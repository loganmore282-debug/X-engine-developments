name: Build X-Engine App APK

on:
  push:
    branches: [ "claude/new-session-nagian" ]
    paths:
      - "xengine-app/**"
      - ".github/workflows/build-android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: xengine-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: xengine-app
        run: cp app/build/outputs/apk/debug/app-debug.apk x-engine.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-engine-app
          path: xengine-app/x-engine.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: X-Engine Android App
          body: "Installable X-Engine app. Download x-engine.apk below and install on the phone."
          files: xengine-app/x-engine.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
