name: Petro global UI verification

on:
  push:
    branches:
      - petro-global-professional-ui-20260922

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Build Petro member bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: petro-global-professional-ui-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: petro/package-lock.json
      - name: Install dependencies
        working-directory: petro
        run: npm ci
      - name: Build member bundle
        working-directory: petro
        run: node build-core.js
      - name: Commit generated member bundle
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add petro/user/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Petro member bundle"
          git push origin HEAD:petro-global-professional-ui-20260922
