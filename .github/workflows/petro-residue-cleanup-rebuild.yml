name: Petro residue cleanup rebuild

on:
  push:
    branches:
      - petro-remove-chipz-residue-20260922

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'Build Petro bundles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: petro-remove-chipz-residue-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: petro/package-lock.json
      - name: Install dependencies
        working-directory: petro
        run: npm ci
      - name: Build member bundle
        working-directory: petro
        run: node build-core.js
      - name: Build admin bundle
        working-directory: petro
        run: node build-admin.js
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add petro/user/index.html petro/admin/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Petro bundles"
          git push origin HEAD:petro-remove-chipz-residue-20260922
