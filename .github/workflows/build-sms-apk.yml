name: Build SMS Forwarder APK

on:
  push:
    branches: [ "claude/new-session-nagian" ]
    paths:
      - "sms-forwarder-app/**"
      - ".github/workflows/build-sms-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: sms-forwarder-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xengine-sms-forwarder
          path: sms-forwarder-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
