name: Build Nexus SMS Forwarder APK

on:
  push:
    branches: [ "claude/new-session-nagian" ]
    paths:
      - "sms-forwarder-app/**"
      - ".github/workflows/build-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: sms-forwarder-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-sms-forwarder
          path: sms-forwarder-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-sms-app
          name: Nexus SMS Forwarder
          body: "Latest build of the Nexus SMS Forwarder app. Download app-debug.apk below and install on the phone that receives MoMo payments. Allow unknown sources in phone settings before installing."
          files: sms-forwarder-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
