name: Build Snow SMS Forwarder APK

on:
  push:
    branches: [ "claude/snow-platform-build" ]
    paths:
      - "snow/sms-forwarder-app/**"
      - ".github/workflows/build-snow-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: snow/sms-forwarder-app
        run: gradle assembleDebug --no-daemon --stacktrace

      # Distinct filename so this never gets confused with the Nexus
      # forwarder's own app-debug.apk in its separate release.
      - name: Rename APK
        working-directory: snow/sms-forwarder-app
        run: cp app/build/outputs/apk/debug/app-debug.apk snow-sms-forwarder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow-sms-forwarder
          path: snow/sms-forwarder-app/snow-sms-forwarder.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snow-sms-app
          name: Snow SMS Forwarder
          body: |
            Snow's manual-deposit SMS forwarder. Install ONE copy per admin payment phone.

            Download `snow-sms-forwarder.apk` below, allow "unknown sources" in phone
            settings, then install and open **Snow SMS** and fill in:
            - Server webhook URL (pre-filled with Snow's own endpoint)
            - Shared secret: the MANUAL_SMS_SECRET set on the snow-server Render service
            - This phone's receiving number: must match the number saved for this phone
              in the admin panel under Settings -> Manual payments -> Payment numbers

            Then tap Save settings, START forwarding, and Send test ping (expect HTTP 200).
          files: snow/sms-forwarder-app/snow-sms-forwarder.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
