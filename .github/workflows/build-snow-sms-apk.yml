name: Build Snow SMS Forwarder APK

on:
  push:
    branches: [ "claude/snow-platform-build" ]
    paths:
      - "snow/sms-forwarder-app/**"
      - ".github/workflows/build-snow-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Gradle does catch malformed XML, but only 25s in and only as a Java
      # stack trace out of the manifest merger. This fails in two seconds
      # naming the file and line. (A literal "--" inside an XML comment is
      # illegal and broke a build exactly this way.)
      - name: Validate XML
        working-directory: snow/sms-forwarder-app
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom as m
          bad = 0
          for f in glob.glob('app/src/main/**/*.xml', recursive=True):
              try:
                  m.parse(f); print('ok   ', f)
              except Exception as e:
                  print('BROKEN', f, '->', e); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Build debug APK
        working-directory: snow/sms-forwarder-app
        run: gradle assembleDebug --no-daemon --stacktrace

      # Distinct filename so this never gets confused with the Nexus
      # forwarder's own app-debug.apk in its separate release.
      - name: Rename APK
        working-directory: snow/sms-forwarder-app
        run: cp app/build/outputs/apk/debug/app-debug.apk snow-sms-forwarder.apk

      # The installed app polls this to find out a newer APK exists. Values
      # come straight from build.gradle so they can never drift from what was
      # actually built.
      - name: Generate version.json
        working-directory: snow/sms-forwarder-app
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "Could not parse versionCode/versionName from app/build.gradle"; exit 1
          fi
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$VC" "$VN" > version.json
          cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow-sms-forwarder
          path: snow/sms-forwarder-app/snow-sms-forwarder.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snow-sms-app
          name: Snow SMS Forwarder
          body: |
            Snow's manual-deposit SMS forwarder. Install one copy per admin payment phone.
            A dual/triple-SIM phone can cover several payment numbers from a single
            install: one number per SIM slot.

            Download `snow-sms-forwarder.apk` below, allow "unknown sources" in phone
            settings, then install and open **Snow SMS**, grant the SMS and phone
            permissions, and fill in:
            - Server webhook URL (pre-filled with Snow's own endpoint)
            - Shared secret: the MANUAL_SMS_SECRET set on the snow-server Render service
            - SIM slot 1 / SIM slot 2 / ...: the payment number each SIM in this phone
              actually uses, exactly as saved in the admin panel under
              Settings -> Manual payments -> Payment numbers. Each slot is labelled with
              the carrier the phone detects. Leave a slot blank if that SIM is not a
              Snow payment number.

            Then tap Save settings, START forwarding, and Send test ping (expect HTTP 200).

            Put a number in the wrong slot and messages get attributed to the wrong
            payment number, so double-check the carrier label on each slot. If the app
            cannot tell which SIM received a message and more than one number is
            configured, it deliberately drops that message rather than risk crediting
            the wrong member.
          files: |
            snow/sms-forwarder-app/snow-sms-forwarder.apk
            snow/sms-forwarder-app/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
