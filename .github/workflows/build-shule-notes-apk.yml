name: Build Shule Notes APK

on:
  push:
    branches: [ "claude/shule-notes-build" ]
    paths:
      - "shule-notes/android/**"
      - ".github/workflows/build-shule-notes-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: shule-notes/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: shule-notes/android
        run: cp app/build/outputs/apk/debug/app-debug.apk shule-notes-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shule-notes-app
          path: shule-notes/android/shule-notes-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shule-notes-app
          name: Shule Notes Android App (debug build)
          body: "Installable Shule Notes app (debug build, for testing). Download shule-notes-debug.apk below and install on the phone. Points at the debug API_BASE_URL in app/build.gradle.kts -- for a real release, build a release APK against the real backend URL instead."
          files: shule-notes/android/shule-notes-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
