name: Build Shule Notes APK

on:
  push:
    branches: [ "claude/shule-notes-build", "claude/space8-rename-frontend-rebuild-juurd7" ]
    paths:
      - "shule-notes/android/**"
      - ".github/workflows/build-shule-notes-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The owner's server. Change this when the real domain exists.
  LIVE_API_URL: https://api.161-97-98-107.sslip.io
  # SHA-256 of android/app/shule-test-signing.keystore. When the real Play Store key replaces it, change this too.
  EXPECTED_CERT_SHA256: 9bb7a9f890dea06e1801240d58446c15509572d5e0dd8ce0f4d822bf5ee6631d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 (what xengine-app's own workflow
      # uses) tries to install a legacy package literally called "tools" as
      # part of its setup -- Google has since removed that package from the
      # SDK repository, so the action now fails before Gradle ever runs.
      # ubuntu-latest runners already ship a full Android SDK (cmdline-tools
      # included) specifically for this case, so installing only the exact
      # packages this project needs sidesteps the broken action entirely.
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: shule-notes/android
        run: gradle assembleDebug -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Rename APK
        working-directory: shule-notes/android
        run: cp app/build/outputs/apk/debug/app-debug.apk shule-notes-debug.apk

      # The same app, pointed at the owner's real server, for installing on a phone.
      # A release-type build (not debuggable, so nobody can read the app's private files with adb), signed
      # with the project's fixed test key, that refuses to run if re-signed by anyone else, and that blocks
      # screenshots inside the reader. Its signing certificate's SHA-256 is checked at run time.
      - name: Build the APK for the live server
        working-directory: shule-notes/android
        run: |
          gradle assembleRelease -PapiBaseUrl="$LIVE_API_URL" -PversionCode="${{ github.run_number }}" -PexpectedCert="$EXPECTED_CERT_SHA256" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk shule-notes-live.apk
          echo "${{ github.run_number }}" > shule-notes-live.version.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shule-notes-app
          path: shule-notes/android/shule-notes-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shule-notes-app
          name: Shule Notes Android App (debug build)
          body: "Installable Shule Notes app (debug build, for testing). Download shule-notes-debug.apk below and install on the phone. Points at the debug API_BASE_URL in app/build.gradle.kts -- for a real release, build a release APK against the real backend URL instead."
          files: shule-notes/android/shule-notes-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the live-server APK (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shule-notes-live
          name: Shule Notes (connects to the live server)
          body: "Shule Notes test build that connects to the owner's server. Download shule-notes-live.apk and install it on a phone. Builds from now on are signed with one fixed key, so they install over each other. (If an older copy from before that is installed, uninstall it once first.)"
          files: |
            shule-notes/android/shule-notes-live.apk
            shule-notes/android/shule-notes-live.version.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
