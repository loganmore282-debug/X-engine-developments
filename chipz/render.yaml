services:
  - type: web
    name: chipz-server
    runtime: node
    rootDir: chipz
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: MARZPAY_KEY
        sync: false
      # Round 141 -- MarzSms, a SEPARATE MarzPay product (its own
      # dashboard/API keys at sms.wearemarz.com) used only to text-alert
      # admins on a new withdrawal request. Optional: server.js skips the
      # SMS entirely (no error) if this is left unset.
      - key: MARZSMS_KEY
        sync: false
      - key: QUOTAGUARDSTATIC_URL
        sync: false
      - key: LIPAPAY_MCHID
        sync: false
      - key: LIPAPAY_PRIVATE_KEY
        sync: false
      - key: LIPAPAY_SANDBOX
        sync: false
      # Round 106 -- subagent-audit-caught: server.js reads both of these
      # (manual-deposit SMS-forwarder auth + the forwarder app's optional
      # settings-screen lock) but neither was documented here, so recreating
      # this service from render.yaml alone silently disabled automated
      # manual-deposit crediting with no signal anything was missing.
      - key: MANUAL_SMS_SECRET
        sync: false
      - key: FORWARDER_PASSWORD
        sync: false

  - type: web
    name: chipz-app
    runtime: static
    rootDir: chipz/user
    buildCommand: "echo no build needed"
    staticPublishPath: .
    autoDeploy: true
    # index.html is the whole app -- no-cache means "revalidate every time",
    # not "never store", so an unchanged build still answers 304 while a new
    # one is picked up immediately, instead of phones sitting on stale builds.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      # Round 106 -- subagent-audit-caught: chipz-server's helmet config sets
      # HSTS + Cross-Origin-Resource-Policy, but neither static site (the
      # browser-facing origins members and admins actually navigate to) had
      # them documented here -- a real oversight, not a deliberate
      # difference, since 5 of the 6 header categories were already present.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
    # No SPA rewrite rule. The app never puts anything in the URL path --
    # every pushState/replaceState call passes '' (keep the current URL) and
    # navigation is pure in-memory state -- so a /* -> /index.html rewrite
    # buys nothing, and a rule that broad sitting in front of sw.js, the
    # manifest and the nav/action PNGs is a risk with no upside. A service
    # worker that ever answers with index.html fails in a way that looks
    # exactly like the stale-cache problems this project already fights.

  - type: web
    name: chipz-admin
    runtime: static
    rootDir: chipz/admin
    buildCommand: "echo no build needed"
    staticPublishPath: .
    autoDeploy: true
    # Same headers as the app, and they matter MORE here -- this panel moves
    # money, so it must never be embeddable in someone else's page.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
    # No SPA rewrite here either, for the same reason: admin/index.html is
    # the entire panel and nothing routes by path.
