plugins {
    id 'com.android.application'
}

android {
    namespace 'site.nexusug.smsforwarder'
    compileSdk 34

    defaultConfig {
        applicationId "site.nexusug.smsforwarder"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies on purpose — keeps the build simple and robust.
dependencies {
}
