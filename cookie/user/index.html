/* Deposit poll and its brief handoff are dedicated full-screen states. They
   use the app's light paper surface and brand-colored motion, with no bottom
   navigation behind them. */
body.deposit-status-open .bottom-nav{display:none;}
/* Owner: "the deposit poll screen is very ugly, showing a background white
   and the page is very not matching with current page." Real gap, not a
   design opinion -- .pay-page is its own class, so it never picked up the
   refinery-wallpaper + dark-glass treatment .sheet-bg/.sheet-head/.sheet-body
   got everywhere else. Its header already looked right (it reuses
   .sheet-head verbatim), which is exactly what made the plain white body
   underneath it read as broken rather than unfinished. Matched here to the
   same pattern, not a new one: same ::before wallpaper .sheet-bg uses, same
   glass-panel numbers .sheet-body uses. */
/* A column now, not a centred box: the page has a real header (back chevron
   + title) pinned at the top, and .pay-body takes the remaining height and
   centres the card inside THAT. Centring the card in the whole page instead
   would push it visibly below centre by half the header's height. */
.pay-page{position:fixed;left:0;right:0;top:0;bottom:0;
  background:#1d130f;z-index:310;display:none;
  flex-direction:column;overflow-y:auto;transform:translateZ(0);will-change:transform;
  isolation:isolate;}
/* Owner: "change the payment polling screen the background image should
   not show up there so full page should be like blurred." The refinery
   photo (var(--auth-hero-img)) was still painting here underneath the
   solid #1d130f fallback above -- isolation:isolate on .pay-page puts this
   ::before INSIDE its own stacking context, where it paints above the
   element's own background regardless of z-index:-1, so the fallback
   color was never actually visible; the photo was.

   First fix dropped the photo entirely for a flat rgba backdrop -- wrong
   in a different way, per the owner's very next round: ".pay-card sits on
   this via its own backdrop-filter:blur(9px) (the exact "in-built blur"
   mechanism the Home stat cards use, background:rgba(20,12,8,.46) +
   blur(9px) -- see .home-stat), and a flat rgba backdrop gives that
   blur nothing real to blur, so the card lost the frosted-glass depth it
   has everywhere else. Kept here instead: the photo stays, blurred with a
   real CSS filter (not backdrop-filter -- there is nothing BEHIND this
   fixed, full-viewport ::before for backdrop-filter to blur; filter blurs
   its own rendered content, including its own background-image). inset
   is overscanned past the viewport edge so the blur radius never reveals
   a blank strip at the boundary -- a standard trick for filter:blur() on
   an edge-to-edge layer. */
.pay-page::before{
  content:'';
  position:fixed;
  inset:-40px;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(12,7,4,.58) 0%,rgba(12,7,4,.72) 100%),
    var(--auth-hero-img);
  background-size:cover,cover;
  background-position:center center,center center;
  background-repeat:no-repeat,no-repeat;
  filter:blur(16px);
}
.pay-page.show{display:flex;}
/* Owner: "when I scroll that page down harder it shows that" (the product page's BUY NOW card peeking out from under the payment screen).
   On a phone browser a drag that the full-screen page does not use falls through to the DOCUMENT behind it; the address bar then slides away,
   the visible area grows, and a fixed layer sized for the old, shorter area leaves a strip at the bottom where the page underneath shows. While a
   full-page screen is open the document behind it must simply not scroll, and the screen must not pass its own overscroll on. */
html:has(.pay-page.show),body:has(.pay-page.show),
html:has(.sheet-bg.show),body:has(.sheet-bg.show){overflow:hidden;overscroll-behavior:none;}
.pay-page{overscroll-behavior:none;}
/* Owner: "l told you to remove that stuff bro, l nolonger need that
   header on payment polling page" -- removing the <h2> text (an earlier
   round) still left the full .sheet-head BAR: padding, border-bottom,
   solid background, the works, just with nothing written in it -- still
   very much "that stuff." Stripped down to a floating, transparent back
   button with no bar chrome at all, sitting directly over the blurred
   backdrop like the rest of this page now does. Position stays sticky
   (inherited from .sheet-head) so it stays reachable if the card's own
   content ever needs to scroll. */
.sheet-head.pay-head{background:transparent;border-bottom:0;box-shadow:none;padding:14px 16px 0;-webkit-backdrop-filter:none;backdrop-filter:none;}
/* "The card should be raised up" -- .pay-body used to CENTER the card in
   whatever height was left under the header bar; removing that bar's
   own padding/height above freed up room, but centering in a now-taller
   box does not by itself read as "raised" the way flex-start does.
   Pushed toward the top instead, with just enough top padding that it
   does not sit flush under the floating back button. */
.pay-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:8px 26px 26px;}
.pay-card{width:100%;max-width:340px;text-align:center;
  padding:28px 22px 26px;border-radius:var(--r-card);
  border:1px solid rgba(255,255,255,.14);
  background:rgba(20,12,8,.46);
  box-shadow:0 16px 34px -20px rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(9px);
  backdrop-filter:blur(9px);}
.pay-card h3{font-size:23px;font-weight:800;color:#fff;margin:0 0 10px;}
.pay-card p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.62);font-weight:500;margin:0;}
/* The pending state is a numbered list of what is happening and what the
   member has to do, so it is LEFT-aligned inside an otherwise centred card --
   centred list items with numbers hanging off them are hard to scan, and the
   numbers stop lining up with each other entirely. */
.pay-steps{margin:0;padding:0 0 0 24px;text-align:left;font-size:15px;
  line-height:1.6;color:rgba(255,255,255,.62);font-weight:500;}
.pay-steps li{margin:0 0 11px;padding-left:3px;}
.pay-steps li:last-child{margin-bottom:0;}
.pay-steps li::marker{color:var(--snow-wine);font-weight:700;}
/* The USSD fallback. Deliberately NOT a fifth numbered step: the four steps
   are what happens normally, and this is the way out of the one common
   failure (the mobile-money prompt never arriving). Quieter and smaller so
   it reads as a footnote rather than another instruction to follow. */
.pay-note{margin:16px 0 0;font-size:13.5px;line-height:1.55;
  color:rgba(255,255,255,.5);text-align:left;}
.pay-actions{margin-top:22px;display:flex;flex-direction:column;gap:11px;}
.pay-actions button{width:100%;padding:15px 0;font-size:16px;}
/* No disc behind it any more -- the mark IS the artwork. Sized here so the
   orbiting chips and the two result marks share one footprint and the page
   does not jump as the poll resolves. */
.dep-status-icon{width:auto;min-height:120px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;}
.dep-status-icon>svg{width:120px;height:120px;display:block;}
/* The owner's own green tick and red cross (deposit result page only) draw themselves on a canvas (see playStatusIcon in the app code). */
.dep-status-icon>canvas{width:120px;height:120px;display:block;}
.dep-status-icon.dep-shake{animation:depShake .62s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes depShake{10%,90%{transform:translateX(-3px) rotate(-1deg)}20%,80%{transform:translateX(6px) rotate(2deg)}30%,50%,70%{transform:translateX(-10px) rotate(-3deg)}40%,60%{transform:translateX(10px) rotate(3deg)}}

/* Waiting for the payment: a coin-dot travels from the phone to the wallet (nothing rotates). */
.dep-flow{display:flex;align-items:center;justify-content:center;gap:12px;width:240px;max-width:100%;}
.dep-flow-ic{width:48px;height:48px;border-radius:14px;background:#eaeefc;color:var(--v-blue);display:flex;align-items:center;justify-content:center;flex:none;}
.dep-flow-ic svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.dep-flow-track{position:relative;flex:1;height:12px;}
.dep-flow-track i{position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--v-blue);opacity:0;animation:depFlow 1.8s ease-in-out infinite;}
.dep-flow-track i:nth-child(2){animation-delay:.45s;}
.dep-flow-track i:nth-child(3){animation-delay:.9s;}
.dep-flow-track i:nth-child(4){animation-delay:1.35s;}
@keyframes depFlow{0%{left:0;opacity:0;transform:scale(.6);}18%{opacity:1;transform:scale(1);}82%{opacity:1;transform:scale(1);}100%{left:calc(100% - 12px);opacity:0;transform:scale(.6);}}
@media (prefers-reduced-motion:reduce){.dep-flow-track i{animation:none;opacity:.55;}.dep-flow-track i:nth-child(1){left:0;}.dep-flow-track i:nth-child(2){left:33%;}.dep-flow-track i:nth-child(3){left:66%;}.dep-flow-track i:nth-child(4){left:calc(100% - 12px);}}

.list-loading{padding:34px 4px;display:flex;justify-content:center;align-items:center;}
.nav-loading{display:inline-block;color:var(--v-blue,#1739b8);font-family:'Noto Serif',Georgia,'DejaVu Serif','Times New Roman',serif;font-size:15px;font-weight:700;letter-spacing:.03em;animation:navBounce .9s cubic-bezier(.28,.84,.42,1) infinite;}
@keyframes navBounce{0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.55,.06,.68,.19);}50%{transform:translateY(-8px);animation-timing-function:cubic-bezier(.22,.61,.36,1);}}
@media (prefers-reduced-motion:reduce){.nav-loading{animation:none;}}
@media(prefers-reduced-motion:reduce){}
.list-empty{padding:30px 4px;text-align:center;color:var(--snow-muted);font-size:15px;}

/* Real content fades/lifts into place once it's ready -- no shimmer
   placeholders. Freshly-inserted DOM (a fresh innerHTML assignment) always
   plays this from the start, so no manual restart/reflow trick is needed.
   Direct children stagger in one after another (the "live animation
   website" look) instead of the whole block popping in as one flat unit;
   each one starts fully hidden (animation-fill-mode:both) so there's no
   flash of unanimated content before its delay elapses. */
/* Owner: "remove live appearing animation everywhere." Both entrance
   animations are gone -- the stagger that played on every page paint, and
   the About page's scroll-into-view reveal (including the word-by-word
   text effect). The .reveal-in / .scroll-reveal / .reveal-word classes are
   still applied by the JS in a dozen places, so rather than unpick all of
   that, .scroll-reveal is neutralised here to plain visible content. Its
   old `opacity:0` default is the thing to be careful about: leaving that
   behind while removing the transition would hide the About page outright.
   The .reveal-in rules are deleted rather than set to `animation:none`,
   because that rule sits later in the file at the same specificity as
   .chest-float and would go straight back to killing the chest's bounce. */
/* The stale `.reveal-word{opacity:0}` that used to sit here is DELETED, not
   overridden. It was the old animation's starting frame, left behind when the
   reveal was removed -- and because it came AFTER the replacement rule at the
   same specificity, it won: every word of the About page rendered at opacity
   0 and translated 10px down. The page was not blank because the text was
   missing; the text was all there, invisible.
   The comment two rules up literally warned about this ("Its old `opacity:0`
   default is the thing to be careful about: leaving that behind while
   removing the transition would hide the About page outright") and the
   duplicate was left in anyway. Adding a third rule to win the cascade would
   have kept the trap loaded; there is now exactly one .reveal-word rule. */


/* V2-BEGIN */
/* ═══ Cookie v2: the signed-in app, built to the owner's screens ═══════════
   Light page, one blue (primary #1739b8 -> #0e2a8e), white cards with a 2px
   blue edge, big radii, bold letter-spaced titles. Yellow / orange / green
   stay only where they mean something (the Buy glow, pending, paid, credits).
   Everything below is self-contained: it replaces the old dark "glass" layer. */
:root{
  --v-blue:#1739b8; --v-blue-2:#0e2a8e; --v-blue-3:#2a52d4;
  --v-grad:linear-gradient(135deg,#2448cc 0%,#1739b8 45%,#0e2a8e 100%);
  --v-ink:#16213f; --v-label:#5b6b8c; --v-muted:#8a94a8;
  --v-bg:#f2f4fd; --v-tint:#eaeefc; --v-line:#c9d3f5; --v-card-line:#1739b8;
  --v-gold:#ffc61a; --v-ok:#6f8f3a; --v-wait:#ff9f0a; --v-bad:#e5484d;
  --nav-h:52px;
}
html,body{background:var(--v-bg);}
body{color:var(--v-ink);}
#app{min-height:100vh;background:var(--v-bg);color:var(--v-ink);}
@supports (min-height:100dvh){#app{min-height:100dvh;}}
#pageHost{background:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);min-height:calc(100vh - var(--nav-h));}
.wrap{background:var(--v-bg);}
.v-page{padding:8px 15px 8px;}
.v-empty{text-align:center;color:var(--v-muted);font-size:14px;padding:34px 10px;}
.v-ic{display:inline-flex;width:24px;height:24px;flex:0 0 24px;}
.v-ic svg{width:100%;height:100%;}

/* ── bottom navigation: four tabs ── */
.bottom-nav{background:#fff;border-top:1px solid #e3e8fa;box-shadow:0 -8px 24px -18px rgba(14,42,142,.45);height:var(--nav-h);padding:0;justify-content:stretch;-webkit-backdrop-filter:none;backdrop-filter:none;}
.navitem{flex:1;height:100%;padding:5px 2px 3px;gap:2px;color:#9aa3bb;background:transparent;border:0;}
.navitem::before{content:'';position:absolute;top:0;left:50%;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--v-blue);opacity:0;transform:translateX(-50%) scaleX(.4);transition:opacity .16s,transform .16s;}
.navitem.active{background:linear-gradient(180deg,rgba(23,57,184,.09),rgba(23,57,184,0));color:var(--v-blue);}
.navitem.active::before{opacity:1;transform:translateX(-50%) scaleX(1);}
.navitem .nav-ic{width:24px;height:24px;color:inherit;}
.navitem .nav-ic svg{width:22px;height:22px;flex:0 0 22px;}
.navitem .nav-ic{position:relative;top:-4.3px;}
.navitem .lbl{position:relative;top:-1.5px;}
.navitem .nav-ic svg g{stroke-width:11px;}
.navitem.active .nav-ic svg g{stroke-width:20px;}
.v-wcard-ic svg g{stroke-width:13px;}
.navitem .lbl{font-size:10px;font-weight:400;color:#b0b7ca;}
.navitem.active .lbl{font-weight:700;color:var(--v-blue);}
.navitem.active .nav-ic{color:var(--v-blue);transform:none;}
body.sheet-open .bottom-nav{display:flex;}

/* ── banner (admin uploads; keeps its frame when empty) ── */
.home-banner{position:relative;margin:0;height:auto;aspect-ratio:330/155;border-radius:14px;overflow:hidden;background:var(--v-grad);box-shadow:0 14px 28px -20px rgba(14,42,142,.7);}
.home-banner>img{display:block;width:100%;height:100%;object-fit:cover;}
.home-banner.v-banner-empty{background:linear-gradient(135deg,#9fb0ec,#3a5fd9 55%,#1739b8);}
#homeCarouselTrack{position:relative;overflow:hidden;}
#homeCarouselTrack .hb-fade-stack{position:relative;width:100%;height:100%;}
#homeCarouselTrack .hb-fade-stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
#homeCarouselTrack .hb-fade-current{opacity:1;z-index:1;transition:opacity .72s cubic-bezier(.22,1,.36,1);}
#homeCarouselTrack .hb-fade-next{opacity:0;z-index:2;transition:opacity .72s cubic-bezier(.22,1,.36,1);}
#homeCarouselTrack .hb-fade-stack.hb-crossfading .hb-fade-current{opacity:0;}
#homeCarouselTrack .hb-fade-stack.hb-crossfading .hb-fade-next{opacity:1;}
#homeCarouselTrack .hb-fade-stack.hb-fade-reset .hb-fade-current,
#homeCarouselTrack .hb-fade-stack.hb-fade-reset .hb-fade-next{transition:none!important;}

/* ── Home: four buttons + scrolling line ── */
.v-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.v-quick button{height:59.5px;border:1.5px solid var(--v-blue);border-radius:14px;background:#fff;color:var(--v-blue);display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;cursor:pointer;box-shadow:0 8px 18px -14px rgba(14,42,142,.6);}
.v-quick button:active{transform:scale(.98);}
.v-quick b{font-size:17.5px;font-weight:700;}
.v-quick .v-ic{width:20px;height:20px;flex-basis:20px;}
.v-ticker{margin-top:13.7px;height:37.3px;border:1px solid #bcc9f2;border-radius:14px;background:#eaeefc;display:flex;align-items:center;gap:9.8px;padding:0 12px;overflow:hidden;}
.v-ticker-ic{width:16.2px;height:16.2px;flex:0 0 16.2px;color:var(--v-blue);}
.v-ticker-ic svg{width:100%;height:100%;}
.v-ticker-win{flex:1;min-width:0;overflow:hidden;white-space:nowrap;position:relative;height:100%;display:flex;align-items:center;}
.v-ticker-txt{display:inline-block;padding-left:100%;font-size:13px;color:#16213f;animation:vMarquee 22s linear infinite;will-change:transform;}
@keyframes vMarquee{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* ── asset cards (Home catalogue + Income) ── */
.v-card{margin-top:14.3px;background:#fff;border:1.5px solid var(--v-card-line);border-radius:14px;overflow:hidden;box-shadow:0 14px 30px -22px rgba(14,42,142,.7);position:relative;}
.v-card-h{margin:0;background:var(--v-grad);color:#fff;text-align:center;font-size:15px;font-weight:700;height:36.5px;display:flex;align-items:center;justify-content:center;padding:0 40px;line-height:1.2;position:relative;}
.v-card-b{display:grid;grid-template-columns:var(--img-w,112.5px) 1fr;gap:20.5px;padding:10px 11px 0 9px;align-items:start;}
.v-side{display:flex;flex-direction:column;min-width:0;}
.v-side .v-rows{flex:none;}
.v-card-f{padding:23px 13px 13px;}
.v-card-img{position:relative;border-radius:11px;overflow:hidden;background:var(--v-grad);height:200px;display:flex;align-items:center;justify-content:center;}
.v-owned .v-card-img{height:227px;}
.v-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.v-card-img.has-img,.v-owned .v-card-img.has-img{height:auto;background:none;overflow:visible;}
.v-card-img.has-img img{position:static;display:block;width:100%;height:auto;border-radius:11px;}
.v-card-img.has-img .v-badge{z-index:2;}
/* A bought asset has no footer, so give its body its own bottom space (the Purchase/Expire box used to
   sit on the card's border) and centre a portrait picture beside the taller column. */
.v-owned .v-card-b{padding-bottom:12px;grid-template-columns:133px minmax(0,1fr);}
/* The bought/gifted picture is fenced: a frame of one fixed size, exactly the 2:3 portrait shape (133 x 200),
   the picture scaled to fit inside it, so a 2:3 picture fills it with no blank band. */
.v-owned .v-card-img{width:133px;height:200px;overflow:hidden;align-self:center;}
.v-owned .v-card-img.v-fence{background:none;}
.v-owned .v-card-img.v-fence img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:0;}
.v-card.v-flat .v-card-b{grid-template-columns:1fr;gap:12px;}
.v-card.v-flat .v-rows,.v-card.v-flat.v-owned .v-rows{height:auto;}
.v-card.v-flat .v-rows>div{flex:none;min-height:38px;}
.v-card.v-flat .v-card-img{align-self:stretch;}
.v-glyph{font-size:40px;font-weight:700;color:rgba(255,255,255,.9);}
.v-badge{position:absolute;top:8px;right:6px;background:var(--v-blue-2);color:#fff;font-style:normal;font-size:10px;font-weight:700;height:14.5px;line-height:14.5px;padding:0 6px;border-radius:6px;z-index:1;}
.v-owned .v-badge{top:8px;right:8px;height:20px;line-height:20px;padding:0 9px;font-size:10.3px;font-weight:500;}
.v-rows{margin:0;height:200px;padding:0 6px 0 5.5px;display:flex;flex-direction:column;}
.v-owned .v-rows{height:160px;}
.v-rows>div{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1;}
.v-rows dt{font-size:10.7px;font-weight:500;text-transform:uppercase;color:var(--v-label);}
.v-rows dd{margin:0;font-size:14px;font-weight:700;color:var(--v-blue-2);text-align:right;}
.v-card-f{padding:23px 13px 13px;}
.v-buy{width:100%;height:46px;border:1.5px solid var(--v-blue);border-radius:12px;background:#fff;cursor:pointer;font:inherit;display:flex;align-items:center;justify-content:center;}
.v-buy span{display:inline-block;font-size:19px;font-weight:700;letter-spacing:1.2px;color:var(--v-blue);-webkit-text-stroke:2.4px #ffd21f;paint-order:stroke fill;filter:url(#vFlame);animation:vBurn .8s ease-in-out infinite alternate;}
@keyframes vBurn{
  0%{text-shadow:0 0 2px #fff6b8,0 0 6px #ffd21f,0 -2px 10px #ffa800,0 -5px 16px rgba(255,120,0,.75);}
  30%{text-shadow:0 0 3px #fff6b8,0 0 8px #ffd21f,0 -3px 12px #ff9d00,0 -7px 20px rgba(255,110,0,.85);}
  65%{text-shadow:0 0 2px #fff6b8,0 0 7px #ffdf3a,0 -2px 11px #ffb000,0 -4px 17px rgba(255,130,0,.7);}
  100%{text-shadow:0 0 3px #fffbd0,0 0 9px #ffd21f,0 -4px 14px #ff9500,0 -8px 24px rgba(255,100,0,.9);}
}
.v-buy:disabled,.v-buy.v-soon{border-color:#c9d3f5;background:#f2f4fd;color:#97a3c2;cursor:default;font-weight:700;font-size:15px;letter-spacing:.04em;}
.v-buy:disabled span,.v-buy.v-soon span{animation:none;filter:none;-webkit-text-stroke:0;color:#97a3c2;text-shadow:none;font-size:17px;}
@media (prefers-reduced-motion:reduce){.v-buy span{animation:none;filter:none;text-shadow:0 0 6px #ffd21f;}.v-ticker-txt{animation:none;padding-left:0;}}

/* ── Income ── */
.v-total{margin-top:15px;margin-bottom:-3px;background:#fff;border:1.5px solid var(--v-card-line);border-radius:14px;text-align:center;padding:20px 10px 21px;}
.v-total span{display:block;color:var(--v-muted);font-size:12px;letter-spacing:.3px;line-height:14px;}
.v-total b{display:block;margin-top:8px;font-size:26px;line-height:30px;font-weight:700;color:#ffc61a;}
.v-ribbon{position:absolute;top:0;right:0;width:40px;height:56px;z-index:2;pointer-events:none;font-style:normal;}
.v-ribbon::before{content:'';position:absolute;right:0;top:35px;width:18px;height:18px;background:var(--v-blue-2);clip-path:polygon(0 0,100% 0,100% 100%);}
.v-ribbon b{position:absolute;right:6px;top:20px;width:22px;text-align:center;transform:rotate(45deg);color:#fff;font-size:8px;font-weight:700;letter-spacing:.3px;}
.v-gift .v-card-h{padding-right:44px;}
.v-dates{background:#eaeefc;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;height:67.5px;margin-top:0;}
.v-dates>div{padding:9px 11px 0;min-width:0;}
.v-dates>div+div{text-align:right;position:relative;}
.v-dates>div+div::before{content:'';position:absolute;left:0;top:14px;height:34px;width:1px;background:#c9d3f5;}
.v-dates span{display:block;font-size:9px;line-height:12px;text-transform:uppercase;color:#8e9bbd;}
.v-dates b{display:block;margin-top:2px;font-size:11.3px;line-height:17px;font-weight:400;color:var(--v-ink);}

/* ── Team ── */
.v-tcard{background:var(--v-grad);color:#fff;border-radius:20px;padding:21.5px 14px 19px;text-align:center;position:relative;overflow:hidden;box-shadow:0 6px 26px rgba(23,57,184,.34);}
.v-tcard::before,.v-tcard::after{content:'';position:absolute;box-sizing:border-box;border:1px solid rgba(255,255,255,.3);border-radius:50%;pointer-events:none;}
/* Two concentric rings in the top-right corner, both ending above the divider line (measured: centre 19 px from the right and 18 px from the top, radii 56 and 40). */
.v-tcard::before{width:112px;height:112px;right:-37px;top:-37.7px;}
.v-tcard::after{width:80px;height:80px;right:-21px;top:-21.7px;}
.v-tcard-top{display:flex;align-items:center;justify-content:center;gap:0;position:relative;z-index:1;}
.v-tc-ic{width:22px;height:22px;margin-right:4.5px;position:relative;top:3.5px;}
.v-tc-ic svg{width:100%;height:100%;}
.v-tc-lbl{font-size:13.2px;font-weight:400;opacity:.95;position:relative;top:3.5px;letter-spacing:.2px;}
.v-tc-num{margin-left:3px;font-size:42.5px;font-weight:700;line-height:1;text-shadow:0 3px 8px rgba(0,0,0,.28);}
.v-tc-line{height:1px;background:rgba(255,255,255,.28);margin:18px 18px 13px;}
.v-tc-money{font-size:15px;font-weight:700;line-height:18px;}
.v-tc-cap{font-size:10.2px;opacity:.9;margin-top:7px;}
.v-share{margin-top:16px;background:#fff;border:1px solid #d4dcf7;border-radius:20px;padding:15px 14px;box-shadow:0 2px 18px rgba(23,57,184,.12);}
.v-share-l{font-size:12px;letter-spacing:.8px;color:var(--v-label);line-height:15px;}
.v-share-box{margin-top:9px;display:flex;align-items:center;gap:10px;background:#eef1fd;border:1px solid #cfd8f6;border-radius:11px;padding:7px 8px 7px 9.5px;min-height:56.5px;}
.v-share-url{flex:1;min-width:0;font-size:11.3px;color:#3b4a6b;word-break:break-all;line-height:16.5px;}
.v-share-box button{width:41px;height:40.3px;flex:0 0 41px;border:0;border-radius:10px;background:#d0d8f6;color:var(--v-blue-2);display:flex;align-items:center;justify-content:center;}
.v-share-box button svg{width:16px;height:16px;}
.v-btn{margin-top:9.5px;width:100%;height:41px;border:0;border-radius:12px;background:var(--v-grad);color:#fff;font:inherit;font-size:13.6px;font-weight:700;letter-spacing:.7px;}
.v-levels{display:flex;flex-direction:column;gap:9.2px;margin-top:16px;}
/* ── Task Center: the Team page button and the page it opens ── */
.v-task-btn{width:100%;margin-top:14px;display:flex;align-items:center;gap:12px;padding:11px 12px 11px 11px;background:#fff;border:1.5px solid var(--v-card-line);border-radius:16px;font:inherit;color:var(--v-ink);cursor:pointer;text-align:left;box-shadow:0 12px 24px -20px rgba(14,42,142,.7);}
.v-task-btn:active{transform:scale(.99);}
.v-task-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc61a,#ff7a1a);color:#fff;box-shadow:0 8px 16px -10px rgba(255,140,0,.85);flex:0 0 40px;}
.v-task-ic svg{width:21px;height:21px;}
.v-task-btn b{flex:1;font-size:16px;font-weight:700;letter-spacing:.02em;}
.v-task-btn em{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:linear-gradient(135deg,#ffc61a,#ff7a1a);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px -6px rgba(255,140,0,.9);}
.v-task-go{width:24px;height:24px;color:var(--v-blue);display:flex;align-items:center;justify-content:center;}
.v-task-go svg{width:20px;height:20px;}
.v-tk{padding:4px 0 24px;}
.v-tk-wait{min-height:50vh;display:flex;align-items:center;justify-content:center;}
.v-tk-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-around;gap:6px;background:var(--v-grad);color:#fff;border-radius:20px;padding:22px 12px 20px 56px;box-shadow:0 18px 32px -22px rgba(14,42,142,.9);}
.v-tk-hero::before,.v-tk-hero::after{content:'';position:absolute;border:1.5px solid rgba(255,255,255,.16);border-radius:50%;pointer-events:none;}
.v-tk-hero::before{width:150px;height:150px;right:-40px;top:-72px;}
.v-tk-hero::after{width:100px;height:100px;right:-14px;top:-46px;}
.v-tk-trophy{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:34px;height:34px;color:#ffd75e;display:flex;align-items:center;justify-content:center;}
.v-tk-trophy svg{width:34px;height:34px;stroke-width:1.5;}
.v-tk-hero i{width:1px;align-self:stretch;background:rgba(255,255,255,.25);}
.v-tk-stat{position:relative;z-index:1;flex:1;min-width:0;text-align:center;}
.v-tk-stat b{display:block;font-size:21px;font-weight:700;line-height:1.15;word-break:break-word;}
.v-tk-stat b.v-fit1{font-size:16px;white-space:nowrap;}
.v-tk-stat b.v-fit2{font-size:13px;white-space:nowrap;}
.v-tk-tgt b.v-fit1{font-size:17px;white-space:nowrap;}
.v-tk-tgt b.v-fit2{font-size:13.5px;white-space:nowrap;}
.v-tk-reward.v-fit1{font-size:12px;padding:6px 8px;}
.v-tk-reward.v-fit2{font-size:10.5px;padding:6px 6px;}
.v-lv-c b.v-fit1{font-size:12px;}
.v-lv-c b.v-fit2{font-size:10px;}
.v-tc-money.v-fit1{font-size:13px;}
.v-tc-money.v-fit2{font-size:11px;}
.v-tk-stat span{display:block;margin-top:5px;font-size:11px;font-weight:500;opacity:.85;line-height:1.25;}
.v-tk-tabs{position:relative;display:flex;gap:6px;margin:16px 0 4px;padding:4px;background:var(--v-tint);border-radius:14px;}
.v-tk-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 7px);border-radius:11px;background:#fff;box-shadow:0 6px 14px -8px rgba(14,42,142,.6);transition:transform .4s cubic-bezier(.3,.85,.3,1);will-change:transform;pointer-events:none;}
.v-tk-tabs[data-tab="deposit"] .v-tk-pill{transform:translateX(calc(100% + 6px));}
.v-tk-tabs button{position:relative;z-index:1;flex:1;height:40px;border:0;border-radius:11px;background:transparent;color:var(--v-label);font:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:color .3s ease;-webkit-tap-highlight-color:transparent;}
.v-tk-tabs button.on{color:var(--v-blue-2);}
.v-tk-tabs button:active{transform:scale(.97);}
@media (prefers-reduced-motion:reduce){.v-tk-pill,.v-tk-tabs button{transition:none;}}
.v-tk-tabs em{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:linear-gradient(135deg,#ffc61a,#ff7a1a);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.v-tk-list{will-change:transform,opacity;display:flex;flex-direction:column;gap:12px;margin-top:12px;}
.v-tk-card{background:#fff;border:1.5px solid #d4dcf7;border-radius:16px;padding:14px 14px 13px;box-shadow:0 12px 24px -22px rgba(14,42,142,.7);position:relative;overflow:hidden;}
.v-tk-card.next{border-color:var(--v-blue);}
.v-tk-card.ready{border-color:#ffb21f;background:linear-gradient(180deg,#fffaf0,#fff 60%);box-shadow:0 14px 26px -18px rgba(255,140,0,.65);}
.v-tk-card.done{background:#f7faf8;border-color:#cfe6d8;}
.v-tk-top{display:flex;align-items:center;gap:11px;}
.v-tk-medal{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--v-tint);color:var(--v-blue);flex:0 0 38px;}
.v-tk-medal svg{width:20px;height:20px;}
.v-tk-card.ready .v-tk-medal{background:linear-gradient(135deg,#ffc61a,#ff7a1a);color:#fff;}
.v-tk-card.done .v-tk-medal{background:#dcf5e3;color:#1f9a49;}
.v-tk-tgt{flex:1;min-width:0;}
.v-tk-tgt b{display:block;font-size:20px;font-weight:700;line-height:1.1;color:var(--v-ink);}
.v-tk-tgt span{display:block;margin-top:3px;font-size:11.5px;font-weight:500;color:var(--v-muted);}
.v-tk-reward{padding:6px 10px;border-radius:10px;background:#fff4dc;color:#b45f00;font-size:14px;font-weight:700;white-space:nowrap;}
.v-tk-card.done .v-tk-reward{background:#e8f4ec;color:#2f7a4a;}
.v-tk-bar{height:8px;border-radius:4px;background:var(--v-tint);margin:13px 0 10px;overflow:hidden;}
.v-tk-bar i{display:block;height:100%;border-radius:4px;background:var(--v-grad);min-width:0;transition:width .5s ease;}
.v-tk-card.ready .v-tk-bar i{background:linear-gradient(90deg,#ffc61a,#ff7a1a);}
.v-tk-card.done .v-tk-bar i{background:#34b968;}
.v-tk-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.v-tk-foot>span{font-size:12.5px;font-weight:500;color:var(--v-label);min-width:0;}
.v-tk-btn{min-width:92px;height:38px;padding:0 14px;border:0;border-radius:11px;background:var(--v-tint);color:#97a3c2;font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;cursor:default;}
.v-tk-btn svg{width:16px;height:16px;}
.v-tk-btn.go{background:var(--v-grad);color:#fff;cursor:pointer;box-shadow:0 10px 18px -12px rgba(14,42,142,.9);}
.v-tk-btn.go:active{transform:scale(.97);}
.v-tk-btn.done{background:#dcf5e3;color:#1f9a49;}
.v-level{display:flex;align-items:center;gap:8px;width:100%;height:64px;text-align:left;font:inherit;background:#fff;color:var(--v-ink);border:1.5px solid var(--v-card-line);border-radius:14px;padding:0 17px;cursor:pointer;box-shadow:0 2px 16px rgba(23,57,184,.12);}
.v-level.on{background:var(--v-grad);color:#fff;border-color:transparent;box-shadow:0 14px 26px -20px rgba(14,42,142,.9);}
.v-lv-l{flex:1;min-width:0;}
.v-lv-l b{display:block;font-size:13px;font-weight:700;}
.v-lv-l small{white-space:nowrap;display:block;margin-top:5px;font-size:10.2px;opacity:.85;}
.v-level:not(.on) .v-lv-l small{color:#5b6b8c;opacity:1;}
.v-lv-r,.v-lv-c{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.v-lv-r small,.v-lv-c small{font-size:9px;opacity:.7;}
.v-lv-r i{font-style:normal;font-size:16.4px;font-weight:700;color:var(--v-blue-2);}
.v-level.on .v-lv-r i{color:#fff;}
.v-lv-c b{font-size:14px;font-weight:700;}
.v-lv-sep{width:1px;height:26px;align-self:center;background:currentColor;opacity:.2;margin:0 8px 0 8.5px;}
#teamMembersBox{margin-top:12px;display:flex;flex-direction:column;gap:11.5px;}
.v-member{background:#f3f5fd;border:1px solid #c9d3f5;border-radius:20px;padding:16.2px 15.5px 14px;min-height:75.5px;box-shadow:0 2px 16px rgba(23,57,184,.1);}
.v-member-top{display:flex;align-items:center;justify-content:space-between;}
.v-mphone{font-size:10.3px;color:var(--v-muted);}
.v-member-top b{font-size:16.7px;font-weight:700;color:var(--v-blue-2);}
.v-member-join{margin-top:11.8px;font-size:10.3px;color:var(--v-muted);}

/* ── My ── */
.v-me{background:var(--v-grad);color:#fff;border-radius:22px;padding:19.2px 18px 18px;box-shadow:0 18px 32px -22px rgba(14,42,142,.9);}
.v-me-top{display:flex;align-items:center;gap:14.5px;}
.v-avatar{width:55px;height:55px;flex:0 0 55px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:#2a52d4;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.v-avatar img{width:100%;height:100%;object-fit:cover;}
.v-av-fb{width:28px;height:28px;color:#fff;}
.v-av-fb svg{width:100%;height:100%;}
.v-me-id{margin-top:-1.7px;}
.v-me-phone{font-size:16px;font-weight:700;letter-spacing:.3px;}
.v-vip{display:inline-block;margin-top:9px;background:rgba(255,255,255,.2);border-radius:999px;padding:0 11px;height:18.3px;line-height:18.3px;font-size:10.3px;font-weight:700;letter-spacing:.6px;}
.v-me-line{height:1px;background:rgba(255,255,255,.28);margin:13px 0 11px;}
.v-me-lbl{text-align:center;font-size:10px;letter-spacing:.8px;line-height:14px;opacity:.78;font-weight:500;}
.v-me-bal{text-align:center;font-size:28.5px;font-weight:700;letter-spacing:.6px;margin:8.5px 0 17.1px;line-height:34px;}
.v-me-btns{display:grid;grid-template-columns:1fr 1fr;gap:11.7px;}
.v-me-btns button{height:38.3px;border-radius:12px;font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;}
.v-me-btns .v-ic{width:17.5px;height:17.5px;flex-basis:17.5px;}
.v-me-dep{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.85);}
.v-me-wit{background:#fff;color:var(--v-blue);border:1.5px solid #fff;}
.v-sec{display:flex;align-items:center;gap:9px;margin:18.5px 0 14px;}
.v-form .v-sec{margin-bottom:17px;}
.v-form>.v-sec:first-child{margin-top:26px;}
.v-amount+.v-sec{margin-top:31px;}
.v-me+.v-sec{margin-top:25px;}
.v-sec .bar{width:3.5px;height:15px;border-radius:2px;background:var(--v-blue);}
.v-sec h2{margin:0;font-size:14.3px;font-weight:700;letter-spacing:1.15px;color:var(--v-ink);}
.v-sec i{flex:1;height:1px;background:linear-gradient(90deg,#f0b6b6,rgba(240,182,182,0));background:linear-gradient(90deg,#b9c5f1,rgba(185,207,251,0));}
.v-tiles{display:grid;grid-template-columns:1fr 1fr;gap:9.5px;}
.v-tile{background:#fff;border:1.5px solid var(--v-card-line);border-radius:13px;height:103.5px;padding:18px 6px 0;display:flex;flex-direction:column;align-items:center;gap:9px;font:inherit;color:var(--v-ink);cursor:pointer;}
.v-tile b{font-size:13.6px;font-weight:600;line-height:16px;}
.v-tile-ic{width:41px;height:41px;border-radius:11px;background:var(--v-grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -10px rgba(14,42,142,.8);}
.v-tile-ic svg{width:20px;height:20px;}
.v-tile-ic.gold{background:linear-gradient(135deg,#ffc61a,#ff7a1a);box-shadow:0 8px 16px -10px rgba(255,140,0,.8);}
.v-wide{margin-top:15.5px;width:100%;height:51px;border:1.5px solid var(--v-card-line);border-radius:12px;background:#eef1fd;color:var(--v-ink);font:inherit;font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:9px;}
.v-wide .v-ic{width:18px;height:18px;flex-basis:18px;}
.v-wide .v-ic{color:var(--v-blue);}
.v-logout{margin-top:22px;width:100%;height:48.5px;border:0;border-radius:24px;background:var(--v-grad);color:#fff;font:inherit;font-size:15px;font-weight:700;letter-spacing:1.8px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 14px 24px -18px rgba(14,42,142,.9);}
.v-logout .v-ic{width:18px;height:18px;flex-basis:18px;}

/* ── secondary pages (Deposit, Withdraw, Balance Record, Wallet ...) ── */
.sheet-bg{background:var(--v-bg);bottom:var(--nav-h);}
body.sheet-open .sheet-bg{bottom:var(--nav-h);}
body.deposit-status-open .sheet-bg{bottom:0;}
.sheet-head{background:#f7f8fe;border-bottom:1px solid #e3e8fa;padding:0 15px 0 14px;min-height:66.5px;box-shadow:0 8px 18px -18px rgba(14,42,142,.5);}
.sheet-head h2{color:var(--v-ink);font-size:17px;font-weight:700;letter-spacing:1.7px;white-space:nowrap;margin-right:22px;padding-left:0;}
.sheet-head .back{border:0;background:transparent;width:30px;height:36px;color:var(--v-ink);}
.sheet-head .back svg{width:16px;height:16px;}
.sheet-head .back svg path{stroke:var(--v-ink)!important;}
.sheet-body{padding:0 15px 36px;color:var(--v-ink);}
.v-form{padding-top:0;}
.v-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 9.5px;}
.v-chips .dep-chip,.dep-chip{height:46px;border:1.5px solid var(--v-card-line);border-radius:12px;background:#fff;color:var(--v-blue);font:inherit;font-size:15.5px;font-weight:700;}
.dep-chip.sel{background:#eaeefc;border-color:var(--v-blue-2);}
.v-amount{display:block;width:100%;height:53.5px;border:0;border-bottom:1.5px solid #c1cbf2;background:transparent;text-align:center;font:inherit;font-size:22.3px;font-weight:700;color:var(--v-ink);padding:18px 0 0;margin:0;border-radius:0;outline:0;}
.v-amount::placeholder{color:#c3cde4;}
.v-phone-in{display:block;width:100%;height:46px;border:0;border-bottom:1.5px solid #c1cbf2;background:transparent;text-align:center;font:inherit;font-size:18px;font-weight:700;color:var(--v-ink);padding:0;margin:8px 0 0;border-radius:0;outline:0;}
.v-phone-in::placeholder{color:#c3cde4;font-weight:500;}
.v-phone-in+.v-sec{margin-top:31px;}
.v-pays{display:grid;grid-template-columns:1fr 1fr;gap:10px 9.5px;}
.v-pays button{height:44.5px;border:1.5px solid var(--v-card-line);border-radius:12px;background:#fff;color:var(--v-blue);font:inherit;font-size:14.5px;font-weight:700;}
.v-pays button.on{background:var(--v-grad);color:#fff;border-color:var(--v-blue-2);box-shadow:0 10px 18px -14px rgba(14,42,142,.9);}
.v-cta{display:block;width:100%;height:44px;margin:30px 0 23px;border:0;border-radius:12px;background:var(--v-grad);color:#fff;font:inherit;font-size:15px;font-weight:700;box-shadow:0 14px 24px -18px rgba(14,42,142,.9);}
.v-cta.fade,.v-cta:disabled{opacity:.55;}
.v-info{background:#f5f6fd;border:1px solid #c9d3f5;border-radius:14px;padding:16px 17px 14px;}
.v-info h3{margin:0 0 6.5px;padding-bottom:7.2px;border-bottom:1px solid #d6e2fa;font-size:12.5px;letter-spacing:.4px;line-height:20px;font-weight:700;color:var(--v-ink);}
.v-info ol{list-style:none;counter-reset:vi;margin:0;padding:0;}
.v-info li{counter-increment:vi;color:#8791aa;font-size:11.2px;line-height:22px;margin-bottom:0;}
.v-info li::before{content:counter(vi) '. ';}
.v-bal{margin-top:23.5px;background:linear-gradient(135deg,#cfdaf8,#b3c3f1);border:1px solid #a5b6ec;border-radius:14px;height:106px;padding:20px 19px 0;position:relative;overflow:hidden;}
.v-bal::after{content:'';position:absolute;right:-8px;top:-10px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(47,123,255,.3),rgba(47,123,255,0) 70%);}
.v-bal span{display:block;font-size:12px;letter-spacing:1.5px;line-height:16px;color:#6d84b3;}
.v-bal b{display:block;margin-top:10px;font-size:32.5px;line-height:38px;font-weight:700;color:var(--v-ink);}
.v-amtrow{margin-top:23px;display:flex;align-items:center;gap:5.5px;background:#fff;border:1px solid #cdd6f4;border-radius:14px;height:51px;padding:0 15px;}
.v-amtrow+.v-sec{margin-top:30px;}
#witWalletBlock+.v-sec{margin-top:21.5px;margin-bottom:12.2px;}
.v-amtrow span{font-size:20.2px;font-weight:700;color:#8a94a8;}
.v-amtrow input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:20px;font-weight:700;color:#6c7488;}
.v-wcard{margin:0 6px;border-radius:16px;height:186.7px;background:linear-gradient(115deg,#1739b8 0%,#2a52d4 45%,#0e2a8e 60%,#1232a1 100%);color:#fff;padding:24px 19px 0;box-shadow:0 6px 26px rgba(23,57,184,.34);position:relative;overflow:hidden;}
.v-wcard::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.2) 48%,rgba(255,255,255,0) 60%);}
.v-wcard-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;}
.v-wcard-top b{font-size:15px;font-weight:700;letter-spacing:.5px;line-height:18px;}
.v-wcard-ic{width:23.7px;height:23.7px;margin-top:-6.2px;opacity:.95;}
.v-wcard-ic svg{width:100%;height:100%;}
.v-chip-art{width:33px;height:25.6px;margin:21.5px 0 15.3px;border:1px solid rgba(255,255,255,.6);border-radius:6px;background:rgba(255,255,255,.2);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);position:relative;overflow:hidden;box-sizing:border-box;}
.v-chip-art i{border:.5px solid rgba(255,255,255,.55);}
.v-wcard-num{font-size:17px;font-weight:700;letter-spacing:2px;position:relative;line-height:22px;}
.v-wcard-l{margin-top:9.7px;font-size:9px;letter-spacing:.5px;opacity:.8;position:relative;line-height:12px;}
.v-wcard-n{font-size:12.5px;font-weight:700;letter-spacing:.3px;margin-top:4.5px;position:relative;line-height:16px;}
.v-bind{display:block;width:100%;height:40.5px;margin-top:12px;border:1.5px solid var(--v-card-line);border-radius:12px;background:#fff;color:var(--v-blue);font:inherit;font-size:13px;font-weight:700;}
.v-pin{display:flex;align-items:center;background:#fff;border:1px solid #cdd6f4;border-radius:14px;height:43.5px;overflow:hidden;}
.v-pin input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15.5px;padding:0 16px;color:var(--v-ink);}
.v-pin input::placeholder{color:#8a94a8;}
.v-pin button{width:42px;height:42px;border:0;background:transparent;color:var(--v-blue);display:flex;align-items:center;justify-content:center;}
.v-pin button svg{width:20px;height:20px;}
.v-fee{margin:15.8px 0 0;font-size:14px;color:#8a94a8;}
.v-form .v-cta{margin-top:23px;}
.v-pays+.v-cta{margin-top:30.5px;}
.v-fee+.v-cta{margin-top:20px;}

/* ── Balance Record ── */
.v-recbal{text-align:center;padding:32px 10px 30px;position:relative;margin:0 -15px;}
.v-recbal span{display:block;font-size:12px;letter-spacing:1.85px;line-height:14px;color:var(--v-muted);}
.v-recbal b{display:block;margin-top:8.7px;font-size:36px;line-height:42px;font-weight:700;color:var(--v-ink);}
.v-recbal::before,.v-recbal::after{content:'';position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(47,123,255,.22),rgba(47,123,255,0) 70%);}
.v-recbal::before{left:-40px;top:-10px;}

#loadingScreen .ld-bar i{display:block;height:100%;width:0;border-radius:5px;background:#0759e3;transition:width .2s linear;}
#loadingScreen .ld-pct{position:absolute;top:calc(41.2% + 19px);left:0;right:0;text-align:center;font:400 12px/1 'Roboto',system-ui,sans-serif;color:#777;}
/* ── Login and Create Account ── */
.va-screen{background:var(--ck-auth);}
.va-screen::after{display:none;}
#authHeroBg{inset:auto;left:0;right:0;top:0;height:262px;-webkit-mask-image:linear-gradient(#000 0%,#000 58%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(#000 0%,#000 58%,rgba(0,0,0,0) 100%);background-position:center top;}
.va-scroll{justify-content:flex-start;padding:259px 26px calc(26px + env(safe-area-inset-bottom));}
.va-pane{max-width:none;}
#authScreen .va-card{padding:42px 0 0;border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:#fff;}
#authScreen .va-card h1,#loginPane .va-card h1,#registerPane .va-card h1{margin:0 0 19.8px;font-size:21px;line-height:28px;font-weight:700;color:#fff;}
#authScreen .va-f,#loginPane .va-f+.va-f{height:45px;padding:0;margin:0 0 20px;border:1px solid rgba(255,255,255,.75);border-radius:13px;background:linear-gradient(180deg,#f5f6fe 0%,#eceefb 100%);box-shadow:0 1px 3px rgba(20,50,110,.12);}
#authScreen .va-f:focus-within{border-color:#fff;box-shadow:0 0 0 2px rgba(7,89,227,.35);}
#authScreen .va-f input{height:43px;padding:0 0 0 19px;font-size:15.8px;color:#17213a;}
#authScreen .va-f input::placeholder{color:#6f7380;}
#authScreen .va-pre{margin:0 0 0 24px;padding:0 10px 0 0;font-size:16px;font-weight:500;line-height:20px;color:#1d56d4;border-right:1.5px solid #1d56d4;}
#authScreen .va-pre+input{padding-left:11px;}
#authScreen .va-ic{display:none;}
#authScreen .va-ic.va-gift{display:flex;flex:0 0 auto;width:auto;height:auto;margin:0 0 0 20px;color:#8a8d96;}
#authScreen .va-ic.va-gift svg{width:24px;height:24px;}
#authScreen .va-ic.va-gift+input{padding-left:12px;font-size:16px;}
#authScreen .va-eye{flex:0 0 auto;width:44px;height:43px;margin:0 8px 0 0;padding:0;border:0;background:transparent;color:#8b8e97;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#authScreen .va-eye svg{width:22px;height:22px;}
#authScreen .va-btn,#loginPane .va-btn,#registerPane .va-btn{height:41.2px;margin-top:0;border-radius:20px;background:var(--ck-grad);font-size:15.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 9px 16px -7px rgba(7,89,227,.6);}
#authScreen .va-link,#loginPane .va-link{margin:23.2px 0 0;font-size:15.9px;line-height:20px;color:#fff;}
#authScreen .va-link a{color:#fff;font-weight:400;}
#authScreen .va-rem{display:none;}
/* ── Announcement dialog ── */
.ann-bg{background:rgba(52,58,74,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ann-sheet.ck-ann{position:relative;width:min(312px,calc(100vw - 78px));max-width:none;gap:0;padding:31px 20px 16px;border-radius:10px;background:linear-gradient(180deg,#ffffff 0%,#f6f9fe 100%);box-shadow:0 24px 60px rgba(8,20,60,.35);}
.ck-ann-in{max-height:calc(100dvh - 110px);overflow:auto;-webkit-overflow-scrolling:touch;}
.ck-ann-x{position:absolute;top:-11px;right:-12px;z-index:2;width:35px;height:35px;padding:0;border:3px solid #fff;border-radius:50%;background:linear-gradient(160deg,#ff5a52,#d9212b);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(180,20,30,.4);cursor:pointer;}
.ck-ann-x svg{width:15px;height:15px;}
.ck-ann-img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover;border-radius:2px;}
.ck-ann-h{margin:6px 0 9px;text-align:center;font:700 18px/26px var(--ck-serif);color:#0b64b0;}
.ck-ann-t{border:1.5px solid #0e69b4;}
.ck-ann-t div{padding:7px 8px;min-height:37px;box-sizing:border-box;text-align:center;font:400 16px/23px var(--ck-serif);color:#0b64b0;}
.ck-ann-t div+div{border-top:1.5px solid #0e69b4;}
.ck-ann-p{margin:20px 0 0;text-align:center;font:400 16px/24.5px var(--ck-serif);color:#0b64b0;white-space:pre-line;}
.ck-ann-join{display:flex;align-items:center;justify-content:center;gap:10px;height:43px;margin-top:12px;border-radius:22px;background:var(--ck-grad);color:#fff;font-size:17px;font-weight:700;letter-spacing:.04em;text-decoration:none;box-shadow:0 8px 16px -8px rgba(7,89,227,.6);}
.ck-ann-join svg{width:22px;height:22px;}
/* ── Base: page colour, bottom bar ── */
:root{--nav-h:68px;--v-bg:#f1f1fd;}
html,body{background:linear-gradient(180deg,#f4f4ff 0%,#ededef 100%) fixed;}
.wrap,#pageHost,#app{background:transparent;}
body{background-attachment:fixed;}
#pageHost{min-height:calc(100vh - var(--nav-h));}
.bottom-nav,body.sheet-open .bottom-nav{height:var(--nav-h);padding:0;align-items:stretch;border:0;border-radius:16px 16px 0 0;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 -6px 22px -10px rgba(10,40,120,.22);}
.navitem{flex:1;padding:9px 0 7px;gap:3px;justify-content:flex-start;background:none;color:#8b8f99;overflow:visible;}
.navitem::before{top:auto;bottom:0;left:0;width:100%;height:3px;border-radius:0;background:var(--ck-blue);transform:none;transition:opacity .18s;}
.navitem.active{background:none;color:var(--ck-blue);}
.navitem.active::before{opacity:1;transform:none;}
.navitem .nav-ic{position:relative;top:0;display:flex;align-items:center;justify-content:center;width:48px;height:30px;border-radius:15px;color:#8b8f99;transition:background .2s,box-shadow .2s;}
.navitem .nav-ic svg{width:23px;height:23px;flex:0 0 23px;}
.navitem.active .nav-ic{color:#fff;background:linear-gradient(135deg,#0a56e3,#3f7eed);box-shadow:0 5px 12px -4px rgba(7,89,227,.6);}
.navitem .lbl{position:relative;top:0;font-size:13.5px;line-height:17px;font-weight:400;color:#8b8f99;letter-spacing:.01em;}
.navitem.active .lbl{font-weight:700;color:var(--ck-blue);}
/* ── Home ── */
#pageHost .v-home{padding:13px 15px 8px;}
#pageHost .home-banner{aspect-ratio:auto;height:184px;margin:0;border-radius:12px;box-shadow:0 10px 22px -16px rgba(7,40,120,.6);}
#pageHost .home-banner.v-banner-empty,#pageHost .home-banner:not(:has(img)){background:linear-gradient(135deg,#0a56e3,#5b91ee);}
.ck-quick{display:flex;justify-content:space-between;margin:11px 0 0;padding:13px 6px 11px;border-radius:20px;background:#fff;box-shadow:0 8px 24px -16px rgba(20,40,110,.28);}
.ck-quick{display:flex;grid-template-columns:none;gap:0;}
#pageHost .ck-quick button{flex:1;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;font:inherit;color:#14161c;cursor:pointer;}
.ck-quick .ck-ic{width:47px;height:47px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 7px 14px -6px var(--c);background:var(--c);}
.ck-quick .ck-ic svg{width:25px;height:25px;}
#pageHost .ck-quick b{font-size:13.5px;font-weight:700;letter-spacing:.01em;color:#14161c;}
.ck-tabs{display:flex;margin:11px 0 0;padding:4px;border:2px solid var(--ck-blue);border-radius:13px;background:#fff;}
.ck-tabs button{flex:1;height:38px;border:0;border-radius:8px;background:none;font:inherit;font-size:15.5px;font-weight:400;color:var(--ck-blue);cursor:pointer;transition:background .2s,color .2s;}
.ck-tabs button.on{background:var(--ck-blue);color:#fff;}
#pageHost #homeProducts{margin-top:11px;}
#pageHost .v-card{margin:0 0 11px;padding:10px;border:0;border-radius:18px;background:#fff;box-shadow:0 8px 22px -16px rgba(20,40,110,.3);overflow:visible;}
#pageHost .v-card-h{display:none;}
#pageHost .v-card-b{display:flex;gap:10px;padding:0;align-items:stretch;}
#pageHost .v-card-img,#pageHost .v-card.v-flat .v-card-img{position:relative;flex:0 0 146px;width:146px;height:146px;margin:0;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#0a56e3,#5b91ee);display:flex;align-items:center;justify-content:center;}
#pageHost .v-card-img img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0;}
#pageHost .v-card-img .v-glyph{color:#fff;font-size:44px;font-weight:700;}
#pageHost .v-badge{position:absolute;top:0;left:0;z-index:2;margin:0;padding:0 11px 0 9px;height:25px;line-height:25px;border-radius:14px 0 14px 0;background:var(--ck-blue);color:#fff;font-style:normal;font-size:12.5px;font-weight:400;}
#pageHost .v-rows{flex:1;min-width:0;margin:0;display:flex;flex-direction:column;justify-content:space-between;}
#pageHost .v-rows>div{display:flex;align-items:center;justify-content:space-between;gap:6px;height:28px;padding:0 9px;border-radius:9px;background:#eff4fd;}
#pageHost .v-rows dt{margin:0;font-size:13px;font-weight:400;color:#1b1d24;text-transform:none;letter-spacing:0;}
#pageHost .v-rows dd{margin:0;font-size:13.5px;font-weight:700;color:var(--ck-blue);white-space:nowrap;}
#pageHost .v-card-f{margin:10px 0 0;padding:0;}
#pageHost .v-buy{display:block;width:100%;height:32px;border:0;border-radius:9px;background:linear-gradient(100deg,#0a56e3 0%,#3b7bec 45%,#8bb3f3 100%);background-size:200% 100%;color:#fff;font:inherit;font-size:15px;font-weight:500;letter-spacing:.01em;text-transform:none;animation:ckShine 4.2s ease-in-out infinite alternate;box-shadow:none;}
#pageHost .v-buy span,#pageHost .v-buy.v-soon span,#pageHost .v-buy:disabled span{display:inline;font-size:15px;font-weight:500;letter-spacing:.01em;text-transform:none;-webkit-text-stroke:0;filter:none;animation:none;text-shadow:none;color:inherit;}
#pageHost .v-buy.v-soon,#pageHost .v-buy:disabled{background:#b9bbc5;color:#eceef3;animation:none;box-shadow:none;}
@keyframes ckShine{from{background-position:0 0;}to{background-position:100% 0;}}
@media (prefers-reduced-motion:reduce){#pageHost .v-buy{animation:none;}}
.v-empty{padding:40px 0;text-align:center;color:#b3b3b9;font:700 18.5px/1.2 var(--ck-serif);letter-spacing:.36em;padding-left:.36em;}
/* ── Sub pages: blue title bar ── */
.ck-hd{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:center;height:44px;background:var(--ck-blue);color:#fff;}
.ck-hd h1{margin:0;font-size:16.8px;font-weight:700;letter-spacing:0;color:#fff;position:relative;top:-1.2px;}
.ck-back{position:absolute;left:0;top:0;width:44px;height:44px;padding:0 0 0 6.9px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;}
.ck-back svg{width:23.6px;height:23.6px;margin-top:-8px;}
.ck-back svg path{stroke-width:1.5;}
.ck-sub{min-height:calc(100vh - var(--nav-h));}
.ck-hero{position:relative;width:100%;height:150px;background:var(--ck-blue) center/cover no-repeat;}
.ck-hero.has-img::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;background:linear-gradient(180deg,rgba(7,89,227,0),var(--ck-fade,#0759e3));}
.ck-hero:not(.has-img){height:0;}
/* ── Share ── */
.ck-share{background:var(--ck-blue);padding-bottom:calc(var(--nav-h) + 20px);}
.ck-share .ck-hero{height:178px;}
.ck-share .ck-hero:not(.has-img){height:0;}
.ck-sharecard{margin:16px 10.5px 0;padding:20.2px 10px 42px;border-radius:14px;background:#fff;}
.ck-share .ck-hero:not(.has-img)+.ck-sharecard{margin-top:35px;}
.ck-copyrow{display:flex;align-items:center;gap:8px;height:43px;min-height:43px;margin:0 0 10.5px;padding:0 10.5px 0 11px;border-radius:12px;background:#f5f5f5;}
.ck-copyrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16.4px;font-weight:700;color:var(--ck-blue);}
.ck-copyrow button{flex:0 0 auto;min-width:43.3px;width:43.3px;height:21.3px;padding:0;border:0;border-radius:4px;background:var(--ck-blue);color:#fff;font:inherit;font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;top:1px;}
.ck-note{margin:10px 0 9.4px;text-align:center;font:400 14.8px/24.45px var(--ck-serif);color:#0b64b0;}
.ck-lvtable{margin:0 3.4px;border:1px solid #e1e8f2;box-shadow:0 1px 3px rgba(20,60,120,.1);}
.ck-lvtable div{display:flex;align-items:center;justify-content:space-between;height:41.2px;padding:0 17.5px;background:#eff6fd;font:700 18px/1 var(--ck-serif);color:#0b64b0;}
.ck-lvtable div:nth-child(2){background:#a9c6f3;}
/* ── Sheets (Deposit, Withdraw, Wallet, Records ...) share the blue title bar ── */
.sheet-bg{background:linear-gradient(180deg,#f2f2fe 0%,#ececec 100%);}
.sheet-head,.sheet-head.pay-head{position:sticky;top:0;display:flex;align-items:center;justify-content:center;height:44px;min-height:44px;padding:0;gap:0;background:var(--ck-blue);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;}
.sheet-head h2{margin:0;padding:0 46px;flex:1;text-align:center;font-size:16.8px;font-weight:700;letter-spacing:0;color:#fff;position:relative;top:-1.2px;}
.sheet-head .back{position:absolute;left:0;top:0;width:44px;height:44px;padding:0 0 0 6.9px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:flex-start;}
.sheet-head .back svg{width:23.6px;height:23.6px;margin-top:-8px;}
.sheet-head .back svg path{stroke-width:1.5!important;}
.sheet-head .back svg path,.sheet-head.pay-head .back svg path{stroke:#fff!important;}
/* ── Income ── */
.ck-income,.ck-my{background:transparent;}
.ck-income .v-page{padding:12px 15px 8px;}
.ck-nodata,.v-empty.ck-nodata{padding:0 0 0 .36em;margin-top:171px;}
.ck-income .v-total{margin:0 0 11px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:46px;border:0;border-radius:14px;background:var(--ck-blue);color:#fff;box-shadow:none;}
.ck-income .v-total span{font-size:14px;color:#dbe7ff;text-transform:none;letter-spacing:0;}
.ck-income .v-total b{font-size:18px;color:#fff;}
#pageHost .v-owned .v-card-img.has-img,#pageHost .v-owned .v-card-img.v-fence{height:146px;overflow:hidden;background:linear-gradient(135deg,#0a56e3,#5b91ee);}
#pageHost .v-owned .v-card-img.v-fence img,#pageHost .v-owned .v-card-img.has-img img{position:static;width:100%;height:100%;object-fit:cover;border-radius:0;}
#pageHost .v-owned .v-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
#pageHost .v-owned .v-side .v-rows{flex:1;}
#pageHost .v-owned .v-badge{left:0;right:auto;}
#pageHost .v-dates{display:none;}
/* ── Team ── */
.ck-team{background:#fff;padding-bottom:calc(var(--nav-h) + 16px);}
.ck-team .ck-hero{height:172px;--ck-fade:#fff;}
.ck-team .ck-hero:not(.has-img){height:0;}
.ck-team .ck-hero.has-img::after{background:linear-gradient(180deg,rgba(255,255,255,0),#fff);}
.ck-stats{display:flex;gap:10px;margin:0 15px;position:relative;}
.ck-team .ck-hero:not(.has-img)+.ck-stats{margin-top:16px;}
.ck-stats>div{flex:1;height:71px;border-radius:9.4px;background:var(--ck-blue);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10.9px;box-sizing:border-box;gap:14.6px;}
.ck-stats span{font-size:12.8px;line-height:15px;}
.ck-stats b{font-size:15.5px;font-weight:700;line-height:18px;}
.ck-lvtabs{display:flex;margin:16px 15px 0;padding:5px;height:56px;box-sizing:border-box;border-radius:10px;background:var(--ck-blue);gap:10.6px;}
.ck-lvtabs .v-level{flex:1;height:46px;border:0;border-radius:6px;background:none;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.2px;padding:0;box-shadow:none;}
.ck-lvtabs .v-level b{font-size:15.6px;font-weight:400;line-height:1;}
.ck-lvtabs .v-level small{font-size:10.8px;line-height:1;opacity:.95;}
.ck-lvtabs .v-level.on{background:#fff;color:var(--ck-blue);}
.ck-lvinfo{margin:10px 15px 0;text-align:center;font-size:12.5px;color:#6c7384;}
.ck-team #teamMembersBox{margin:14px 14px 0;gap:14px;min-height:30vh;padding-bottom:90px;}
/* ── My ── */
.ck-my{padding-bottom:calc(var(--nav-h) + 16px);}
.ck-me{position:relative;height:248px;padding:30px 15px 0;background:linear-gradient(135deg,#0a56e3 0%,#5b91ee 100%);overflow:hidden;}
.ck-me.has-img{background:var(--ck-me-img) center/cover no-repeat;}
.ck-me.has-img::before{content:'';position:absolute;inset:-20px;background:inherit;filter:blur(7px);z-index:0;}
.ck-me::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,rgba(240,247,253,0),#f0f7fd);z-index:0;}
.ck-me-top{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px;}
.ck-avatar{position:relative;flex:0 0 80px;width:80px;height:80px;border-radius:50%;border:3px solid rgba(190,215,250,.9);background:#fff;box-shadow:0 6px 16px rgba(0,30,100,.3);}
.ck-avatar img,.ck-avatar .v-av-fb{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--ck-blue);}
.ck-avatar .v-av-fb svg{width:42px;height:42px;}
.ck-vip{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);padding:0 9px;height:19px;line-height:19px;border-radius:10px;background:#cfe0fb;color:var(--ck-blue);font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;}
.ck-me-id{min-width:0;padding-top:2px;}
.ck-me-phone{font-size:26px;font-weight:500;line-height:34px;color:#fff;text-shadow:0 1px 6px rgba(0,20,80,.35);white-space:nowrap;}
.ck-idchip{display:inline-block;margin-top:6px;padding:0 9px;height:19px;line-height:19px;border-radius:10px;background:#cfe0fb;color:var(--ck-blue);font-size:12.5px;}
.ck-balcard{position:relative;z-index:2;display:flex;margin:-98px 15px 0;height:82px;border-radius:16px;background:linear-gradient(180deg,#5a91ec 0%,#1a66e6 100%);box-shadow:0 12px 26px -14px rgba(7,60,180,.7);color:#fff;}
.ck-balcard>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;}
.ck-balcard>div+div::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:1px;background:rgba(255,255,255,.75);}
.ck-balcard b{font-size:19px;font-weight:500;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.ck-balcard span{font-size:15px;}
.ck-menu{margin:14px 15px 0;display:flex;flex-direction:column;gap:10px;}
.ck-row{position:relative;display:flex;align-items:center;gap:13px;width:100%;height:51px;padding:0 12px 0 14px;border:0;border-radius:14px;background:#f1f6fd;font:inherit;text-align:left;color:#14161c;cursor:pointer;}
.ck-row:active{background:#e6eefb;}
.ck-row-ic{flex:0 0 22px;width:22px;height:22px;display:flex;color:#111;}
.ck-row-ic svg{width:22px;height:22px;}
.ck-row-t{flex:1;font-size:16.5px;}
.ck-row-badge{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;line-height:18px;text-align:center;}
.ck-row-go{flex:0 0 18px;width:18px;height:18px;display:flex;color:#9aa0ad;}
.ck-row-go svg{width:18px;height:18px;}
/* ── Personal information, Rules, Wallet ── */
.sheet-bg.ck-rules-page{background:linear-gradient(180deg,#f2f2fe 0%,#ececec 100%);}
.sheet-bg.ck-pi-page{background:#fff;}
.sheet-bg.ck-bind-page{background:linear-gradient(180deg,#f2f2fe 0%,#ececec 100%);}
.ck-pi-art{display:block;overflow:hidden;box-sizing:border-box;height:304px;background:#095ae7;}
.ck-pi-art svg{display:block;width:100%;height:auto;margin-top:-8px;}

@media (prefers-reduced-motion:reduce){.ck-spin::before,.ck-spin::after{animation:none !important;}}
/* ── Bottom bar motion, frame by frame from the owner's recording ──
   tap: a soft ripple on the icon; then the blue pill starts as a small round dot and widens (the icon widens with it),
   the underline grows from the middle while the old one shrinks to its middle, and the page rises and fades in. */
@keyframes ckPillGrow{from{width:29px;}to{width:48.7px;}}
@keyframes ckIconWiden{from{transform:scaleX(.12);}to{transform:scaleX(1);}}
@keyframes ckRipple{0%{transform:translate(-50%,-50%) scale(.35);opacity:.9;}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0;}}
.navitem.active .nav-ic{animation:ckPillGrow .22s cubic-bezier(.25,.8,.35,1) both;}
.navitem.active .nav-ic svg{animation:ckIconWiden .22s cubic-bezier(.25,.8,.35,1) both;}
.navitem::before{opacity:1 !important;transform:scaleX(0) !important;transform-origin:center;transition:transform .22s cubic-bezier(.25,.8,.35,1) !important;}
.navitem.active::before{transform:scaleX(1) !important;}
.navitem .nav-ic::after{content:'';position:absolute;left:50%;top:50%;width:36px;height:36px;border-radius:50%;background:rgba(110,150,235,.28);opacity:0;pointer-events:none;}
.navitem.nav-tap .nav-ic::after{animation:ckRipple .32s ease-out;}
.navitem.nav-tap .nav-ic svg{animation:none;}
@keyframes ckPageIn{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}

<script data-cookie-idle>
// Where a login is kept. localStorage, so it survives closing the app or the browser (the server still ends it after its own idle/maximum time);
// sessionStorage when the browser does not allow localStorage. (sessionStorage alone ended every login the moment the tab or the app was closed.)
window.cookieKeep = (function(){ try { var k = '__cookie_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (_) { try { return sessionStorage; } catch (__) { return null; } } })();
// Real interaction renews activity; polling, focus, and visibility never do.
window.createCookieIdleSession = function(key, onExpire, onActivity){
  var IDLE = 4 * 60 * 60 * 1000, MAX = 4 * 60 * 60 * 1000;
  var state = null, lastPulse = 0, lastSave = 0, timer = null;
  function save(force){
    if (!state || (!force && Date.now() - lastSave < 1000)) return;
    lastSave = Date.now();
    try { window.cookieKeep.setItem(key, JSON.stringify(state)); } catch (_) {}
  }
  function clear(){ state = null; lastSave = 0; clearInterval(timer); timer = null; try { window.cookieKeep.removeItem(key); } catch (_) {} }
  function expire(){ if (!state) return false; clear(); onExpire(); return false; }
  // A phone's clock is corrected by the network now and then and can step
  // BACK by a few seconds. Treating any backward step as tampering signed
  // members out for nothing. A small step is absorbed by pulling the stored
  // times back to now (so it can lengthen a session by no more than SKEW);
  // a larger one is still refused, as is a clock that has run far ahead.
  // 60 seconds is the same limit the server applies to a login time that is
  // ahead of its own clock (checkMember in session-policy.js).
  var SKEW = 60 * 1000;
  function check(){
    if (!state) return false;
    var now = Date.now();
    if (!Number.isFinite(state.started) || !Number.isFinite(state.last)) return expire();
    if (state.last > now && state.last <= now + SKEW) state.last = now;
    if (state.started > now && state.started <= now + SKEW) state.started = now;
    if (state.last > now || now < state.started || now - state.last >= IDLE || now - state.started >= MAX) return expire();
    return true;
  }
  function pulse(){
    if (!check() || !onActivity || Date.now() - lastPulse < 30000) return;
    lastPulse = Date.now();
    Promise.resolve(onActivity()).catch(function(){});
  }
  function activity(e){
    if (document.hidden || !e.isTrusted || !check()) return;
    state.last = Date.now(); save(); pulse();
  }
  ['pointerdown','keydown','wheel','touchmove'].forEach(function(name){
    document.addEventListener(name, activity, {passive:true});
  });
  document.addEventListener('visibilitychange', function(){ if (check() && document.hidden) save(true); });
  window.addEventListener('pagehide', function(){ if (check()) save(true); });
  window.addEventListener('pageshow', check);
  return {
    begin: function(identity, started, fresh){
      clearInterval(timer);
      var saved = null;
      try { saved = JSON.parse(window.cookieKeep.getItem(key)); } catch (_) {}
      // Firebase timestamps use the server clock. Allow the same small
      // forward skew as the backend; clamp locally so no lifetime is added.
      var localStarted = started > Date.now() && started <= Date.now() + 60000 ? Date.now() : started;
      state = !fresh && saved && saved.identity === identity ? saved :
        {identity:identity, started:localStarted, last:localStarted};
      if (!check()) return false;
      save(true); timer = setInterval(check, 1000); lastPulse = 0; pulse(); return true;
    },
    check:check, clear:clear, expire:expire
  };
};
</script>

<script data-cookie-loader>
/* Paint the owner's loading picture on the very first frame: the copy kept from the last visit is set
   inline (no network wait), then the stored copy is refreshed in the background for next time. The very
   first launch ever has no copy yet, so it shows the gradient with the Loading... word until the picture arrives. */
(function(){
  window._cookieLoaderStart = Date.now();
  /* The bar and its percent: eases toward 96 while the app opens, and jumps to 100 the moment the screen is taken down. */
  (function(){
    var fill = document.getElementById('ldFill'), pct = document.getElementById('ldPct'), t0 = Date.now(), cur = 0;
    function set(n){ n = Math.max(cur, Math.min(100, Math.round(n))); cur = n; if (fill) fill.style.width = n + '%'; if (pct) pct.textContent = n + '%'; }
    window._ckLoaderDone = function(){ set(100); };
    var iv = setInterval(function(){
      var ls = document.getElementById('loadingScreen');
      if (!ls || ls.style.display === 'none' || cur >= 100) { clearInterval(iv); return; }
      var e = (Date.now() - t0) / 1000;
      set(96 * (1 - Math.exp(-e / 1.6)));
    }, 120);
    set(2);
  })();
  try {
    var ls = document.getElementById('loadingScreen'), bg = document.getElementById('ldBg'), KEY = 'cookie_loader_img', FX = 'cookie_loader_fx';
    var layer = function(u){ return 'url("' + u + '")'; };
    /* The picture's opacity (0-100) and blur (0-40 px) are remembered the same way, so they also apply on the first frame. */
    var fx = function(op, bl){
      op = Number(op); bl = Number(bl);
      if (!ls || !isFinite(op) || !isFinite(bl)) return;
      ls.style.setProperty('--ld-op', String(Math.min(100, Math.max(0, op)) / 100));
      ls.style.setProperty('--ld-blur', Math.min(40, Math.max(0, bl)) + 'px');
      try { localStorage.setItem(FX, Math.round(op) + ',' + Math.round(bl)); } catch (e) {}
    };
    window._cookieLoaderFx = fx;
    try { var kfx = (localStorage.getItem(FX) || '').split(','); if (kfx.length === 2) fx(kfx[0], kfx[1]); } catch (e) {}
    var kept = null; try { kept = localStorage.getItem(KEY); } catch (e) {}
    if (kept && bg) bg.style.backgroundImage = layer(kept);
    if (!window.fetch || !window.FileReader) return;
    fetch('/k7x2/public/loader-image', { cache: 'no-cache' }).then(function(r){ if (r.status === 404) { try { localStorage.removeItem(KEY); } catch (e) {} if (bg && kept) bg.style.backgroundImage = 'none'; return null; } if (r.ok) fx(r.headers.get('X-Loader-Opacity'), r.headers.get('X-Loader-Blur')); return r.ok ? r.blob() : null; }).then(function(b){
      if (!b || b.size > 1500000) return;
      var fr = new FileReader();
      fr.onload = function(){
        var u = String(fr.result || '');
        if (u.indexOf('data:image/') !== 0 || u === kept) return;
        try { localStorage.setItem(KEY, u); } catch (e) {}
        if (!kept && bg) bg.style.backgroundImage = layer(u);
      };
      fr.readAsDataURL(b);
    }).catch(function(){});
  } catch (e) {}
})();
</script>

<script>
/* THE APP'S NAME, PAINTED BEFORE ANYTHING ELSE.
 *
 * Owner: "l had made a little bit changes in names but on start up loader it
 * was still saying cookie."
 *
 * He is describing a real gap, not a bug in the rename. The name lives in
 * Admin -> Settings and reaches the app over the network, but the loading
 * screen is on screen precisely while that request is in flight -- so the
 * loader could only ever show whatever was compiled into this file, and what
 * was compiled in was the old name. Every boot, forever.
 *
 * So the name is remembered on the device the first time it is known, and
 * this runs before the 250KB core inflates: every launch after the very first
 * paints the real name in the first frame. The DOMContentLoaded pass catches
 * every [data-brandmark] further down the document -- currently just the
 * pre-launch countdown gate's own mark, since the loading screen no longer
 * carries one.
 *
 * Nothing here falls back to a hard-coded name. Owner: "let's not make cookie
 * to be default name" -- on a genuinely first-ever launch the mark stays
 * blank for the moment it takes settings to land. A blank that fills in is
 * honest; the wrong name is not.
 *
 * The mark is built with createTextNode/createElement rather than innerHTML.
 * The server already refuses < and > in the name, but this value has been
 * through localStorage, and building nodes is injection-proof by
 * construction instead of by remembering to escape.
 */
(function(){
  var KEY = 'cookie_brand_name';
  var name = '';
  try { name = (localStorage.getItem(KEY) || '').trim(); } catch (e) {}
  // The module reads this instead of its own localStorage: one read, one
  // place that knows the key.
  window.__brandCached = name;
  if (!name) return;
  document.title = name;
  var up = name.toUpperCase();
  // Just the name -- the last-letter-in-accent-colour "CHIP+Z" split was a
  // pun specific to Cookie's own name, meaningless for any other brand, so
  // it isn't carried over here (matches brandWordmarkHtml() in the module,
  // which this pre-core paint has to mirror since it runs before the module
  // exists).
  window.__paintBrandMarks = function(){
    var els = document.querySelectorAll('[data-brandmark]');
    for (var i = 0; i < els.length; i++) els[i].textContent = up;
  };
  window.__paintBrandMarks();
  document.addEventListener('DOMContentLoaded', window.__paintBrandMarks);
})();

/* Older browsers lack lvh. Ignore height-only resize events (address bar
 * and keyboard); recalculate only when the layout width changes. */
(function(){
  if (window.CSS && CSS.supports('height', '100lvh')) return;
  var lastWidth = 0;
  function sizeWallpaper(){
    var width = document.documentElement.clientWidth;
    if (!width || width === lastWidth) return;
    lastWidth = width;
    document.documentElement.style.setProperty('--wallpaper-height', window.innerHeight + 'px');
  }
  sizeWallpaper();
  window.addEventListener('resize', sizeWallpaper, { passive: true });
})();

/* Contain document edge drags on browsers that ignore overscroll-behavior.
 * Use the current movement direction so reversing at an edge works within
 * the same gesture. Lock only vertical gestures after a small movement
 * threshold; sideways swipes, nested scrollers and multi-touch stay native. */
(function(){
  function hasOwnScroller(el){
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollHeight > el.clientHeight) {
        var oy = getComputedStyle(el).overflowY;
        if (oy === 'auto' || oy === 'scroll') return true;
      }
      el = el.parentElement;
    }
    return false;
  }
  var startX = 0, startY = 0, lastY = 0, axis = null, blocking = false;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) { blocking = false; return; }
    startX = e.touches[0].clientX;
    startY = lastY = e.touches[0].clientY;
    axis = null;
    blocking = !hasOwnScroller(e.target);
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length !== 1) { blocking = false; return; }
    if (!blocking) return;
    var y = e.touches[0].clientY;
    var dy = y - lastY;
    lastY = y;
    if (axis === null) {
      var dx = Math.abs(e.touches[0].clientX - startX);
      var travelY = Math.abs(y - startY);
      if (Math.max(dx, travelY) < 8) return;
      axis = travelY > dx ? 'vertical' : 'horizontal';
    }
    if (axis !== 'vertical') return;
    var root = document.scrollingElement || document.documentElement;
    var atTop = root.scrollTop <= 0;
    var atBottom = root.scrollTop + root.clientHeight >= root.scrollHeight - 1;
    if (e.cancelable && ((atTop && dy > 0) || (atBottom && dy < 0))) e.preventDefault();
  }, { passive: false });
  function reset(){ blocking = false; }
  document.addEventListener('touchend', reset, { passive: true });
  document.addEventListener('touchcancel', reset, { passive: true });
})();
</script>
