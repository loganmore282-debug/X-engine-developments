<meta charset="utf-8">
<meta name="viewport" content="width=390, user-scalable=no, viewport-fit=cover">
<title>Cookie</title>
<!-- The SAME policy nginx sends as a header, carried in the file itself too.
     A host header cannot follow a file to another host, so this meta tag is
     what keeps the page covered even if it were ever served from somewhere
     other than this VPS's own nginx (a local test server with no headers
     configured, for instance) -- a document must satisfy BOTH, they
     intersect rather than one overriding the other.

     What this actually buys, on a money app: script injected into this page
     cannot POST a member's balance, session token or Trade Password to a
     server the attacker controls, and cannot LOAD a script from one. That is
     connect-src and script-src's host list; everything else here is
     supporting work.

     'unsafe-inline' in script-src is REQUIRED and must not be "tidied away":
     build-core.js ships the whole app as one inline <script> (s.textContent =
     code), which no hash can cover because the content changes every build.

     'unsafe-eval' is deliberately ABSENT, and there is one expected, harmless
     CSP violation on every load because of it. build-core.js / build-admin.js
     set `disableConsoleOutput: true`, and javascript-obfuscator implements
     that with a global-object helper shaped like
         try { g = Function('return this')(); } catch (e) { g = window; }
     Function() is eval, so the browser blocks it and reports a violation --
     then the catch assigns `window`, which is the same object it was reaching
     for, and the bundle carries on. Verified by test-csp-runtime.py, which
     walks every tab and sheet under the real policy.

     Do NOT add 'unsafe-eval' to silence that one line. It would let any
     injected script build code from a string, which is most of what this
     policy is here to prevent, in exchange for a warning that changes
     nothing. test-csp-runtime.py allows that exact violation and fails on
     any other, so a NEW eval -- one without a fallback, that really would
     break something -- is still caught.

     frame-ancestors is NOT here: a meta policy cannot express it (the browser
     ignores it), which is exactly why render.yaml keeps sending the header
     version too. The two are not redundant. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- Owner: "why app still have red upper title color? it takes space even."
     That red band above the app is Android painting the status bar with
     theme-color, and at #e21b2a it reads as a separate red title bar sitting
     on top of the app rather than as part of it -- which is exactly why it
     looks like it is taking space. Set to the app's own paper, the status bar
     becomes the top of the page and the band disappears. Chrome picks dark
     status icons for a light theme colour, so the clock stays readable.
     NOTE: manifest.json's theme_color must match, and an ALREADY-INSTALLED
     app keeps the colour it was installed with until it is reinstalled. -->
<meta name="theme-color" content="#f2f4fd">
<link rel="manifest" href="/manifest.json">
<!-- The app icon and the share card are both admin-uploadable, which is why
     these point at cookie-server rather than at the files sitting next to
     this one. Neither consumer can be reached from our JavaScript: Chrome
     reads the icon out of manifest.json when a member installs the app, and
     the WhatsApp / Telegram / Facebook crawler reads the og: tags below when
     someone pastes the link -- crawlers do not run scripts. So both have to
     be real files at fixed URLs, and the server swaps what sits behind them.
     It falls back to the bundled icon-192/512.png, so these never 404.
     THESE URLS ARE PERMANENT. Changing a path here breaks the installed
     icon and every previously-shared link at the same time. -->
<link rel="icon" href="/k7x2/public/app-icon-192.png">
<link rel="apple-touch-icon" href="/k7x2/public/app-icon-192.png">
<meta name="description" content="Cookie — invest, earn daily income, and grow your team.">
<!-- Link preview REMOVED entirely, again, all the way this time (owner,
     after the previous round left a text-only card in place: "why still
     link preview stuffs are still showing up") -- the earlier round kept
     og:title/og:description/og:type/twitter:title/twitter:description on
     the theory that a shared link should keep SOME summary card, just
     lose its picture. That reasoning is superseded now: a WhatsApp/
     Telegram/Facebook paste still rendered a title+description card with
     no image, which reads as "still showing a preview" exactly as
     reported. All of it is gone now, not just the image half -- pasting
     the link renders as a bare URL, the same as any page with no
     og:/twitter: tags at all. <meta name="description"> above is left
     alone; that is a search-result snippet, not a link-preview card, and
     removing it would hurt search visibility for zero benefit toward
     what was actually asked. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Warm the existing login/API connections while the sign-in screen loads. -->
<!-- All admin-selectable number/digit fonts (see NUMBER_FONT_STACKS in
     original_module.js) loaded in one request -- Georgia and "System
     default" need no webfont, so they aren't listed here. Loading every
     option up front (not just whichever is currently selected) means
     switching the admin setting never needs a fresh network request or a
     page reload to take visible effect. -->
<!-- Barlow Condensed/Playfair Display/Bodoni Moda/DM Serif Display/Roboto
     Mono/JetBrains Mono/Orbitron were Cookie's own font auditioning, carried
     into this fork unmodified -- Barlow Condensed was the one actually in
     use (body{font-family} below, the single source every other rule's
     font-family:inherit reads from); the other six were dead imports,
     referenced nowhere else in this file, just extra network weight on
     every load. Inter replaces Barlow Condensed as this app's own body/
     number font: a plain, normal-width sans (Barlow Condensed is
     condensed/narrow, which combined with this app's many font-weight:700/
     800 rules is what read as "still Cookie's bold font") with weights wide
     enough that headings/buttons don't need to reach for 800 to stand out. -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Cookie design tokens ──────────────────────────────────────────────
   Value-only swap of the token names this codebase already uses everywhere
   (the same convention Snow's own history documents for its repeated colour
   changes) -- every existing rule keeps working, the whole app reskins at
   once. Cookie's palette is the bold Doritos-style red->orange gradient on a
   warm cream/paper ground; --snow-green stays a real green because it is
   used semantically (positive amounts, success pills), not as a brand
   accent. */
:root{
  /* ── Re-themed to Cookie's own "Premium Industrial Energy" identity ──
     Owner-specified, not invented: Corporate Red #1739b8 (primary --
     headers, buttons, active nav, cards), Clean White #FFFFFF (dashboard
     background), Golden Orange #F5A000-#FFB000 (secondary accent, off the
     logo and refinery/sunset lighting), Charcoal #25262B (auth glass
     panels, text, secondary UI). Green stays FUNCTIONAL ONLY (success
     states) -- explicitly not a theme color, so those tokens are the one
     set below left untouched. Variable NAMES are kept (--snow-* / --cookie-*)
     with only the VALUES swapped -- the same low-risk convention this file's
     own admin-src.html already used for its own re-theme (see that file's
     --gold comment): every one of the hundreds of rules in this file already
     reads these tokens, so nothing downstream needed touching to pick up
     the new palette. */
  --snow-canvas:#f2f4fd;
  --snow-surface:#ffffff;
  --snow-ink:#25262b;
  --snow-muted:#6b6d76;
  --snow-wine:#1739b8;
  --snow-wine-deep:#0e2a8e;
  --snow-green:#1a7a3e;
  --snow-border:#d4dcf7;
  --snow-wave-on-wine:#d0d8f6;
  --snow-green-deep:#146030;
  --snow-wine-soft:#dde3fa;
  --snow-green-soft:#dff2e2;
  --snow-neutral-soft:#f5f5f6;
  --snow-radius-card:22px;
  --snow-radius-tile:16px;
  --snow-radius-control:16px;
  --snow-radius-sheet:32px;
  /* Cookie additions (no Snow equivalent) */
  /* Bottom nav height. Grew from 68px when the icons did -- owner, twice:
     "the nav icons are small". */
  --nav-h:68px;
  --cookie-orange:#f5a000;
  /* Flat, not a gradient -- the mockup's cards/buttons/header are a solid
     corporate red, not Cookie's old red-to-orange blend. Still a CSS custom
     property assignable straight into `background:`, so every one of the
     ~40 rules that read --cookie-grad needed no change at all. */
  --cookie-grad:linear-gradient(135deg,#2448cc 0%,#1739b8 45%,#0e2a8e 100%);
  /* .auth-hero's fallback ONLY -- shown behind the Login/Sign Up glass
     panel until the owner uploads the real sunset-refinery photo to the
     'authhero' image slot (already-built admin upload, see
     /admin/cookie-image/set + COOKIE_IMAGE_SLOTS in server.js). Charcoal to
     deep red to gold, echoing that same warm dusk-over-a-refinery mood as a
     photo-free placeholder rather than a random gradient. */
  --cookie-hero:linear-gradient(160deg,#0a1f5c 0%,#0b2278 55%,#4a70e6 100%);
  --cookie-gold:#ffb000;
  --cookie-neg:#0b2278;
  /* Not blue -- the owner was explicit this should not read as "the typical
     blue/green fintech look." Deep red carries the same "this is a link"
     legibility a blue would, without introducing a fifth brand color. */
  --cookie-link:#0e2a8e;
  --cookie-shelf:#0e2a8e;
  /* ── Surfaces ──
     Owner, holding a mockup next to the live app: "the mock up has very
     clean CSS, well ultra definition and quality cards and colour ... clean
     cards, well defined and high quality."

     What actually separated the two was not colour. Ninety-one rules
     hardcoded `border-radius:4px` -- square, at the size where a corner
     reads as an unfinished edge rather than a decision -- and every card
     leaned on a hard 1px hairline with a shadow so far offset
     (`-16px`/`-24px` spread) that it never drew a pixel. A hairline with no
     shadow is a wireframe; a shadow with no hairline is a smudge. Cards need
     both, and the corner has to be big enough to see.

     These three radii are now the ONLY ones in the file, so a card can never
     again be 4px in one place and 16px in another:
       --r-card  panels, list rows, sheets, anything holding content
       --r-ctl   buttons, inputs, chips, tiles -- tighter, so a control
                 reads as pressable rather than as a small card
       --r-pill  status pills, accent bars, progress tracks
     Two-layer shadow: a 1-2px contact shadow that defines the edge, plus a
     wide soft one that lifts it off the cream canvas. One layer alone gives
     you either a hard line or a haze. */
  --r-card:16px;
  --r-ctl:12px;
  --r-pill:999px;
  --sh-card:0 1px 2px rgba(30,10,5,.05),0 12px 26px -16px rgba(30,10,5,.34);
  --sh-card-hi:0 2px 4px rgba(30,10,5,.06),0 22px 42px -20px rgba(30,10,5,.42);
  /* The hairline, dialled back: it is now an edge highlight sitting on top of
     a real shadow, not the only thing holding the card together. */
  --line-soft:rgba(239,224,211,.72);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
body{background:var(--snow-canvas);font-weight:400;font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--snow-ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-variant-numeric:lining-nums tabular-nums;font-family:var(--number-font,inherit);}
/* Cookie leads with a serif display face for headings/figures over a
   condensed sans for body copy, matching every approved mockup. */
h1,h2,h3,.section-title,.stat-val,.bal-value{}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}
a{color:inherit;}
/* Keep the scrollbar subtle on the document as well as nested scroll areas. */
html,body{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:var(--r-pill);}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.35);}
::-webkit-scrollbar-corner{background:transparent;}

/* Owner: "l also need 3d buttons" -- a solid darker shelf under every primary
   CTA plus a real press-down :active state, applied once here so every button
   in the app picks it up. */
.primary-button{background:var(--cookie-grad);color:#fff;border:none;border-radius:var(--r-ctl);font-weight:700;letter-spacing:.02em;
  box-shadow:none;
  transform:translateY(0);transition:transform .1s,box-shadow .1s;}
.primary-button:active:not(:disabled){transform:translateY(4px);box-shadow:none;}
.primary-button:disabled{opacity:.5;box-shadow:none;}
.secondary-button{background:var(--snow-surface);color:var(--snow-wine);border:1.6px solid var(--snow-wine);border-radius:var(--r-ctl);font-weight:700;
  box-shadow:0 4px 0 var(--snow-border);transform:translateY(0);transition:transform .1s,box-shadow .1s;}
.secondary-button:active:not(:disabled){opacity:.85;}
/* Dark variant used for Log Out / Edit Wallet, per the Account + Wallet mockups. */
/* Cookie CTAs stay visually stable at rest. The old perpetual highlight sweep
   was inherited interaction choreography; only deliberate press/focus states
   move now, which keeps the industrial interface quiet and predictable. */

/* Team member Active / Pending. Same treatment as the record pills, for the
   same reason -- one pill vocabulary across the app, so a status looks like a
   status wherever it appears. Pending stays deliberately quiet: it is the
   absence of a thing, and shouting it would make every new referral look like
   a problem. */

/* --nav-h is the ONE place the bar's height is written. Four other rules
   depend on it (the page's bottom padding, the sheet overlay's bottom
   inset, the Download panel's height) and they used to repeat 68 as a
   literal, so growing the bar meant finding all four. */
.bottom-nav{z-index:210;background:rgba(255,255,255,.98);border-top:1px solid var(--snow-border);display:flex;align-items:center;justify-content:space-around;height:var(--nav-h);position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:0 8px;box-shadow:0 -10px 30px -28px rgba(37,38,43,.55);}
.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--snow-muted);background:none;border:none;padding:8px 2px 6px;flex:1;min-width:0;position:relative;}
/* Cookie navigation is an industrial rail, not Cookie's springy selector box.
   The active tab is marked by a restrained red line that stays anchored to
   the bar; taps use a short signal-dip, with no squash/overshoot/bounce. */
.navitem::before{content:'';position:absolute;top:0;left:50%;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--snow-wine);opacity:0;transform:translateX(-50%) scaleX(.35);transform-origin:center;transition:opacity .16s ease,transform .16s ease;}
.navitem.active::before{opacity:1;transform:translateX(-50%) scaleX(1);}
.navitem .nav-ic,.navitem .lbl{position:relative;z-index:1;}
.navitem .nav-ic{display:flex;align-items:center;justify-content:center;width:30px;height:30px;color:var(--snow-muted);transition:color .16s ease,transform .16s ease;}
.navitem .nav-ic svg,.navitem .nav-ic .supplied-icon{width:24px;height:24px;flex:0 0 24px;transition:transform .16s ease,opacity .16s ease;}
.navitem .lbl{font-size:10px;font-weight:600;white-space:nowrap;transition:color .16s ease;}
.navitem.active{color:var(--snow-wine);}
.navitem.active .nav-ic{color:var(--snow-wine);transform:translateY(-1px);}
.navitem.active .lbl{font-weight:700;color:var(--snow-wine);}
.navitem.nav-tap .nav-ic svg,.navitem.nav-tap .nav-ic .supplied-icon{animation:navTapSignal .18s ease-out;}
@keyframes navTapSignal{
  0%{transform:translateY(0);opacity:1;}
  45%{transform:translateY(1px);opacity:.62;}
  100%{transform:translateY(0);opacity:1;}}
@media (prefers-reduced-motion:reduce){
  .navitem::before,.navitem .nav-ic,.navitem .nav-ic svg,.navitem .lbl{transition:none;}
  .navitem.nav-tap .nav-ic svg,.navitem.nav-tap .nav-ic .supplied-icon{animation:none;}}



.wordmark{display:flex;align-items:center;gap:9px;}



/* Product card, per the owner's reference screenshot: the NAME sits on top,
   centred and large, then the full-width image, then a 2x2 grid of tinted
   stat tiles, then a full-width Buy Now. The reference is a screenshot of
   an unrelated app in a purple/blue theme -- layout, labels and proportions
   are copied, the colours are Cookie's own (CLAUDE.md's design-fidelity
   rule). */
/* Owner: "product cards are rounded and large, they should be small and not
   rounded." The 22px radius and 170px image came from the mockup, but with
   four money tiles under them each card filled a whole phone screen. Tighter
   radius, half the image height, and smaller type -- roughly half the height
   per card, so several are visible at once. */
/* Owner: no title bar -- the product name sits ON the image. Product photos
   are stored at exactly 1600x900 px, 16:9 (the admin panel cover-fits every
   upload onto that frame), so the card frame is aspect-ratio driven rather
   than a fixed pixel height: the image fills it exactly, with no letterboxing,
   whatever the phone's width. 1600 px wide still covers a 3x phone at the
   ~355 px card width, so it stays sharp.

   This was 4:3 until the owner sent his real artwork -- 1721x914, near enough
   16:9 -- with "reduce on the size of cards their height is very high, just
   like you see that resolution it should be that". 4:3 was the cause: at a
   354 px card the image alone was 264 px tall and the whole card 422 px, so
   barely two fitted on a phone screen. 16:9 takes the image to 199 px and the
   card to 357 px. Measured, not estimated. */
.p-card{background:var(--snow-surface);border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line-soft);box-shadow:var(--sh-card);}
/* Owner: "l also want when l tap on the product card it fades in then out,
   but no action just it is animation but no action should be there on
   triggering buy."
   So the CARD acknowledges a tap and does nothing else. Buying stays behind
   the Buy Now button alone -- tapping a card must never start a purchase,
   which is why this is a class toggled by a listener rather than any kind of
   onclick handler on the card itself.

   The first version dipped OPACITY to .62 and left transform alone. Owner:
   "you failed to understand, cozy when l tap it just cause faint image
   instead of make product card bounce in or fade in and out minimumly." He is
   right, and the reason is worth keeping: fading a card does not read as the
   card responding, it reads as the card briefly failing to draw. A press is a
   physical event, so the acknowledgement has to be physical -- the card gives
   under the finger and springs back.

   Same spring curve as the nav icon, a fraction of its amplitude. The nav
   icon squashes to .74 and overshoots to 1.18, which is right for a 30px
   glyph and would look like the whole screen lurching on a 360px-wide card.
   "Minimumly": 2.8% in, under 1% out -- enough to see, not enough to move the
   layout under the finger. Nothing here changes opacity, so the card never
   goes faint again. */
.p-card.card-tap{animation:cardTapBounce .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardTapBounce{
  0%{transform:scale(1);}
  34%{transform:scale(.972);}   /* in  */
  68%{transform:scale(1.008);}  /* out */
  100%{transform:scale(1);}}
@media (prefers-reduced-motion:reduce){.p-card.card-tap{animation:none;}}
/* A scrim, not a solid bar -- the name has to stay readable over whatever
   photo is uploaded without hiding the top of it. */
.p-stat{background:var(--snow-green-soft);border-radius:var(--r-ctl);padding:8px 6px;text-align:center;}
.p-stat.warm{background:var(--snow-wine-soft);}
.p-stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--snow-muted);font-weight:600;}
/* Owner: "make sure those boxes can withstand figures ie of 7 characters."
   Verified live (headless Chromium, real card width, up to 9-digit UGX
   values at 320px) that these already hold a genuinely large figure
   without visibly overflowing -- but white-space:nowrap had no overflow
   fallback at all, so a truly extreme value (or a device zoomed in) would
   have had nowhere to go but spill past the card edge. overflow:hidden +
   ellipsis is a pure safety net: it changes nothing for any value that
   already fits, which every real one does. */
.p-stat .v{font-size:16px;font-weight:700;color:var(--snow-ink);margin-top:2px;font-family:var(--number-font,inherit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

/* ── Home / Products / Referral (Cookie mockups) ───────────────────── */
/* Cookie's own rule here was edge-to-edge, no rounding, no side gutters
   (owner, at the time: "it should complete the margin"). The new mockup
   shows the opposite -- a rounded, inset card with visible white margin
   either side, so this follows the new mockup rather than the old Cookie
   preference; .ref-banner (the Referral page's own banner, not shown in
   any mockup yet) keeps the original edge-to-edge treatment. */
.home-banner{margin:0 18px 14px;height:190px;border-radius:var(--r-card);position:relative;overflow:hidden;background:var(--cookie-hero);}
/* ── SKELETON LOADERS ──
   Owner: "use skeleton loaders exactly how the screen contents will appear
   after load." So these are not generic grey bars -- each one is built from
   the same measurements as the real thing it stands in for, so nothing jumps
   when the data lands. Before this, a first-ever visit with nothing cached
   painted the real screen with empty data: "0 plans", zeroed totals, an empty
   member list -- indistinguishable from a member who genuinely has none.
   The shimmer stays. It is what makes a block read as "loading" rather than
   as a broken empty box, and it is not the content-entrance animation that
   was removed earlier. */
/* A tint, not a flat colour: --snow-neutral-soft was so close to the cream
   page that the blocks were invisible on it. An alpha tint reads at the same
   strength on the page AND on the white cards the skeletons sit inside. */
.sk{position:relative;overflow:hidden;background:rgba(60,26,14,.09);border-radius:var(--r-ctl);}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:skShimmer 1.25s ease-in-out infinite;}
@keyframes skShimmer{100%{transform:translateX(100%);}}

/* ── The member card, measured off his mockup ──────────────────────────
   Owner: "l need that exactly what you're seeing, all the arrangements, have
   you seen even those green winnings on cards, l need them, also figures are
   small why?"

   THE GREEN EDGE is real and ours had none. Sampled straight out from the left
   edge of his card 1: G-R reaches +12 and G-B +10 in the two pixels just
   outside it, then decays to the page's own +1 over about 8 device px. Ours
   carried `var(--sh-card)`, a warm brown drop shadow, and a warm neutral
   border -- no green anywhere. This is the same glow .team-gcard already uses
   above, rgba(74,170,108,...), so the two card families on this one screen
   finally match instead of one being warm and one green.

   Both screenshots are 720 device px wide on the same phone, so
   720/390 = 1.846 device px per CSS px, and his figures convert directly:

     card height   244 dev = 132.2 CSS   (ours was 129)
     gap           28 dev  =  15.2 CSS   (ours was 12)
     side margin   32 dev  =  17.3 CSS   (ours 18 -- unchanged) */
/* Owner: "a profile logo like one uploaded from admin, number and active or
   inactive nothing else to put" -- avatar, phone, status pill, one row, no
   card content beneath it. Replaces the earlier mockup-matched card (amount/
   joined-date/footer, with its own measured-ink-height sizing) entirely. */
/* The disc holds a mark now (owner: "why the logo is empty?"), so it needs to
   centre one. Mirrors .acct-logo's rules at 44px instead of 68px: cover for an
   uploaded logo so a square upload fills the circle rather than letterboxing,
   and overflow:hidden so it is clipped to the circle either way. */

/* Team.dc.html's level switcher: three separate pills, the active one filled
   with the brand gradient and its own 3D shelf -- not the soft segmented
   control inherited from Snow. */

/* ── Account (Account.dc.html) ──
   A profile card (logo / ID / phone / wallet balance / Deposit+Withdraw)
   above a plain white SETTINGS list, then a black Log Out button. This
   replaces Snow's coloured card matrix entirely. */
/* When an animated logo is set it becomes the profile mark itself, and the
   circle has to give way: the source is 300x220 landscape, and cropping that
   to a 60px circle would cut roughly a quarter of its width off the sides.
   So the slot takes the source's own aspect ratio, contains rather than
   covers (nothing cropped, nothing stretched), and drops the gradient
   backing so the file's transparency shows through.
   Resolution: 66px tall renders at 132-198 device pixels on a 2x/3x phone,
   comfortably inside the source's 220px height, so it is always downscaled
   and stays crisp -- it is never blown up past its native size. */
/* Owner, against a reference screenshot: "the number of account balance is
   large and UGX and colored in the colour of site, so ours should be that
   orange." So the whole figure -- the UGX too, not just the digits -- is the
   brand orange, big and bold, exactly as the reference treats its own brand
   colour. It was 34px in the app's default text weight and ink colour, which
   is what made it read as ordinary body text next to the reference.
   Size is capped by the longest figure that has to fit on a 390px phone
   without wrapping (see test-balance-style.py, which measures the real
   rendered width rather than trusting the number here). */
/* Owner: "but has no gradient just like you see buttons, other side is conc
   another is half conc" -- the Deposit button runs deep red on one end into
   orange on the other, and the figure was a single flat orange next to it.
   Same --cookie-grad, same 135deg, painted through the glyphs.
   Guarded by @supports because the fallback for an unsupported
   background-clip is an INVISIBLE balance -- the flat orange above stays as
   the fallback, and only browsers that can actually clip to text get the
   gradient. -webkit-text-fill-color is the one WebKit honours. */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  }
/* Every number below is measured off the owner's own mockup, not chosen.
   His screenshot and ours are both 1080 device px wide on the same phone, so
   device pixels compare directly; 1080/390 = 2.769 device px per CSS px.

     icon tile      his 114 dev px -> 41 CSS   (ours was 52, 1.28x too big)
     row pitch      his 193        -> 70 CSS   (ours was 250)
     title ink      his  30        -> 15 CSS   (ours was 35 at 17.5px)
     Deposit btn    his 141 tall   -> 51 CSS   (ours was 58)
     Log Out        his 146 tall   -> 53 CSS   (ours was 54, already right)

   Owner: "see cards in account are very big plus their icons, please use
   exactly the size of mock up, even see button size of withdrawal and
   deposit." Row pitch is tile + 2x padding + the 1px rule: 41 + 28 + 1 = 70,
   which is his 69.7 to within a pixel. */
/* The Invitation Reward heading's accent bar. Same shape and gradient as
   .sec-head .bar so the two read as one device, sized to this smaller 17px
   heading rather than Account's 22px one. */
/* Owner: "see the settings card is having green line." It is the CARD's own
   border, not the rule beside the heading -- sampled down his left edge it
   holds rgb(236,243,235) from the top of the card to the bottom, G-R = +7,
   a green-tinted hairline rather than the neutral one we had. */
/* Each tile carries its OWN background, sampled top-left to bottom-right off
   his mockup -- they are gradients, not flat fills. Two stops were his
   theme's purple and are translated to the brand's orange per the standing
   rule (shape and placement from the mockup, colour from Cookie); owner:
   "the first of download app it is purple, so here it should be orange."
   Everything else is his measured colour unchanged, including the pale green
   behind Balance Record that he pointed at specifically.
     download  (100,31,112) -> ( 78, 23, 88)   purple  => deep orange
     wallet    (255,209,12) -> (232,195, 78)
     balance   (177,202,172)-> (224,238,225)
     messages  (254,244,208)-> (250,244,230)
     loginpw   ( 98,52, 98) -> (233,216,188)   purple  => deep orange
     tradepw   (192,161,96) -> (246,202, 15)
   Turntable has no counterpart in his mockup (that row does not exist there),
   so it takes a warm coral that sits between the gold above it and the green
   below rather than inventing a seventh hue out of sequence. */
/* Language has no counterpart in the owner's mockup (that row does not exist
   there), so like Turntable it takes a tone that sits inside the sequence
   already measured off it rather than introducing a hue of its own -- a
   deeper burnt orange, one step darker than Download APP's so the two do not
   read as the same tile. Its glyph is stroked white, hence the light end
   stays dark enough to keep it legible. */
/* The owner's own door artwork, at the size his mockup draws it: his
   glyph measures 31x47 device px, which is 17 CSS px tall. Width is left
   auto so the door keeps its own proportions instead of being squashed

/* ── Notify dialog (Notify.dc.html) ── */
/* A dark, small, centred toast -- owner: "don't send the same notify design
   as old Cookie code... make these dark small, not designed" (kept), then
   later: "l nolonger need such notifies of in page... all notifies in
   middle not bottom" -- moved from bottom-anchored to the middle of the
   screen, and this is now the ONLY place a validation/error message shows
   anywhere in the app (the auth screens used to write their own inline
   pink error boxes into the page instead of calling this -- see
   regError()/forgotError() and doLogin() in original_module.js -- that
   second pattern is gone, not just hidden). No dimmed backdrop and no OK
   button: the toast itself is the only tappable thing (dismiss early by
   tapping it), it also auto-dismisses on its own (see notify()'s timer),
   and it never blocks taps on the rest of the screen -- .notify-bg spans
   the full screen but takes no pointer events itself, and .notify-card
   only takes them while .show is actually applied.
   Real bug, found from an owner report ("buttons tend to freeze" after a
   notify appears) rather than guessed at: .notify-card used to be
   pointer-events:auto UNCONDITIONALLY, not just while visible. notifyMsg's
   textContent is never cleared on close, so after the first notify() call
   this invisible, still-fully-clickable card sits centred on screen at
   whatever size that last message needed, forever -- confirmed live with
   elementFromPoint() that a tap on a genuinely centred button (e.g. Login)
   was being swallowed by this ghost card instead of reaching the button
   underneath. Scoping pointer-events to .show fixes the whole class of it
   regardless of the card's leftover size, rather than also having to
   remember to clear notifyMsg on every close path. */
.notify-bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 28px;z-index:440;pointer-events:none;}
.notify-card{pointer-events:none;max-width:360px;background:rgba(37,38,43,.96);color:#fff;padding:14px 20px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:1.4;text-align:center;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);transform:scale(.9);opacity:0;transition:transform .22s cubic-bezier(.34,1.35,.64,1),opacity .18s;}
.notify-bg.show .notify-card{pointer-events:auto;transform:scale(1);opacity:1;}
.notify-msg{white-space:pre-line;}

/* ── Messages (MessagesList.dc.html / Messages.dc.html) ── */
/* Owner: "they have design ... the mock up has a very clean css, high
   quality and definition." His unread row is not a flat white rectangle: it
   is a soft gradient card carrying a TINTED glow in the accent hue, so an
   unread message looks lit rather than merely outlined. Ours had the accent
   only as a 3px bar on the left edge, which is a marker, not a design.
   The glow is the brand's warm one for the same reason the backdrop is --
   his green belongs to his theme. */
.msg-row{display:flex;align-items:flex-start;gap:14px;background:linear-gradient(135deg,#ffffff 0%,#fff6ef 100%);border:1px solid var(--line-soft);border-left:3px solid var(--snow-wine);border-radius:var(--r-card);padding:16px;margin-bottom:12px;width:100%;text-align:left;font-family:inherit;color:var(--snow-ink);box-shadow:0 1px 2px rgba(30,10,5,.05),0 12px 26px -14px rgba(226,27,42,.42);}
/* A read message loses the lift as well as the bar -- it is done with, and
   should sit back rather than keep competing with the unread ones. */
.msg-row.read{background:var(--snow-surface);border-left-color:var(--snow-border);box-shadow:var(--sh-card);}
/* Same raised disc as the Balance Record avatars -- one avatar treatment
   across the app, not two that nearly match. */
.msg-row .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(145deg,#eafaee 0%,#b8e6c6 100%);color:#116434;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  box-shadow:0 6px 14px -6px rgba(20,96,48,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.msg-row .txt{flex:1;min-width:0;}
.msg-row .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.msg-row .t1{font-weight:600;font-size:15px;line-height:1.35;}
.msg-row .date{font-size:11px;color:var(--snow-muted);font-weight:500;text-align:right;flex-shrink:0;white-space:nowrap;}
.msg-row .t2{font-size:12px;color:var(--snow-muted);font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Owner, holding his mockup's before/after beside ours: "you can see blurry
   green, and message doesn't slide from down."
   Both halves measured off the two screenshots at matched width.

   THE BACKDROP. His reads rgb(163,218,186) -- luminance 189, a LIGHT tinted
   wash with the list visibly blurred behind it. Ours read rgb(134,125,118),
   luminance 126: a flat grey-brown dim, no blur, no hue. The difference is
   not "a bit darker", it is the opposite operation -- his lifts and tints the
   page, ours drops a dirty sheet over it.
   The tint here is the BRAND's warm one, not his green. His mockups are drawn
   in a purple/green theme; a green wash is the right answer in that app and
   would be the only green surface in this one. The effect is his, the hue is
   Cookie's -- say the word and it goes green.
   backdrop-filter is what does the blurring; the rgba on top does the tint.
   Both are needed: the blur alone leaves the colour of whatever is behind it,
   and the tint alone is what we already had.

   ROUND 2, owner: "the mockup shows good blur very well but see yours, not
   even blur ... see the message when tapped, it leaves a nav icons but see
   yours how you did it."
   Two separate faults, both measured off his latest screenshot.
   (1) The blur WAS applying -- the tint was hiding it. At .42 the wash was
       opaque enough that the blurred page underneath stopped being legible as
       content, which is what "not even blur" describes: you cannot see a blur
       you cannot see through. His backdrop keeps the list's shapes plainly
       visible behind the glass. Tint down to .26, blur up to 20px, so there is
       something recognisable behind it.
   (2) His overlay STOPS ABOVE THE BOTTOM BAR -- sampling his left gutter, the
       tint runs to y=1841 of 2085 and the nav below it is untinted and sharp.
       Ours covered the whole screen. `bottom:var(--nav-h)` is the same rule
       .sheet-bg already uses, so this is the app's own convention rather than
       a number invented here.

   ROUND 3, and (1) above had overshot: 20px is not "minimal". Owner: "see the
   blur in my mockup it is minimal such that you can even see some texts in
   background." Measured over the strip above the card in both screenshots:

                    luminance   stdev   edge p99
        his            190.9     10.9        8
        ours (20px)    216.2      1.4        3

   stdev and edge energy are what matter -- they say how much STRUCTURE
   survives, i.e. whether there is anything left to read. Ours was FLAT: the
   content was not blurred, it was erased. Luminance cannot see that, and
   chasing luminance is exactly how round 2 landed on a backdrop that hit the
   right brightness with nothing legible behind it.

   blur/tint were then swept over the REAL popup on the REAL list
   (tune-msg-blur.py, 28 combinations) and read back the same three ways.
   5px/.22 reproduces his stdev exactly (10.9). The luminance still reads
   higher than his and that is correct to ignore: his list sits on a green
   page and ours on a white sheet, so brightness here is a property of his
   CONTENT, not of his blur. */
.msg-detail-bg{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);
  background:rgba(238,112,34,.22);
  -webkit-backdrop-filter:blur(5px) saturate(1.15);backdrop-filter:blur(5px) saturate(1.15);
  display:none;align-items:flex-end;z-index:305;}
/* No backdrop-filter (older Android WebViews): a light tint alone would leave
   the page behind fully legible and the card floating on nothing, so lean on
   opacity instead. Deliberate, not accidental. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .msg-detail-bg{background:rgba(238,112,34,.62);}
}
.msg-detail-bg.show{display:flex;}
/* A FLOATING card, not a sheet welded to the screen edge -- that is what
   "poorly designed it" is pointing at. Measured off his screenshot: the card
   spans x=45..1035 of 1080, so a 4.2% side inset (16px at 390), its bottom
   edge sits 39px above the overlay's own bottom (another ~16px), and every
   corner is rounded. Its height is 898 of 2085 = 43% of the screen; the old
   58vh minimum made a short message noticeably taller than his.
   It still rises from below -- the owner asked for that in an earlier round
   and this does not undo it; it now travels to a resting place 16px up rather
   than to the screen edge. */
.msg-detail{width:calc(100% - 32px);max-width:448px;margin:0 auto 16px;background:var(--snow-surface);border-radius:26px;padding:26px 22px 30px;position:relative;box-shadow:0 18px 44px -14px rgba(20,10,5,.42);animation:sheetUp .42s cubic-bezier(.22,1,.36,1);min-height:43vh;max-height:calc(100% - 32px);overflow-y:auto;}
/* It really slides now. It was translateY(24px) over .22s -- a nudge you have
   to be looking for, which is exactly "message doesn't slide from down". From
   100% of its own height means it starts fully below the fold and travels the
   whole way up. */
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.msg-detail .xbtn{position:absolute;top:18px;right:18px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;color:var(--snow-ink);}
.msg-detail .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;padding-right:30px;}
.msg-detail .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(145deg,#eafaee 0%,#b8e6c6 100%);color:#116434;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  box-shadow:0 6px 14px -6px rgba(20,96,48,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.msg-detail h2{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.35;}
.msg-detail .date{font-size:11px;color:var(--snow-muted);font-weight:500;}
.msg-detail .ln{height:1px;background:var(--snow-border);margin-bottom:16px;}
.msg-detail .content{font-size:14px;line-height:1.75;color:var(--snow-ink);font-weight:500;white-space:pre-line;}

/* ── Change Login / Trade Password (ChangeLoginPassword.dc.html, ChangePassword.dc.html) ── */

/* ── Auth (Login / Sign Up) ──────────────────────────────────────────
   Matches the approved Main.dc.html / Register.dc.html mockups: a hero
   band (admin-uploadable background image) with the COOKIE wordmark, then a
   white card that overlaps its lower edge carrying the LOGIN / SIGN UP
   title, a small dash-dot-dash divider, and the fields. Field icons here
   are deliberately real emoji glyphs (owner: "even see those emoji or
   symbols of padlock, key... l need that same key") -- the only place in
   this app that uses emoji instead of SVG. */
.auth-hero{position:relative;overflow:hidden;height:280px;background:var(--cookie-grad);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
/* ── Admin-set backdrops for the Login / Sign Up screen ──
   Owner: "make when l can put background image on those screens of login tab
   and registration tab ... 2 different images so one image will appear on
   login and registration tabs, and 1 will appear on space where orange color
   is shared". Two slots: the orange hero band, and the white form card.

   Each is a CHILD element rather than a background-image on the section
   itself, and that is what makes the opacity control useful: the child paints
   OVER the brand gradient (or the white card), so opacity blends the photo
   towards the brand colour instead of towards nothing. A background-image
   with opacity would need the whole element faded, taking the wordmark and
   the form fields with it.

   The negative inset is not decoration. filter:blur() feathers an element's
   own edges, so a backdrop that exactly filled its box would show a soft
   transparent rim all the way round once blurred. Pulling it out by twice the
   blur radius puts that rim outside the clip, which is why both sections need
   overflow:hidden. */
.auth-bg{position:absolute;inset:calc(-2 * var(--auth-bg-blur, 0px));
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:var(--auth-bg-op, 1);filter:blur(var(--auth-bg-blur, 0px));
  pointer-events:none;z-index:0;}
#authHeroBg{--auth-bg-blur:var(--auth-hero-blur, 0px);--auth-bg-op:var(--auth-hero-op, 1);
  background-image:var(--auth-hero-img, none);}
/* ── The banner bleeds into the card instead of stopping dead ──
   Owner: "on login and register pages there should be like whites or color
   bleeding into the image of banner uploaded from admin panel, just like you
   see the first image."

   His reference is a photo whose lower half ramps smoothly into the page's
   own flat colour, so there is no banner EDGE anywhere -- measured down that
   image, the pixels stop varying entirely about 80 device px before the
   bottom and the last ~160 px are one continuous ramp. Ours ended on a hard
   horizontal cut that the card's rounded top corners left visible on both
   sides.

   A scrim to the card's colour, NOT a mask on the image: masking the image
   out would just reveal the orange gradient underneath it, which is not
   "white bleeding in". 55% of the hero, with a mid stop, so the ramp is long
   and slow at the top and solid well before the bottom rather than a short
   hard fade near the edge.

   z-index 1 puts it over the photo (z-index 0) and under the wordmark and
   the tagline (z-index 2), so the brand stays crisp on top of the fade.

   Only when a banner is actually set: with no image the hero is the plain
   brand gradient, and washing THAT out at the bottom would quietly restyle a
   screen he has already approved. .has-bg is toggled in applyAuthBackgrounds(). */
.auth-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:55%;
  pointer-events:none;z-index:1;opacity:0;transition:opacity .2s ease;
  background:linear-gradient(to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.55) 55%,
    var(--snow-surface) 88%,
    var(--snow-surface) 100%);}
.auth-hero.has-bg::after{opacity:1;}
/* Angular triangle motifs, straight off Main.dc.html -- Cookie's brand
   language is angular, NOT the soft wave this screen inherited from Snow
   (owner: "l no longer need to see this wavy curvy design"). */
.auth-tri{position:absolute;}
.auth-tri.t1{width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:150px solid rgba(0,0,0,.16);top:-60px;left:-40px;transform:rotate(18deg);}
.auth-tri.t2{width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid rgba(255,255,255,.14);bottom:-50px;right:-30px;transform:rotate(-12deg);}
.auth-wordmark{position:relative;font-size:36px;letter-spacing:.02em;transform:skewX(-7deg);color:#fff;}
.auth-wordmark b{color:#14100d;font-weight:400;}
.auth-card{background:var(--snow-surface);margin-top:-28px;border-radius:var(--r-card);position:relative;z-index:3;padding:32px 22px 30px;box-shadow:0 22px 44px -26px rgba(40,10,4,.5);overflow:hidden;}
/* Owner: "there is a white space down the login screen, why is it there?"
   The hero is a fixed 280px and the card was only as tall as its own fields,
   so on any screen taller than the two of them together the page canvas
   showed through underneath as a pale strip -- most obvious on Log In, which
   has three fewer fields than Sign Up. Making the wrap a column and letting
   the card take the slack runs it to the bottom of the screen instead.
   dvh, not vh, where it is supported: 100vh on a phone is the viewport WITH
   the address bar hidden, so on first paint (bar visible) it overshoots and
   trades the gap for a scrollbar. dvh tracks what is actually on screen. */
#authScreen > .wrap{display:flex;flex-direction:column;min-height:100vh;}
@supports (min-height:100dvh){#authScreen > .wrap{min-height:100dvh;}}
#authScreen .auth-hero{flex:0 0 auto;}
#authScreen .auth-card{flex:1 0 auto;}
/* Everything in the card sits above its backdrop.
   The second rule has to restore `position:absolute`, not just drop the
   z-index: `.auth-card > *` and `.auth-bg` have the SAME specificity, and
   this one comes later in the sheet, so it was winning and collapsing the
   backdrop to a 0x0 relatively-positioned span. It rendered as nothing at

/* ── THE LANGUAGE PICKER SHEET ──
   Owner: "language changing should stimulate google language translator, or
   else remove it" -- the curated translation table only ever covers a
   fraction of the app's text by design (see original_module.js's own long
   comment above LANG_ROWS for why -- a wrong word on a money screen is worse
   than an English one, so unreviewed strings deliberately fall back to
   English rather than guess), which read as "changing language only changes
   small things." Given the choice between a real translation API (cost +
   new dependency), Google's free but unreliable page-translate widget, or
   removing the switcher, the owner chose removal. The entry point -- the
   `.lang-btn` pill that used to sit top-right on the auth hero -- is gone
   from the markup above, and its CSS is gone with it (no element uses this
   class any more, so keeping the rule would just be dead weight, not a
   feature preserved for later). The picker SHEET below stays as dormant,
   unreachable code (openLangPicker() has no caller left) -- same "leave the
   machinery, remove the entry point" precedent as Turntable/subdomains/Trade
   Password elsewhere in this file's history, in case real translation is
   revisited later with an actual API. DEFAULT_REGION.languages is already
   ['en']-only in server.js (see the Uganda-only retirement round above),
   which is what made the button invisible everywhere paintLangButton() already
   ran -- removing the markup on top of that makes it gone unconditionally,
   not dependent on a region config staying correctly set. */
.lang-sheet-bg{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;

@media (prefers-reduced-motion:reduce){

}

/* Another real bug from the same audit: updateReferralFieldHint() ("says out

@keyframes onAutoFillStart{ from{} to{} }
