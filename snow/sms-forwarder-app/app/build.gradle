plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snowplatform.smsforwarder'
    compileSdk 34

    defaultConfig {
        applicationId "com.snowplatform.smsforwarder"
        minSdk 24
        targetSdk 34
        // Bump BOTH on every change you want phones to be offered. The build
        // publishes these as version.json next to the APK, and installed apps
        // compare versionCode against it to decide whether to prompt.
        versionCode 12
        versionName "1.11"
    }

    // AGP 8 stops generating BuildConfig unless asked. The forwarder reports
    // its own versionName to the server with every message and heartbeat, so
    // the panel can show which phones are running an old build.
    buildFeatures {
        buildConfig true
    }

    // Sign with a keystore committed alongside the app, NOT the one Gradle
    // auto-generates. A fresh CI runner has no ~/.android/debug.keystore, so
    // every build would otherwise be signed with a brand-new random key --
    // and Android refuses to install an update whose signature differs from
    // the installed app ("App not installed"). That would force a full
    // uninstall (losing each phone's configured numbers and secret) on every
    // single update. A fixed key means updates install straight over the top
    // and keep their settings.
    //
    // This is a DEBUG signing key with the standard public debug password --
    // it is not a secret and grants nothing on its own. If this app is ever
    // distributed beyond the admin phones (e.g. Play Store), replace it with
    // a real release key held in GitHub Actions secrets rather than in the repo.
    signingConfigs {
        shared {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies on purpose — keeps the build simple and robust.
dependencies {
}
