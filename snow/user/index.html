<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Snow</title>
<meta name="theme-color" content="#941827">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --snow-canvas:#FCFBF9;
  --snow-surface:#FFFFFF;
  --snow-ink:#111111;
  --snow-muted:#737373;
  --snow-wine:#941827;
  --snow-wine-deep:#71101B;
  --snow-green:#2F6B47;
  --snow-border:#E8E4E1;
  --snow-wave-on-wine:#8FE0AE;
  --snow-green-deep:#1F5136;
  --snow-wine-soft:#F8E9EC;
  --snow-green-soft:#EAF4EC;
  --snow-neutral-soft:#F1EFEC;
  --snow-radius-card:28px;
  --snow-radius-tile:20px;
  --snow-radius-control:24px;
  --snow-radius-sheet:32px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--snow-canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--snow-ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-variant-numeric:tabular-nums;}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}
a{color:inherit;}
::-webkit-scrollbar{display:none;}

.app-card{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);box-shadow:0 14px 34px -24px rgba(17,17,17,.25);}
.primary-button{background:var(--snow-wine);color:#fff;border:none;border-radius:var(--snow-radius-control);font-weight:700;}
.primary-button:disabled{opacity:.5;}
.secondary-button{background:transparent;color:var(--snow-wine);border:1.5px solid var(--snow-wine);border-radius:var(--snow-radius-control);font-weight:600;}
.status-pill{display:inline-block;border-radius:999px;font-size:10.5px;font-weight:600;padding:3px 10px;}
.status-pill.active{background:var(--snow-green-soft);color:var(--snow-green);}
.status-pill.pending{background:var(--snow-neutral-soft);color:var(--snow-muted);}

.bottom-nav{background:var(--snow-surface);border-top:1px solid var(--snow-border);display:flex;align-items:center;justify-content:space-around;height:72px;position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--snow-muted);background:none;border:none;padding:6px 10px;}
.navitem.active{color:var(--snow-wine);}
.navitem .lbl{font-size:10.5px;}
.navitem.active .lbl{font-weight:600;}

.brand-hero--full{position:relative;overflow:hidden;min-height:250px;padding-bottom:100px;background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);color:#fff;}
.brand-wave--full{position:absolute;inset:auto 0 -1px;width:100%;height:126px;display:block;}
.brand-card{background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);border-radius:var(--snow-radius-card);position:relative;overflow:hidden;color:#fff;}

.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark .wm-text{font-weight:800;letter-spacing:2px;}

.stat-label{font-size:10px;color:var(--snow-muted);text-transform:uppercase;letter-spacing:.35px;}
.stat-val{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;color:var(--snow-ink);margin-top:2px;}
.section-title{font-size:17px;font-weight:800;color:var(--snow-ink);}

.stat-tile{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-tile);padding:12px;}
.icon-tile{border-radius:13px;background:var(--snow-wine-soft);color:var(--snow-wine);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.product-card{display:flex;align-items:stretch;background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);overflow:hidden;box-shadow:0 14px 34px -24px rgba(17,17,17,.25);}
.product-card__body{flex:1;min-width:0;padding:16px;}
.product-card__stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:10px 16px;}
.product-card__cta{width:100%;min-height:44px;margin-top:16px;border-radius:var(--snow-radius-control);font-size:14px;}
.product-card__thumb{width:118px;flex-shrink:0;object-fit:cover;background:var(--snow-neutral-soft);}

.plan-card{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);padding:18px;box-shadow:0 14px 34px -24px rgba(17,17,17,.25);}

.segmented-control,.team-level-switcher{display:flex;background:var(--snow-neutral-soft);border-radius:16px;padding:4px;gap:4px;}
.segmented-control .seg,.team-level-switcher .seg{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:13px;font-weight:500;color:var(--snow-muted);background:none;border:none;}
.segmented-control .seg.active,.team-level-switcher .seg.active{background:#fff;font-weight:700;color:var(--snow-wine);box-shadow:0 4px 12px -8px rgba(17,17,17,.3);}

.settings-list{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);padding:4px 16px;}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--snow-border);}
.list-row:last-child{border-bottom:none;}

.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.account-feature-card{min-height:190px;border-radius:var(--snow-radius-card);overflow:hidden;box-shadow:0 16px 32px -22px rgba(17,17,17,.35);position:relative;color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;border:none;text-align:left;font-family:inherit;}
.account-utility-card{min-height:100px;border-radius:26px;padding:16px;box-shadow:0 14px 28px -24px rgba(17,17,17,.28);position:relative;overflow:hidden;display:flex;flex-direction:row;align-items:center;gap:14px;border:none;text-align:left;font-family:inherit;width:100%;}
.account-icon-bubble{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.utility-wine{border:1px solid rgba(148,24,39,.10);}
.utility-wine .account-icon-bubble{background:linear-gradient(145deg,#B42638,var(--snow-wine));color:#fff;box-shadow:0 10px 20px -12px rgba(113,16,27,.55);}
.utility-green{border:1px solid rgba(47,107,71,.12);}
.utility-green .account-icon-bubble{background:linear-gradient(145deg,var(--snow-green),var(--snow-green-deep));color:#fff;box-shadow:0 10px 20px -12px rgba(31,81,54,.5);}

.team-referral-card{position:relative;overflow:hidden;min-height:210px;padding:22px;border-radius:var(--snow-radius-card);color:#fff;background:linear-gradient(145deg,var(--snow-wine),var(--snow-wine-deep));box-shadow:0 16px 32px -22px rgba(17,17,17,.35);}
.team-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.team-deposits-card{grid-column:1 / -1;position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(145deg,var(--snow-green),var(--snow-green-deep));box-shadow:0 14px 28px -22px rgba(17,17,17,.3);}

/* ── App chrome not in the mockups: auth, sheets, forms, toast, loading ── */
.wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;background:var(--snow-canvas);padding-bottom:88px;}
#loadingScreen{position:fixed;inset:0;background:var(--snow-canvas);display:flex;align-items:center;justify-content:center;z-index:500;}
#loadingScreen .spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--snow-wine-soft);border-top-color:var(--snow-wine);animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.auth-hero{position:relative;overflow:hidden;padding:26px 20px 0;background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);color:#fff;min-height:230px;}
.auth-wave{position:absolute;inset:auto 0 -1px;width:100%;height:70px;display:block;}
.form-field{margin:0 0 14px;}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--snow-ink);margin-bottom:8px;}
.form-field .input-wrap{position:relative;}
.form-field input{width:100%;padding:15px 44px 15px 16px;border:1px solid var(--snow-border);border-radius:26px;font-size:15px;background:var(--snow-surface);color:var(--snow-ink);}
.form-field input:focus{outline:none;border-color:var(--snow-wine);}
.form-field .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--snow-muted);background:none;border:none;padding:4px;}
.form-hint{font-size:11.5px;color:var(--snow-muted);margin-top:6px;}
.auth-error{background:var(--snow-wine-soft);color:var(--snow-wine-deep);border-radius:14px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}

.sheet-bg{position:fixed;inset:0;background:var(--snow-canvas);z-index:200;display:none;overflow-y:auto;}
.sheet-bg.show{display:block;}
.sheet-head{display:flex;align-items:center;gap:12px;padding:18px 20px;position:sticky;top:0;background:var(--snow-canvas);z-index:1;}
.sheet-head .back{background:var(--snow-surface);border:1px solid var(--snow-border);width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.sheet-head h2{margin:0;font-size:16px;font-weight:800;}
.sheet-body{padding:4px 20px 40px;max-width:480px;margin:0 auto;}

#toastHost{position:fixed;left:0;right:0;bottom:96px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:600;pointer-events:none;}
.toast{background:var(--snow-ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;max-width:86%;text-align:center;box-shadow:0 12px 28px -14px rgba(0,0,0,.4);}
.toast.err{background:var(--snow-wine-deep);}

.confirm-bg{position:fixed;inset:0;background:rgba(17,17,17,.5);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.confirm-bg.show{display:flex;}
.confirm-sheet{background:var(--snow-surface);width:100%;max-width:480px;border-radius:32px 32px 0 0;padding:24px 22px 30px;}
.confirm-sheet h3{margin:0 0 6px;font-size:18px;font-weight:800;}
.confirm-row{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--snow-border);}
.confirm-row:last-of-type{border-bottom:none;}

.list-empty{padding:30px 4px;text-align:center;color:var(--snow-muted);font-size:13px;}

.sk{background:linear-gradient(90deg,var(--snow-neutral-soft) 25%,#fff 50%,var(--snow-neutral-soft) 75%);background-size:400% 100%;animation:skshimmer 1.4s ease infinite;border-radius:8px;}
@keyframes skshimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.sk-row{display:flex;align-items:center;gap:12px;padding:14px 4px;}
.sk-line{height:13px;}
.sk-card{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);padding:18px;}
</style>
</head>
<body>

<div id="loadingScreen"><div class="spin"></div></div>

<!-- ═══════════ AUTH ═══════════ -->
<div id="authScreen" style="display:none;">
  <div class="wrap" style="padding-bottom:0;">
    <div class="auth-hero" id="authHero">
      <div class="wordmark" style="justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--snow-green)" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M4.2 6.5l15.6 11M4.2 17.5l15.6-11"/><path d="M12 2l-2 2.3M12 2l2 2.3M12 22l-2-2.3M12 22l2-2.3M4.2 6.5l3 .3M4.2 6.5l1-2.8M19.8 6.5l-3 .3M19.8 6.5l-1-2.8M4.2 17.5l3-.3M4.2 17.5l1 2.8M19.8 17.5l-3-.3M19.8 17.5l-1 2.8"/></svg>
        <div class="wm-text" style="font-size:24px;">SNOW</div>
      </div>
      <svg class="auth-wave" viewBox="0 0 390 70" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 48 C58 22 104 18 154 34 C205 50 251 44 296 22 C332 6 362 0 390 4 L390 70 L0 70 Z" fill="var(--snow-canvas)"></path>
      </svg>
    </div>
    <div style="padding:0 20px;">
      <div id="loginPane">
        <h1 style="font-size:28px;font-weight:800;margin:20px 0 4px;">Welcome back</h1>
        <p style="color:var(--snow-muted);margin:0 0 20px;">Sign in to your Snow account</p>
        <div id="loginError"></div>
        <div class="form-field">
          <label>Mobile number</label>
          <input id="loginPhone" type="tel" inputmode="tel" placeholder="+256 7XX XXX XXX" autocomplete="tel">
        </div>
        <div class="form-field">
          <label>Password</label>
          <div class="input-wrap">
            <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
            <button class="eye" onclick="togglePw('loginPassword')">👁</button>
          </div>
        </div>
        <button class="primary-button" id="loginBtn" style="width:100%;padding:15px 0;font-size:15px;margin-top:6px;" onclick="doLogin()">Login</button>
        <p style="text-align:center;margin:18px 0;font-size:13.5px;">New to Snow? <a href="#" style="color:var(--snow-green);font-weight:700;text-decoration:none;" onclick="showAuthTab('register');return false;">Create account</a></p>
      </div>
      <div id="registerPane" style="display:none;">
        <h1 style="font-size:26px;font-weight:800;margin:20px 0 4px;">Create account</h1>
        <p style="color:var(--snow-muted);margin:0 0 20px;">Start your Snow journey</p>
        <div id="regError"></div>
        <div class="form-field">
          <label>Mobile number</label>
          <input id="regPhone" type="tel" inputmode="tel" placeholder="+256 7XX XXX XXX" autocomplete="tel">
        </div>
        <div class="form-field">
          <label>Password</label>
          <div class="input-wrap">
            <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password">
            <button class="eye" onclick="togglePw('regPassword')">👁</button>
          </div>
        </div>
        <div class="form-field">
          <label>Transaction PIN</label>
          <input id="regPin" type="text" inputmode="numeric" maxlength="5" placeholder="5 digits" autocomplete="one-time-code">
          <div class="form-hint">This PIN also authorizes every withdrawal.</div>
        </div>
        <button class="primary-button" id="regBtn" style="width:100%;padding:15px 0;font-size:15px;margin-top:6px;" onclick="doRegister()">Register</button>
        <p style="text-align:center;margin:18px 0;font-size:13.5px;">Already have an account? <a href="#" style="color:var(--snow-green);font-weight:700;text-decoration:none;" onclick="showAuthTab('login');return false;">Login</a></p>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app" style="display:none;">
  <div class="wrap" id="pageHost"></div>
  <div class="bottom-nav">
    <button class="navitem" data-nav="home" onclick="showPage('home')"><span class="nav-ic"></span><div class="lbl">Home</div></button>
    <button class="navitem" data-nav="products" onclick="showPage('products')"><span class="nav-ic"></span><div class="lbl">My Products</div></button>
    <button class="navitem" data-nav="team" onclick="showPage('team')"><span class="nav-ic"></span><div class="lbl">Team</div></button>
    <button class="navitem" data-nav="account" onclick="showPage('account')"><span class="nav-ic"></span><div class="lbl">Account</div></button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet-head">
    <button class="back" onclick="closeSheet()">←</button>
    <h2 id="sheetTitle"></h2>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="confirm-bg" id="confirmBg" onclick="if(event.target===this)closeConfirm()">
  <div class="confirm-sheet" id="confirmSheet"></div>
</div>

<div id="toastHost"></div>

    messagingSenderId: "171510439127",

  window.fbCreateUser = (email, pass) => createUserWithEmailAndPassword(auth, email, pass);

// Endpoints that actually move money -- a background service-worker reload
// (see the registration script near the bottom of this file) waits for this
// count to hit 0 before ever yanking the page out from under one of these.
const MONEY_ENDPOINTS = new Set(['/deposit/marzpay', '/withdraw/request', '/invest/create', '/bank/save', '/bank/delete']);
window._moneyCallsInFlight = 0;
async function api(path, opts){
  opts = opts || {};
  const isMoneyCall = MONEY_ENDPOINTS.has(path);
  if (isMoneyCall) window._moneyCallsInFlight++;
  try {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (window.fbAuth && window.fbAuth.currentUser) {
      try { headers['Authorization'] = 'Bearer ' + (await window.fbAuth.currentUser.getIdToken()); } catch (_) {}
    }
    let resp;
    try {
      resp = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
    } catch (e) {
      return { status: 'error', message: 'Network error. Check your connection.' };
    }
    let data;
    try { data = await resp.json(); } catch (_) { data = { status: 'error', message: 'Unexpected response from server' }; }
    return data;
  } finally {
    if (isMoneyCall) window._moneyCallsInFlight--;
  }
}
function post(path, body){ return api(path, { method: 'POST', body: JSON.stringify(body || {}) }); }

function phoneToEmail(phone){ return String(phone).replace(/\D/g,'').replace(/^0+/, '') + '@snow-platform.com'; }
function cleanPhone(raw){
  const s = String(raw||'').replace(/\D/g,'');
  let local9 = null;
  if (s.startsWith('256') && s.length === 12) local9 = s.slice(3);
  else if (s.startsWith('0') && s.length === 10) local9 = s.slice(1);
  else if (s.length === 9) local9 = s;
  if (!local9 || !/^7\d{8}$/.test(local9)) return null;
  return '+256' + local9;
}
function showAuthTab(tab){
  $('loginPane').style.display = tab === 'login' ? '' : 'none';
  $('registerPane').style.display = tab === 'register' ? '' : 'none';
  $('loginError').innerHTML = ''; $('regError').innerHTML = '';
}
function setBtnLoading(id, loading, label){
  const btn = $(id);
  btn.disabled = loading;
  btn.textContent = loading ? 'Please wait…' : label;
}
function fbErrMsg(e){
  const code = e && e.code || '';
  if (code === 'auth/invalid-credential' || code === 'auth/wrong-password') return 'Incorrect phone number or password.';
  if (code === 'auth/user-not-found') return 'No account found for that number.';
  if (code === 'auth/email-already-in-use') return 'An account with that number already exists.';
  if (code === 'auth/weak-password') return 'Password must be at least 6 characters.';
  if (code === 'auth/too-many-requests') return 'Too many attempts. Try again shortly.';
  return e && e.message ? e.message : 'Something went wrong. Try again.';
}
window.doLogin = async function(){
  const phone = cleanPhone($('loginPhone').value);
  const pass = $('loginPassword').value;
  if (!phone) return $('loginError').innerHTML = '<div class="auth-error">Enter a valid Uganda mobile number.</div>';
  if (!pass) return $('loginError').innerHTML = '<div class="auth-error">Enter your password.</div>';
  $('loginError').innerHTML = '';
  setBtnLoading('loginBtn', true);
  try { await window.fbSignIn(phoneToEmail(phone), pass); }
  catch (e) { $('loginError').innerHTML = `<div class="auth-error">${esc(fbErrMsg(e))}</div>`; setBtnLoading('loginBtn', false, 'Login'); }
};
window.doRegister = async function(){
  const phone = cleanPhone($('regPhone').value);
  const pass = $('regPassword').value;
  const pin = $('regPin').value.trim();
  if (!phone) return $('regError').innerHTML = '<div class="auth-error">Enter a valid Uganda mobile number.</div>';
  if (!pass || pass.length < 6) return $('regError').innerHTML = '<div class="auth-error">Password must be at least 6 characters.</div>';
  if (!/^\d{5}$/.test(pin)) return $('regError').innerHTML = '<div class="auth-error">Transaction PIN must be exactly 5 digits.</div>';
  $('regError').innerHTML = '';
  setBtnLoading('regBtn', true);
  window._pendingRegPin = pin;
  window._pendingRegPhone = phone;
  try { await window.fbCreateUser(phoneToEmail(phone), pass); }
  catch (e) { $('regError').innerHTML = `<div class="auth-error">${esc(fbErrMsg(e))}</div>`; setBtnLoading('regBtn', false, 'Register'); }
};

  Object.assign(STATE, { account: null, investments: null, teamStats: null, teamMembers: {1:null,2:null,3:null}, bankAccounts: null });
  await window.fbSignOut();
};

window.addEventListener('snow-auth', async (ev) => {
  const user = ev.detail;
  STATE.user = user;
  if (!user) {
    $('loadingScreen').style.display = 'none';
    $('app').style.display = 'none';
    $('authScreen').style.display = '';
    setBtnLoading('loginBtn', false, 'Login');
    setBtnLoading('regBtn', false, 'Register');
    return;
  }
  $('authScreen').style.display = 'none';
  $('loadingScreen').style.display = 'flex';
  await enterApp();
});
async function enterApp(){
  let r = await api('/account');
  if (r.status === 'error' && (r.code === 'NOT_FOUND' || r.message === 'User not found')) {
    // Ghost account (Firebase user exists, our profile never finished) or a
    // fresh registration still finishing -- retry /register, which
    // self-heals a missing profile doc and is a safe no-op if already done.
    const reg = await post('/register', {
      referralCode: STATE.refCode || '',
      pin: window._pendingRegPin || '',
      phone: window._pendingRegPhone || '',
    });
    if (reg.status !== 'success' && reg.status !== 'already_done') {
      $('loadingScreen').style.display = 'none';
      toast(reg.message || 'Could not complete registration', true);
      await window.fbSignOut();
      return;
    }
    r = await api('/account');
  }
  if (r.status === 'error') {
    $('loadingScreen').style.display = 'none';
    if (r.code === 'BANNED') { toast(r.message, true); await window.fbSignOut(); return; }
    toast(r.message || 'Could not load your account', true);
    await window.fbSignOut();
    return;
  }
  STATE.account = r.account;
  $('loadingScreen').style.display = 'none';
  $('app').style.display = '';
  showPage(STATE.page || 'home');
}

// Live-ticking "Next cashback in HH:MM:SS" on each active plan card. Cleared
// whenever the page changes away from My Products so it never keeps ticking
// (and leaking a timer) in the background.
let _countdownTimer = null;
function startPlanCountdowns(){
  if (_countdownTimer) clearInterval(_countdownTimer);
  const tick = () => {
    const nodes = document.querySelectorAll('[data-countdown]');
    if (!nodes.length) { clearInterval(_countdownTimer); _countdownTimer = null; return; }
    nodes.forEach(el => {
      const created = Number(el.dataset.created);
      const made = Number(el.dataset.payoutsMade);
      const nextBoundary = created + (made + 1) * 86400000;
      const remaining = Math.max(0, nextBoundary - Date.now());
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      const pad = n => String(n).padStart(2, '0');
      el.querySelector('.countdown-val').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    });
  };
  tick();
  _countdownTimer = setInterval(tick, 1000);
}

function maskPhone(phone){
  const s = String(phone||'').replace(/\D/g,'');
  if (s.length < 6) return phone || '';
  return '+' + s.slice(0,6) + ' *** ' + s.slice(-3);
}
function timeAgo(ts){
  if (!ts) return '';
  const ms = typeof ts === 'object' && ts.seconds ? ts.seconds*1000 : new Date(ts).getTime();
  if (!ms) return '';
  const days = Math.floor((Date.now()-ms)/86400000);
  if (days <= 0) return 'Joined today';
  if (days === 1) return 'Joined 1 day ago';
  if (days < 14) return `Joined ${days} days ago`;
  const weeks = Math.floor(days/7);
  return `Joined ${weeks} week${weeks===1?'':'s'} ago`;
}

  $('witSubmitBtn').disabled = true; $('witSubmitBtn').textContent = 'Please wait…';
  const r = await post('/withdraw/request', { amount, network: acct.network, phone: acct.phone, pin });
  $('witSubmitBtn').disabled = false; $('witSubmitBtn').textContent = 'Request Withdrawal';
  if (r.status !== 'success') return toast(r.message || 'Could not request withdrawal', true);
  toast(r.message || 'Cash-out requested');
  closeSheet();
  if (STATE.page==='home') renderHome();
};

window.openWithdrawalAccountsSheet = async function(){
  openSheet('Withdrawal Accounts', skRows(2));
  const r = await api('/bank/list');
  STATE.bankAccounts = r.status === 'success' ? r.accounts : [];
  renderWithdrawalAccountsSheet();
};
function renderWithdrawalAccountsSheet(){
  const list = STATE.bankAccounts || [];
  let html = '<div class="settings-list" style="margin-bottom:18px;">';
  html += list.length ? list.map(a => `
    <div class="list-row">
      <div style="flex:1;min-width:0;">
        <div style="font-size:13.5px;font-weight:600;">${esc(a.holder)}</div>
        <div style="font-size:11.5px;color:var(--snow-muted);margin-top:1px;">${esc(a.network)} &middot; ${esc(a.phone)}</div>
      </div>
      <button style="border:none;background:none;color:var(--snow-wine);padding:6px;" onclick="deleteWithdrawalAccount('${a.id}')">${ICONS.trash}</button>
    </div>`).join('') : '<div class="list-empty">No withdrawal accounts saved.</div>';
  html += '</div>';
  html += `
    <div class="section-title" style="margin-bottom:14px;">Add withdrawal account</div>
    <div class="form-field"><label>Account holder name</label><input id="bankHolder" type="text" placeholder="Full name"></div>
    <div class="form-field"><label>Network</label>
      <select id="bankNetwork" style="width:100%;padding:15px 16px;border:1px solid var(--snow-border);border-radius:26px;font-size:15px;background:var(--snow-surface);">
        <option value="" disabled selected>Select network</option>
        <option value="MTN Mobile Money">MTN Mobile Money</option>
        <option value="Airtel Money">Airtel Money</option>
      </select>
    </div>
    <div class="form-field"><label>Phone number</label><input id="bankPhone" type="tel" inputmode="tel" placeholder="+256 7XX XXX XXX"></div>
    <div class="form-field"><label>Transaction PIN</label><input id="bankPin" type="text" inputmode="numeric" maxlength="5" placeholder="5 digits" autocomplete="one-time-code"></div>
    <button class="primary-button" id="bankSaveBtn" style="width:100%;padding:15px 0;font-size:15px;" onclick="saveWithdrawalAccount()">Save account</button>`;
  $('sheetBody').innerHTML = html;
}
window.saveWithdrawalAccount = async function(){
  const holder = $('bankHolder').value.trim();
  const network = $('bankNetwork').value;
  const phone = $('bankPhone').value;
  const pin = $('bankPin').value.trim();
  if (!holder) return toast('Enter the account holder name', true);
  if (!network) return toast('Select a network', true);
  if (!/^\d{5}$/.test(pin)) return toast('Enter your 5-digit Transaction PIN', true);
  $('bankSaveBtn').disabled = true; $('bankSaveBtn').textContent = 'Please wait…';
  const r = await post('/bank/save', { holder, network, phone, pin });
  $('bankSaveBtn').disabled = false; $('bankSaveBtn').textContent = 'Save account';
  if (r.status !== 'success') return toast(r.message || 'Could not save account', true);
  toast('Withdrawal account saved');
  const list = await api('/bank/list');
  STATE.bankAccounts = list.status === 'success' ? list.accounts : [];
  renderWithdrawalAccountsSheet();
};
window.deleteWithdrawalAccount = function(id){
  openConfirm('Remove withdrawal account?', 'Enter your Transaction PIN to confirm.', async (pinValue) => {
    const r = await post('/bank/delete', { id, pin: pinValue });
    if (r.status !== 'success') { toast(r.message || 'Could not remove account', true); return false; }
    toast('Account removed');
    const list = await api('/bank/list');
    STATE.bankAccounts = list.status === 'success' ? list.accounts : [];
    renderWithdrawalAccountsSheet();
    return true;
  });
};

window.openInvestConfirm = function(tierKey){
  const p = (STATE.products||[]).find(x => x.key === tierKey);
  if (!p) return;
  const dailyPayout = Math.round((p.expectedReturn||p.price*30)/(p.cycle||150));
  $('confirmSheet').innerHTML = `
    <h3>Confirm purchase</h3>
    <p style="color:var(--snow-muted);font-size:13px;margin:0 0 12px;">${esc(p.name)}</p>
    <div class="confirm-row"><span>Investment</span><span class="mono">${fmtUGX(p.price)}</span></div>
    <div class="confirm-row"><span>Daily cashback</span><span class="mono">${fmtUGX(dailyPayout)}</span></div>
    <div class="confirm-row"><span>Duration</span><span class="mono">${p.cycle||150} days</span></div>
    <div class="confirm-row"><span>Total return</span><span class="mono">${fmtUGX(p.expectedReturn||p.price*30)}</span></div>
    <button class="primary-button" id="investConfirmBtn" style="width:100%;padding:15px 0;font-size:15px;margin-top:16px;" onclick="confirmInvest('${esc(tierKey)}')">Confirm & Invest</button>
    <button class="secondary-button" style="width:100%;padding:13px 0;font-size:14px;margin-top:10px;border:none;color:var(--snow-muted);" onclick="closeConfirm()">Cancel</button>`;
  $('confirmBg').classList.add('show');
};
window.closeConfirm = function(){ $('confirmBg').classList.remove('show'); };
window.confirmInvest = async function(tierKey){
  const btn = $('investConfirmBtn');
  btn.disabled = true; btn.textContent = 'Please wait…';
  const r = await post('/invest/create', { tierKey });
  closeConfirm();
  if (r.status !== 'success') return toast(r.message || 'Could not complete purchase', true);
  toast(r.message || 'Purchase successful');
  if (STATE.page === 'home') renderHome();
};
function openConfirm(title, body, onConfirm){
  $('confirmSheet').innerHTML = `
    <h3>${esc(title)}</h3>
    <p style="color:var(--snow-muted);font-size:13px;margin:0 0 14px;">${esc(body)}</p>
    <input id="confirmPin" type="text" inputmode="numeric" maxlength="5" placeholder="5-digit PIN" style="width:100%;padding:15px 16px;border:1px solid var(--snow-border);border-radius:26px;font-size:15px;margin-bottom:14px;">
    <button class="primary-button" id="confirmActionBtn" style="width:100%;padding:15px 0;font-size:15px;">Confirm</button>
    <button class="secondary-button" style="width:100%;padding:13px 0;font-size:14px;margin-top:10px;border:none;color:var(--snow-muted);" onclick="closeConfirm()">Cancel</button>`;
  $('confirmActionBtn').onclick = async () => {
    const pinValue = $('confirmPin').value.trim();
    if (!/^\d{5}$/.test(pinValue)) return toast('Enter your 5-digit Transaction PIN', true);
    $('confirmActionBtn').disabled = true; $('confirmActionBtn').textContent = 'Please wait…';
    const ok = await onConfirm(pinValue);
    $('confirmActionBtn').disabled = false; $('confirmActionBtn').textContent = 'Confirm';
    if (ok) closeConfirm();
  };
  $('confirmBg').classList.add('show');
}

// ── PWA: install prompt + service worker auto-update ──
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  window._installPrompt = e;
});
window.addEventListener('appinstalled', () => { window._installPrompt = null; });
window.promptInstallApp = async function(){
  if (!window._installPrompt) { toast('Already installed, or your browser doesn\'t support installing Snow.'); return; }
  window._installPrompt.prompt();
  await window._installPrompt.userChoice.catch(() => {});
  window._installPrompt = null;
};
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      const checkForUpdate = () => reg.update().catch(() => {});
      setInterval(checkForUpdate, 60 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
      window.addEventListener('focus', checkForUpdate);
    }).catch(() => {});
  });
  // Only reload when there was ALREADY a controller at page-load time --
  // controllerchange also fires on the very first clients.claim() after a
  // fresh install/cleared cache, which is not a real update and would
  // otherwise bounce the app back to the loading screen for no reason.
  let _swReloading = false;
  let _hadControllerAtLoad = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_swReloading) return;
    if (!_hadControllerAtLoad) { _hadControllerAtLoad = true; return; }
    (function tryReload(){
      if ((window._moneyCallsInFlight || 0) > 0) { setTimeout(tryReload, 500); return; }
      _swReloading = true;
      location.reload();
    })();
  });
}

// ── START ──
captureReferralFromUrl();
boot();
