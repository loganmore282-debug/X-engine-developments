<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snow</title>
<meta name="theme-color" content="#941827">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --snow-canvas:#FCFBF9;
  --snow-surface:#FFFFFF;
  --snow-ink:#111111;
  --snow-muted:#737373;
  --snow-wine:#941827;
  --snow-wine-deep:#71101B;
  --snow-green:#2F6B47;
  --snow-border:#E8E4E1;
  --snow-wave-on-wine:#8FE0AE;
  --snow-green-deep:#1F5136;
  --snow-wine-soft:#F8E9EC;
  --snow-green-soft:#EAF4EC;
  --snow-neutral-soft:#F1EFEC;
  --snow-radius-card:28px;
  --snow-radius-tile:20px;
  --snow-radius-control:24px;
  --snow-radius-sheet:32px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
body{background:var(--snow-canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--snow-ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-variant-numeric:lining-nums tabular-nums;font-family:'Bodoni Moda',Didot,'Playfair Display',Georgia,serif;}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}
a{color:inherit;}
::-webkit-scrollbar{display:none;}

.app-card{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);box-shadow:0 14px 34px -24px rgba(17,17,17,.25);}
.primary-button{background:var(--snow-wine);color:#fff;border:none;border-radius:var(--snow-radius-control);font-weight:700;}
.primary-button:disabled{opacity:.5;}
.secondary-button{background:transparent;color:var(--snow-wine);border:1.5px solid var(--snow-wine);border-radius:var(--snow-radius-control);font-weight:600;}
.status-pill{display:inline-block;border-radius:999px;font-size:10.5px;font-weight:600;padding:3px 10px;}
.status-pill.active{background:var(--snow-green-soft);color:var(--snow-green);}
.status-pill.pending{background:var(--snow-neutral-soft);color:var(--snow-muted);}

.bottom-nav{background:var(--snow-surface);border-top:1px solid var(--snow-border);display:flex;align-items:center;justify-content:space-around;height:72px;position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--snow-muted);background:none;border:none;padding:6px 10px;}
.navitem.active{color:var(--snow-wine);}
.navitem .lbl{font-size:10.5px;}
.navitem.active .lbl{font-weight:600;}

.brand-hero--full{position:relative;overflow:hidden;min-height:250px;padding-bottom:100px;background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);color:#fff;}
.brand-wave--full{position:absolute;inset:auto 0 -1px;width:100%;height:126px;display:block;}
.brand-card{background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);border-radius:var(--snow-radius-card);position:relative;overflow:hidden;color:#fff;}
/* Account page's profile header -- same full-bleed "fills the upper part"
   shape as Home's hero, but its own scalloped triple-bump wave (accountWaveFull())
   instead of Home's single S-curve (brandWaveFull()), so the two read as
   distinct, not copy-pasted (owner: "wavy design but different from that
   of home"). */
.account-hero--full{position:relative;overflow:hidden;min-height:230px;padding-bottom:58px;background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);color:#fff;}
.account-wave--full{position:absolute;inset:auto 0 -1px;width:100%;height:86px;display:block;}

.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark .wm-text{font-weight:800;letter-spacing:2px;}

.stat-label{font-size:10px;color:var(--snow-muted);text-transform:uppercase;letter-spacing:.35px;}
.stat-val{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;color:var(--snow-ink);margin-top:2px;}
.section-title{font-size:17px;font-weight:800;color:var(--snow-ink);}

.stat-tile{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-tile);padding:12px;}
.icon-tile{border-radius:13px;background:var(--snow-wine-soft);color:var(--snow-wine);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.product-card{display:flex;align-items:stretch;background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);overflow:hidden;box-shadow:0 14px 34px -24px rgba(17,17,17,.25);}
.product-card__body{flex:1;min-width:0;padding:16px;}
.product-card__stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:10px 16px;}
.product-card__cta{width:100%;min-height:44px;margin-top:16px;border-radius:var(--snow-radius-control);font-size:14px;}
.product-card__thumb{width:118px;flex-shrink:0;object-fit:cover;background:var(--snow-neutral-soft);}

.plan-card{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);padding:18px;box-shadow:0 14px 34px -24px rgba(17,17,17,.25);}

.segmented-control,.team-level-switcher{display:flex;background:var(--snow-neutral-soft);border-radius:16px;padding:4px;gap:4px;}
.segmented-control .seg,.team-level-switcher .seg{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:13px;font-weight:500;color:var(--snow-muted);background:none;border:none;}
.segmented-control .seg.active,.team-level-switcher .seg.active{background:#fff;font-weight:700;color:var(--snow-wine);box-shadow:0 4px 12px -8px rgba(17,17,17,.3);}

.settings-list{background:var(--snow-surface);border:1px solid var(--snow-border);border-radius:var(--snow-radius-card);padding:4px 16px;}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--snow-border);}
.list-row:last-child{border-bottom:none;}

/* Withdrawal accounts, shown as a bank-card style tile -- owner: "I want a
   saved account to appear like a bank card... before saving [it shows
   masked placeholders], and after saving it shows holder name and number." */
.bank-card{position:relative;overflow:hidden;min-height:130px;border-radius:20px;padding:20px;margin-bottom:14px;color:#fff;background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);box-shadow:0 16px 30px -20px rgba(17,17,17,.45);display:flex;flex-direction:column;justify-content:space-between;}
.bank-card.bank-card-empty{opacity:.6;}
.bank-card-top{position:relative;display:flex;align-items:center;justify-content:space-between;}
.bank-card-network{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.9;}
.bank-card-number{position:relative;font-size:19px;font-weight:700;letter-spacing:2.5px;margin-top:18px;}
.bank-card-bottom{position:relative;display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;gap:10px;}
.bank-card-holder{font-size:12.5px;font-weight:700;letter-spacing:.4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bank-card-delete{position:relative;flex-shrink:0;border:none;background:rgba(255,255,255,.16);color:#fff;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.account-feature-card{min-height:190px;border-radius:var(--snow-radius-card);overflow:hidden;box-shadow:0 16px 32px -22px rgba(17,17,17,.35);position:relative;color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;border:none;text-align:left;font-family:inherit;}
.account-utility-card{min-height:100px;border-radius:26px;padding:16px;box-shadow:0 14px 28px -24px rgba(17,17,17,.28);position:relative;overflow:hidden;display:flex;flex-direction:row;align-items:center;gap:14px;border:none;text-align:left;font-family:inherit;width:100%;}
.account-icon-bubble{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.utility-wine{border:1px solid rgba(148,24,39,.10);}
.utility-wine .account-icon-bubble{background:linear-gradient(145deg,#B42638,var(--snow-wine));color:#fff;box-shadow:0 10px 20px -12px rgba(113,16,27,.55);}
.utility-green{border:1px solid rgba(47,107,71,.12);}
.utility-green .account-icon-bubble{background:linear-gradient(145deg,var(--snow-green),var(--snow-green-deep));color:#fff;box-shadow:0 10px 20px -12px rgba(31,81,54,.5);}

.team-referral-card{position:relative;overflow:hidden;min-height:210px;padding:22px;border-radius:var(--snow-radius-card);color:#fff;background:linear-gradient(145deg,var(--snow-wine),var(--snow-wine-deep));box-shadow:0 16px 32px -22px rgba(17,17,17,.35);}
.team-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.team-deposits-card{grid-column:1 / -1;position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(145deg,var(--snow-green),var(--snow-green-deep));box-shadow:0 14px 28px -22px rgba(17,17,17,.3);}

/* ── App chrome not in the mockups: auth, sheets, forms, toast, loading ── */
.wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;background:var(--snow-canvas);padding-bottom:88px;}
#loadingScreen{position:fixed;inset:0;background:var(--snow-canvas);display:flex;align-items:center;justify-content:center;z-index:500;}
#loadingScreen .spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--snow-wine-soft);border-top-color:var(--snow-wine);animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
@keyframes tickerFlow{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes chestSwing{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.chest-hang{animation:chestSwing 2.6s ease-in-out infinite;transform-origin:50% -6px;}

.auth-hero{position:relative;overflow:hidden;padding:26px 20px 0;background:linear-gradient(145deg,var(--snow-wine) 0%,var(--snow-wine-deep) 100%);color:#fff;min-height:230px;}
.auth-wave{position:absolute;inset:auto 0 -1px;width:100%;height:70px;display:block;}
.form-field{margin:0 0 14px;}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--snow-ink);margin-bottom:8px;}
.form-field .input-wrap{position:relative;}
.form-field input{width:100%;padding:15px 44px 15px 16px;border:1px solid var(--snow-border);border-radius:26px;font-size:15px;background:var(--snow-surface);color:var(--snow-ink);}
.form-field input:focus{outline:none;border-color:var(--snow-wine);}
.form-field .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--snow-muted);background:none;border:none;padding:4px;display:flex;align-items:center;justify-content:center;}
/* Owner: "make (+256) static, so one can type 07xxxxxxxx or 7xxxxxxxx... just
   the system understand it" -- every phone field is now a static, fixed
   "+256" chip next to a local-number-only input, instead of one free-text
   field where the country code had to be typed (and could be typed several
   different ways). See sanitizePhoneInput()'s own comment for why this is
   safe for already-registered accounts. */
.phone-field{display:flex;gap:8px;}
.phone-prefix{flex-shrink:0;padding:15px 12px;border:1px solid var(--snow-border);border-radius:26px;background:var(--snow-neutral-soft);color:var(--snow-ink);font-size:15px;font-weight:700;display:flex;align-items:center;}
.phone-field input{flex:1;min-width:0;width:auto;padding:15px 16px;}
/* Chrome's own "Use saved password?" picker fills #loginPhone/#loginPassword
   with zero JS-visible events -- there's no input/change to listen for. The
   browser DOES tag autofilled fields with the :-webkit-autofill pseudo-class
   though, and toggling a no-op animation on that class is the one reliable,
   long-standing trick to get a real DOM event (animationstart) out of it. See
   autoSubmitOnAutofill() in original_module.js. */
@keyframes onAutoFillStart{ from{} to{} }
@keyframes onAutoFillCancel{ from{} to{} }
#loginPhone:-webkit-autofill{ animation-name:onAutoFillStart; animation-duration:.01s; }
#loginPhone:not(:-webkit-autofill){ animation-name:onAutoFillCancel; animation-duration:.01s; }
#loginPassword:-webkit-autofill{ animation-name:onAutoFillStart; animation-duration:.01s; }
#loginPassword:not(:-webkit-autofill){ animation-name:onAutoFillCancel; animation-duration:.01s; }
.form-hint{font-size:11.5px;color:var(--snow-muted);margin-top:6px;}
.quick-amts{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 14px;}
.quick-amt{padding:8px 14px;border-radius:20px;border:1px solid var(--snow-border);background:var(--snow-surface);color:var(--snow-ink);font-size:12.5px;font-weight:600;cursor:pointer;}
.quick-amt.active{background:var(--snow-wine-soft);border-color:var(--snow-wine);color:var(--snow-wine);}
.auth-error{background:var(--snow-wine-soft);color:var(--snow-wine-deep);border-radius:14px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}

.sheet-bg{position:fixed;inset:0;background:var(--snow-canvas);z-index:200;display:none;overflow-y:auto;}
.sheet-bg.show{display:block;}
.sheet-head{display:flex;align-items:center;gap:12px;padding:18px 20px;position:sticky;top:0;background:var(--snow-canvas);z-index:1;}
.sheet-head .back{background:var(--snow-surface);border:1px solid var(--snow-border);width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.sheet-head h2{margin:0;font-size:16px;font-weight:800;}
.sheet-body{padding:4px 20px 40px;max-width:480px;margin:0 auto;}

#toastHost{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:600;pointer-events:none;padding:20px;}
.toast{background:rgba(17,17,17,.82);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;max-width:86%;text-align:center;box-shadow:0 12px 28px -14px rgba(0,0,0,.4);}

/* All pop-up dialogs (as opposed to full-page sheets) open centered, share
   the activity ticker's own dark pill color, and use a modest radius --
   not the tall rounded bottom-sheet look. */
.confirm-bg{position:fixed;inset:0;background:rgba(17,17,17,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.confirm-bg.show{display:flex;}
.confirm-sheet{background:rgba(17,17,17,.82);color:#fff;width:100%;max-width:340px;border-radius:16px;padding:22px 20px 24px;transform:scale(.92);opacity:0;transition:transform .18s ease,opacity .18s ease;}
.confirm-bg.show .confirm-sheet{transform:scale(1);opacity:1;}
.confirm-sheet h3{margin:0 0 6px;font-size:18px;font-weight:800;}
.confirm-row{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);}
.confirm-row:last-of-type{border-bottom:none;}

/* Centered popup (opens from the middle, not a bottom sheet) -- the
   treasure-chest gift-code entry on Home. */
.chest-modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:310;display:none;align-items:center;justify-content:center;padding:20px;}
.chest-modal-bg.show{display:flex;}
.chest-modal{background:rgba(17,17,17,.82);color:#fff;width:100%;max-width:340px;border-radius:16px;padding:22px 20px;text-align:center;transform:scale(.92);opacity:0;transition:transform .18s ease,opacity .18s ease;}
.chest-modal-bg.show .chest-modal{transform:scale(1);opacity:1;}
.chest-modal img{width:96px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));}
.chest-modal h3{margin:0 0 6px;font-size:18px;font-weight:800;}
.chest-modal p{margin:0 0 18px;font-size:13px;color:rgba(255,255,255,.65);}
/* Home announcement dialog -- reuses .chest-modal's exact dark background
   (rgba(17,17,17,.82), the same color the Home activity ticker pill uses)
   and centered scale-in, with its own close (X) button and left-aligned
   multi-line body text since this holds a real paragraph, not a one-line
   caption. */
.announce-modal{position:relative;text-align:left;max-height:70vh;display:flex;flex-direction:column;}
.announce-modal h3{font-size:16.5px;font-weight:800;margin:0 0 8px;padding-right:24px;flex-shrink:0;}
.announce-scroll{overflow-y:auto;flex:1;min-height:0;}
.announce-modal p{white-space:pre-line;line-height:1.55;font-size:12.5px;color:rgba(255,255,255,.85);margin:0;}
.announce-modal .primary-button{flex-shrink:0;}
.announce-close{position:absolute;top:-8px;right:-6px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

.list-empty{padding:30px 4px;text-align:center;color:var(--snow-muted);font-size:13px;}
.list-empty .empty-icon{display:flex;justify-content:center;margin-bottom:14px;opacity:.85;}
.list-empty .empty-icon svg{width:64px;height:64px;}
.list-end{padding:16px 4px 4px;text-align:center;color:var(--snow-muted);font-size:12px;}

/* Real content fades/lifts into place once it's ready -- no shimmer
   placeholders. Freshly-inserted DOM (a fresh innerHTML assignment) always
   plays this from the start, so no manual restart/reflow trick is needed.
   Direct children stagger in one after another (the "live animation
   website" look) instead of the whole block popping in as one flat unit;
   each one starts fully hidden (animation-fill-mode:both) so there's no
   flash of unanimated content before its delay elapses. */
@keyframes revealIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.reveal-in > *{animation:revealIn .42s cubic-bezier(.22,1,.36,1) both;}
.reveal-in > *:nth-child(1){animation-delay:0ms;}
.reveal-in > *:nth-child(2){animation-delay:35ms;}
.reveal-in > *:nth-child(3){animation-delay:70ms;}
.reveal-in > *:nth-child(4){animation-delay:105ms;}
.reveal-in > *:nth-child(5){animation-delay:140ms;}
.reveal-in > *:nth-child(6){animation-delay:175ms;}
.reveal-in > *:nth-child(n+7){animation-delay:210ms;}

/* About page article blocks -- reveals each text/image block as it scrolls
   into view (owner: "whenever one scrolls down, images and words I placed
   show animation"), distinct from .reveal-in above which fires once on
   first paint regardless of scroll position. */
.scroll-reveal{opacity:0;transform:translateY(22px);transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);}
.scroll-reveal.in-view{opacity:1;transform:translateY(0);}
.about-block{margin-bottom:18px;}
.about-block:last-child{margin-bottom:0;}

</style>
</head>

9.443 22.61 9.271 22.61 9.271Z"/></svg>
        <div class="wm-text" style="font-size:24px;">SNOW</div>
      </div>
      <div id="authTagline" style="position:relative;text-align:center;font-size:12.5px;color:rgba(255,255,255,.75);margin:-6px 0 8px;display:none;"></div>

        <path d="M0 48 C58 22 104 18 154 34 C205 50 251 44 296 22 C332 6 362 0 390 4 L390 70 L0 70 Z" fill="var(--snow-canvas)"></path>
