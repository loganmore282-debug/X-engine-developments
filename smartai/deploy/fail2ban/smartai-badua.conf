# nginx answers 444 (closes the connection) to a User-Agent that names a hacking tool (sqlmap, nikto, nmap, hydra...). Three in 10 minutes ban the address (one odd sender name must not shut a payment gateway out for a day).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[^"]*" 444 
ignoreregex =
