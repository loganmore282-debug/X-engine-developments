# Wrong admin key / admin password, or the admin sign-in being hit so fast that nginx refused it. Only the admin sign-in is watched: many
# honest members can share one mobile-carrier address, so member sign-ins are never used to ban an address.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /k7x2/admin/(login|check-key)[^"]*" (401|429) 
ignoreregex =
