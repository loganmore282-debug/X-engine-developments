<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      background-color: #FF0000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    .message {
      color: #FFFFFF;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .message .icon {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .message h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin: 0;
    }
    .message p {
      font-size: 1.1rem;
      margin: 0.75rem 0 0;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="message">
    <div class="icon">⛔</div>
    <h1>Access Denied</h1>
    <p>You do not have permission to view this page</p>
  </div>
</body>
</html>
