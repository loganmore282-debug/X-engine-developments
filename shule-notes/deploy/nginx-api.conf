# The app's API. The Node server listens on 127.0.0.1 only; certbot adds
# the HTTPS part of this file.
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # A note can be up to 50 MB.
    client_max_body_size 55m;
    include /etc/nginx/shule-hook-location.conf;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An AI answer can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
