# The website: plain files built from shule-notes/web. It has no server of its own;
# everything it shows comes from the same Shule Notes server the phone app uses.
server {
    listen 80;
    listen [::]:80;
    server_name __WEB_DOMAIN__;

    # Some nginx versions do not know the .mjs type (the PDF reader's helper file), so say it here.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    root /var/www/shule-web;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Only this site's own files may run, and data may only be fetched from the Shule Notes server.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://__API_DOMAIN__; connect-src 'self' https://__API_DOMAIN__; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Built files have a fingerprint in their name, so a browser may keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # The page itself must always be checked again, so a new version shows up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
