# Configuration for Shule Notes' OWN MongoDB instance (written to
# /etc/shule-mongod.conf by setup-mongodb.sh). It is separate from any other
# MongoDB on the server: its own port, its own data folder, its own service.
#
# - Listens on this machine only (127.0.0.1); the firewall never opens this port.
# - Requires a username and password.
# - The memory cache is capped so the other projects on the server keep their
#   RAM. Raise cacheSizeGB only if the server has plenty to spare.

storage:
  dbPath: /var/lib/shule-mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/shule-mongodb/mongod.log

net:
  port: __PORT__
  bindIp: 127.0.0.1

security:
  authorization: __AUTH__
