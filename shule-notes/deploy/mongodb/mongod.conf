# /etc/mongod.conf for Shule Notes (written by setup-mongodb.sh).
#
# - Listens on this machine only (127.0.0.1). It is not reachable from the
#   internet, and the firewall does not open port 27017 either.
# - Requires a username and password.
# - The memory cache is capped so MongoDB leaves room for the app and nginx
#   on a small VPS. Raise cacheSizeGB if your VPS has plenty of RAM
#   (a good value is about a quarter of the RAM).

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

security:
  authorization: enabled
