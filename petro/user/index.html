.pw-field.pin input::placeholder{letter-spacing:normal;}

/* ── Auth (Login / Sign Up) ──────────────────────────────────────────
   Matches the approved Main.dc.html / Register.dc.html mockups: a hero
   band (admin-uploadable background image) with the PETRO wordmark, then a
   white card that overlaps its lower edge carrying the LOGIN / SIGN UP
   title, a small dash-dot-dash divider, and the fields. Field icons here
   are deliberately real emoji glyphs (owner: "even see those emoji or
   symbols of padlock, key... l need that same key") -- the only place in
   this app that uses emoji instead of SVG. */
.auth-hero{position:relative;overflow:hidden;height:280px;background:var(--petro-grad);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
/* ── Admin-set backdrops for the Login / Sign Up screen ──
   Owner: "make when l can put background image on those screens of login tab
   and registration tab ... 2 different images so one image will appear on
   login and registration tabs, and 1 will appear on space where orange color
   is shared". Two slots: the orange hero band, and the white form card.

   Each is a CHILD element rather than a background-image on the section
   itself, and that is what makes the opacity control useful: the child paints
   OVER the brand gradient (or the white card), so opacity blends the photo
   towards the brand colour instead of towards nothing. A background-image
   with opacity would need the whole element faded, taking the wordmark and
   the form fields with it.

   The negative inset is not decoration. filter:blur() feathers an element's
   own edges, so a backdrop that exactly filled its box would show a soft
   transparent rim all the way round once blurred. Pulling it out by twice the
   blur radius puts that rim outside the clip, which is why both sections need
   overflow:hidden. */
.auth-bg{position:absolute;inset:calc(-2 * var(--auth-bg-blur, 0px));
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:var(--auth-bg-op, 1);filter:blur(var(--auth-bg-blur, 0px));
  pointer-events:none;z-index:0;}
#authHeroBg{--auth-bg-blur:var(--auth-hero-blur, 0px);--auth-bg-op:var(--auth-hero-op, 1);
  background-image:var(--auth-hero-img, none);}
/* ── The banner bleeds into the card instead of stopping dead ──
   Owner: "on login and register pages there should be like whites or color
   bleeding into the image of banner uploaded from admin panel, just like you
   see the first image."

   His reference is a photo whose lower half ramps smoothly into the page's
   own flat colour, so there is no banner EDGE anywhere -- measured down that
   image, the pixels stop varying entirely about 80 device px before the
   bottom and the last ~160 px are one continuous ramp. Ours ended on a hard
   horizontal cut that the card's rounded top corners left visible on both
   sides.

   A scrim to the card's colour, NOT a mask on the image: masking the image
   out would just reveal the orange gradient underneath it, which is not
   "white bleeding in". 55% of the hero, with a mid stop, so the ramp is long
   and slow at the top and solid well before the bottom rather than a short
   hard fade near the edge.

   z-index 1 puts it over the photo (z-index 0) and under the wordmark and
   the tagline (z-index 2), so the brand stays crisp on top of the fade.

   Only when a banner is actually set: with no image the hero is the plain
   brand gradient, and washing THAT out at the bottom would quietly restyle a
   screen he has already approved. .has-bg is toggled in applyAuthBackgrounds(). */
.auth-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:55%;
  pointer-events:none;z-index:1;opacity:0;transition:opacity .2s ease;
  background:linear-gradient(to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.55) 55%,
    var(--snow-surface) 88%,
    var(--snow-surface) 100%);}
.auth-hero.has-bg::after{opacity:1;}
#authCardBg{--auth-bg-blur:var(--auth-card-blur, 0px);--auth-bg-op:var(--auth-card-op, 1);
  background-image:var(--auth-card-img, none);border-radius:inherit;}
/* Angular triangle motifs, straight off Main.dc.html -- Petro's brand
   language is angular, NOT the soft wave this screen inherited from Snow
   (owner: "l no longer need to see this wavy curvy design"). */
.auth-tri{position:absolute;}
.auth-tri.t1{width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:150px solid rgba(0,0,0,.16);top:-60px;left:-40px;transform:rotate(18deg);}
.auth-tri.t2{width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid rgba(255,255,255,.14);bottom:-50px;right:-30px;transform:rotate(-12deg);}
.mark-row{display:flex;align-items:center;gap:8px;position:relative;z-index:2;}
.mark-tri{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid #14100d;flex-shrink:0;}
.auth-wordmark{position:relative;font-size:36px;letter-spacing:.02em;transform:skewX(-7deg);color:#fff;}
.auth-wordmark b{color:#14100d;font-weight:400;}
.auth-card{background:var(--snow-surface);margin-top:-28px;border-radius:var(--r-card);position:relative;z-index:3;padding:32px 22px 30px;box-shadow:0 22px 44px -26px rgba(40,10,4,.5);overflow:hidden;}
/* Owner: "there is a white space down the login screen, why is it there?"
   The hero is a fixed 280px and the card was only as tall as its own fields,
   so on any screen taller than the two of them together the page canvas
   showed through underneath as a pale strip -- most obvious on Log In, which
   has three fewer fields than Sign Up. Making the wrap a column and letting
   the card take the slack runs it to the bottom of the screen instead.
   dvh, not vh, where it is supported: 100vh on a phone is the viewport WITH
   the address bar hidden, so on first paint (bar visible) it overshoots and
   trades the gap for a scrollbar. dvh tracks what is actually on screen. */
#authScreen > .wrap{display:flex;flex-direction:column;min-height:100vh;}
@supports (min-height:100dvh){#authScreen > .wrap{min-height:100dvh;}}
#authScreen .auth-hero{flex:0 0 auto;}
#authScreen .auth-card{flex:1 0 auto;}
/* Everything in the card sits above its backdrop.
   The second rule has to restore `position:absolute`, not just drop the
   z-index: `.auth-card > *` and `.auth-bg` have the SAME specificity, and
   this one comes later in the sheet, so it was winning and collapsing the
   backdrop to a 0x0 relatively-positioned span. It rendered as nothing at
   all, and every computed-style check still passed. */
/* ── THE LANGUAGE BUTTON AND ITS PICKER ──
   The button sits over the auth hero's top-right corner, above the backdrop
   image (z-index 0) and the wordmark row's own layer. It is a glass pill
   rather than a filled one: the hero behind it is either the brand gradient
   or an owner-uploaded photo, and a solid chip on top of either reads as a
   sticker. */
.lang-btn{position:absolute;top:14px;right:14px;z-index:4;display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;border:1px solid rgba(255,255,255,.42);border-radius:var(--r-pill);
  background:rgba(20,10,5,.26);color:#fff;font:inherit;font-size:13px;font-weight:600;
  letter-spacing:.01em;cursor:pointer;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);}
.lang-btn:active{transform:translateY(1px);}
.lang-sheet-bg{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,10,5,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;}
.lang-sheet-bg.show{opacity:1;pointer-events:auto;}
.lang-sheet{width:100%;max-width:520px;background:var(--snow-surface);
  border-radius:var(--r-card) var(--r-card) 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);max-height:82vh;overflow:auto;}
.lang-sheet-bg.show .lang-sheet{transform:translateY(0);}
.lang-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;}
.lang-head b{font-size:19px;letter-spacing:.02em;}
.lang-x{width:34px;height:34px;border-radius:var(--r-pill);border:1px solid var(--line-soft);
  background:transparent;color:var(--snow-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.lang-list{display:flex;flex-direction:column;gap:8px;}
.lang-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:13px 14px;border:1px solid var(--line-soft);border-radius:var(--r-ctl);
  background:var(--snow-card);color:var(--snow-ink);font:inherit;text-align:left;cursor:pointer;}
.lang-opt.on{border-color:var(--petro-orange);box-shadow:0 0 0 1px var(--petro-orange) inset;color:var(--petro-red);}
.lang-names{display:flex;flex-direction:column;gap:2px;min-width:0;}
.lang-names .n1{font-size:16.5px;font-weight:700;}
.lang-names .n2{font-size:12.5px;color:var(--snow-muted);}
.lang-opt.on .lang-names .n2{color:var(--petro-red);opacity:.75;}
@media (prefers-reduced-motion:reduce){
  .lang-sheet{transition:none;}
}
.auth-card > *{position:relative;z-index:1;}
.auth-card > #authCardBg{position:absolute;z-index:0;}
.auth-card h1{margin:0 0 6px;font-size:26px;text-align:center;letter-spacing:.08em;font-weight:400;}

.row-check input{width:18px;height:18px;accent-color:var(--snow-wine);}

/* Everything above (.auth-hero/.auth-card/.auth-wordmark/.mark-row/.auth-tri/
   .dot-divider/.auth-field/.row-check/.auth-switch) belonged to the old
   hero-band + white-card layout the auth screen no longer uses -- superseded
   by .auth-screen-v2 below. Left in place, unreferenced, same as this
   session's other supersessions (nothing else in the app still uses them). */

/* ── Auth v2: the owner's exact mockup -- ONE continuous full-bleed photo
   (admin-uploadable, still the "authhero" slot/--auth-hero-img var, applied
   here via the #authHeroBg/.auth-bg rules above) with dark glass pill fields
   floating directly on it. No hero/card split, no wordmark, no dial-code
   chip, no "remember me" -- single screen, exactly the fields shown. */
.auth-screen-v2{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;background:var(--petro-grad);}
@supports (min-height:100dvh){.auth-screen-v2{min-height:100dvh;}}
.auth-screen-v2::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom, rgba(12,7,4,.35) 0%, rgba(12,7,4,.55) 55%, rgba(12,7,4,.8) 100%);}
.auth-screen-v2 .lang-btn{z-index:4;}
/* Owner: "my tabs are boxed and these are round ... login is raised up" --
   fields/buttons were a full 999px pill; the mockup's are a boxed
   (rounded-RECTANGLE, --r-ctl) shape, same radius family every other
   control in this app already uses. And a short pane (Log In, 2 fields)
   was simply top-padded the same as the long one (Register, 6 fields), so
   it sat pinned near the top with a dead gap below it -- "raised up" --
   instead of sitting centred like the mockup. justify-content:center on
   the scroll container centres whichever single pane is visible; a pane
   too tall to fit still scrolls (overflow-y:auto), so Register is
   unaffected. */
.auth-scroll-v2{position:relative;z-index:2;flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;
  padding:24px 22px calc(30px + env(safe-area-inset-bottom));}
.af-v2{display:flex;align-items:center;gap:10px;background:rgba(20,12,8,.44);border:1.5px solid rgba(255,255,255,.18);
  border-radius:var(--r-ctl);padding:0 16px;height:54px;margin-bottom:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.af-v2 input{border:0;background:transparent;outline:0;font-family:inherit;font-size:15px;flex:1;min-width:0;color:#fff;}
.af-v2 input::placeholder{color:rgba(255,255,255,.58);}
.af-ic{color:rgba(255,255,255,.78);display:flex;flex-shrink:0;}
/* Owner: "this time no using subdomains ... only on signup or login one
   selects country code besides the number area ie 256|" -- restores the
   dial-code chip the phone field always had, in the SAME slot the person
   icon used on every other field, so a phone row reads as one continuous
   pill instead of icon + separate chip. Wired to the exact same
   paintRegionChrome() -> #loginDial/#regDial/#forgotDial mechanism the
   deposit screen's own .dep-phone .prefix already uses elsewhere in this

.af-prefix{flex-shrink:0;font-weight:700;color:#fff;font-size:15px;padding-right:10px;margin-right:2px;border-right:1.5px solid rgba(255,255,255,.24);}
.af-eye{background:none;border:none;padding:4px;color:rgba(255,255,255,.68);display:flex;align-items:center;flex-shrink:0;cursor:pointer;}
.af-v2.with-btn{padding-right:6px;}
.af-inline-btn{flex-shrink:0;background:var(--petro-orange);color:#fff;border:0;border-radius:var(--r-ctl);
  padding:0 16px;height:38px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
.af-inline-btn:disabled{opacity:.55;cursor:default;}
.af-forgot{text-align:right;margin:-4px 0 18px;font-size:13.5px;}
.af-forgot a{color:rgba(255,255,255,.85);text-decoration:none;font-weight:600;}
.af-btn-v2{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--petro-grad);
  color:#fff;border:0;border-radius:var(--r-ctl);height:54px;font:inherit;font-size:16px;font-weight:700;
  cursor:pointer;letter-spacing:.01em;}
.af-btn-v2:disabled{opacity:.6;cursor:default;}
.af-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(255,255,255,.55);font-size:13px;font-weight:600;}
.af-or span{flex:1;height:1px;background:rgba(255,255,255,.22);}
.af-btn-outline{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.07);
  color:#fff;border:1.5px solid rgba(255,255,255,.42);border-radius:var(--r-ctl);height:54px;font:inherit;font-size:15px;
  font-weight:700;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.af-switch{text-align:center;margin-top:18px;font-size:13.5px;color:rgba(255,255,255,.72);}
.af-switch a{color:#fff;text-decoration:none;font-weight:700;}
.form-field{margin:0 0 14px;}
.form-field label{display:block;font-size:15px;font-weight:500;color:var(--snow-ink);margin-bottom:8px;}
.form-field .input-wrap{position:relative;}
.form-field input{width:100%;padding:17px 44px 17px 16px;border:1px solid var(--snow-border);border-radius:var(--r-ctl);font-size:17px;background:var(--snow-surface);color:var(--snow-ink);}
.form-field input:focus{outline:none;border-color:var(--snow-wine);}
.form-field .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--snow-muted);background:none;border:none;padding:4px;display:flex;align-items:center;justify-content:center;}
/* Owner: "make (+256) static, so one can type 07xxxxxxxx or 7xxxxxxxx... just
   the system understand it" -- every phone field is now a static, fixed
   "+256" chip next to a local-number-only input, instead of one free-text
   field where the country code had to be typed (and could be typed several
   different ways). See sanitizePhoneInput()'s own comment for why this is
   safe for already-registered accounts. */
.phone-field{display:flex;gap:8px;}
.phone-prefix{flex-shrink:0;padding:15px 12px;border:1px solid var(--snow-border);border-radius:var(--r-ctl);background:var(--snow-neutral-soft);color:var(--snow-ink);font-size:15px;font-weight:500;display:flex;align-items:center;}
.phone-field input{flex:1;min-width:0;width:auto;padding:15px 16px;}
/* Chrome's own "Use saved password?" picker fills #loginPhone/#loginPassword
   with zero JS-visible events -- there's no input/change to listen for. The
   browser DOES tag autofilled fields with the :-webkit-autofill pseudo-class
   though, and toggling a no-op animation on that class is the one reliable,
   long-standing trick to get a real DOM event (animationstart) out of it. See
   autoSubmitOnAutofill() in original_module.js. */
@keyframes onAutoFillStart{ from{} to{} }
@keyframes onAutoFillCancel{ from{} to{} }
#loginPhone:-webkit-autofill{ animation-name:onAutoFillStart; animation-duration:.01s; }
#loginPhone:not(:-webkit-autofill){ animation-name:onAutoFillCancel; animation-duration:.01s; }
#loginPassword:-webkit-autofill{ animation-name:onAutoFillStart; animation-duration:.01s; }
#loginPassword:not(:-webkit-autofill){ animation-name:onAutoFillCancel; animation-duration:.01s; }
.form-hint{font-size:11.5px;color:var(--snow-muted);margin-top:6px;}
.instr-card{background:var(--snow-wine-soft);border-radius:var(--r-card);padding:18px;margin-top:24px;}

.instr-card .instr-head .instr-title{font-size:14.5px;font-weight:700;color:var(--snow-ink);}

.instr-card ol li{margin-bottom:3px;}
.milestone-card{display:flex;align-items:stretch;background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);overflow:hidden;margin-top:14px;box-shadow:var(--sh-card);}
.milestone-rail{width:52px;flex-shrink:0;background:linear-gradient(165deg,var(--snow-wine),var(--snow-wine-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14.5px;}
.milestone-rail.done{background:linear-gradient(165deg,var(--snow-green),#1F4E33);}
.milestone-body{flex:1;min-width:0;padding:16px 18px;}
.milestone-title{font-size:13.5px;font-weight:600;color:var(--snow-ink);line-height:1.45;}
.milestone-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;text-align:center;}
.milestone-stats .stat-num{font-size:13.5px;font-weight:700;color:var(--snow-ink);}
.milestone-stats .stat-lbl{font-size:9.5px;color:var(--snow-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
.milestone-track{height:5px;border-radius:var(--r-pill);background:var(--snow-border);margin-top:10px;overflow:hidden;}
.milestone-fill{height:100%;border-radius:var(--r-pill);background:var(--snow-wine);}
.milestone-fill.done{background:var(--snow-green);}

/* Keep the scrollable form layer untransformed. The earlier translateZ(0) fix
   was based on a diagnosis later disproved by the real CSS-token bug; on
   Android a transformed fixed scroller can also make input focus/IME viewport
   changes more expensive. */
.sheet-bg{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);background:var(--snow-canvas);z-index:200;display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
/* Owner: "in withdrawal page still when tapped the nav icons still remain
   why? Remove them please, it's not a must that withdrawal page will be
   looking like that." Every sub-page opened via openSheet() (Deposit,
   Withdraw, About, Balance Record, Messages, My Team, ...) shares this one
   overlay, so body.sheet-open is the one flag that turns the bottom nav off
   for all of them at once -- same "swap one token" leverage as the
   .sheet-head retheme. The sheet itself extends to fill the space the nav
   used to occupy instead of leaving a dead gap. */
body.sheet-open .bottom-nav{display:none;}
body.sheet-open .sheet-bg{bottom:0;}
.sheet-bg.show{display:block;}
/* Round 1 of this fix made every sub-page header a solid Corporate Red
   band, replacing Petro's own peach-band-plus-blue-chevron. Owner's own
   follow-up: "remove all red headers" -- a colored band across the top of
   every single secondary screen (About, Balance Record, Messages, Deposit,
   Withdraw, etc.) reads as heavy/repetitive at that frequency, not as this
   app's identity. Petro's own owner independently reached the same
   conclusion once already, for the manual-pay overlay specifically (see
   the long comment above depositChipsHtml() in original_module.js: "don't
   expect header bars or red colors, just fresh well sized screen") --
   this is that same call, made for every other sub-page too. Plain,
   minimal header now: no background fill, dark text/icon, a thin bottom
   rule for separation. Red stays reserved for buttons, active states and
   real emphasis, not page furniture. */
.sheet-head{display:flex;align-items:center;gap:12px;padding:18px 20px;position:sticky;top:0;background:var(--snow-surface);border-bottom:1px solid var(--snow-border);z-index:1;}
.sheet-head .back{background:none;border:none;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-head h2{margin:0;flex:1;text-align:center;margin-right:30px;font-size:18px;font-weight:700;letter-spacing:.01em;color:var(--snow-ink);}
.sheet-body{padding:4px 20px 40px;max-width:480px;margin:0 auto;}

/* The dark bottom-pill toast (#toastHost, .toast, @keyframes toastIn) was
   removed here. Owner: "l nolonger need those dark tiny notifies you already
   know that we have a pop up card with [the warning sign]." Every message it
   carried now opens .notify-card instead. */

/* All pop-up dialogs (as opposed to full-page sheets) open centered, share
   the activity ticker's own dark pill color, and use a modest radius --
   not the tall rounded bottom-sheet look. Owner: "smooth appearing... not
   just appearing suddenly" -- the scale+fade entrance (below, and on
   .chest-modal, which .announce-modal/.dep-status-modal both extend) was
   real but only 180ms/linear ease, which read as a snap/pop rather than a
   settle. Widened to this app's own established "gentle settle" curve
   (cubic-bezier(.22,1,.36,1), the exact same one .reveal-in/.scroll-reveal
   already use elsewhere) so every popup eases in consistently. Owner,
   next round: "abit slow appearing delay abit" -- duration widened again
   (340ms->520ms) plus a short 100ms delay before the ease-in starts, so
   the dialog visibly pauses a beat before settling into place rather than
   beginning to move the instant it's shown. */
/* Petro dialog language (Notify.dc.html): white card on a warm dimmed
   backdrop, dark ink, pill buttons. This card was still Snow's dark glass
   panel -- the one dialog a member reads immediately before their money
   moves, in a theme it no longer belongs to. */
.confirm-bg{position:fixed;inset:0;background:rgba(20,10,5,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.confirm-bg.show{display:flex;}
.confirm-sheet{background:var(--snow-surface);color:var(--snow-ink);width:100%;max-width:340px;border-radius:var(--r-card);padding:24px 22px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);transform:scale(.92);opacity:0;transition:transform .52s cubic-bezier(.22,1,.36,1) .1s,opacity .52s cubic-bezier(.22,1,.36,1) .1s;}
.confirm-bg.show .confirm-sheet{transform:scale(1);opacity:1;}
.confirm-sheet h3{margin:0 0 4px;font-size:19px;font-weight:700;color:var(--snow-wine);}
.confirm-sheet .confirm-sub{color:var(--snow-muted);font-size:13px;margin:0 0 14px;font-weight:500;}
.confirm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--snow-border);color:var(--snow-muted);font-weight:500;}
.confirm-row:last-of-type{border-bottom:none;}
.confirm-row .mono{color:var(--snow-ink);font-weight:700;font-family:var(--number-font,inherit);font-size:15px;}
.confirm-sheet .secondary-button{background:var(--snow-green-soft);color:var(--snow-ink);border-radius:var(--r-ctl);font-weight:700;}

/* Centered popup (opens from the middle, not a bottom sheet) -- the
   treasure-chest gift-code entry on Home. */
.chest-modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:310;display:none;align-items:center;justify-content:center;padding:20px;}
.chest-modal-bg.show{display:flex;}
.chest-modal{background:rgba(17,17,17,.82);color:#fff;width:100%;max-width:340px;border-radius:var(--r-card);padding:22px 20px;text-align:center;transform:scale(.92);opacity:0;transition:transform .52s cubic-bezier(.22,1,.36,1) .1s,opacity .52s cubic-bezier(.22,1,.36,1) .1s;}
.chest-modal-bg.show .chest-modal{transform:scale(1);opacity:1;}
.chest-modal img{width:96px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));}
.chest-modal h3{margin:0 0 6px;font-size:18px;font-weight:700;}
.chest-modal p{margin:0 0 18px;font-size:13px;color:rgba(255,255,255,.65);}
/* Deposit live-status modal (Recharge) -- reuses .chest-modal-bg/.chest-modal
   for the same dark/centered/thin dialog convention as every other pop-up.
   3 states toggled via #depStatusIcon's class: pending (spinner, reuses the
   loading screen's own @keyframes sp), success (green check), failed (red
   x) -- SVG only, per the house no-emoji rule. */
/* The recharge poll is a PAGE in the app's own colours, not a dark modal.
   Owner: "l nolonger need those old poll designs ... when one taps deposit,
   it should open a new page for polling, so for polling it should show the
   other 4 triangles rotating, just like those which we placed on running
   product, so it will be enlarged ... l nolonger need those dark things, use
   app color and theme not dark ... however still nav icons should exist on
   the poll payment page."

   It keeps its own classes rather than restyling .chest-modal-bg/.chest-modal:
   those are SHARED with the gift-code win modal, and recolouring them here
   would silently redesign the chest too.

   `bottom:var(--nav-h)` is the app's own convention for "leave the bottom bar
   alone" (.sheet-bg and .msg-detail-bg both use it), which is what keeps the
   nav icons visible and tappable while a payment is being polled. */
/* The in-flight loader between Confirm and the poll page. Sits ABOVE the
   sheet (z-index 320 against .sheet-bg's 200) and, like the poll page, stops
   at the bottom bar rather than covering it. */
.dep-redirect{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);
  background:rgba(251,241,232,.86);z-index:320;display:none;
  align-items:center;justify-content:center;}
.dep-redirect.show{display:flex;}
.dep-redirect-inner{text-align:center;}
.dep-redirect-ring{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
  border:5px solid var(--snow-wine-soft);border-top-color:var(--snow-wine);
  animation:sp .8s linear infinite;}
.dep-redirect-text{font-size:17px;font-weight:700;color:var(--snow-ink);}
@media (prefers-reduced-motion:reduce){.dep-redirect-ring{animation-duration:2.4s;}}
/* A column now, not a centred box: the page has a real header (back chevron
   + title) pinned at the top, and .pay-body takes the remaining height and
   centres the card inside THAT. Centring the card in the whole page instead
   would push it visibly below centre by half the header's height. */
.pay-page{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);
  background:var(--snow-canvas);z-index:310;display:none;
  flex-direction:column;overflow-y:auto;transform:translateZ(0);will-change:transform;}
.pay-page.show{display:flex;}
.pay-body{flex:1;display:flex;align-items:center;justify-content:center;padding:26px;}
.pay-card{width:100%;max-width:340px;text-align:center;}
.pay-card h3{font-size:23px;font-weight:800;color:var(--snow-ink);margin:0 0 10px;}
.pay-card p{font-size:15px;line-height:1.6;color:var(--snow-muted);font-weight:500;margin:0;}
/* The pending state is a numbered list of what is happening and what the
   member has to do, so it is LEFT-aligned inside an otherwise centred card --
   centred list items with numbers hanging off them are hard to scan, and the
   numbers stop lining up with each other entirely. */
.pay-steps{margin:0;padding:0 0 0 24px;text-align:left;font-size:15px;
  line-height:1.6;color:var(--snow-muted);font-weight:500;}
.pay-steps li{margin:0 0 11px;padding-left:3px;}
.pay-steps li:last-child{margin-bottom:0;}
.pay-steps li::marker{color:var(--snow-wine);font-weight:700;}
/* The USSD fallback. Deliberately NOT a fifth numbered step: the four steps
   are what happens normally, and this is the way out of the one common
   failure (the mobile-money prompt never arriving). Quieter and smaller so
   it reads as a footnote rather than another instruction to follow. */
.pay-note{margin:16px 0 0;font-size:13.5px;line-height:1.55;
  color:var(--snow-muted);opacity:.85;text-align:left;}
.pay-actions{margin-top:22px;display:flex;flex-direction:column;gap:11px;}
.pay-actions button{width:100%;padding:15px 0;font-size:16px;}
/* No disc behind it any more -- the mark IS the artwork. Sized here so the
   orbiting chips and the two result marks share one footprint and the page
   does not jump as the poll resolves. */
.dep-status-icon{width:150px;height:150px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;}
.dep-status-icon .pspin{--s:150px;}
.dep-status-icon>svg{width:116px;height:116px;display:block;}

/* The orbiting-chips mark while a list is being fetched. Owner, on the Team
   downline: "add the other loader of 'Loading...' while Loading users on team
   of specific level ... l wanted the other which has 4 triangle chips
   rotating, it is already there" -- so this is PLAN_SPIN, the same markup and
   the same keyframes the ongoing-plan rows and the payment page use, resized
   purely by --s. One mark, one set of keyframes, three sizes.
   No word under it: he asked for the chips INSTEAD of the word ("it will be 4
   triangles not Loading..."). */
.list-loading{padding:34px 4px;display:flex;justify-content:center;align-items:center;}
.list-loading .pspin{--s:56px;}
/* Network's own team/referral loading state used PLAN_SPIN (the orbiting-
   chips mark) too, by explicit earlier request, then a plain spinning ring.
   Owner, this round: "l need the other start up loader to be in navigation
   of loading so it will be smaller even" -- reusing the boot screen's own
   three-ring SVG mark (see #loadingScreen above) here, just small, rather
   than a third distinct spinner design. It shares the same .ring-arc/
   ringSweep animation rules, but carries its OWN gradient def
   (#miniRingGrad, identical stops to the boot screen's #ringGrad) instead
   of pointing at that one: confirmed by rendering this offline that a
   url(#ringGrad) paint-server reference from OUTSIDE a display:none
   subtree does not reliably resolve in Chromium once #loadingScreen
   itself is display:none -- the ring painted with no stroke at all. A
   self-contained def has no dependency on #loadingScreen's visibility. */
.mini-ring-loader{width:34px;height:34px;overflow:visible;filter:drop-shadow(0 0 4px rgba(227,6,19,.4));}
.mini-ring-loader .ring-arc{stroke:url(#miniRingGrad);}
.list-empty{padding:30px 4px;text-align:center;color:var(--snow-muted);font-size:15px;}
.list-empty .empty-icon{display:flex;justify-content:center;margin-bottom:14px;opacity:.85;}
.list-empty .empty-icon svg{width:64px;height:64px;}
.list-end{padding:18px 4px 4px;text-align:center;color:var(--snow-muted);font-size:14px;}

/* Real content fades/lifts into place once it's ready -- no shimmer
   placeholders. Freshly-inserted DOM (a fresh innerHTML assignment) always
   plays this from the start, so no manual restart/reflow trick is needed.
   Direct children stagger in one after another (the "live animation
   website" look) instead of the whole block popping in as one flat unit;
   each one starts fully hidden (animation-fill-mode:both) so there's no
   flash of unanimated content before its delay elapses. */
/* Owner: "remove live appearing animation everywhere." Both entrance
   animations are gone -- the stagger that played on every page paint, and
   the About page's scroll-into-view reveal (including the word-by-word
   text effect). The .reveal-in / .scroll-reveal / .reveal-word classes are
   still applied by the JS in a dozen places, so rather than unpick all of
   that, .scroll-reveal is neutralised here to plain visible content. Its
   old `opacity:0` default is the thing to be careful about: leaving that
   behind while removing the transition would hide the About page outright.
   The .reveal-in rules are deleted rather than set to `animation:none`,
   because that rule sits later in the file at the same specificity as
   .chest-float and would go straight back to killing the chest's bounce. */
.scroll-reveal,.scroll-reveal.about-image,.scroll-reveal.in-view{opacity:1;transform:none;transition:none;}
.reveal-word{display:inline-block;opacity:1;transform:none;}
.about-block{margin-bottom:18px;}
.about-block:last-child{margin-bottom:0;}
/* The stale `.reveal-word{opacity:0}` that used to sit here is DELETED, not
   overridden. It was the old animation's starting frame, left behind when the
   reveal was removed -- and because it came AFTER the replacement rule at the
   same specificity, it won: every word of the About page rendered at opacity
   0 and translated 10px down. The page was not blank because the text was
   missing; the text was all there, invisible.
   The comment two rules up literally warned about this ("Its old `opacity:0`
   default is the thing to be careful about: leaving that behind while
   removing the transition would hide the About page outright") and the
   duplicate was left in anyway. Adding a third rule to win the cascade would
   have kept the trap loaded; there is now exactly one .reveal-word rule. */


/* ── Member glass surfaces ───────────────────────────────────────────────
   Reuses the authentication screen's uploaded background and its smoked
   glass language inside the four main member tabs. This is deliberately a
   CSS-only surface pass: no markup, navigation, API, money logic or sheet

/* ── Static refinery backdrop on every signed-in screen ───────────────
   The picture must behave like wallpaper, not page content: it stays pinned
   to the viewport while Home/Assets/Network/Account and every full-screen
   sheet scroll independently over it. */
#app{
  position:relative;
  isolation:isolate;
  background:#1d130f;
}
#app::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(12,7,4,.34) 0%,rgba(12,7,4,.46) 48%,rgba(12,7,4,.56) 100%),
    var(--auth-hero-img);
  background-size:cover,cover;
  background-position:center center,center center;
  background-repeat:no-repeat,no-repeat;
}
#pageHost,.bottom-nav{position:relative;z-index:1;}

/* Secondary screens (Deposit, Withdraw, Check-in, Statement, Wallet,
   Support, About, etc.) share .sheet-bg, so one fixed pseudo-layer gives
   every one of them the same stationary refinery backdrop. */

  isolation:isolate;
  background:transparent;
}
.sheet-bg::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(12,7,4,.54) 0%,rgba(12,7,4,.68) 100%),

  background-position:center center,center center;

}

}

   the source of the visible nudge when mobile browser chrome resized. */

#homeCarouselTrack{position:relative;overflow:hidden;}
#homeCarouselTrack .hb-fade-stack{
  position:relative;
  width:100%;
  height:100%;
}
#homeCarouselTrack .hb-fade-stack img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:none!important;

  opacity:1;
  z-index:1;
  transition:opacity .72s cubic-bezier(.22,1,.36,1);
}

<div id="loadingScreen">
  <div class="ring-loader-wrap">
    <svg class="ring-loader" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="24" y1="104" x2="96" y2="16" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ff3b44"/>
          <stop offset="55%" stop-color="#e30613"/>
          <stop offset="100%" stop-color="#6b4cff"/>
        </linearGradient>
      </defs>
      <circle class="ring-arc ring-arc-1" cx="60" cy="60" r="52" pathLength="100"/>
      <circle class="ring-arc ring-arc-2" cx="60" cy="60" r="45" pathLength="100"/>
      <circle class="ring-arc ring-arc-3" cx="60" cy="60" r="38" pathLength="100"/>
    </svg>
    <div class="ls-percent" id="lsPercent" role="status" aria-label="Loading">0</div>
  </div>
</div>

<script>
/* THE APP'S NAME, PAINTED BEFORE ANYTHING ELSE.
 *
 * Owner: "l had made a little bit changes in names but on start up loader it
 * was still saying petro."
 *
 * He is describing a real gap, not a bug in the rename. The name lives in
 * Admin -> Settings and reaches the app over the network, but the loading
 * screen is on screen precisely while that request is in flight -- so the
 * loader could only ever show whatever was compiled into this file, and what
 * was compiled in was the old name. Every boot, forever.
 *
 * So the name is remembered on the device the first time it is known, and
 * this runs before the 250KB core inflates: every launch after the very first
 * paints the real name in the first frame. The DOMContentLoaded pass catches
 * every [data-brandmark] further down the document -- currently just the
 * pre-launch countdown gate's own mark, since the loading screen no longer
 * carries one.
 *
 * Nothing here falls back to a hard-coded name. Owner: "let's not make petro
 * to be default name" -- on a genuinely first-ever launch the mark stays
 * blank for the moment it takes settings to land. A blank that fills in is
 * honest; the wrong name is not.
 *
 * The mark is built with createTextNode/createElement rather than innerHTML.
 * The server already refuses < and > in the name, but this value has been
 * through localStorage, and building nodes is injection-proof by
 * construction instead of by remembering to escape.
 */
(function(){
  var KEY = 'petro_brand_name';
  var name = '';
  try { name = (localStorage.getItem(KEY) || '').trim(); } catch (e) {}
  // The module reads this instead of its own localStorage: one read, one
  // place that knows the key.
  window.__brandCached = name;
  if (!name) return;
  document.title = name;
  var up = name.toUpperCase();
  // Just the name -- the last-letter-in-accent-colour "CHIP+Z" split was a
  // pun specific to Petro's own name, meaningless for any other brand, so
  // it isn't carried over here (matches brandWordmarkHtml() in the module,
  // which this pre-core paint has to mirror since it runs before the module
  // exists).
  window.__paintBrandMarks = function(){
    var els = document.querySelectorAll('[data-brandmark]');
    for (var i = 0; i < els.length; i++) els[i].textContent = up;
  };
  window.__paintBrandMarks();
  document.addEventListener('DOMContentLoaded', window.__paintBrandMarks);
})();

/* THE LOADER'S PERCENTAGE COUNTER.
 *
 * Purely cosmetic, same as the reference GIF's own counter -- boot time
 * genuinely varies (cold backend, slow network), so this was never a real
 * progress bar, just the same "still working" motion the reference shows:
 * climbs 0-100 in uneven steps, wraps back to 0, repeats.
 *
 * A MutationObserver on #loadingScreen's own `style` attribute starts and
 * stops the interval, rather than editing every one of the ~10 call sites
 * that show/hide the loading screen mid-session (login, sign-up, returning
 * to the app, etc.) -- one place that reacts to visibility instead of many
 * places that would each have to remember to announce it.
 */
(function(){
  var ls = document.getElementById('loadingScreen');
  var el = ls && ls.querySelector('.ls-percent');
  if (!ls || !el) return;
  var n = 0, timer = null;
  function tick(){
    n += 2 + Math.floor(Math.random() * 5);
    if (n >= 100) n = 0;
    el.textContent = n;
  }
  function shown(){ return ls.style.display !== 'none'; }
  function sync(){
    if (shown() && !timer) { n = 0; el.textContent = '0'; timer = setInterval(tick, 110); }
    else if (!shown() && timer) { clearInterval(timer); timer = null; }
  }
  sync();
  try { new MutationObserver(sync).observe(ls, { attributes: true, attributeFilter: ['style'] }); } catch (e) {}
})();
</script>
