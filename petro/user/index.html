/* ── Team (Team.dc.html) ── */
.plain-head{font-size:19px;font-weight:400;margin:22px 18px 12px;}
/* Team cards, measured off the owner's mockup rather than eyeballed. Both his
   screenshot and ours came off the same phone at 1080x2340, and our card is
   973 device px for a CSS width of 354, so 1 CSS px = 2.749 device px and his
   figures convert directly:

                              ours      his
     card 1 height          157.2    164.8 CSS
     card 2 height          163.7    177.9
     "45" / "1%" cap height  25.1     33.8  -> both his figures are ~47px
     green glow on the edge   none    ~12% alpha, fading over ~16px
     arcs top-right           none    2 hairlines, r 41.5 and 61.5

   The GREEN is on the card EDGE only. Owner: "see some green behind the
   percentage, and number, also on card edges" -- but sampling the haze around
   his figures gives (212,228,244) against a (223,229,245) fill: a shadow in
   the GLYPH's own hue, not a green one. So the figures get a halo in their own
   brand colour and the green stays where it was measured, on the edge. */
.team-gcard{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff0e6,#ffd9b3);border-radius:var(--r-card);padding:21px 20px;border:1px solid #ffe0bf;
  box-shadow:0 6px 24px rgba(74,170,108,.34),0 2px 8px rgba(74,170,108,.20);}
/* The two clipped rings in his top-right corner. Centre sits 19.6px INSIDE the
   corner, so a circle of radius R is offset (19.6 - R) from both edges and the
   card's own overflow:hidden cuts it into the semi-circle he described. Card 2
   has none in his mockup, hence :not(.comm). Barely-there strokes on purpose:
   measured only ~4 luminance units above the fill. */
.team-gcard:not(.comm)::before,.team-gcard:not(.comm)::after{content:'';position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);pointer-events:none;}
.team-gcard:not(.comm)::before{width:123px;height:123px;top:-41.9px;right:-41.9px;}
.team-gcard:not(.comm)::after{width:83px;height:83px;top:-21.9px;right:-21.9px;}
/* Owner: "you failed to put that icon total team icon just as the same team
   icon on our app, dont use that in mockup" -- the card had no icon at all,
   and the mockup he was holding up marks it with a bare emoji. This is the
   app's own team artwork, the same file the bottom nav uses, so the icon for
   "team" is one thing everywhere instead of an emoji in one place and a
   picture in another. align-items:center, not baseline: a picture has no
   baseline to sit on and would hang low against the text. */
.team-gcard .row1{display:flex;align-items:center;justify-content:center;gap:8px;}
.team-gcard .row1 .ic{width:24px;height:24px;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 3px 5px rgba(30,10,5,.28));}
.team-gcard .row1 .lbl{font-size:15px;font-weight:500;color:#7a5a3a;}
/* Owner: "on team there are some green behind the number, see our mockup on
   percentage and number of team, some green is there behind numbers, see
   clearly rather than guess."

   Measured off his mockup rather than eyeballed. Sampling across the glow on
   his big "45": the halo pixels read (176,220,219) against a (197,230,249)
   card, so every channel drops but BLUE drops most (-30) and green least
   (-10) -- the signature of a green cast, not a shadow. Solving that back
   through normal alpha compositing at a plausible 20-30% puts the glow's own
   colour between (92,180,99) and (127,197,149): a medium leafy green, not
   the deep --snow-green and not a mint.

   Ours had a red glow (rgba(226,27,42,.30)) -- the numeral's own colour,
   which reads as a blur of the digit rather than as anything behind it. The
   geometry was already right: his halo dies out about 10-25 device px from
   the stroke, which at his screenshot's 1.846 device px per CSS px is the
   ~14px reach an 18px blur has. Only the colour changes.

   One token, used by both numbers, so the two can never drift. */
:root{--team-glow:rgba(45,170,85,.42);}
.team-gcard .row1 .num{font-size:47px;color:var(--snow-wine);line-height:1.05;
  text-shadow:0 0 18px var(--team-glow);}
.team-gcard .ln{height:1px;background:rgba(122,90,58,.25);margin:14px 0;}
.team-gcard .amt{text-align:center;font-size:22px;font-weight:700;color:var(--snow-ink);}
.team-gcard .cap{text-align:center;font-size:12px;color:#7a5a3a;font-weight:500;margin-top:2px;}
.team-gcard.comm{padding:30px 22px;text-align:center;}
.team-gcard.comm .lvl{font-size:14px;font-weight:500;color:#7a5a3a;margin-bottom:4px;}
.team-gcard.comm .pct{font-size:47px;color:var(--snow-wine);line-height:1.1;
  text-shadow:0 0 18px var(--team-glow);}
.team-gcard.comm .amt2{font-size:20px;color:var(--snow-ink);margin-top:6px;}
.team-gcard.comm .mem{font-size:12px;color:#7a5a3a;font-weight:500;margin-top:2px;}
/* ── The member card, measured off his mockup ──────────────────────────
   Owner: "l need that exactly what you're seeing, all the arrangements, have
   you seen even those green winnings on cards, l need them, also figures are
   small why?"

   THE GREEN EDGE is real and ours had none. Sampled straight out from the left
   edge of his card 1: G-R reaches +12 and G-B +10 in the two pixels just
   outside it, then decays to the page's own +1 over about 8 device px. Ours
   carried `var(--sh-card)`, a warm brown drop shadow, and a warm neutral
   border -- no green anywhere. This is the same glow .team-gcard already uses
   above, rgba(74,170,108,...), so the two card families on this one screen
   finally match instead of one being warm and one green.

   Both screenshots are 720 device px wide on the same phone, so
   720/390 = 1.846 device px per CSS px, and his figures convert directly:

     card height   244 dev = 132.2 CSS   (ours was 129)
     gap           28 dev  =  15.2 CSS   (ours was 12)
     side margin   32 dev  =  17.3 CSS   (ours 18 -- unchanged) */
.team-member{background:var(--snow-surface);border:1px solid #dceadd;border-radius:var(--r-card);padding:16px;margin-bottom:15px;
  box-shadow:0 6px 24px rgba(74,170,108,.34),0 2px 8px rgba(74,170,108,.20);}
.team-member .top{display:flex;align-items:center;gap:12px;}
/* The disc holds a mark now (owner: "why the logo is empty?"), so it needs to
   centre one. Mirrors .acct-logo's rules at 44px instead of 68px: cover for an
   uploaded logo so a square upload fills the circle rather than letterboxing,
   and overflow:hidden so it is clipped to the circle either way. */
.team-member .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.team-member .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.team-member .avatar span{color:#fff;font-weight:800;letter-spacing:.04em;line-height:1;}
/* Text sizes derived from INK HEIGHTS, not guessed. Each of his blocks was
   measured, then converted with this app's own measured cap-to-font ratio for
   that same element (same font family, so the ratio transfers) -- and only
   where the two strings share a glyph class, since an ink height that includes
   an ascender or descender is not comparable to one that does not.

     element   his ink   our ink @ our size   -> his size   ours now
     .name       10.8      10 @ 15px             16.2         16
     .phone       8.1       9 @ 12px             10.8         11
     .amt3       13.0      12 @ 16px             17.3         17
     .foot        8.1       8 @ 11px             11.1         11 (unchanged)

   .joined is deliberately absent: his string and ours were different, so ink
   height could not compare them. It is set by WIDTH instead, now that both
   render the same "Joined 07/09/2026 01:21" -- his measures 123.0 CSS wide. */
.team-member .name{font-weight:600;font-size:16px;}
.team-member .phone{font-size:11px;color:var(--snow-muted);font-weight:500;}
.team-member .amt3{margin-left:auto;font-size:17px;font-weight:700;color:var(--snow-wine);}
/* 11px stays: measured by WIDTH, not ink height, now that his string and ours
   are the same. His "Joined 07/09/2026 01:21" runs 123.0 CSS wide; ours at
   11px measures 121.1, inside 2%. Ink height could not have settled this --
   the old text had descenders his has none of.

   The bottom margin is 12, not 8, and it is the whole 3px the card was short:
   his divider sits 94.8 CSS below the card top and ours sat at 91. With 12 it
   lands at 95, the footer line at 104, and the card at 132 against his 131.6. */
.team-member .joined{font-size:11px;color:var(--snow-muted);font-weight:500;margin:10px 0 12px;}
.team-member .ln2{height:1px;background:var(--snow-border);margin-bottom:8px;}
.team-member .foot{font-size:11px;color:var(--snow-muted);font-weight:500;}

/* Team.dc.html's level switcher: three separate pills, the active one filled
   with the brand gradient and its own 3D shelf -- not the soft segmented
   control inherited from Snow. */
.lv-switcher{display:flex;gap:10px;margin:16px 18px 14px;}
.lv-switcher .lv{flex:1;text-align:center;padding:11px 0;border-radius:var(--r-pill);font-weight:700;font-size:14px;border:1.5px solid var(--snow-border);color:var(--snow-muted);background:var(--snow-surface);font-family:inherit;}
.lv-switcher .lv.on{background:var(--chipz-grad);color:#fff;border-color:transparent;box-shadow:none;}

/* ── Account (Account.dc.html) ──
   A profile card (logo / ID / phone / wallet balance / Deposit+Withdraw)
   above a plain white SETTINGS list, then a black Log Out button. This
   replaces Snow's coloured card matrix entirely. */
.acct-profile{background:var(--snow-surface);border-radius:var(--r-card);padding:22px;border:1px solid var(--line-soft);box-shadow:var(--sh-card);}
.acct-profile .p-top{display:flex;align-items:center;gap:14px;}
.acct-logo{width:68px;height:68px;border-radius:50%;background:var(--chipz-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 10px 20px -12px rgba(226,27,42,.5);}
.acct-logo img{width:100%;height:100%;object-fit:cover;}
.acct-logo span{color:#fff;font-weight:800;font-size:19px;letter-spacing:.06em;}
/* When an animated logo is set it becomes the profile mark itself, and the
   circle has to give way: the source is 300x220 landscape, and cropping that
   to a 60px circle would cut roughly a quarter of its width off the sides.
   So the slot takes the source's own aspect ratio, contains rather than
   covers (nothing cropped, nothing stretched), and drops the gradient
   backing so the file's transparency shows through.
   Resolution: 66px tall renders at 132-198 device pixels on a 2x/3x phone,
   comfortably inside the source's 220px height, so it is always downscaled
   and stays crisp -- it is never blown up past its native size. */
.acct-logo.has-gif{width:auto;height:66px;aspect-ratio:300/220;border-radius:var(--r-ctl);background:none;box-shadow:none;}
.acct-logo.has-gif img{width:100%;height:100%;object-fit:contain;image-rendering:auto;}
.acct-profile .p-id{font-weight:600;font-size:20px;}
.acct-profile .p-phone{color:var(--snow-muted);font-size:16px;font-weight:500;}
.acct-divider{height:1px;background:var(--snow-border);margin:18px 0;}
.acct-profile .bal-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--snow-muted);font-weight:500;text-align:center;}
/* Owner, against a reference screenshot: "the number of account balance is
   large and UGX and colored in the colour of site, so ours should be that
   orange." So the whole figure -- the UGX too, not just the digits -- is the
   brand orange, big and bold, exactly as the reference treats its own brand
   colour. It was 34px in the app's default text weight and ink colour, which
   is what made it read as ordinary body text next to the reference.
   Size is capped by the longest figure that has to fit on a 390px phone
   without wrapping (see test-balance-style.py, which measures the real
   rendered width rather than trusting the number here). */
.acct-profile .bal-value{font-size:44px;font-weight:700;color:var(--chipz-orange);
  text-align:center;line-height:1.1;letter-spacing:-.01em;
  /* Pinned to one line on purpose: a balance broken across two lines reads
     as two numbers. fitBalanceText() steps the size down only as far as the
     measured width actually demands, so an ordinary balance keeps all 44px
     and only a very large one shrinks. */
  white-space:nowrap;
  /* fit-content so the box HUGS the digits, which is what makes the gradient
     below span the figure itself instead of the full-width card. max-width
     keeps the overflow test (scrollWidth > clientWidth) working: the box is
     capped at the card's width, so a too-long figure still reports overflow
     and gets stepped down. */
  width:fit-content;max-width:100%;margin:2px auto 18px;}
/* Owner: "but has no gradient just like you see buttons, other side is conc
   another is half conc" -- the Deposit button runs deep red on one end into
   orange on the other, and the figure was a single flat orange next to it.
   Same --chipz-grad, same 135deg, painted through the glyphs.
   Guarded by @supports because the fallback for an unsupported
   background-clip is an INVISIBLE balance -- the flat orange above stays as
   the fallback, and only browsers that can actually clip to text get the
   gradient. -webkit-text-fill-color is the one WebKit honours. */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .acct-profile .bal-value{background:var(--chipz-grad);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;}
}
/* Every number below is measured off the owner's own mockup, not chosen.
   His screenshot and ours are both 1080 device px wide on the same phone, so
   device pixels compare directly; 1080/390 = 2.769 device px per CSS px.

     icon tile      his 114 dev px -> 41 CSS   (ours was 52, 1.28x too big)
     row pitch      his 193        -> 70 CSS   (ours was 250)
     title ink      his  30        -> 15 CSS   (ours was 35 at 17.5px)
     Deposit btn    his 141 tall   -> 51 CSS   (ours was 58)
     Log Out        his 146 tall   -> 53 CSS   (ours was 54, already right)

   Owner: "see cards in account are very big plus their icons, please use
   exactly the size of mock up, even see button size of withdrawal and
   deposit." Row pitch is tile + 2x padding + the 1px rule: 41 + 28 + 1 = 70,
   which is his 69.7 to within a pixel. */
.acct-btnrow{display:flex;gap:10px;}
.acct-btnrow button{flex:1;height:51px;font-size:16px;padding:0;}
.sec-head{display:flex;align-items:center;gap:9px;margin:26px 0 12px;}
.sec-head .bar{width:4px;height:21px;border-radius:var(--r-pill);background:var(--chipz-grad);flex-shrink:0;}
.sec-head h2{font-size:22px;font-weight:400;margin:0;flex-shrink:0;}
.sec-head .ln{flex:1;height:1px;background:var(--snow-border);}
/* The Invitation Reward heading's accent bar. Same shape and gradient as
   .sec-head .bar so the two read as one device, sized to this smaller 17px
   heading rather than Account's 22px one. */
.inv-bar{width:4px;height:17px;border-radius:var(--r-pill);background:var(--chipz-grad);flex-shrink:0;display:block;}
/* Owner: "see the settings card is having green line." It is the CARD's own
   border, not the rule beside the heading -- sampled down his left edge it
   holds rgb(236,243,235) from the top of the card to the bottom, G-R = +7,
   a green-tinted hairline rather than the neutral one we had. */
.setting-list{background:var(--snow-surface);border-radius:var(--r-card);overflow:hidden;border:1px solid #dceadd;box-shadow:var(--sh-card);}
.setting-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--snow-border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--snow-ink);font-family:inherit;}
.setting-row:last-child{border-bottom:0;}
.setting-row .sq{width:41px;height:41px;border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--snow-neutral-soft);}
.setting-row .sq img{width:30px;height:30px;object-fit:contain;}
.setting-row .txt{flex:1;min-width:0;}
.setting-row .t1{font-weight:600;font-size:15px;}
.setting-row .t2{font-size:12.5px;color:var(--snow-muted);font-weight:500;}
.setting-row .chev{flex-shrink:0;color:var(--snow-muted);}
/* Each tile carries its OWN background, sampled top-left to bottom-right off
   his mockup -- they are gradients, not flat fills. Two stops were his
   theme's purple and are translated to the brand's orange per the standing
   rule (shape and placement from the mockup, colour from Chipz); owner:
   "the first of download app it is purple, so here it should be orange."
   Everything else is his measured colour unchanged, including the pale green
   behind Balance Record that he pointed at specifically.
     download  (100,31,112) -> ( 78, 23, 88)   purple  => deep orange
     wallet    (255,209,12) -> (232,195, 78)
     balance   (177,202,172)-> (224,238,225)
     messages  (254,244,208)-> (250,244,230)
     loginpw   ( 98,52, 98) -> (233,216,188)   purple  => deep orange
     tradepw   (192,161,96) -> (246,202, 15)
   Turntable has no counterpart in his mockup (that row does not exist there),
   so it takes a warm coral that sits between the gold above it and the green
   below rather than inventing a seventh hue out of sequence. */
.setting-row .sq.ic-download{background:linear-gradient(145deg,#b34700,#8a3600);}
.setting-row .sq.ic-wallet  {background:linear-gradient(145deg,#ffd10c,#e8c34e);}
.setting-row .sq.ic-turntable{background:linear-gradient(145deg,#f4a06a,#efc0a2);}
.setting-row .sq.ic-balance {background:linear-gradient(145deg,#b1caac,#e0eee1);}
.setting-row .sq.ic-messages{background:linear-gradient(145deg,#fef4d0,#faf4e6);}
.setting-row .sq.ic-loginpw {background:linear-gradient(145deg,#a8480e,#e9d8bc);}
.setting-row .sq.ic-tradepw {background:linear-gradient(145deg,#c0a160,#f6ca0f);}
/* Language has no counterpart in the owner's mockup (that row does not exist
   there), so like Turntable it takes a tone that sits inside the sequence
   already measured off it rather than introducing a hue of its own -- a
   deeper burnt orange, one step darker than Download APP's so the two do not
   read as the same tile. Its glyph is stroked white, hence the light end
   stays dark enough to keep it legible. */
.setting-row .sq.ic-language{background:linear-gradient(145deg,#8f4a12,#c4763a);
  display:flex;align-items:center;justify-content:center;}
.logout-btn{display:flex;width:100%;height:53px;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-size:16px;letter-spacing:.08em;padding:0;}
/* The owner's own door artwork, at the size his mockup draws it: his
   glyph measures 31x47 device px, which is 17 CSS px tall. Width is left
   auto so the door keeps its own proportions instead of being squashed
   into a square. */
.logout-btn img{height:17px;width:auto;display:block;flex-shrink:0;}

/* ── Wallet (Wallet.dc.html) ──
   ONE bound payout account shown as a bank-card tile, an Edit Wallet
   toggle that reveals the provider/account/holder form, and a compact
   "Your Wallet" summary row underneath. */
.wallet-card{position:relative;border-radius:var(--r-card);padding:22px 22px 20px;color:#fff;overflow:hidden;margin-bottom:18px;box-shadow:0 18px 34px -18px rgba(30,10,5,.55);background:linear-gradient(120deg,#1a1a1d 0%,#7a0e14 42%,#e30613 62%,#f5a000 100%);}
/* Owner: "on wallet that wallet card having number, it has a glow sweep
   animation too."

   .sheen was a STATIC diagonal highlight painted across the whole card -- the
   look of a sweep frozen mid-pass, which is why it reads as almost-right. It
   travels now, and it deliberately reuses this app's own sweep convention
   rather than inventing a second one: the same right-to-left direction the
   owner asked for on the buttons ("let it move from right to left"), the same
   band-narrower-than-its-box shape, and the same run-then-rest cycle so it
   reads as a repeating pass rather than a strobe. Slower than the buttons'
   2.8s because this is a big card at rest, not a control asking to be tapped.

   The band is WIDER than the buttons' 38% and the card is wider still, so it
   keeps the broad soft gradient the static version had instead of turning
   into a hard stripe. overflow:hidden is already on .wallet-card. */
.wallet-card .sheen{position:absolute;top:-20%;bottom:-20%;left:0;width:55%;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.26) 50%,transparent 100%);
  transform:translateX(210%) skewX(-20deg);
  animation:wcSheenSweep 5.2s ease-in-out infinite;}
@keyframes wcSheenSweep{
  0%{transform:translateX(210%) skewX(-20deg);}
  55%,100%{transform:translateX(-120%) skewX(-20deg);}}
@media (prefers-reduced-motion:reduce){
  /* Back to the static highlight rather than nothing: the card is glossy by
     design, and a flat gradient-only card looks unfinished. */
  .wallet-card .sheen{animation:none;top:0;bottom:0;width:100%;
    transform:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);}}
.wallet-card .row1{position:relative;display:flex;align-items:flex-start;justify-content:space-between;}
/* The card number measured bigger than the mockup's (32 against 24 device
   px of ink), so what reads as "small" here is TRACKING, not size: his
   digits are widely spaced and ours were nearly touching. Widened rather
   than enlarged. The provider label is genuinely bigger in his. */
.wallet-card .provider{font-size:24px;font-weight:600;letter-spacing:.02em;}
/* The same two-cards artwork used by the Wallet row on Account -- the owner's
   own icon, not a drawn approximation of it, so the two places agree. */
.wallet-card .wc-mark{width:38px;height:38px;object-fit:contain;display:block;flex-shrink:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));}
.wallet-card .chip{position:relative;width:42px;height:32px;margin:20px 0 22px;border-radius:5px;background:linear-gradient(135deg,#f6dc95,#c9973a);box-shadow:inset 0 0 0 1px rgba(120,80,10,.35);}
/* The contact pads. Two hairline grids drawn with gradients rather than an
   image, so the chip reads as a chip at any size. */
.wallet-card .chip::before{content:'';position:absolute;inset:5px 3px;
  background:linear-gradient(to right,transparent 0 32%,rgba(120,80,10,.5) 32% 34%,transparent 34% 66%,rgba(120,80,10,.5) 66% 68%,transparent 68%),
             linear-gradient(to bottom,transparent 0 45%,rgba(120,80,10,.5) 45% 55%,transparent 55%);}
.wallet-card .chip::after{content:'';position:absolute;left:34%;right:34%;top:5px;bottom:5px;border:1px solid rgba(120,80,10,.5);border-radius:2px;}
.wallet-card .num{position:relative;font-size:24px;letter-spacing:.16em;margin-bottom:16px;}
.wallet-card .holder-lbl{position:relative;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:500;}
.wallet-card .holder-name{position:relative;font-size:15px;font-weight:500;margin-top:3px;}
.wallet-panel{background:var(--snow-surface);border:1.5px solid var(--snow-border);border-radius:var(--r-card);padding:20px;margin-bottom:20px;}
.wallet-panel .lbl{font-size:13px;color:var(--snow-muted);font-weight:500;margin:0 0 6px;}
.wallet-panel .field{background:var(--snow-surface);border:1.6px solid var(--snow-border);border-radius:var(--r-ctl);height:50px;display:flex;align-items:center;padding:0 15px;margin-bottom:16px;gap:8px;}
.wallet-panel .field input,.wallet-panel .field select{border:0;outline:0;background:transparent;font-size:15px;color:var(--snow-ink);flex:1;min-width:0;font-family:inherit;}
/* Wallet provider picker -- a field that drops a plain list under it, as the
   mockup shows, instead of handing off to Android's own system picker. */
.prov-pick{position:relative;}
.prov-pick .prov-input{cursor:pointer;}
.prov-pick .prov-input input{cursor:pointer;}
.prov-caret{color:var(--snow-muted);flex-shrink:0;transition:transform .15s;}
.prov-pick.open .prov-caret{transform:rotate(180deg);}
.prov-list{display:none;position:absolute;left:0;right:0;top:52px;z-index:5;background:var(--snow-surface);border:1.6px solid var(--snow-border);border-radius:var(--r-ctl);overflow:hidden;box-shadow:0 14px 28px -14px rgba(30,10,5,.35);}
.prov-pick.open .prov-list{display:block;}
.prov-opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--snow-border);padding:14px 15px;font-family:inherit;font-size:15px;color:var(--snow-ink);cursor:pointer;}
.prov-opt:last-child{border-bottom:0;}
.prov-opt:active{background:var(--snow-neutral-soft);}
.prov-opt.on{color:var(--snow-wine);font-weight:600;}
.wallet-panel .btnrow{display:flex;gap:12px;}
.wallet-panel .btnrow button{flex:1;height:48px;font-size:14px;padding:0;}
.wallet-panel .btnrow .cancel{border:0;border-radius:var(--r-ctl);background:#f3e2ee;color:#6b2f56;font-weight:600;font-family:inherit;box-shadow:none;}
.plain-h2{font-size:17px;font-weight:700;margin:0 0 12px;}
.wallet-summary{display:flex;align-items:center;justify-content:space-between;background:var(--snow-surface);border:1.5px solid var(--snow-border);border-radius:var(--r-card);padding:16px 18px;gap:10px;}
.wallet-summary .prov{font-weight:600;font-size:14px;flex-shrink:0;}
.wallet-summary .masked{font-size:14px;color:var(--snow-muted);}
.wallet-summary .holder{font-size:13px;font-weight:500;text-align:right;line-height:1.3;}

/* ── Deposit (Deposit.dc.html) ──
   Chipz's own deposit screen, replacing the Recharge form inherited from
   Snow: red-bar section headers, a 3-column grid of quick-amount chips with
   the picked one filled, the amount field UNDER the chips, an explicit
   payment-method row, a dark-prefixed phone field, and the numbered
   instruction card. */
.dep-sec{display:flex;align-items:center;gap:9px;margin:0 0 12px;}
.dep-sec .bar{width:4px;height:19px;border-radius:var(--r-pill);background:var(--chipz-grad);flex-shrink:0;}
.dep-sec span{font-size:17px;font-weight:600;letter-spacing:.02em;}
.dep-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px;}
/* Owner: "every amount card on deposit has some green, see clearly and
   critically". Measured off his screenshot rather than picked: walking out
   of a chip's edge gives a 1px border at rgb(203,214,206) -- a light
   green-grey, not the warm --snow-border we had -- and outside it a green
   shadow peaking around rgb(227,243,232) against a rgb(247,246,241) page,
   fading over ~10 device px (about 5 CSS px at this screenshot's scale).
   The shadow DARKENS red and blue while leaving green almost untouched,
   which is what makes it read as green rather than as grey. */
.dep-chip{text-align:center;padding:17px 4px;border-radius:var(--r-ctl);font-weight:700;font-size:17px;border:1.6px solid #cbd9cf;background:var(--snow-surface);color:var(--snow-ink);font-family:inherit;
  box-shadow:0 3px 0 #dfeade,0 4px 12px rgba(120,190,145,.42);}
.dep-chip.sel{background:var(--chipz-grad);color:#fff;border-color:transparent;box-shadow:none;}
/* Kept in step with .wit-amt on purpose -- same control, sibling screen. */
.dep-amt{background:var(--snow-surface);border:1.6px solid var(--snow-border);border-radius:var(--r-ctl);height:62px;display:flex;align-items:center;padding:0 18px;margin-bottom:24px;}
.dep-amt input{border:0;outline:0;background:transparent;font-size:23px;color:var(--snow-ink);flex:1;min-width:0;font-family:inherit;}
.pay-row{position:relative;display:flex;align-items:center;justify-content:center;background:var(--snow-surface);border:2px solid var(--snow-border);border-radius:var(--r-ctl);height:56px;padding:0 18px;margin-bottom:14px;width:100%;font-family:inherit;color:var(--snow-ink);}
.pay-row.on{border-color:var(--snow-ink);}
.pay-row span{font-weight:600;font-size:15px;letter-spacing:.03em;}
.pay-row .pay-radio{position:absolute;right:18px;top:50%;transform:translateY(-50%);}
.pay-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--snow-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 0 rgba(26,19,16,.25);}
.pay-row.on .pay-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--snow-ink);}
/* height matters here. Every other field on this screen (.dep-amt, .wit-amt,
   .wit-pw, .pw-field) sets one; this row alone did not, so it collapsed to
   its text and rendered 19px tall -- a third the height of the box above it,
   and a genuinely hard tap target on a phone. Owner: "the number text area is
   very small". 56px, slightly above the others, because it is the one field
   on this screen that must be typed into. */
.dep-phone{display:flex;align-items:stretch;height:56px;border-radius:var(--r-ctl);overflow:hidden;border:1.6px solid var(--snow-border);margin-bottom:8px;background:var(--snow-surface);}
.dep-phone .prefix{background:var(--snow-ink);color:#fff;font-weight:700;display:flex;align-items:center;padding:0 14px;font-size:15px;flex-shrink:0;}
.dep-phone input{border:0;outline:0;background:transparent;flex:1;padding:0 12px;font-family:inherit;font-size:15px;color:var(--snow-ink);min-width:0;}
.dep-hint{font-size:12px;color:var(--snow-muted);font-weight:500;margin:0 0 8px;}
.dep-instr{background:var(--snow-surface);border:1.5px solid var(--snow-border);border-radius:var(--r-card);padding:18px;}
.dep-instr .ih{display:flex;align-items:center;margin-bottom:10px;}
.dep-instr .ih span{font-weight:700;font-size:17px;}
.dep-instr .ln{height:1px;background:var(--snow-border);margin-bottom:10px;}
.dep-instr ol{margin:0;padding-left:18px;color:var(--snow-muted);font-size:13px;font-weight:500;line-height:1.9;}

/* ── Withdraw (Withdraw.dc.html) ── */
.wit-bal{background:linear-gradient(120deg,#eaf7ee 0%,#fdf0da 55%,#fbe6ea 100%);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:18px 20px;margin-bottom:20px;box-shadow:var(--sh-card);}
/* Owner: "you see the difference on withdrawal screen with my mockups,
   things are small even see number, it is small in size, and words."
   Measured rather than guessed: his mockup and a screenshot of the live
   screen are both 720px wide, so glyph heights compare directly. Three
   things came back genuinely undersized, all by the same ~1.45x --
   the balance figure (38 -> 55 device px of ink), the amount you type
   (19 -> 28) and the trade-password field (14 -> 21). Everything else on
   the screen already matched or beat the mockup: the section headings are
   23 against his 24, and the instruction list is 18-23 against his 16.
   Those are left alone deliberately -- scaling them too would overshoot
   the thing he actually pointed at. */
.wit-bal .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--snow-muted);font-weight:500;}
.wit-bal .val{font-size:40px;color:var(--snow-ink);margin-top:6px;}
/* The field grows with its text. Leaving the 52px height while the type
   goes 16 -> 23px puts the digits hard against the border. */
.wit-amt{background:var(--snow-surface);border:1.6px solid var(--snow-border);border-radius:var(--r-ctl);height:62px;display:flex;align-items:center;padding:0 18px;margin-bottom:22px;gap:10px;}
.wit-amt span{color:var(--snow-muted);font-weight:700;font-size:21px;}
.wit-amt input{border:0;outline:0;background:transparent;font-size:23px;color:var(--snow-ink);flex:1;min-width:0;font-family:inherit;}
.btn-bind{display:block;width:100%;height:52px;border:0;border-radius:var(--r-ctl);background:#f3e2ee;color:#6b2f56;font-weight:700;font-size:15px;margin-bottom:22px;font-family:inherit;}
.wit-pw{background:var(--snow-surface);border:1.6px solid var(--snow-border);border-radius:var(--r-ctl);height:62px;display:flex;align-items:center;padding:0 18px;margin-bottom:12px;}
.wit-pw input{border:0;outline:0;background:transparent;font-size:22px;color:var(--snow-ink);flex:1;min-width:0;font-family:inherit;}
.wit-fee{font-size:13px;color:var(--snow-muted);font-weight:500;margin:0 0 8px;}
.wit-instr{background:var(--snow-surface);border:1.5px solid var(--snow-border);border-radius:var(--r-card);padding:18px;}
.wit-instr h3{font-size:17px;font-weight:700;margin:0 0 10px;}
.wit-instr .ln{height:1px;background:var(--snow-border);margin-bottom:10px;}
.wit-instr ol{margin:0;padding-left:18px;color:var(--snow-muted);font-size:13px;font-weight:500;line-height:1.9;}

/* ── Turntable (spin wheel) ──
   A Chipz-only feature, so there is no mockup to match -- built in the same
   language as the rest: brand gradient, Playfair numbers, 3D button. The
   wheel is 8 alternating segments drawn with conic-gradient so it needs no
   image asset, and the pointer sits above it. */
.tt-stage{display:flex;flex-direction:column;align-items:center;padding:28px 0 0;}
.tt-wheel-wrap{position:relative;width:270px;height:270px;display:flex;align-items:center;justify-content:center;}
.tt-wheel{width:250px;height:250px;border-radius:50%;position:relative;
  background:conic-gradient(var(--snow-wine) 0deg 45deg,var(--chipz-orange) 45deg 90deg,var(--snow-wine) 90deg 135deg,var(--chipz-orange) 135deg 180deg,var(--snow-wine) 180deg 225deg,var(--chipz-orange) 225deg 270deg,var(--snow-wine) 270deg 315deg,var(--chipz-orange) 315deg 360deg);
  box-shadow:0 0 0 8px #1a1310,0 18px 34px -14px rgba(30,10,5,.6);
  transition:transform 4s cubic-bezier(.17,.67,.16,1);}
/* Owner: "why the spin wheel has no amounts?" -- the eight prize figures, one
   per wedge, sent by the server so the wheel and the wallet cannot disagree.
   Placed by left/top from JS at each wedge's own centre and left UPRIGHT
   rather than rotated to follow the wedge: eight rotated numbers on a 250px
   wheel are a puzzle to read, and this is money. The currency is stated once
   under the wheel instead of eight times on it, and the figures are never
   shortened. pointer-events:none so a label can never swallow a tap. */
.tt-slice{position:absolute;transform:translate(-50%,-50%);font-size:12.5px;font-weight:800;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);white-space:nowrap;pointer-events:none;}
.tt-cur{margin:2px 0 0;font-size:12.5px;color:var(--snow-sub,#8c7f76);letter-spacing:.02em;}
.tt-wheel .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:var(--snow-surface);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--snow-wine);box-shadow:0 4px 12px -4px rgba(0,0,0,.4);}
.tt-pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--chipz-gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));z-index:2;}
.tt-spins{font-size:22px;margin:22px 0 2px;}
.tt-sub{color:var(--snow-muted);font-size:13px;font-weight:500;text-align:center;margin:0 0 22px;line-height:1.6;}
.tt-rules{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:18px;margin-top:24px;box-shadow:var(--sh-card);}
.tt-rules h3{font-size:16px;font-weight:700;margin:0 0 10px;}
.tt-rules li{font-size:13px;color:var(--snow-muted);font-weight:500;line-height:1.7;margin-left:16px;}

/* ── Notify dialog (Notify.dc.html) ── */
/* A dark, small, bottom-sliding toast -- owner: "don't send the same notify
   design as old Chipz code... make these dark small, not designed, and
   open/appear from down." No dimmed backdrop and no OK button: the toast
   itself is the only tappable thing (dismiss early by tapping it), it also
   auto-dismisses on its own (see notify()'s timer), and it never blocks
   taps on the rest of the screen -- .notify-bg spans the width but takes no
   pointer events itself, only .notify-card does. */
.notify-bg{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px);display:flex;justify-content:center;padding:0 20px;z-index:400;pointer-events:none;}
.notify-card{pointer-events:auto;max-width:420px;background:rgba(37,38,43,.96);color:#fff;padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:1.4;text-align:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transform:translateY(140%);opacity:0;transition:transform .28s cubic-bezier(.34,1.35,.64,1),opacity .22s;}
.notify-bg.show .notify-card{transform:translateY(0);opacity:1;}
.notify-msg{white-space:pre-line;}

/* ── Treasure chest (Chest.dc.html / ChestSuccess.dc.html) ── */
/* The mockup frames the whole block with a hairline above the chest and
   another below the button -- a light rule that fades out at both ends, not
   a hard border edge to edge. */
.chest-stage{display:flex;flex-direction:column;align-items:center;padding:30px 0 0;}
.chest-rule{width:64%;height:1px;flex-shrink:0;background:linear-gradient(to right,transparent,var(--snow-border) 22%,var(--snow-border) 78%,transparent);}
.chest-rule.top{margin-bottom:22px;}
.chest-rule.bottom{margin-top:24px;}
/* Owner: "on treasure chest there are 2 linings circulating the chest box, you
   can even see clearly that one inside is solid and one outside is dotted ...
   also some greener background on that chest box."
   We had ONE dotted ring and an orange wash. All three values below were
   sampled off his screenshot rather than eyeballed -- scanning the vertical
   centre line through the circle finds the outer dotted ring at rgb(166,206,180)
   (a muted mint), the inner solid one 27 image-px inside it at rgb(234,227,209)
   (a warm tan), and the field between them tinted rgb(198,227,199) against
   rgb(250,248,240) paper, which is the green wash. At his 1080px capture on a
   ~393pt screen that is a 191px outer circle, a 172px inner one, and roughly
   10px between them. */
.glow-ring{width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,196,140,.34) 0%,rgba(76,196,140,.13) 45%,rgba(76,196,140,0) 70%);
  display:flex;align-items:center;justify-content:center;position:relative;}
/* OUTER: dotted, mint. Fine dots, not the 1.5px dashes an earlier round had --
   those read as a drawn border rather than the faint guide circle it should be. */
.glow-ring::before{content:'';position:absolute;inset:16px;border-radius:50%;border:1px dotted rgba(126,178,148,.75);}
/* INNER: solid, warm tan, ~10px further in. */
.glow-ring::after{content:'';position:absolute;inset:26px;border-radius:50%;border:1px solid rgba(208,180,132,.72);}
.glow-ring img{width:140px;filter:drop-shadow(0 18px 20px rgba(30,10,5,.35));animation:chestBounce 1.8s ease-in-out infinite;}
.chest-stage h2{font-size:26px;font-weight:700;text-align:center;margin:26px 0 6px;}
.chest-stage .sub{color:var(--snow-muted);font-size:14px;font-style:italic;font-weight:500;text-align:center;margin:0 0 26px;}
/* Owner: "l want you to see the chest box password input card, it has green on
   it, don't you see the mockup image."
   It does -- sampling down the field's left edge in his screenshot gives
   rgb(184,213,195) on the border rows against a rgb(254,253,251) fill. Undoing
   the JPEG's blend against the paper puts the real border near rgb(156,197,174).
   It is the same sage the rings and the wash use, which is why the whole block
   reads as one thing there and read as a plain grey box here. Only this field
   is greened: it is the one that belongs to the chest. */
.key-field{width:100%;height:54px;border:1.6px solid rgba(150,196,172,.9);border-radius:var(--r-ctl);background:var(--snow-surface);display:flex;align-items:center;padding:0 18px;margin-bottom:16px;}
.key-field input{border:0;outline:0;background:transparent;font-size:16px;text-align:center;color:var(--snow-ink);flex:1;min-width:0;font-family:inherit;}
.chest-win-bg{position:fixed;inset:0;background:#2ecc71;display:none;align-items:center;justify-content:center;padding:28px;z-index:320;}
.chest-win-bg.show{display:flex;animation:winFlash .5s ease-out;}
@keyframes winFlash{0%{background:#fff;}60%{background:#8ef0b4;}100%{background:#2ecc71;}}
.chest-win-ghost{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:120px;filter:blur(6px) brightness(1.3);opacity:.55;}
/* Owner: "when one spins it shows that spin icon background icon l generated
   my own instead of chest box, so it will show that inside background blur."
   The wheel is his own artwork and is taller than it is wide (it stands on a
   base), so it gets its own size and sits a little higher -- at the chest's
   120px it read as a small smudge rather than the thing he drew. */
/* Its own opacity and filter, not the chest's. The chest is warm brown, so
   lifting its brightness on the green flash just made it glow; the wheel is
   red and white, and the same treatment turned the red to mud and let the
   green through the white segments until it read as mint. Truer colour, a
   softer blur, and enough opacity to keep it his artwork rather than a stain
   on the background. */
.chest-win-ghost.spin{top:92px;width:172px;filter:blur(5px);opacity:.9;}
.chest-win-card{position:relative;width:100%;max-width:340px;background:linear-gradient(160deg,#fff,#fbe9ee);border-radius:var(--r-card);border:2px solid #bfe3ff;box-shadow:0 24px 50px -20px rgba(0,0,0,.35);padding:36px 26px 30px;text-align:center;}
.chest-win-card h1{font-size:26px;font-weight:700;margin:0 0 10px;background:var(--chipz-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.chest-win-card .sub{font-size:15px;font-style:italic;color:var(--snow-muted);font-weight:500;margin:0 0 14px;}
.chest-win-card .amt{font-size:38px;font-weight:700;margin:0 0 18px;background:var(--chipz-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.chest-win-card .bal{font-size:13px;color:var(--snow-muted);font-weight:500;margin:0 0 24px;}

/* ── Balance Record (BalanceRecord.dc.html) ── */
/* Bleeds to the sheet's own edges: .sheet-body is padded 4px 20px 40px. */
.bal-band{background:var(--chipz-hero);padding:26px 18px;text-align:center;margin:-4px -20px 0;}
.bal-band .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.7);font-weight:600;}
.bal-band .val{font-size:40px;color:#fff;margin-top:6px;}
.rec-tabs{display:flex;margin:16px 0;border-bottom:1.5px solid var(--snow-border);}
.rec-tabs .tb{flex:1;text-align:center;padding:0 0 12px;font-size:16px;font-weight:700;color:var(--snow-muted);position:relative;background:none;border:none;font-family:inherit;}
.rec-tabs .tb.on{color:var(--snow-ink);}
.rec-tabs .tb.on::after{content:'';position:absolute;left:20%;right:20%;bottom:-1.5px;height:2.5px;background:var(--snow-wine);border-radius:var(--r-pill);}
.rec{display:flex;align-items:center;gap:11px;background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:16px 14px;margin-bottom:12px;box-shadow:var(--sh-card);}
/* The D / W / T discs. Owner: "see icons of D,W, very clean, defined and
   high quality." They were a flat wash of one colour with the letter in a
   darker tone of the same -- at 44px that reads as a smudge with something
   in it. Three things give a small disc definition: a gradient so it has a
   lit side, a 1px inner highlight along the top edge so it looks raised
   rather than printed, and a shadow tinted with its OWN colour instead of
   grey, which is what makes it sit on the card rather than next to it.
   Green for money coming in, rose for money going out -- the app's own
   colours, not the mockup's purple. */
.rec .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;letter-spacing:.01em;}
.rec .av.g{background:linear-gradient(145deg,#eafaee 0%,#b8e6c6 100%);color:#116434;
  box-shadow:0 6px 14px -6px rgba(20,96,48,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.rec .av.w{background:linear-gradient(145deg,#ffe7e1 0%,#f0b3b0 100%);color:#7a1030;
  box-shadow:0 6px 14px -6px rgba(122,16,48,.42),inset 0 1px 0 rgba(255,255,255,.9);}
.rec .txt{flex:1;min-width:0;}
.rec .t1{font-weight:600;font-size:16.5px;line-height:1.25;}
.rec .t2{font-size:12.5px;color:var(--snow-muted);font-weight:500;margin-top:3px;white-space:nowrap;}
.rec .t3{font-size:13px;font-weight:500;margin-top:5px;color:var(--snow-muted);}
.rec .right{text-align:right;flex-shrink:0;}
.rec .amt{font-size:16.5px;font-weight:700;white-space:nowrap;}
.rec .amt.pos{color:var(--snow-green);}
.rec .amt.neg{color:var(--chipz-neg);}
/* Status pills. Owner: "see the colours of paid, deposit pending." They were
   pale tints with same-hue text -- a green pill on a white card at 12.5px was
   readable but not LEGIBLE, and Failed and Paid were the same weight of
   nothing. Solid fill, white text: a status is the one thing on the row worth
   spotting from arm's length. Each keeps a shadow in its own hue so it reads
   as a chip laid on the card. */
.rec-pill{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.03em;padding:5px 14px;border-radius:var(--r-pill);color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.18);}
.rec-pill.pend{background:linear-gradient(135deg,#fb8c00,#dd6b00);box-shadow:0 5px 12px -6px rgba(221,107,0,.75);}
/* The orange is deliberately a stop deeper than the mockup's. White text on
   a bright #ffa726 measures 2.35:1, which is a label you squint at outdoors;
   this reads 2.8:1 and still lands as orange next to the green and the red. */
.rec-pill.paid{background:linear-gradient(135deg,#35c46c,#12894a);box-shadow:0 5px 12px -6px rgba(18,137,74,.7);}
.rec-pill.fail{background:linear-gradient(135deg,#ef5f52,#c0182a);box-shadow:0 5px 12px -6px rgba(192,24,42,.7);}

/* ── Messages (MessagesList.dc.html / Messages.dc.html) ── */
/* Owner: "they have design ... the mock up has a very clean css, high
   quality and definition." His unread row is not a flat white rectangle: it
   is a soft gradient card carrying a TINTED glow in the accent hue, so an
   unread message looks lit rather than merely outlined. Ours had the accent
   only as a 3px bar on the left edge, which is a marker, not a design.
   The glow is the brand's warm one for the same reason the backdrop is --
   his green belongs to his theme. */
.msg-row{display:flex;align-items:flex-start;gap:14px;background:linear-gradient(135deg,#ffffff 0%,#fff6ef 100%);border:1px solid var(--line-soft);border-left:3px solid var(--snow-wine);border-radius:var(--r-card);padding:16px;margin-bottom:12px;width:100%;text-align:left;font-family:inherit;color:var(--snow-ink);box-shadow:0 1px 2px rgba(30,10,5,.05),0 12px 26px -14px rgba(226,27,42,.42);}
/* A read message loses the lift as well as the bar -- it is done with, and
   should sit back rather than keep competing with the unread ones. */
.msg-row.read{background:var(--snow-surface);border-left-color:var(--snow-border);box-shadow:var(--sh-card);}
/* Same raised disc as the Balance Record avatars -- one avatar treatment
   across the app, not two that nearly match. */
.msg-row .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(145deg,#eafaee 0%,#b8e6c6 100%);color:#116434;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  box-shadow:0 6px 14px -6px rgba(20,96,48,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.msg-row .txt{flex:1;min-width:0;}
.msg-row .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.msg-row .t1{font-weight:600;font-size:15px;line-height:1.35;}
.msg-row .date{font-size:11px;color:var(--snow-muted);font-weight:500;text-align:right;flex-shrink:0;white-space:nowrap;}
.msg-row .t2{font-size:12px;color:var(--snow-muted);font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Owner, holding his mockup's before/after beside ours: "you can see blurry
   green, and message doesn't slide from down."
   Both halves measured off the two screenshots at matched width.

   THE BACKDROP. His reads rgb(163,218,186) -- luminance 189, a LIGHT tinted
   wash with the list visibly blurred behind it. Ours read rgb(134,125,118),
   luminance 126: a flat grey-brown dim, no blur, no hue. The difference is
   not "a bit darker", it is the opposite operation -- his lifts and tints the
   page, ours drops a dirty sheet over it.
   The tint here is the BRAND's warm one, not his green. His mockups are drawn
   in a purple/green theme; a green wash is the right answer in that app and
   would be the only green surface in this one. The effect is his, the hue is
   Chipz's -- say the word and it goes green.
   backdrop-filter is what does the blurring; the rgba on top does the tint.
   Both are needed: the blur alone leaves the colour of whatever is behind it,
   and the tint alone is what we already had.

   ROUND 2, owner: "the mockup shows good blur very well but see yours, not
   even blur ... see the message when tapped, it leaves a nav icons but see
   yours how you did it."
   Two separate faults, both measured off his latest screenshot.
   (1) The blur WAS applying -- the tint was hiding it. At .42 the wash was
       opaque enough that the blurred page underneath stopped being legible as
       content, which is what "not even blur" describes: you cannot see a blur
       you cannot see through. His backdrop keeps the list's shapes plainly
       visible behind the glass. Tint down to .26, blur up to 20px, so there is
       something recognisable behind it.
   (2) His overlay STOPS ABOVE THE BOTTOM BAR -- sampling his left gutter, the
       tint runs to y=1841 of 2085 and the nav below it is untinted and sharp.
       Ours covered the whole screen. `bottom:var(--nav-h)` is the same rule
       .sheet-bg already uses, so this is the app's own convention rather than
       a number invented here.

   ROUND 3, and (1) above had overshot: 20px is not "minimal". Owner: "see the
   blur in my mockup it is minimal such that you can even see some texts in
   background." Measured over the strip above the card in both screenshots:

                    luminance   stdev   edge p99
        his            190.9     10.9        8
        ours (20px)    216.2      1.4        3

   stdev and edge energy are what matter -- they say how much STRUCTURE
   survives, i.e. whether there is anything left to read. Ours was FLAT: the
   content was not blurred, it was erased. Luminance cannot see that, and
   chasing luminance is exactly how round 2 landed on a backdrop that hit the
   right brightness with nothing legible behind it.

   blur/tint were then swept over the REAL popup on the REAL list
   (tune-msg-blur.py, 28 combinations) and read back the same three ways.
   5px/.22 reproduces his stdev exactly (10.9). The luminance still reads
   higher than his and that is correct to ignore: his list sits on a green
   page and ours on a white sheet, so brightness here is a property of his
   CONTENT, not of his blur. */
.msg-detail-bg{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);
  background:rgba(238,112,34,.22);
  -webkit-backdrop-filter:blur(5px) saturate(1.15);backdrop-filter:blur(5px) saturate(1.15);
  display:none;align-items:flex-end;z-index:305;}
/* No backdrop-filter (older Android WebViews): a light tint alone would leave
   the page behind fully legible and the card floating on nothing, so lean on
   opacity instead. Deliberate, not accidental. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .msg-detail-bg{background:rgba(238,112,34,.62);}
}
.msg-detail-bg.show{display:flex;}
/* A FLOATING card, not a sheet welded to the screen edge -- that is what
   "poorly designed it" is pointing at. Measured off his screenshot: the card
   spans x=45..1035 of 1080, so a 4.2% side inset (16px at 390), its bottom
   edge sits 39px above the overlay's own bottom (another ~16px), and every
   corner is rounded. Its height is 898 of 2085 = 43% of the screen; the old
   58vh minimum made a short message noticeably taller than his.
   It still rises from below -- the owner asked for that in an earlier round
   and this does not undo it; it now travels to a resting place 16px up rather
   than to the screen edge. */
.msg-detail{width:calc(100% - 32px);max-width:448px;margin:0 auto 16px;background:var(--snow-surface);border-radius:26px;padding:26px 22px 30px;position:relative;box-shadow:0 18px 44px -14px rgba(20,10,5,.42);animation:sheetUp .42s cubic-bezier(.22,1,.36,1);min-height:43vh;max-height:calc(100% - 32px);overflow-y:auto;}
/* It really slides now. It was translateY(24px) over .22s -- a nudge you have
   to be looking for, which is exactly "message doesn't slide from down". From
   100% of its own height means it starts fully below the fold and travels the
   whole way up. */
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.msg-detail .xbtn{position:absolute;top:18px;right:18px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;color:var(--snow-ink);}
.msg-detail .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;padding-right:30px;}

/* ── Auth (Login / Sign Up) ──────────────────────────────────────────
   Matches the approved Main.dc.html / Register.dc.html mockups: a hero
   band (admin-uploadable background image) with the CHIPZ wordmark, then a
   white card that overlaps its lower edge carrying the LOGIN / SIGN UP
   title, a small dash-dot-dash divider, and the fields. Field icons here
   are deliberately real emoji glyphs (owner: "even see those emoji or
   symbols of padlock, key... l need that same key") -- the only place in
   this app that uses emoji instead of SVG. */
.auth-hero{position:relative;overflow:hidden;height:280px;background:var(--chipz-grad);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
/* ── Admin-set backdrops for the Login / Sign Up screen ──
   Owner: "make when l can put background image on those screens of login tab
   and registration tab ... 2 different images so one image will appear on
   login and registration tabs, and 1 will appear on space where orange color
   is shared". Two slots: the orange hero band, and the white form card.

   Each is a CHILD element rather than a background-image on the section
   itself, and that is what makes the opacity control useful: the child paints
   OVER the brand gradient (or the white card), so opacity blends the photo
   towards the brand colour instead of towards nothing. A background-image
   with opacity would need the whole element faded, taking the wordmark and
   the form fields with it.

   The negative inset is not decoration. filter:blur() feathers an element's
   own edges, so a backdrop that exactly filled its box would show a soft
   transparent rim all the way round once blurred. Pulling it out by twice the
   blur radius puts that rim outside the clip, which is why both sections need
   overflow:hidden. */
.auth-bg{position:absolute;inset:calc(-2 * var(--auth-bg-blur, 0px));
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:var(--auth-bg-op, 1);filter:blur(var(--auth-bg-blur, 0px));
  pointer-events:none;z-index:0;}
#authHeroBg{--auth-bg-blur:var(--auth-hero-blur, 0px);--auth-bg-op:var(--auth-hero-op, 1);
  background-image:var(--auth-hero-img, none);}
/* ── The banner bleeds into the card instead of stopping dead ──
   Owner: "on login and register pages there should be like whites or color
   bleeding into the image of banner uploaded from admin panel, just like you
   see the first image."

   His reference is a photo whose lower half ramps smoothly into the page's
   own flat colour, so there is no banner EDGE anywhere -- measured down that
   image, the pixels stop varying entirely about 80 device px before the
   bottom and the last ~160 px are one continuous ramp. Ours ended on a hard
   horizontal cut that the card's rounded top corners left visible on both
   sides.

   A scrim to the card's colour, NOT a mask on the image: masking the image
   out would just reveal the orange gradient underneath it, which is not
   "white bleeding in". 55% of the hero, with a mid stop, so the ramp is long
   and slow at the top and solid well before the bottom rather than a short
   hard fade near the edge.

   z-index 1 puts it over the photo (z-index 0) and under the wordmark and
   the tagline (z-index 2), so the brand stays crisp on top of the fade.

   Only when a banner is actually set: with no image the hero is the plain
   brand gradient, and washing THAT out at the bottom would quietly restyle a
   screen he has already approved. .has-bg is toggled in applyAuthBackgrounds(). */
.auth-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:55%;
  pointer-events:none;z-index:1;opacity:0;transition:opacity .2s ease;
  background:linear-gradient(to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.55) 55%,
    var(--snow-surface) 88%,
    var(--snow-surface) 100%);}
.auth-hero.has-bg::after{opacity:1;}
#authCardBg{--auth-bg-blur:var(--auth-card-blur, 0px);--auth-bg-op:var(--auth-card-op, 1);
  background-image:var(--auth-card-img, none);border-radius:inherit;}
/* Angular triangle motifs, straight off Main.dc.html -- Chipz's brand
   language is angular, NOT the soft wave this screen inherited from Snow
   (owner: "l no longer need to see this wavy curvy design"). */
.auth-tri{position:absolute;}
.auth-tri.t1{width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:150px solid rgba(0,0,0,.16);top:-60px;left:-40px;transform:rotate(18deg);}
.auth-tri.t2{width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid rgba(255,255,255,.14);bottom:-50px;right:-30px;transform:rotate(-12deg);}
.mark-row{display:flex;align-items:center;gap:8px;position:relative;z-index:2;}
.mark-tri{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid #14100d;flex-shrink:0;}
.auth-wordmark{position:relative;font-size:36px;letter-spacing:.02em;transform:skewX(-7deg);color:#fff;}
.auth-wordmark b{color:#14100d;font-weight:400;}
.auth-card{background:var(--snow-surface);margin-top:-28px;border-radius:var(--r-card);position:relative;z-index:3;padding:32px 22px 30px;box-shadow:0 22px 44px -26px rgba(40,10,4,.5);overflow:hidden;}
/* Owner: "there is a white space down the login screen, why is it there?"
   The hero is a fixed 280px and the card was only as tall as its own fields,
   so on any screen taller than the two of them together the page canvas
   showed through underneath as a pale strip -- most obvious on Log In, which
   has three fewer fields than Sign Up. Making the wrap a column and letting
   the card take the slack runs it to the bottom of the screen instead.
   dvh, not vh, where it is supported: 100vh on a phone is the viewport WITH
   the address bar hidden, so on first paint (bar visible) it overshoots and
   trades the gap for a scrollbar. dvh tracks what is actually on screen. */
#authScreen > .wrap{display:flex;flex-direction:column;min-height:100vh;}
@supports (min-height:100dvh){#authScreen > .wrap{min-height:100dvh;}}
#authScreen .auth-hero{flex:0 0 auto;}

/* Everything in the card sits above its backdrop.
   The second rule has to restore `position:absolute`, not just drop the
   z-index: `.auth-card > *` and `.auth-bg` have the SAME specificity, and
   this one comes later in the sheet, so it was winning and collapsing the
   backdrop to a 0x0 relatively-positioned span. It rendered as nothing at
   all, and every computed-style check still passed. */
/* ── THE LANGUAGE BUTTON AND ITS PICKER ──

/* ── Manual deposit: payment-method + "COPY & PAY" screens ──

   padding numbers now apply exactly as authored -- no more adaptation
   needed, since there's a real bare viewport under it again. Every other
   rule below is still the reference's own exact CSS, just class-prefixed

   Two further owner corrections applied this round: the reference's own
   red accents (#c92727/#c92b2b) are gone -- replaced with the same neutral
   dark tone the rest of the reference's own body text already uses, not a
   new color; and the account-number/account-name figures (a real
   +256XXXXXXXXX number is 13 characters) now scale down with clamp()
   instead of the reference's own two fixed breakpoints, which were still
   wide enough to push the copy-button off the right edge on a real phone
   number at the reference's own 35px mobile size. See
   openManualDepositFormSheet()'s own comment in original_module.js for why
   the reference's own "GOPAY" brand logo specifically was swapped for
   Snow's own mark (a real third-party e-wallet company's logo, not
   shipped) while the real MTN/Airtel logos were kept exactly as supplied. */
.mp-overlay{position:fixed;inset:0;z-index:250;display:none;overflow-y:auto;background:#050505;-webkit-overflow-scrolling:touch;}
.mp-overlay.show{display:block;}
/* One small, unobtrusive circular back button -- deliberately NOT a full-
   width title bar ("no header bars"), fixed in the same spot regardless of
   which of the reference's 2 internal screens is showing. */
.mp-back-btn{position:fixed;top:16px;left:16px;z-index:5;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
#manualPayFlow {

  --gold2:#f5c55a;

#manualPayFlow *{box-sizing:border-box}
#manualPayFlow button,#manualPayFlow input{font:inherit}

/* Owner: "the network payment page should be balanced in the middle of the
   page" -- the reference's own version just top-aligned the card with a lot
   of empty space below it on a real phone screen. Flex-centered instead;

/* Same swap as .mp-brand-center above (GoPay logo -> Snow's own mark),

#manualPayFlow .mp-expiry{position:absolute;right:10px;top:14px;text-align:right;font-size:11px;color:#eee}

#manualPayFlow .mp-timer{margin-top:6px;font-size:15px;letter-spacing:1px}
#manualPayFlow .mp-timer span{

  background:linear-gradient(#696969,#333);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
}
#manualPayFlow .mp-timeline-card{

  position:relative;z-index:2;padding:18px 15px;box-shadow:0 18px 28px rgba(0,0,0,.12);

/* One row per real section (COPY & PAY / Payment completed / Your payment
   account / Payment reminder) instead of 3 icons absolutely positioned
   against the WHOLE card's own height -- that only worked while the card's

#manualPayFlow .mp-tl-row{display:flex;gap:11px;}

#manualPayFlow .mp-tl-icon{

#manualPayFlow .mp-tl-body{flex:1;min-width:0;padding-bottom:20px;}
#manualPayFlow .mp-tl-row:last-child .mp-tl-body{padding-bottom:0;}
#manualPayFlow .mp-card-title{font-size:16.5px;font-weight:800;margin:0 0 6px}
#manualPayFlow .mp-sub{font-size:12px;color:#919191;margin-bottom:11px}
#manualPayFlow .mp-sub b{color:#4b4b4b;font-size:13px}
#manualPayFlow .mp-detail-box{

}
#manualPayFlow .mp-label{font-size:11px;color:#8e8e8e;font-weight:700;margin-bottom:5px}
#manualPayFlow .mp-total{font-size:clamp(18px,5.5vw,24px);color:#e58d00;font-weight:800;margin-bottom:12px;}
#manualPayFlow .mp-total small{font-size:12px;margin-right:6px}
#manualPayFlow .mp-account-value{font-size:clamp(15px,5vw,20px);color:#e58d00;font-weight:800;line-height:1.15;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;}
#manualPayFlow .mp-account-value span{min-width:0;overflow-wrap:anywhere;}
#manualPayFlow .mp-name-value{font-size:clamp(13px,4.5vw,17px);color:#e58d00;font-weight:800;line-height:1.2;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;}
#manualPayFlow .mp-name-value span{min-width:0;overflow-wrap:anywhere;}
#manualPayFlow .mp-copybtn{

}
#manualPayFlow .mp-copybtn:before,#manualPayFlow .mp-copybtn:after{

}

}

#manualPayFlow .mp-copybtn i:after{height:7px;width:2px;left:13px;top:10px}
#manualPayFlow .mp-paydone{font-size:15px;font-weight:700;margin:2px 0 2px}
#manualPayFlow .mp-refresh-text{font-size:11.5px;color:#8f8f8f;margin-bottom:10px}
#manualPayFlow .mp-refresh-text b{color:#4b4b4b;font-size:12.5px}
#manualPayFlow .mp-paid-box{background:#f6f6f6;border-radius:13px;padding:12px 14px;margin-bottom:14px}
#manualPayFlow .mp-paid-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8d8d8;padding-bottom:8px;gap:8px;}
#manualPayFlow .mp-paid-label{font-size:11px;font-weight:700}
#manualPayFlow .mp-paid-value{font-size:14px;color:#a8a8a8;font-weight:800;margin-top:3px}
#manualPayFlow .mp-refresh-btn{
  border:0;background:#f09400;color:#fff;border-radius:18px;padding:7px 16px;font-size:12.5px;cursor:pointer;flex-shrink:0;
}
#manualPayFlow .mp-refresh-btn:disabled{opacity:.6}
#manualPayFlow .mp-note{font-size:10.5px;color:#9b9b9b;padding-top:7px}
#manualPayFlow .mp-your-account{font-size:13px;font-weight:700;margin-top:6px}
#manualPayFlow .mp-your-number{font-size:13.5px;margin-top:3px;color:#111}
#manualPayFlow .mp-loading-overlay{
  position:fixed;inset:0;background:rgba(255,255,255,.0);z-index:20;display:flex;align-items:center;justify-content:center;
}
#manualPayFlow .mp-loader-box{
  width:130px;height:130px;border-radius:10px;background:rgba(71,71,71,.76);color:white;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;
}
#manualPayFlow .mp-spinner{
  width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:white;border-radius:50%;
  animation:sp 1s linear infinite;margin-bottom:12px;
}
/* The reference's own validation toast, back -- owner: "l need to see such
   notifies, ie when one taps confirm but when no number or operator set, and
   when invalid number is set." His screenshots show a CENTRED dark box, not
   the bottom pill an earlier version of this had.
   
   That bottom pill was removed for a real reason, recorded below, and this
   avoids it by construction: it is a FIXED, self-centring element parented to
   #manualPayFlow, exactly like .mp-loading-overlay, which has always worked.
   It never becomes a child of a .reveal-in wrapper, so this app's stagger
   entrance cannot reach it, cannot override its transform, and cannot leave it
   sitting off-centre with its own opacity:0 still applied.
   
   It sits ABOVE the loading overlay (z-index 30 against 20): the two can
   legitimately overlap -- a failed init lowers the loader and raises the toast
   in the same tick -- and the message is the part the member needs to read. */
#manualPayFlow .mp-toast{
  position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  padding:36px;pointer-events:none;
}
#manualPayFlow .mp-toast.show{display:flex;}
#manualPayFlow .mp-toast span{
  max-width:290px;background:rgba(71,71,71,.88);color:#fff;border-radius:var(--r-card);
  padding:16px 22px;font-size:15.5px;line-height:1.45;text-align:center;
}
@media (prefers-reduced-motion:no-preference){
  #manualPayFlow .mp-toast.show span{animation:mpToastIn .16s ease-out;}
}
@keyframes mpToastIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
/* The reference's own local bottom-pill toast was removed (see
   openManualDepositFormSheet()'s own comment in original_module.js for
   the real bug it had -- being a direct child of the .reveal-in wrapper
   meant this app's own stagger-entrance animation permanently overrode its
   `transform:translateX(-50%)` centering after playing once, and its own
   `opacity:0` default with it, leaving a small dark box with no text
   sitting off-center near the bottom of the screen). Validation/status
   messages on this screen now go through this app's own already-correct,
   already-centered global toast() instead, per the owner's own "notify
   doesn't open from middle" -- matching every other message in this app.

   Get-results-faster SMS/transaction-ID fallback -- hidden until the
   member has tapped Refresh at least once and it's still not confirmed
   (owner: "the sms forward forwards sms and server matches automatically,
   we are just putting them as fallback... when one clicks refresh, the
   page spreads so one puts sms and submits"). */
#manualPayFlow .mp-sms-fallback{margin:4px 0 14px;}
#manualPayFlow .mp-sms-title{font-size:13px;font-weight:800;color:#e58d00;margin-bottom:3px;}
#manualPayFlow .mp-sms-sub{font-size:11.5px;font-weight:700;color:#2d2d2d;margin-bottom:8px;}
#manualPayFlow .mp-sms-fallback textarea{width:100%;min-height:76px;border:1px solid #bdbdbd;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.5;color:#222;resize:vertical;font-family:inherit;}
#manualPayFlow .mp-sms-fallback textarea::placeholder{color:#bbb;}
#manualPayFlow .mp-sms-warn{font-size:10.5px;color:#cb6565;margin:7px 0 12px;}
/* Admin-authored, network-specific transfer steps (owner: "let us establish
   Payment reminder, so as it is also editable in admin panel for mtn and
   airtel") -- only rendered when the admin has actually filled in a template
   for the network the member picked; see renderManualPayReminder(). */
#manualPayFlow .mp-reminder-title{font-size:15px;font-weight:800;color:#4b4b4b;margin-bottom:6px;}
#manualPayFlow .mp-reminder-box{background:#f6f6f6;border-radius:13px;padding:12px 14px;font-size:12px;line-height:1.9;color:#555;}

.sheet-bg{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);background:var(--snow-canvas);z-index:200;display:none;overflow-y:auto;overscroll-behavior:contain;}
.sheet-bg.show{display:block;}
/* Every sub-page header in the approved mockups is a soft peach band with a
   centred serif title and a bare cyan-to-blue gradient chevron on the left --
   no circular icon button behind it. */
.sheet-head{display:flex;align-items:center;gap:12px;padding:18px 20px;position:sticky;top:0;background:linear-gradient(180deg,#ffe3d1,var(--snow-canvas));border-bottom:1px solid var(--snow-border);z-index:1;}
.sheet-head .back{background:none;border:none;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-head h2{margin:0;flex:1;text-align:center;margin-right:30px;font-size:23px;font-weight:400;letter-spacing:.03em;}
.sheet-body{padding:4px 20px 40px;max-width:480px;margin:0 auto;}

/* The dark bottom-pill toast (#toastHost, .toast, @keyframes toastIn) was
   removed here. Owner: "l nolonger need those dark tiny notifies you already
   know that we have a pop up card with [the warning sign]." Every message it
   carried now opens .notify-card instead. */

/* All pop-up dialogs (as opposed to full-page sheets) open centered, share
   the activity ticker's own dark pill color, and use a modest radius --
   not the tall rounded bottom-sheet look. Owner: "smooth appearing... not
   just appearing suddenly" -- the scale+fade entrance (below, and on
   .chest-modal, which .announce-modal/.dep-status-modal both extend) was
   real but only 180ms/linear ease, which read as a snap/pop rather than a
   settle. Widened to this app's own established "gentle settle" curve
   (cubic-bezier(.22,1,.36,1), the exact same one .reveal-in/.scroll-reveal
   already use elsewhere) so every popup eases in consistently. Owner,
   next round: "abit slow appearing delay abit" -- duration widened again
   (340ms->520ms) plus a short 100ms delay before the ease-in starts, so
   the dialog visibly pauses a beat before settling into place rather than
   beginning to move the instant it's shown. */
/* Chipz dialog language (Notify.dc.html): white card on a warm dimmed
   backdrop, dark ink, pill buttons. This card was still Snow's dark glass
   panel -- the one dialog a member reads immediately before their money
   moves, in a theme it no longer belongs to. */
.confirm-bg{position:fixed;inset:0;background:rgba(20,10,5,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.confirm-bg.show{display:flex;}
.confirm-sheet{background:var(--snow-surface);color:var(--snow-ink);width:100%;max-width:340px;border-radius:var(--r-card);padding:24px 22px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);transform:scale(.92);opacity:0;transition:transform .52s cubic-bezier(.22,1,.36,1) .1s,opacity .52s cubic-bezier(.22,1,.36,1) .1s;}
.confirm-bg.show .confirm-sheet{transform:scale(1);opacity:1;}
.confirm-sheet h3{margin:0 0 4px;font-size:19px;font-weight:700;color:var(--snow-wine);}
.confirm-sheet .confirm-sub{color:var(--snow-muted);font-size:13px;margin:0 0 14px;font-weight:500;}
.confirm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--snow-border);color:var(--snow-muted);font-weight:500;}
.confirm-row:last-of-type{border-bottom:none;}
.confirm-row .mono{color:var(--snow-ink);font-weight:700;font-family:var(--number-font,inherit);font-size:15px;}
.confirm-sheet .secondary-button{background:var(--snow-green-soft);color:var(--snow-ink);border-radius:var(--r-ctl);font-weight:700;}

/* Centered popup (opens from the middle, not a bottom sheet) -- the
   treasure-chest gift-code entry on Home. */
.chest-modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:310;display:none;align-items:center;justify-content:center;padding:20px;}
.chest-modal-bg.show{display:flex;}
.chest-modal{background:rgba(17,17,17,.82);color:#fff;width:100%;max-width:340px;border-radius:var(--r-card);padding:22px 20px;text-align:center;transform:scale(.92);opacity:0;transition:transform .52s cubic-bezier(.22,1,.36,1) .1s,opacity .52s cubic-bezier(.22,1,.36,1) .1s;}
.chest-modal-bg.show .chest-modal{transform:scale(1);opacity:1;}
.chest-modal img{width:96px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));}
.chest-modal h3{margin:0 0 6px;font-size:18px;font-weight:700;}
.chest-modal p{margin:0 0 18px;font-size:13px;color:rgba(255,255,255,.65);}
/* Deposit live-status modal (Recharge) -- reuses .chest-modal-bg/.chest-modal
   for the same dark/centered/thin dialog convention as every other pop-up.
   3 states toggled via #depStatusIcon's class: pending (spinner, reuses the
   loading screen's own @keyframes sp), success (green check), failed (red
   x) -- SVG only, per the house no-emoji rule. */
/* The recharge poll is a PAGE in the app's own colours, not a dark modal.
   Owner: "l nolonger need those old poll designs ... when one taps deposit,
   it should open a new page for polling, so for polling it should show the
   other 4 triangles rotating, just like those which we placed on running
   product, so it will be enlarged ... l nolonger need those dark things, use
   app color and theme not dark ... however still nav icons should exist on
   the poll payment page."

   It keeps its own classes rather than restyling .chest-modal-bg/.chest-modal:
   those are SHARED with the gift-code win modal, and recolouring them here
   would silently redesign the chest too.

   `bottom:var(--nav-h)` is the app's own convention for "leave the bottom bar
   alone" (.sheet-bg and .msg-detail-bg both use it), which is what keeps the
   nav icons visible and tappable while a payment is being polled. */
/* The in-flight loader between Confirm and the poll page. Sits ABOVE the
   sheet (z-index 320 against .sheet-bg's 200) and, like the poll page, stops
   at the bottom bar rather than covering it. */
.dep-redirect{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);

/* A column now, not a centred box: the page has a real header (back chevron
   + title) pinned at the top, and .pay-body takes the remaining height and
   centres the card inside THAT. Centring the card in the whole page instead
   would push it visibly below centre by half the header's height. */
.pay-page{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);
  background:var(--snow-canvas);z-index:310;display:none;

/* The pending state is a numbered list of what is happening and what the

   centred list items with numbers hanging off them are hard to scan, and the

   failure (the mobile-money prompt never arriving). Quieter and smaller so

   downline: "add the other loader of 'Loading...' while Loading users on team
   of specific level ... l wanted the other which has 4 triangle chips
   rotating, it is already there" -- so this is PLAN_SPIN, the same markup and
   the same keyframes the ongoing-plan rows and the payment page use, resized
   purely by --s. One mark, one set of keyframes, three sizes.
   No word under it: he asked for the chips INSTEAD of the word ("it will be 4
   triangles not Loading..."). */
.list-loading{padding:34px 4px;display:flex;justify-content:center;align-items:center;}
.list-loading .pspin{--s:56px;}

/* Real content fades/lifts into place once it's ready -- no shimmer
   placeholders. Freshly-inserted DOM (a fresh innerHTML assignment) always
   plays this from the start, so no manual restart/reflow trick is needed.
   Direct children stagger in one after another (the "live animation
   website" look) instead of the whole block popping in as one flat unit;
   each one starts fully hidden (animation-fill-mode:both) so there's no
   flash of unanimated content before its delay elapses. */
/* Owner: "remove live appearing animation everywhere." Both entrance
   animations are gone -- the stagger that played on every page paint, and
   the About page's scroll-into-view reveal (including the word-by-word
   text effect). The .reveal-in / .scroll-reveal / .reveal-word classes are
   still applied by the JS in a dozen places, so rather than unpick all of
   that, .scroll-reveal is neutralised here to plain visible content. Its
   old `opacity:0` default is the thing to be careful about: leaving that
   behind while removing the transition would hide the About page outright.
   The .reveal-in rules are deleted rather than set to `animation:none`,
   because that rule sits later in the file at the same specificity as
   .chest-float and would go straight back to killing the chest's bounce. */
.scroll-reveal,.scroll-reveal.about-image,.scroll-reveal.in-view{opacity:1;transform:none;transition:none;}
.reveal-word{display:inline-block;opacity:1;transform:none;}
.about-block{margin-bottom:18px;}
.about-block:last-child{margin-bottom:0;}
/* The stale `.reveal-word{opacity:0}` that used to sit here is DELETED, not
   overridden. It was the old animation's starting frame, left behind when the
   reveal was removed -- and because it came AFTER the replacement rule at the
   same specificity, it won: every word of the About page rendered at opacity
   0 and translated 10px down. The page was not blank because the text was
   missing; the text was all there, invisible.
   The comment two rules up literally warned about this ("Its old `opacity:0`
   default is the thing to be careful about: leaving that behind while
   removing the transition would hide the About page outright") and the
   duplicate was left in anyway. Adding a third rule to win the cascade would
   have kept the trap loaded; there is now exactly one .reveal-word rule. */

</style>

<div id="loadingScreen">
  <div class="ring-loader-wrap">
    <svg class="ring-loader" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="24" y1="104" x2="96" y2="16" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ff3b44"/>
          <stop offset="55%" stop-color="#e30613"/>
          <stop offset="100%" stop-color="#6b4cff"/>
