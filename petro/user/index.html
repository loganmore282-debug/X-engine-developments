<!-- The SAME policy render.yaml sends as a header, carried in the file itself.
     It is here because this page does not only ship from Render: the frontend
     is also deployed to EdgeOne (see CLAUDE.md, and the .edgeone.* entries in
     CORS_ALLOWED_SUFFIXES), and a host header cannot follow a file to another
     host. A meta policy travels with index.html, so the app is covered
     wherever it is uploaded.

     What this actually buys, on a money app: script injected into this page
     cannot POST a member's balance, session token or Trade Password to a
     server the attacker controls, and cannot LOAD a script from one. That is
     connect-src and script-src's host list; everything else here is
     supporting work.

     'unsafe-inline' in script-src is REQUIRED and must not be "tidied away":
     build-core.js ships the whole app as one inline <script> (s.textContent =
     code), which no hash can cover because the content changes every build.

     'unsafe-eval' is deliberately ABSENT, and there is one expected, harmless
     CSP violation on every load because of it. build-core.js / build-admin.js
     set `disableConsoleOutput: true`, and javascript-obfuscator implements
     that with a global-object helper shaped like
         try { g = Function('return this')(); } catch (e) { g = window; }
     Function() is eval, so the browser blocks it and reports a violation --
     then the catch assigns `window`, which is the same object it was reaching
     for, and the bundle carries on. Verified by test-csp-runtime.py, which
     walks every tab and sheet under the real policy.

     Do NOT add 'unsafe-eval' to silence that one line. It would let any
     injected script build code from a string, which is most of what this
     policy is here to prevent, in exchange for a warning that changes
     nothing. test-csp-runtime.py allows that exact violation and fails on
     any other, so a NEW eval -- one without a fallback, that really would
     break something -- is still caught.

     frame-ancestors is NOT here: a meta policy cannot express it (the browser
     ignores it), which is exactly why render.yaml keeps sending the header
     version too. The two are not redundant. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' http://179.198.197.114:3000 https://*.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- Owner: "why app still have red upper title color? it takes space even."
     That red band above the app is Android painting the status bar with
     theme-color, and at #e21b2a it reads as a separate red title bar sitting
     on top of the app rather than as part of it -- which is exactly why it
     looks like it is taking space. Set to the app's own paper, the status bar
     becomes the top of the page and the band disappears. Chrome picks dark
     status icons for a light theme colour, so the clock stays readable.
     NOTE: manifest.json's theme_color must match, and an ALREADY-INSTALLED
     app keeps the colour it was installed with until it is reinstalled. -->
<meta name="theme-color" content="#f7f7f8">
<link rel="manifest" href="/manifest.json">
<!-- The app icon and the share card are both admin-uploadable, which is why
     these point at chipz-server rather than at the files sitting next to
     this one. Neither consumer can be reached from our JavaScript: Chrome
     reads the icon out of manifest.json when a member installs the app, and
     the WhatsApp / Telegram / Facebook crawler reads the og: tags below when
     someone pastes the link -- crawlers do not run scripts. So both have to
     be real files at fixed URLs, and the server swaps what sits behind them.
     It falls back to the bundled icon-192/512.png, so these never 404.
     THESE URLS ARE PERMANENT. Changing a path here breaks the installed
     icon and every previously-shared link at the same time. -->
<link rel="icon" href="http://179.198.197.114:3000/public/app-icon-192.png">
<link rel="apple-touch-icon" href="http://179.198.197.114:3000/public/app-icon-192.png">
<meta name="description" content="Chipz — invest, earn daily income, and grow your team.">
<!-- ── og:image IS THE BACKEND ROUTE, SO THE UPLOADED CARD IS WHAT SHOWS ──
     Owner: "l wanted the uploaded link preview to be shown not the
     hardcoded, please check out that very well."

     It pointed at a static file shipped with this build, which meant the
     admin panel's Link preview upload changed nothing a crawler ever saw --
     only a redeploy could change the share card. It names the BACKEND's
     /public/link-preview.jpg again, which serves the upload when there is
     one. A static host cannot do that: it has no database and runs no code.

     The two reasons that route was abandoned are both dealt with, and it is
     worth knowing why, because they were real at the time:

     1. "It 404s when nothing has been uploaded." It no longer can --
        BRAND_ASSET_SLOTS['link-preview'] now falls back to the bundled
        user/link-preview.jpg read off disk, exactly as the app icon has
        always fallen back to icon-512.png. Upload set -> the upload; no
        upload, or the database unreachable -> this build's own card.
     2. "The backend sleeps, and a crawler only waits a few seconds."
        chipz-server is a PAID Render instance and does not sleep. That
        reasoning was carried over from a free-tier assumption and was
        already wrong for this deploy.

     Same host as the manifest's icons on purpose: these two consumers are
     the same shape (no script, no data: URI, a fixed permanent URL), and the
     icon has been served this way from the backend all along.

     THE URL IS PERMANENT. It is absolute and names the backend's own stable
     host because an og:image must resolve for a crawler with no page
     context, and the members' domain changes per country while this one
     never does.

     Two things an upload does NOT reach, stated in the panel's own copy
     because they otherwise come back as bug reports: a link somebody has
     ALREADY shared keeps the preview WhatsApp/Facebook cached for it
     (appending anything, e.g. ?x=2, forces a refetch), and the route's own
     five-minute cache means a fresh fetch can show the old card for up to
     that long.
-->
<!-- og:url is deliberately absent. A crawler falls back to the URL it
     actually fetched, so the card keeps working on any domain the app is
     served from; a hard-coded one would silently go stale the day a custom

<style>
/* ── Chipz design tokens ──────────────────────────────────────────────
   Value-only swap of the token names this codebase already uses everywhere
   (the same convention Snow's own history documents for its repeated colour
   changes) -- every existing rule keeps working, the whole app reskins at
   once. Chipz's palette is the bold Doritos-style red->orange gradient on a
   warm cream/paper ground; --snow-green stays a real green because it is
   used semantically (positive amounts, success pills), not as a brand
   accent. */
:root{
  /* ── Re-themed to Petro's own "Premium Industrial Energy" identity ──
     Owner-specified, not invented: Corporate Red #E30613 (primary --
     headers, buttons, active nav, cards), Clean White #FFFFFF (dashboard
     background), Golden Orange #F5A000-#FFB000 (secondary accent, off the
     logo and refinery/sunset lighting), Charcoal #25262B (auth glass
     panels, text, secondary UI). Green stays FUNCTIONAL ONLY (success
     states) -- explicitly not a theme color, so those tokens are the one
     set below left untouched. Variable NAMES are kept (--snow-*/--chipz-*)
     with only the VALUES swapped -- the same low-risk convention this file's
     own admin-src.html already used for its own re-theme (see that file's
     --gold comment): every one of the hundreds of rules in this file already
     reads these tokens, so nothing downstream needed touching to pick up
     the new palette. */
  --snow-canvas:#f7f7f8;
  --snow-surface:#ffffff;
  --snow-ink:#25262b;
  --snow-muted:#6b6d76;
  --snow-wine:#e30613;
  --snow-wine-deep:#b10510;
  --snow-green:#1a7a3e;
  --snow-border:#ececee;
  --snow-wave-on-wine:#ffd9a0;
  --snow-green-deep:#146030;
  --snow-wine-soft:#fbd9dc;
  --snow-green-soft:#dff2e2;
  --snow-neutral-soft:#f5f5f6;
  --snow-radius-card:22px;
  --snow-radius-tile:16px;
  --snow-radius-control:16px;
  --snow-radius-sheet:32px;
  /* Chipz-specific additions (no Snow equivalent) */
  /* Bottom nav height. Grew from 68px when the icons did -- owner, twice:
     "the nav icons are small". */
  --nav-h:68px;
  --chipz-orange:#f5a000;
  /* Flat, not a gradient -- the mockup's cards/buttons/header are a solid
     corporate red, not Chipz's old red-to-orange blend. Still a CSS custom
     property assignable straight into `background:`, so every one of the
     ~40 rules that read --chipz-grad needed no change at all. */
  --chipz-grad:#e30613;
  /* .auth-hero's fallback ONLY -- shown behind the Login/Sign Up glass
     panel until the owner uploads the real sunset-refinery photo to the
     'authhero' image slot (already-built admin upload, see
     /admin/chipz-image/set + CHIPZ_IMAGE_SLOTS in server.js). Charcoal to
     deep red to gold, echoing that same warm dusk-over-a-refinery mood as a
     photo-free placeholder rather than a random gradient. */
  --chipz-hero:linear-gradient(160deg,#25262b 0%,#7a0e14 55%,#f5a000 100%);
  --chipz-gold:#ffb000;
  --chipz-neg:#7a0e14;
  /* Not blue -- the owner was explicit this should not read as "the typical
     blue/green fintech look." Deep red carries the same "this is a link"
     legibility a blue would, without introducing a fifth brand color. */
  --chipz-link:#b10510;
  --chipz-shelf:#b10510;
  /* ── Surfaces ──
     Owner, holding a mockup next to the live app: "the mock up has very
     clean CSS, well ultra definition and quality cards and colour ... clean
     cards, well defined and high quality."

     What actually separated the two was not colour. Ninety-one rules
     hardcoded `border-radius:4px` -- square, at the size where a corner
     reads as an unfinished edge rather than a decision -- and every card
     leaned on a hard 1px hairline with a shadow so far offset
     (`-16px`/`-24px` spread) that it never drew a pixel. A hairline with no
     shadow is a wireframe; a shadow with no hairline is a smudge. Cards need
     both, and the corner has to be big enough to see.

     These three radii are now the ONLY ones in the file, so a card can never
     again be 4px in one place and 16px in another:
       --r-card  panels, list rows, sheets, anything holding content
       --r-ctl   buttons, inputs, chips, tiles -- tighter, so a control
                 reads as pressable rather than as a small card
       --r-pill  status pills, accent bars, progress tracks
     Two-layer shadow: a 1-2px contact shadow that defines the edge, plus a
     wide soft one that lifts it off the cream canvas. One layer alone gives
     you either a hard line or a haze. */
  --r-card:16px;
  --r-ctl:12px;
  --r-pill:999px;
  --sh-card:0 1px 2px rgba(30,10,5,.05),0 12px 26px -16px rgba(30,10,5,.34);
  --sh-card-hi:0 2px 4px rgba(30,10,5,.06),0 22px 42px -20px rgba(30,10,5,.42);
  /* The hairline, dialled back: it is now an edge highlight sitting on top of
     a real shadow, not the only thing holding the card together. */
  --line-soft:rgba(239,224,211,.72);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
body{background:var(--snow-canvas);font-weight:400;font-family:'Barlow Condensed','Arial Narrow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--snow-ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-variant-numeric:lining-nums tabular-nums;font-family:var(--number-font,inherit);}
/* Chipz leads with a serif display face for headings/figures over a
   condensed sans for body copy, matching every approved mockup. */
h1,h2,h3,.section-title,.stat-val,.bal-value{}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}
a{color:inherit;}
/* Owner: "l want the scroll bar to be orange not dull color."
 *
 * This needs BOTH properties, and only one of them is the one he can see.
 *
 * The file used to say `::-webkit-scrollbar{display:none}`, which is why the
 * bar he is looking at is grey: Android always draws OVERLAY scrollbars, and
 * since Chromium 121 overlay scrollbars are painted natively and ignore the
 * ::-webkit-scrollbar pseudo-elements entirely. The rule was not being
 * disobeyed -- it simply does not reach that scrollbar, so the phone fell
 * back to the system thumb. The standard `scrollbar-color` is the one thing
 * overlay scrollbars do obey.
 *
 * ::-webkit-scrollbar is kept for the classic (non-overlay) scrollbars an
 * older Chromium or a desktop browser still draws, where `scrollbar-color`
 * alone would leave a default-width grey track around an orange thumb.
 *
 * scrollbar-color is an INHERITED property, so setting it on the root covers
 * every scroller in the app -- the sheets, the announcement body, the message
 * detail, the manual-pay overlay -- without naming any of them. Naming them
 * is how the next one added gets missed.
 *
 * The track is transparent on purpose: a filled track on a phone is a grey
 * stripe down the edge of every screen, which is the thing being removed. */
html{scrollbar-width:thin;scrollbar-color:var(--chipz-orange) transparent;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--chipz-orange);border-radius:var(--r-pill);}
::-webkit-scrollbar-thumb:hover{background:var(--snow-wine);}
::-webkit-scrollbar-corner{background:transparent;}

.app-card{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--sh-card);}
/* Owner: "l also need 3d buttons" -- a solid darker shelf under every primary
   CTA plus a real press-down :active state, applied once here so every button
   in the app picks it up. */
.primary-button{background:var(--chipz-grad);color:#fff;border:none;border-radius:var(--r-ctl);font-weight:700;letter-spacing:.02em;
  box-shadow:none;
  transform:translateY(0);transition:transform .1s,box-shadow .1s;}
.primary-button:active:not(:disabled){transform:translateY(4px);box-shadow:none;}
.primary-button:disabled{opacity:.5;box-shadow:none;}
.secondary-button{background:var(--snow-surface);color:var(--snow-wine);border:1.6px solid var(--snow-wine);border-radius:var(--r-ctl);font-weight:700;
  box-shadow:0 4px 0 var(--snow-border);transform:translateY(0);transition:transform .1s,box-shadow .1s;}
.secondary-button:active:not(:disabled){opacity:.85;}
/* Dark variant used for Log Out / Edit Wallet, per the Account + Wallet mockups. */
.dark-button{background:var(--snow-ink);color:#fff;border:none;border-radius:var(--r-ctl);font-weight:700;letter-spacing:.04em;
  box-shadow:none;transition:opacity .1s;}
.dark-button:active:not(:disabled){opacity:.85;}
/* A band of light travels across every filled CTA on a loop, clipped to the
   button's own rounded box. Owner asked for it "left to right" first, then
   corrected to "let it move from right to left" -- it now enters at the
   right edge and exits left.

   Applied to the FILLED buttons only -- the ones that read as a call to
   action. Deliberately NOT on the bottom-nav items, the Home action icons,
   the round icon buttons or the close X: those are transparent or 26-38px
   artwork, and a shine crossing them reads as flicker, not polish.

   The band is a pseudo-element moved with transform alone, which the browser
   animates on the compositor -- no layout, no repaint, no per-frame work on
   the main thread. That matters here because these run forever on cheap
   Android phones. `will-change` is deliberately NOT set: it would pin a
   layer per button for the life of the page, and a running transform is
   auto-promoted anyway.

   The sweep runs for the first 55% of the cycle and rests for the remainder,
   so it reads as a repeating pass rather than a strobe.

   --sweep is the band's colour, so a pale button can override it: white on
   white would be invisible, so those get a brand-tinted sheen instead. */
.primary-button,.secondary-button,.dark-button,.spin-cta,.notify-ok,.btn-bind,
.wallet-panel .btnrow .cancel,#manualPayFlow .mp-confirm-btn{position:relative;overflow:hidden;}
.primary-button::after,.secondary-button::after,.dark-button::after,.spin-cta::after,
.notify-ok::after,.btn-bind::after,.wallet-panel .btnrow .cancel::after,
#manualPayFlow .mp-confirm-btn::after{
  content:'';position:absolute;top:0;bottom:0;left:0;width:38%;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,var(--sweep,rgba(255,255,255,.45)) 50%,transparent 100%);
  transform:translateX(360%) skewX(-20deg);
  animation:btnGlowSweep 2.8s ease-in-out infinite;}
/* Pale buttons: a white band on a near-white face shows nothing, so tint it. */
.secondary-button,.btn-bind,.wallet-panel .btnrow .cancel{--sweep:rgba(226,27,42,.18);}
/* A disabled button must not look alive. */
.primary-button:disabled::after,.secondary-button:disabled::after,.dark-button:disabled::after,
.spin-cta:disabled::after,.notify-ok:disabled::after,.btn-bind:disabled::after,
.wallet-panel .btnrow .cancel:disabled::after,#manualPayFlow .mp-confirm-btn:disabled::after{display:none;}
/* Owner: "let it move from right to left." Starts off the RIGHT edge and
   travels off the left. */
@keyframes btnGlowSweep{
  0%{transform:translateX(360%) skewX(-20deg);}
  55%,100%{transform:translateX(-140%) skewX(-20deg);}}
@media (prefers-reduced-motion:reduce){
  .primary-button::after,.secondary-button::after,.dark-button::after,.spin-cta::after,
  .notify-ok::after,.btn-bind::after,.wallet-panel .btnrow .cancel::after,
  #manualPayFlow .mp-confirm-btn::after{animation:none;display:none;}}

/* Team member Active / Pending. Same treatment as the record pills, for the
   same reason -- one pill vocabulary across the app, so a status looks like a
   status wherever it appears. Pending stays deliberately quiet: it is the
   absence of a thing, and shouting it would make every new referral look like
   a problem. */
.status-pill{display:inline-block;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;letter-spacing:.03em;padding:5px 13px;}
.status-pill.active{background:linear-gradient(135deg,#35c46c,#12894a);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 5px 12px -6px rgba(18,137,74,.7);}
.status-pill.pending{background:var(--snow-neutral-soft);color:var(--snow-muted);border:1px solid var(--line-soft);font-weight:600;}

/* --nav-h is the ONE place the bar's height is written. Four other rules
   depend on it (the page's bottom padding, the sheet overlay's bottom
   inset, the Download panel's height) and they used to repeat 68 as a
   literal, so growing the bar meant finding all four. */
.bottom-nav{z-index:210;background:var(--snow-surface);border-top:1px solid var(--snow-border);display:flex;align-items:center;justify-content:space-around;height:var(--nav-h);position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:0 2px;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--snow-muted);background:none;border:none;padding:6px 2px;flex:1;min-width:0;position:relative;}
/* The bottom nav's selector box and its icon animation are TWO separate
   things, and an earlier build had them the wrong way round. Owner, putting
   it straight: "l said the icon fades in and out when tapped not static and
   selector doesn't disappear."

   So:
     - the BOX is the active-tab marker. It STAYS on whichever tab is
       selected and does not fade away -- it only eases across as the
       selection changes (the transition below).
     - the ICON is what animates on a tap: it fades out and straight back in,
       so tapping never looks static.

   The box sits BEHIND the icon and label, which is why both are given a
   z-index: a positioned pseudo-element otherwise paints on top of its own
   element's text and artwork, and the box would cover the very icon it is
   meant to sit behind. z-index:-1 is not the answer either -- the bar's own
   white background would then hide it completely.

   Brand-tinted rather than the reference's lavender, per the standing rule:
   copy the shape from a reference, never another app's colours. */
/* Owner: "the nav tab is still small in width can you extend it abit."
   Widened from a fixed 54px to as wide as the tab allows, capped at 62px.
   Sized with left/right insets + margin:auto rather than the old
   left:50% / margin-left:-27px, because that older trick pinned the width to
   a hard-coded number AND, more importantly, centring via transform would
   collide with navBoxBounce: the keyframes set transform to a bare scale(),
   which would throw away any translate the centring depended on. This way
   `transform` belongs entirely to the animation.
   The cap matters on a wide phone: 6 tabs across a 430px screen give ~71px
   each, and a box that grew to fill it would nearly touch its neighbours. */
.navitem::before{content:'';position:absolute;top:3px;left:3px;right:3px;max-width:56px;margin:0 auto;height:42px;
  border-radius:14px;background:rgba(226,27,42,.13);opacity:0;transform:scale(.72);pointer-events:none;z-index:0;
  transition:opacity .2s ease,transform .2s ease;}
.navitem.active::before{opacity:1;transform:scale(1);}
.navitem .nav-ic,.navitem .lbl{position:relative;z-index:1;}
/* Owner: "not only the nav icon bounces in and out but also the selector
   should do so." So the box presses with the icon -- same curve, so the two
   read as ONE press rather than two things moving near each other.
   opacity stays pinned at 1 for the whole animation: the box is the active-tab
   selector and it must never look like it is going away ("selector doesn't
   disappear"), so only the scale moves. Slightly gentler than the icon's
   (.78/1.14 against .74/1.18) because it is a 54x40 slab rather than a 26px
   glyph, and the same numbers on that area read as a wobble.
   It is .42s to the icon's .46s deliberately -- hookNavTapBox() ends the tap
   by watching for navIconBounce, and removing the class kills any animation
   still running, so the box has to finish FIRST or it gets cut off. */
.navitem.nav-tap.active::before{animation:navBoxBounce .42s cubic-bezier(.34,1.56,.64,1);}
@keyframes navBoxBounce{
  0%{opacity:1;transform:scale(1);}
  28%{opacity:1;transform:scale(.78);}   /* in  */
  62%{opacity:1;transform:scale(1.14);}  /* out */
  82%{opacity:1;transform:scale(.97);}
  100%{opacity:1;transform:scale(1);}}
/* The other half of the tap animation lives on the ICON.
   Owner, third pass: "the nav icons when tapped be live bounce in and out
   ... it is like tapping something and bounces 1 in and out 1." So it is a
   BOUNCE now, not the fade it was: the icon presses IN (squashes down),
   springs back OUT past its own size, then settles. One in, one out.
   Opacity stays at 1 the whole way -- a fade was what he was rejecting, and
   an icon that dims mid-bounce reads as a loading state, not a press.
   The overshoot to 1.18 is what makes it feel physical; without it this is
   just a scale transition and the "bounce" is gone. */
.navitem.nav-tap .nav-ic svg{animation:navIconBounce .46s cubic-bezier(.34,1.56,.64,1);}
@keyframes navIconBounce{
  0%{transform:scale(1);}
  28%{transform:scale(.74);}   /* in  */
  62%{transform:scale(1.18);}  /* out */
  82%{transform:scale(.95);}
  100%{transform:scale(1);}}
@media (prefers-reduced-motion:reduce){
  .navitem::before{transition:none;}
  .navitem.nav-tap.active::before{animation:none;}
  .navitem.nav-tap .nav-ic svg{animation:none;}}
.navitem.active{color:var(--snow-wine);}
.navitem .lbl{font-size:10px;font-weight:600;white-space:nowrap;}
.navitem.active .lbl{font-weight:700;}
.navitem svg{width:28px;height:28px;}
.chest-float.turntable-float{animation:none;right:14px;bottom:212px;width:56px;height:56px;border-radius:50%;background:var(--chipz-grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px -8px rgba(226,27,42,.6);}
.chest-float.turntable-float svg{width:26px;height:26px;}
/* Left over from the old dark ticker pill: white-on-dark. The card is white
   now, so this rule made every phone number in it invisible. Same element,
   same id -- the colours just had to follow the card. */
#activityTickerTrack b{color:var(--snow-ink);font-weight:600;}
#activityTickerTrack .sep{color:var(--snow-border);}
/* 31px. The history matters, because this has now been wrong in both
   directions: the mockup drew these at 23px, which read as specks on a real
   phone with six tabs sharing the width, so two rounds of "the nav icons are
   small" pushed them to 38 -- and 38 turned out to be too far the other way
   ("reduce on sizes of nav icons, they are too big eeh"). 31 is between the
   two, nearer the smaller end because that is the direction of the last
   complaint. The bar comes down with it (--nav-h 76 -> 68) rather than
   leaving a shrunken glyph floating in the old height. */
.navitem .nav-ic{display:flex;align-items:center;justify-content:center;height:31px;color:var(--snow-muted);transition:color .15s;}
.navitem .nav-ic svg{width:23px;height:23px;}
.navitem.active .nav-ic{color:var(--snow-wine);}


.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark .wm-text{font-weight:700;letter-spacing:2px;}

.stat-label{font-size:10px;color:var(--snow-muted);text-transform:uppercase;letter-spacing:.35px;}
.stat-val{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;color:var(--snow-ink);margin-top:2px;}
.section-title{font-size:17px;font-weight:700;color:var(--snow-ink);}

.stat-tile{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:12px;box-shadow:var(--sh-card);}
.icon-tile{border-radius:var(--r-ctl);background:var(--snow-wine-soft);color:var(--snow-wine);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Product card, per the owner's reference screenshot: the NAME sits on top,
   centred and large, then the full-width image, then a 2x2 grid of tinted
   stat tiles, then a full-width Buy Now. The reference is a screenshot of
   an unrelated app in a purple/blue theme -- layout, labels and proportions
   are copied, the colours are Chipz's own (CLAUDE.md's design-fidelity
   rule). */
/* Owner: "product cards are rounded and large, they should be small and not
   rounded." The 22px radius and 170px image came from the mockup, but with
   four money tiles under them each card filled a whole phone screen. Tighter
   radius, half the image height, and smaller type -- roughly half the height
   per card, so several are visible at once. */
/* Owner: no title bar -- the product name sits ON the image. Product photos
   are stored at exactly 1600x900 px, 16:9 (the admin panel cover-fits every
   upload onto that frame), so the card frame is aspect-ratio driven rather
   than a fixed pixel height: the image fills it exactly, with no letterboxing,
   whatever the phone's width. 1600 px wide still covers a 3x phone at the
   ~355 px card width, so it stays sharp.

   This was 4:3 until the owner sent his real artwork -- 1721x914, near enough
   16:9 -- with "reduce on the size of cards their height is very high, just
   like you see that resolution it should be that". 4:3 was the cause: at a
   354 px card the image alone was 264 px tall and the whole card 422 px, so
   barely two fitted on a phone screen. 16:9 takes the image to 199 px and the
   card to 357 px. Measured, not estimated. */
.p-card{background:var(--snow-surface);border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line-soft);box-shadow:var(--sh-card);}
/* Owner: "l also want when l tap on the product card it fades in then out,
   but no action just it is animation but no action should be there on
   triggering buy."
   So the CARD acknowledges a tap and does nothing else. Buying stays behind
   the Buy Now button alone -- tapping a card must never start a purchase,
   which is why this is a class toggled by a listener rather than any kind of
   onclick handler on the card itself.

   The first version dipped OPACITY to .62 and left transform alone. Owner:
   "you failed to understand, cozy when l tap it just cause faint image
   instead of make product card bounce in or fade in and out minimumly." He is
   right, and the reason is worth keeping: fading a card does not read as the
   card responding, it reads as the card briefly failing to draw. A press is a
   physical event, so the acknowledgement has to be physical -- the card gives
   under the finger and springs back.

   Same spring curve as the nav icon, a fraction of its amplitude. The nav
   icon squashes to .74 and overshoots to 1.18, which is right for a 30px
   glyph and would look like the whole screen lurching on a 360px-wide card.
   "Minimumly": 2.8% in, under 1% out -- enough to see, not enough to move the
   layout under the finger. Nothing here changes opacity, so the card never
   goes faint again. */
.p-card.card-tap{animation:cardTapBounce .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardTapBounce{
  0%{transform:scale(1);}
  34%{transform:scale(.972);}   /* in  */
  68%{transform:scale(1.008);}  /* out */
  100%{transform:scale(1);}}
@media (prefers-reduced-motion:reduce){.p-card.card-tap{animation:none;}}
.p-card .p-img{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#ffd9a0,#f5a000);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.p-card .p-img img{width:100%;height:100%;object-fit:cover;display:block;}
.p-card .p-img .glyph{width:52px;height:52px;border-radius:var(--r-ctl);background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;}
/* A scrim, not a solid bar -- the name has to stay readable over whatever
   photo is uploaded without hiding the top of it. */
.p-card .p-name{position:absolute;left:0;right:0;bottom:0;padding:24px 13px 10px;color:#fff;font-weight:700;font-size:19px;letter-spacing:.01em;
  background:linear-gradient(to top,rgba(20,8,4,.72) 0%,rgba(20,8,4,.42) 55%,rgba(20,8,4,0) 100%);text-shadow:0 1px 4px rgba(0,0,0,.5);}
.p-card .p-body{padding:10px;}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px;}
.p-stat{background:var(--snow-green-soft);border-radius:var(--r-ctl);padding:8px 6px;text-align:center;}
.p-stat.warm{background:var(--snow-wine-soft);}
.p-stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--snow-muted);font-weight:600;}
.p-stat .v{font-size:16px;font-weight:700;color:var(--snow-ink);margin-top:2px;font-family:var(--number-font,inherit);white-space:nowrap;}
.p-card .p-cta{width:100%;height:44px;padding:0;font-size:16px;letter-spacing:.04em;border-radius:var(--r-ctl);}
.product-card__stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:10px 16px;}
.product-card__cta{width:100%;min-height:44px;margin-top:16px;border-radius:var(--r-ctl);font-size:14px;}

.plan-card{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:18px;box-shadow:var(--sh-card);}

.segmented-control,.team-level-switcher{display:flex;background:var(--snow-neutral-soft);border-radius:var(--r-ctl);padding:4px;gap:4px;}
.segmented-control .seg,.team-level-switcher .seg{flex:1;text-align:center;padding:9px 0;border-radius:var(--r-ctl);font-size:13px;font-weight:500;color:var(--snow-muted);background:none;border:none;}
.segmented-control .seg.active,.team-level-switcher .seg.active{background:#fff;font-weight:700;color:var(--snow-wine);box-shadow:0 4px 12px -8px rgba(17,17,17,.3);}

.settings-list{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:4px 16px;box-shadow:var(--sh-card);}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--snow-border);}
.list-row:last-child{border-bottom:none;}



.team-referral-card{position:relative;overflow:hidden;min-height:210px;padding:22px;border-radius:var(--r-card);color:#fff;background:var(--chipz-hero);box-shadow:0 16px 32px -22px rgba(17,17,17,.35);}
.team-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.team-deposits-card{grid-column:1 / -1;position:relative;overflow:hidden;border-radius:var(--r-card);padding:20px;color:#fff;background:linear-gradient(145deg,var(--snow-green),var(--snow-green-deep));box-shadow:0 14px 28px -22px rgba(17,17,17,.3);}

/* ── App chrome not in the mockups: auth, sheets, forms, toast, loading ── */
.wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;background:var(--snow-canvas);padding-bottom:calc(var(--nav-h) + 20px);}
/* Rebuilt entirely per the owner's own reference GIF, frame-by-frame
   (a 167-frame loop): three concentric rings, red at the bottom fading to
   blue/violet at the top, whose visible arc continuously grows/shrinks
   AND travels around the circle (not a fixed spinner), glowing, with a
   plain numeric counter climbing 0-100 dead centre -- no wordmark, no
   background image, no gradient backdrop, pure black. Owner: "remove it
   even it has background image like that of chipz, remove it entirely,
   only put that loader everywhere for loading pages... check that loader
   in gif carefully how it works and use it." The old dark-red gradient
   backdrop and the Chipz-derived wordmark/wave treatment are gone, not
   just restyled -- there is nothing left here that came from Chipz. */
#loadingScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:500;}
#openingGate .og-mark{font-weight:800;font-size:36px;letter-spacing:.03em;color:#fff;}
.ring-loader-wrap{position:relative;width:min(38vw,150px);height:min(38vw,150px);display:flex;align-items:center;justify-content:center;}
.ring-loader{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 0 7px rgba(227,6,19,.55)) drop-shadow(0 0 16px rgba(107,76,255,.4));}
/* pathLength="100" (set on each <circle> in the markup) normalises every
   ring's dash math to 0-100 regardless of its actual radius, so all three
   rings -- different circumferences -- can share one keyframe animation
   and still trace the exact same arc/gap at every instant, matching how
   the reference's three rings move in lockstep rather than spiralling
   apart. stroke-dashoffset alone (no transform:rotate) is what makes the
   gap travel around the ring -- the gradient stays fixed in screen space
   (red low, blue/violet high) exactly like the reference, instead of
   rotating with the ring the way a transform-based spinner would. */
.ring-arc{fill:none;stroke:url(#ringGrad);stroke-linecap:round;
  stroke-dasharray:2 98;stroke-dashoffset:0;transform-origin:60px 60px;
  animation:ringSweep 2.4s ease-in-out infinite;}
.ring-arc-1{stroke-width:3;}
.ring-arc-2{stroke-width:2.4;opacity:.85;}
.ring-arc-3{stroke-width:1.8;opacity:.7;}
@keyframes ringSweep{
  0%{stroke-dasharray:2 98;stroke-dashoffset:0;}
  50%{stroke-dasharray:78 22;stroke-dashoffset:-38;}
  100%{stroke-dasharray:2 98;stroke-dashoffset:-100;}
}
.ls-percent{position:relative;z-index:1;font-weight:800;font-size:clamp(20px,7vw,28px);color:#ff3b44;letter-spacing:.02em;
  text-shadow:0 0 10px rgba(227,6,19,.85),0 0 22px rgba(227,6,19,.4);}
/* ── Download APP screen ──
   Owner: "make when one taps download, it opens and middle there is a button
   download, and in background there is image uploaded from admin panel."
   The admin image fills the panel; the button sits dead centre on top of it.
   min-height uses the sheet's own visible box (the sheet stops 68px short of
   the bottom for the nav bar), so "middle" is the middle of what is actually
   on screen -- 100vh here would push the button below the fold. */
/* Bleeds to the sheet's own edges: .sheet-body is padded 4px 20px 40px, and
   .sheet-bg itself stops 68px short of the bottom for the nav bar, under a
   ~66px .sheet-head. So the panel spans exactly what is visible. */
.dl-screen{position:relative;min-height:calc(100vh - var(--nav-h) - 66px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--chipz-grad);margin:-4px -20px -40px;}
.dl-screen .dl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* The image is uploaded by the owner and could be anything -- pale, busy,
   white. The scrim is what guarantees the white title and the button edge
   stay legible on top of whatever lands here, rather than hoping. */
.dl-screen .dl-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,4,.32) 0%,rgba(10,6,4,.62) 100%);}
/* Owner: "middle there is a button download" -- the BUTTON is what has to sit
   in the middle, not the block of text that happens to contain it. Centring
   the whole card puts the heading and blurb above it, which pushes the button
   about 60px below the real centre. Three rows with equal 1fr top and bottom
   put the button itself dead centre, with the text hanging off it either way. */
.dl-screen .dl-body{position:relative;z-index:1;width:100%;max-width:320px;padding:0 22px;text-align:center;color:#fff;
  display:grid;grid-template-rows:1fr auto 1fr;min-height:calc(100vh - var(--nav-h) - 66px);}
.dl-screen .dl-top{align-self:end;padding-bottom:26px;}
.dl-screen .dl-mark{display:flex;justify-content:center;margin-bottom:18px;}
.dl-screen .dl-title{font-size:24px;font-weight:700;margin:0 0 10px;color:#fff;}
.dl-screen .dl-sub{font-size:14px;line-height:1.6;margin:0 0 26px;color:rgba(255,255,255,.86);}
.dl-screen .dl-btn{width:100%;padding:16px 0;font-size:16px;font-weight:700;letter-spacing:.04em;}
.dl-screen .dl-note{font-size:12.5px;line-height:1.6;margin:16px 0 0;color:rgba(255,255,255,.78);}
#loadingScreen .spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
/* Owner: "when one taps recharge after having select amount it should
   bring a spin loader so as to open the screen which is for selecting
   network and number" -- proceedToManualPaymentMethod() already swapped
   the button's own label for this markup during its brief transition to
   the network/number screen, but .mini-spin was never actually given any
   CSS -- an empty, invisible <div>, so tapping Recharge visibly did
   nothing for 400ms before the next screen appeared. Real gap, not just
   too subtle; same white-on-wine spinner style as .primary-button already
   uses elsewhere, sized to sit cleanly inside a button. */
.mini-spin{width:18px;height:18px;margin:0 auto;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite;}
/* Owner: "establish a timer ie like saying snow opening in 23:59:34... so it

#openingGate{position:fixed;inset:0;z-index:501;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--chipz-hero);color:#fff;}

/* ── SKELETON LOADERS ──
   Owner: "use skeleton loaders exactly how the screen contents will appear
   after load." So these are not generic grey bars -- each one is built from
   the same measurements as the real thing it stands in for, so nothing jumps
   when the data lands. Before this, a first-ever visit with nothing cached
   painted the real screen with empty data: "0 plans", zeroed totals, an empty
   member list -- indistinguishable from a member who genuinely has none.
   The shimmer stays. It is what makes a block read as "loading" rather than
   as a broken empty box, and it is not the content-entrance animation that
   was removed earlier. */
/* A tint, not a flat colour: --snow-neutral-soft was so close to the cream
   page that the blocks were invisible on it. An alpha tint reads at the same
   strength on the page AND on the white cards the skeletons sit inside. */
.sk{position:relative;overflow:hidden;background:rgba(60,26,14,.09);border-radius:var(--r-ctl);}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:skShimmer 1.25s ease-in-out infinite;}

.sk-line.sm{height:10px;}
.sk-line.lg{height:22px;}
/* Product card: image block at 4:3, then the 2x2 stat grid and the CTA, laid
   out by the real .p-card rules so the swap is invisible. */
.sk-pcard{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);overflow:hidden;}
.sk-pcard .sk-img{aspect-ratio:16/9;border-radius:0;}
.sk-pcard .sk-body{padding:10px;}
.sk-pcard .sk-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}

.sk-filters{display:flex;gap:8px;margin:0 16px 12px;}

/* Team: two stat cards over the level switcher and member rows. */

.sk-tcards .sk{flex:1;height:104px;}
.sk-member{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--snow-border);}

/* ── MY PRODUCTS ──
   Deliberately not Snow's layout. Snow leads with three white count tiles
   and a flat "Active Plans" list; this leads with the one figure a member
   actually wants -- what they are still owed -- on a full-bleed band, then
   filters (Running / Matured / All, which Snow has no equivalent of), then

   and a live next-payout countdown. */
.mp-band{margin:0 0 14px;padding:20px 18px 16px;background:var(--chipz-hero);color:#fff;}
.mp-band-k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600;}

.mp-band-row span{display:block;font-size:13px;opacity:.75;}

/* Owner: "remove counter showing number of plans, it is in userpanel so
   remove it." The `<i>3</i>` badge is gone from the markup, so its two
   rules go with it rather than styling an element that no longer exists. */
.mp-f{flex:1;min-width:0;height:42px;border:1px solid var(--snow-border);background:var(--snow-surface);color:var(--snow-muted);border-radius:var(--r-ctl);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:none;}

.mp-chip.done{background:var(--snow-neutral-soft);color:var(--snow-muted);}
/* Owner: "remove progress bar on running products so on you will see how
   you'll organize it but remove progress bar."
   The bar is gone. This line used to be its CAPTION -- two muted greys sitting
   6px under the track, which without the bar above them read as a leftover
   label rather than content. So it takes over the bar's own slot (13px, where
   the eye already expects the next thing after the header) and the day count
   is promoted to ink at the row's weight: the fact the bar was drawing is now
   simply stated. The right-hand half stays muted, because "26 days left" is
   the same arithmetic said a second way and should not compete with it. */
.mp-days{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--snow-muted);margin-top:13px;}
.mp-days .lead{display:flex;align-items:center;gap:9px;min-width:0;}

/* Owner: "make sure that one running investment, it shows Date bought."
   Its own quiet line rather than a third column in .mp-figs: those columns
   would drop from 161px to 104px each, and "UGX 571,300.00" at 16px does not
   fit in 104. Shown on matured rows too -- when a finished plan was bought is
   the same fact, and hiding it there would be an odd gap. */
.mp-bought{font-size:12.5px;color:var(--snow-muted);margin-top:5px;}

/* ── THE ONGOING MARK ──
   Owner sent this as a 180px standalone loader ("put this animation on aside of
   running product, it should be well defined") -- three chips orbiting a
   pulsing centre one.

   Every length is a fraction of --s rather than a fixed px, so the shape is
   IDENTICAL at any size. Shrinking his 180px original with transform:scale()
   was the other option and is worse here: it would drop the 2px speckle
   highlights to a third of a pixel, where they stop being texture and become
   dirt. Same reason the speckles are dropped outright at this size -- at 32px
   they are sub-pixel either way, and his gold-to-ember gradient is what
   actually carries the chip.

   32px is measured, not guessed: rendered at 24/30/36/44 and compared, the
   three triangles stay separately readable down to about 30 and mush below it.

   It marks ONLY ongoing plans -- a matured one has nothing in motion -- and
   holds still for a phone that asked for less motion. */
.pspin{--s:32px;width:var(--s);height:var(--s);position:relative;flex:none;}
.pspin-orbit{position:absolute;inset:0;animation:pspinOrbit 1.8s linear infinite;}
.pspin-chip{position:absolute;width:calc(var(--s)*.30);height:calc(var(--s)*.278);
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:linear-gradient(145deg,#ffd85f 0%,#f7aa27 32%,#e97918 65%,#b9430e 100%);
  animation:pspinGlow .9s ease-in-out infinite alternate;}
.pspin-chip:nth-child(1){top:calc(var(--s)*.011);left:calc(var(--s)*.35);transform:rotate(4deg);}
.pspin-chip:nth-child(2){right:calc(var(--s)*.022);bottom:calc(var(--s)*.15);transform:rotate(125deg);animation-delay:.2s;}
.pspin-chip:nth-child(3){left:calc(var(--s)*.022);bottom:calc(var(--s)*.15);transform:rotate(235deg);animation-delay:.4s;}
.pspin-core{position:absolute;width:calc(var(--s)*.417);height:calc(var(--s)*.383);
  left:50%;top:50%;
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:linear-gradient(145deg,#ffe06b 0%,#f7ae29 34%,#e67917 67%,#b6400d 100%);
  filter:drop-shadow(0 calc(var(--s)*.044) calc(var(--s)*.033) rgba(96,35,3,.36));
  animation:pspinPulse 1.15s ease-in-out infinite;}
.pspin-glow{position:absolute;width:calc(var(--s)*.44);height:calc(var(--s)*.11);left:50%;top:62%;
  border-radius:50%;background:rgba(255,121,0,.28);
  filter:blur(calc(var(--s)*.061));animation:pspinShadow 1.15s ease-in-out infinite;}
@keyframes pspinOrbit{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pspinGlow{
  from{filter:drop-shadow(0 1px 1px rgba(102,40,6,.22)) brightness(.95);}
  to{filter:drop-shadow(0 2px 2px rgba(102,40,6,.38)) brightness(1.12);}}
@keyframes pspinPulse{
  0%,100%{transform:translate(-50%,-50%) scale(.88) rotate(-5deg);}
  50%{transform:translate(-50%,-50%) scale(1.08) rotate(5deg);}}
@keyframes pspinShadow{
  0%,100%{opacity:.35;transform:translateX(-50%) scale(.75);}
  50%{opacity:.9;transform:translateX(-50%) scale(1.2);}}
@media (prefers-reduced-motion:reduce){
  .pspin-orbit,.pspin-chip,.pspin-core,.pspin-glow{animation:none;}
  .pspin-core{transform:translate(-50%,-50%);}
  .pspin-glow{transform:translateX(-50%);}
}
.mp-figs{display:flex;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--snow-border);}

   dark pill. Sits on the app surface like every other card now. */

/* Home's lower banner, replacing the product strip. Full-bleed like the top
   one, with the Go spin call to action sitting on it. */
.spin-banner{position:relative;margin:0 0 14px;min-height:150px;background:var(--chipz-hero);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.spin-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.spin-cta{position:relative;margin:0 0 18px;padding:0 30px;height:44px;border:0;border-radius:var(--r-ctl);background:var(--chipz-grad);color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:none;}
.spin-cta:active{opacity:.85;}
/* The animated brand mark filling Home's leftover strip above the nav.
   max-height is in vh on purpose -- a GIF arrives at whatever size it was
   exported at, and one tall upload would otherwise push Home into scrolling.
   The right padding is wider than the left by the width of the floating
   chest: the chest is position:fixed over that corner, so centring inside
   the FULL width would put the mark half under it. This centres it in the
   space that is actually free, which is what reads as centred on the phone.
   pointer-events:none so the strip can never eat a tap meant for the chest. */
.home-gif{display:flex;align-items:center;justify-content:center;padding:2px 96px 0 18px;pointer-events:none;}
.home-gif img{max-width:100%;max-height:20vh;width:auto;height:auto;display:block;}

.hb-stripes{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 14px,transparent 14px 30px);}

/* Admin video banner (Home.dc.html). Owner: "l dont want it to be tappable
   or pause or play, l want it to go or run on its own." So the play ring is

   passes straight through, it cannot be paused, and there is no long-press
