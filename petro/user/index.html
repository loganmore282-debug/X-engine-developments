      <circle class="ring-arc ring-arc-2" cx="60" cy="60" r="45" pathLength="100"/>
      <circle class="ring-arc ring-arc-3" cx="60" cy="60" r="38" pathLength="100"/>
    </svg>
    <div class="ls-percent" id="lsPercent" role="status" aria-label="Loading">0</div>
  </div>
</div>

<script>
/* THE APP'S NAME, PAINTED BEFORE ANYTHING ELSE.
 *
 * Owner: "l had made a little bit changes in names but on start up loader it
 * was still saying chipz."
 *
 * He is describing a real gap, not a bug in the rename. The name lives in
 * Admin -> Settings and reaches the app over the network, but the loading
 * screen is on screen precisely while that request is in flight -- so the
 * loader could only ever show whatever was compiled into this file, and what
 * was compiled in was the old name. Every boot, forever.
 *
 * So the name is remembered on the device the first time it is known, and
 * this runs before the 250KB core inflates: every launch after the very first
 * paints the real name in the first frame. The DOMContentLoaded pass catches
 * every [data-brandmark] further down the document -- currently just the
 * pre-launch countdown gate's own mark, since the loading screen no longer
 * carries one.
 *
 * Nothing here falls back to a hard-coded name. Owner: "let's not make chipz
 * to be default name" -- on a genuinely first-ever launch the mark stays
 * blank for the moment it takes settings to land. A blank that fills in is
 * honest; the wrong name is not.
 *
 * The mark is built with createTextNode/createElement rather than innerHTML.
 * The server already refuses < and > in the name, but this value has been
 * through localStorage, and building nodes is injection-proof by
 * construction instead of by remembering to escape.
 */
(function(){
  var KEY = 'chipz_brand_name';
  var name = '';
  try { name = (localStorage.getItem(KEY) || '').trim(); } catch (e) {}
  // The module reads this instead of its own localStorage: one read, one
  // place that knows the key.
  window.__brandCached = name;
  if (!name) return;
  document.title = name;
  var up = name.toUpperCase();
  // Just the name -- the last-letter-in-accent-colour "CHIP+Z" split was a
  // pun specific to Chipz's own name, meaningless for any other brand, so
  // it isn't carried over here (matches brandWordmarkHtml() in the module,
  // which this pre-core paint has to mirror since it runs before the module
  // exists).
  window.__paintBrandMarks = function(){
    var els = document.querySelectorAll('[data-brandmark]');
    for (var i = 0; i < els.length; i++) els[i].textContent = up;
  };
  window.__paintBrandMarks();
  document.addEventListener('DOMContentLoaded', window.__paintBrandMarks);
})();

/* THE LOADER'S PERCENTAGE COUNTER.
 *
 * Purely cosmetic, same as the reference GIF's own counter -- boot time
 * genuinely varies (cold backend, slow network), so this was never a real
 * progress bar, just the same "still working" motion the reference shows:
 * climbs 0-100 in uneven steps, wraps back to 0, repeats.
 *
 * A MutationObserver on #loadingScreen's own `style` attribute starts and
 * stops the interval, rather than editing every one of the ~10 call sites
 * that show/hide the loading screen mid-session (login, sign-up, returning
 * to the app, etc.) -- one place that reacts to visibility instead of many
 * places that would each have to remember to announce it.
 */
(function(){
  var ls = document.getElementById('loadingScreen');
  var el = ls && ls.querySelector('.ls-percent');
  if (!ls || !el) return;
  var n = 0, timer = null;
  function tick(){
    n += 2 + Math.floor(Math.random() * 5);
    if (n >= 100) n = 0;
    el.textContent = n;
  }
  function shown(){ return ls.style.display !== 'none'; }
  function sync(){
    if (shown() && !timer) { n = 0; el.textContent = '0'; timer = setInterval(tick, 110); }
    else if (!shown() && timer) { clearInterval(timer); timer = null; }
  }
  sync();
  try { new MutationObserver(sync).observe(ls, { attributes: true, attributeFilter: ['style'] }); } catch (e) {}
})();
</script>

    <button class="back" onclick="closeSheet()" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><linearGradient id="chipzBack" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3ad4e8"/><stop offset="1" stop-color="#2f6fed"/></linearGradient></defs><path d="M15 5l-7 7 7 7" stroke="url(#chipzBack)" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 id="sheetTitle"></h2>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="confirm-bg" id="confirmBg" onclick="if(event.target===this)closeConfirm()">
  <div class="confirm-sheet" id="confirmSheet"></div>
</div>

<!-- Message detail (Messages.dc.html): a bottom sheet that slides up over
     the inbox list, with an X top-right. -->
<div class="msg-detail-bg" id="msgDetailBg" onclick="if(event.target===this)closeMessageDetail()">
  <div class="msg-detail" id="msgDetail"></div>
</div>

<!-- Announcement dialog REMOVED (owner: "remove announcement everywhere") --
     see petro/CLAUDE.md's "Design system" section. -->

<!-- Generic alert/toast (notify()) -- owner: "don't send the same notify
     design as old Chipz code, make these dark small, not designed, and
     open/appear from down." Replaced the old centred white card + dimmed
     backdrop + amber warning-triangle emoji with a small dark toast that
     slides up from the bottom, auto-dismisses, and never blocks the rest of
     the screen (the backdrop itself takes no taps -- only the toast card
     does). Same #notifyBg/#notifyMsg ids and the same notify()/closeNotify()
     signatures as before, so every one of this file's many call sites needed
     no change at all -- only how this renders changed. -->
<div class="notify-bg" id="notifyBg">
  <div class="notify-card" onclick="closeNotify()">
    <div class="notify-msg" id="notifyMsg"></div>
  </div>
</div>

<!-- Treasure-chest win state (ChestSuccess.dc.html): a full green flash
     behind a Congratulations card. Its own layer, not a sheet -- it covers
     the chest screen it was opened from. -->
<div class="chest-win-bg" id="chestWinBg">
  <img class="chest-win-ghost" id="chestWinGhost" src="/treasure-chest.png" alt="">
  <div class="chest-win-card">
    <h1>Congratulations!</h1>
    <div class="sub">You won</div>
    <div class="amt" id="chestWinAmount"></div>
    <div class="bal" id="chestWinBalance"></div>
    <button class="dark-button" style="width:100%;height:52px;padding:0;letter-spacing:.06em;" onclick="closeChestWin()">COLLECT</button>
  </div>
</div>

<!-- Owner: "see critically after confirm deposit a loader saying Redirecting
     to payment." Shown only while /deposit/marzpay is actually in flight, and
     taken down by the same finally{} that re-enables the button, so it can
     never be left covering the form after a failure.

     His mockup dims the form to a dark wash; this uses a light scrim in the
     app's own paper instead, because "l nolonger need those dark things, use
     app color and theme not dark" was a standing instruction from the round
     that rebuilt the poll screen, and a dark sheet here would contradict it
     two screens apart. -->
<div class="dep-redirect" id="depRedirect" aria-hidden="true">
  <div class="dep-redirect-inner">
    <div class="dep-redirect-ring"></div>
    <div class="dep-redirect-text">Redirecting to payment…</div>
  </div>
</div>

<!-- Owner: "include nav arrow '<', and its title space, on that payment page."
     Reuses .sheet-head verbatim so this header IS the app's header, not a
     lookalike -- same gradient, same 30px chevron, same centred title. The
     gradient gets its own id (chipzBackPay): two <linearGradient> elements
     sharing an id in one document is a duplicate-id bug, and although both
     happen to be identical today, a later change to one would silently and
     confusingly repaint the other.
     #depStatusBody is a DIV, not a <p>: the pending state renders an <ol>
     of steps, and an <ol> inside a <p> is invalid and gets reparented by
     the browser, which drops the list out of the card entirely. -->
<div class="pay-page" id="depStatusBg">
  <div class="sheet-head pay-head">
    <button class="back" onclick="closeDepositStatusModal()" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><linearGradient id="chipzBackPay" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3ad4e8"/><stop offset="1" stop-color="#2f6fed"/></linearGradient></defs><path d="M15 5l-7 7 7 7" stroke="url(#chipzBackPay)" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 id="depStatusHeadTitle">Recharge</h2>
  </div>
  <div class="pay-body">
    <div class="pay-card">
      <div class="dep-status-icon" id="depStatusIcon"></div>
      <h3 id="depStatusTitle">Processing your recharge</h3>
      <div id="depStatusBody"></div>
      <div class="pay-actions">
        <button class="secondary-button" id="depVerifyBtn" style="display:none;" onclick="verifyDepositNow()">Verify</button>
        <button class="primary-button" id="depStatusCloseBtn" style="display:none;" onclick="closeDepositStatusModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="mp-overlay" id="manualPayBg">
  <button type="button" class="mp-back-btn" onclick="closeManualPayOverlay()" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div id="manualPayFlow"></div>
</div>


<script type="module">
  import { initializeApp, getApps }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut,
           updatePassword, reauthenticateWithCredential, EmailAuthProvider }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    // PLACEHOLDER -- this is NOT a real Firebase project. It must be replaced
    // with Petro's own project's web config before anything can sign in.
    // Deliberately broken rather than left pointing at Chipz's real project:
    // a copy-pasted deploy must fail loudly here, not authenticate Petro's
    // members into Chipz's live user pool. See petro/CLAUDE.md.
    apiKey: "AIzaSyCOij0DRicI7MKDEibIlFfm0n3dl_faOnM",
    authDomain: "chnpetrol.firebaseapp.com",
    projectId: "chnpetrol",
    storageBucket: "chnpetrol.firebasestorage.app",
    messagingSenderId: "969724557876",
    appId: "1:969724557876:web:553284e329bdfd146a2861",
    measurementId: "G-HXG8ZVCMWS"
  };
  const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.fbCreateUser = (email, pass) => createUserWithEmailAndPassword(auth, email, pass);
  window.fbSignIn     = (email, pass) => signInWithEmailAndPassword(auth, email, pass);
  window.fbSignOut    = () => signOut(auth);
  window.fbAuth       = auth;
  // Change Login Password (Account -> Login Password). Firebase requires a
  // recent sign-in before updatePassword(), so the old password the member
  // types is used to reauthenticate first -- that also doubles as the
  // "is this really you" check, which is why the screen asks for it.
  window.fbChangePassword = async (email, oldPass, newPass) => {
    const user = auth.currentUser;
    if (!user) throw new Error('not-signed-in');
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(email, oldPass));
    await updatePassword(user, newPass);
  };
  onAuthStateChanged(auth, (user) => { window.dispatchEvent(new CustomEvent('snow-auth', { detail: user })); });
</script>
