<title>Petro</title>
<!-- The SAME policy render.yaml sends as a header, carried in the file itself.
     It is here because this page does not only ship from Render: the frontend
     is also deployed to EdgeOne (see CLAUDE.md, and the .edgeone.* entries in
     CORS_ALLOWED_SUFFIXES), and a host header cannot follow a file to another
     host. A meta policy travels with index.html, so the app is covered
     wherever it is uploaded.

     What this actually buys, on a money app: script injected into this page
     cannot POST a member's balance, session token or Trade Password to a
     server the attacker controls, and cannot LOAD a script from one. That is
     connect-src and script-src's host list; everything else here is
     supporting work.

     'unsafe-inline' in script-src is REQUIRED and must not be "tidied away":
     build-core.js ships the whole app as one inline <script> (s.textContent =
     code), which no hash can cover because the content changes every build.

     'unsafe-eval' is deliberately ABSENT, and there is one expected, harmless
     CSP violation on every load because of it. build-core.js / build-admin.js
     set `disableConsoleOutput: true`, and javascript-obfuscator implements
     that with a global-object helper shaped like
         try { g = Function('return this')(); } catch (e) { g = window; }
     Function() is eval, so the browser blocks it and reports a violation --
     then the catch assigns `window`, which is the same object it was reaching
     for, and the bundle carries on. Verified by test-csp-runtime.py, which
     walks every tab and sheet under the real policy.

     Do NOT add 'unsafe-eval' to silence that one line. It would let any
     injected script build code from a string, which is most of what this
     policy is here to prevent, in exchange for a warning that changes
     nothing. test-csp-runtime.py allows that exact violation and fails on
     any other, so a NEW eval -- one without a fallback, that really would
     break something -- is still caught.

     frame-ancestors is NOT here: a meta policy cannot express it (the browser
     ignores it), which is exactly why render.yaml keeps sending the header
     version too. The two are not redundant. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' http://179.198.197.114:3000 https://*.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- Owner: "why app still have red upper title color? it takes space even."
     That red band above the app is Android painting the status bar with
     theme-color, and at #e21b2a it reads as a separate red title bar sitting
     on top of the app rather than as part of it -- which is exactly why it
     looks like it is taking space. Set to the app's own paper, the status bar
     becomes the top of the page and the band disappears. Chrome picks dark
     status icons for a light theme colour, so the clock stays readable.
     NOTE: manifest.json's theme_color must match, and an ALREADY-INSTALLED
     app keeps the colour it was installed with until it is reinstalled. -->
<meta name="theme-color" content="#f7f7f8">
<link rel="manifest" href="/manifest.json">
<!-- The app icon and the share card are both admin-uploadable, which is why
     these point at petro-server rather than at the files sitting next to
     this one. Neither consumer can be reached from our JavaScript: Chrome
     reads the icon out of manifest.json when a member installs the app, and
     the WhatsApp / Telegram / Facebook crawler reads the og: tags below when
     someone pastes the link -- crawlers do not run scripts. So both have to
     be real files at fixed URLs, and the server swaps what sits behind them.
     It falls back to the bundled icon-192/512.png, so these never 404.
     THESE URLS ARE PERMANENT. Changing a path here breaks the installed
     icon and every previously-shared link at the same time. -->
<link rel="icon" href="http://179.198.197.114:3000/public/app-icon-192.png">
<link rel="apple-touch-icon" href="http://179.198.197.114:3000/public/app-icon-192.png">
<meta name="description" content="Petro — invest, earn daily income, and grow your team.">
<!-- ── og:image IS THE BACKEND ROUTE, SO THE UPLOADED CARD IS WHAT SHOWS ──
     Owner: "l wanted the uploaded link preview to be shown not the
     hardcoded, please check out that very well."

     It pointed at a static file shipped with this build, which meant the
     admin panel's Link preview upload changed nothing a crawler ever saw --
     only a redeploy could change the share card. It names the BACKEND's
     /public/link-preview.jpg again, which serves the upload when there is
     one. A static host cannot do that: it has no database and runs no code.

     The two reasons that route was abandoned are both dealt with, and it is
     worth knowing why, because they were real at the time:

     1. "It 404s when nothing has been uploaded." It no longer can --
        BRAND_ASSET_SLOTS['link-preview'] now falls back to the bundled
        user/link-preview.jpg read off disk, exactly as the app icon has
        always fallen back to icon-512.png. Upload set -> the upload; no
        upload, or the database unreachable -> this build's own card.
     2. "The backend sleeps, and a crawler only waits a few seconds."
        petro-server is a PAID Render instance and does not sleep. That
        reasoning was carried over from a free-tier assumption and was
        already wrong for this deploy.

     Same host as the manifest's icons on purpose: these two consumers are
     the same shape (no script, no data: URI, a fixed permanent URL), and the
     icon has been served this way from the backend all along.

     THE URL IS PERMANENT. It is absolute and names the backend's own stable
     host because an og:image must resolve for a crawler with no page
     context, and the members' domain changes per country while this one
     never does.

     Two things an upload does NOT reach, stated in the panel's own copy
     because they otherwise come back as bug reports: a link somebody has
     ALREADY shared keeps the preview WhatsApp/Facebook cached for it
     (appending anything, e.g. ?x=2, forces a refetch), and the route's own
     five-minute cache means a fresh fetch can show the old card for up to
     that long.
-->
<!-- og:url is deliberately absent. A crawler falls back to the URL it
     actually fetched, so the card keeps working on any domain the app is
     served from; a hard-coded one would silently go stale the day a custom
     domain is added. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Petro">
<meta property="og:title" content="Petro">
<meta property="og:description" content="Invest, earn daily income, and grow your team.">
<meta property="og:image" content="http://179.198.197.114:3000/public/link-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Petro">
<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:description" content="Invest, earn daily income, and grow your team.">
<meta name="twitter:image" content="http://179.198.197.114:3000/public/link-preview.jpg">

<!-- All admin-selectable number/digit fonts (see NUMBER_FONT_STACKS in
     original_module.js) loaded in one request -- Georgia and "System
     default" need no webfont, so they aren't listed here. Loading every
     option up front (not just whichever is currently selected) means
     switching the admin setting never needs a fresh network request or a
     page reload to take visible effect. -->
<!-- Barlow Condensed/Playfair Display/Bodoni Moda/DM Serif Display/Roboto
     Mono/JetBrains Mono/Orbitron were Petro's own font auditioning, carried
     into this fork unmodified -- Barlow Condensed was the one actually in
     use (body{font-family} below, the single source every other rule's
     font-family:inherit reads from); the other six were dead imports,
     referenced nowhere else in this file, just extra network weight on
     every load. Inter replaces Barlow Condensed as this app's own body/
     number font: a plain, normal-width sans (Barlow Condensed is
     condensed/narrow, which combined with this app's many font-weight:700/
     800 rules is what read as "still Petro's bold font") with weights wide
     enough that headings/buttons don't need to reach for 800 to stand out. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Petro design tokens ──────────────────────────────────────────────
   Value-only swap of the token names this codebase already uses everywhere
   (the same convention Snow's own history documents for its repeated colour
   changes) -- every existing rule keeps working, the whole app reskins at
   once. Petro's palette is the bold Doritos-style red->orange gradient on a
   warm cream/paper ground; --snow-green stays a real green because it is
   used semantically (positive amounts, success pills), not as a brand
   accent. */
:root{
  /* ── Re-themed to Petro's own "Premium Industrial Energy" identity ──
     Owner-specified, not invented: Corporate Red #E30613 (primary --
     headers, buttons, active nav, cards), Clean White #FFFFFF (dashboard
     background), Golden Orange #F5A000-#FFB000 (secondary accent, off the
     logo and refinery/sunset lighting), Charcoal #25262B (auth glass
     panels, text, secondary UI). Green stays FUNCTIONAL ONLY (success
     states) -- explicitly not a theme color, so those tokens are the one
     set below left untouched. Variable NAMES are kept (--snow-* / --petro-*)
     with only the VALUES swapped -- the same low-risk convention this file's
     own admin-src.html already used for its own re-theme (see that file's
     --gold comment): every one of the hundreds of rules in this file already
     reads these tokens, so nothing downstream needed touching to pick up
     the new palette. */
  --snow-canvas:#f7f7f8;
  --snow-surface:#ffffff;
  --snow-ink:#25262b;
  --snow-muted:#6b6d76;
  --snow-wine:#e30613;
  --snow-wine-deep:#b10510;
  --snow-green:#1a7a3e;
  --snow-border:#ececee;
  --snow-wave-on-wine:#ffd9a0;
  --snow-green-deep:#146030;
  --snow-wine-soft:#fbd9dc;
  --snow-green-soft:#dff2e2;
  --snow-neutral-soft:#f5f5f6;
  --snow-radius-card:22px;
  --snow-radius-tile:16px;
  --snow-radius-control:16px;
  --snow-radius-sheet:32px;
  /* Petro additions (no Snow equivalent) */
  /* Bottom nav height. Grew from 68px when the icons did -- owner, twice:
     "the nav icons are small". */
  --nav-h:68px;
  --petro-orange:#f5a000;
  /* Flat, not a gradient -- the mockup's cards/buttons/header are a solid
     corporate red, not Petro's old red-to-orange blend. Still a CSS custom
     property assignable straight into `background:`, so every one of the
     ~40 rules that read --petro-grad needed no change at all. */
  --petro-grad:#e30613;
  /* .auth-hero's fallback ONLY -- shown behind the Login/Sign Up glass
     panel until the owner uploads the real sunset-refinery photo to the
     'authhero' image slot (already-built admin upload, see
     /admin/petro-image/set + PETRO_IMAGE_SLOTS in server.js). Charcoal to
     deep red to gold, echoing that same warm dusk-over-a-refinery mood as a
     photo-free placeholder rather than a random gradient. */
  --petro-hero:linear-gradient(160deg,#25262b 0%,#7a0e14 55%,#f5a000 100%);
  --petro-gold:#ffb000;
  --petro-neg:#7a0e14;
  /* Not blue -- the owner was explicit this should not read as "the typical
     blue/green fintech look." Deep red carries the same "this is a link"
     legibility a blue would, without introducing a fifth brand color. */
  --petro-link:#b10510;
  --petro-shelf:#b10510;
  /* ── Surfaces ──
     Owner, holding a mockup next to the live app: "the mock up has very
     clean CSS, well ultra definition and quality cards and colour ... clean
     cards, well defined and high quality."

     What actually separated the two was not colour. Ninety-one rules
     hardcoded `border-radius:4px` -- square, at the size where a corner
     reads as an unfinished edge rather than a decision -- and every card
     leaned on a hard 1px hairline with a shadow so far offset
     (`-16px`/`-24px` spread) that it never drew a pixel. A hairline with no
     shadow is a wireframe; a shadow with no hairline is a smudge. Cards need
     both, and the corner has to be big enough to see.

     These three radii are now the ONLY ones in the file, so a card can never
     again be 4px in one place and 16px in another:
       --r-card  panels, list rows, sheets, anything holding content
       --r-ctl   buttons, inputs, chips, tiles -- tighter, so a control
                 reads as pressable rather than as a small card
       --r-pill  status pills, accent bars, progress tracks
     Two-layer shadow: a 1-2px contact shadow that defines the edge, plus a
     wide soft one that lifts it off the cream canvas. One layer alone gives
     you either a hard line or a haze. */
  --r-card:16px;
  --r-ctl:12px;
  --r-pill:999px;
  --sh-card:0 1px 2px rgba(30,10,5,.05),0 12px 26px -16px rgba(30,10,5,.34);
  --sh-card-hi:0 2px 4px rgba(30,10,5,.06),0 22px 42px -20px rgba(30,10,5,.42);
  /* The hairline, dialled back: it is now an edge highlight sitting on top of
     a real shadow, not the only thing holding the card together. */
  --line-soft:rgba(239,224,211,.72);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;}
*{-webkit-tap-highlight-color:transparent;}
body{background:var(--snow-canvas);font-weight:400;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--snow-ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-variant-numeric:lining-nums tabular-nums;font-family:var(--number-font,inherit);}
/* Petro leads with a serif display face for headings/figures over a
   condensed sans for body copy, matching every approved mockup. */
h1,h2,h3,.section-title,.stat-val,.bal-value{}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}
a{color:inherit;}
/* Keep the scrollbar subtle on the document as well as nested scroll areas. */
html,body{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:var(--r-pill);}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.35);}
::-webkit-scrollbar-corner{background:transparent;}

.app-card{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--sh-card);}
/* Owner: "l also need 3d buttons" -- a solid darker shelf under every primary
   CTA plus a real press-down :active state, applied once here so every button
   in the app picks it up. */
.primary-button{background:var(--petro-grad);color:#fff;border:none;border-radius:var(--r-ctl);font-weight:700;letter-spacing:.02em;
  box-shadow:none;
  transform:translateY(0);transition:transform .1s,box-shadow .1s;}
.primary-button:active:not(:disabled){transform:translateY(4px);box-shadow:none;}
.primary-button:disabled{opacity:.5;box-shadow:none;}
.secondary-button{background:var(--snow-surface);color:var(--snow-wine);border:1.6px solid var(--snow-wine);border-radius:var(--r-ctl);font-weight:700;
  box-shadow:0 4px 0 var(--snow-border);transform:translateY(0);transition:transform .1s,box-shadow .1s;}
.secondary-button:active:not(:disabled){opacity:.85;}
/* Dark variant used for Log Out / Edit Wallet, per the Account + Wallet mockups. */
.dark-button{background:var(--snow-ink);color:#fff;border:none;border-radius:var(--r-ctl);font-weight:700;letter-spacing:.04em;
  box-shadow:none;transition:opacity .1s;}
.dark-button:active:not(:disabled){opacity:.85;}
/* Petro CTAs stay visually stable at rest. The old perpetual highlight sweep
   was inherited interaction choreography; only deliberate press/focus states
   move now, which keeps the industrial interface quiet and predictable. */

/* Team member Active / Pending. Same treatment as the record pills, for the
   same reason -- one pill vocabulary across the app, so a status looks like a
   status wherever it appears. Pending stays deliberately quiet: it is the
   absence of a thing, and shouting it would make every new referral look like
   a problem. */
.status-pill{display:inline-block;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;letter-spacing:.03em;padding:5px 13px;}
.status-pill.active{background:linear-gradient(135deg,#35c46c,#12894a);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 5px 12px -6px rgba(18,137,74,.7);}
.status-pill.pending{background:var(--snow-neutral-soft);color:var(--snow-muted);border:1px solid var(--line-soft);font-weight:600;}

/* --nav-h is the ONE place the bar's height is written. Four other rules
   depend on it (the page's bottom padding, the sheet overlay's bottom
   inset, the Download panel's height) and they used to repeat 68 as a
   literal, so growing the bar meant finding all four. */
.bottom-nav{z-index:210;background:rgba(255,255,255,.98);border-top:1px solid var(--snow-border);display:flex;align-items:center;justify-content:space-around;height:var(--nav-h);position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:0 8px;box-shadow:0 -10px 30px -28px rgba(37,38,43,.55);}
.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--snow-muted);background:none;border:none;padding:8px 2px 6px;flex:1;min-width:0;position:relative;}
/* Petro navigation is an industrial rail, not Petro's springy selector box.
   The active tab is marked by a restrained red line that stays anchored to
   the bar; taps use a short signal-dip, with no squash/overshoot/bounce. */
.navitem::before{content:'';position:absolute;top:0;left:50%;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--snow-wine);opacity:0;transform:translateX(-50%) scaleX(.35);transform-origin:center;transition:opacity .16s ease,transform .16s ease;}
.navitem.active::before{opacity:1;transform:translateX(-50%) scaleX(1);}
.navitem .nav-ic,.navitem .lbl{position:relative;z-index:1;}
.navitem .nav-ic{display:flex;align-items:center;justify-content:center;width:30px;height:30px;color:var(--snow-muted);transition:color .16s ease,transform .16s ease;}
.navitem .nav-ic svg,.navitem .nav-ic .supplied-icon{width:24px;height:24px;flex:0 0 24px;transition:transform .16s ease,opacity .16s ease;}
.navitem .lbl{font-size:10px;font-weight:600;white-space:nowrap;transition:color .16s ease;}
.navitem.active{color:var(--snow-wine);}
.navitem.active .nav-ic{color:var(--snow-wine);transform:translateY(-1px);}
.navitem.active .lbl{font-weight:700;color:var(--snow-wine);}
.navitem.nav-tap .nav-ic svg,.navitem.nav-tap .nav-ic .supplied-icon{animation:navTapSignal .18s ease-out;}
@keyframes navTapSignal{
  0%{transform:translateY(0);opacity:1;}
  45%{transform:translateY(1px);opacity:.62;}
  100%{transform:translateY(0);opacity:1;}}
@media (prefers-reduced-motion:reduce){
  .navitem::before,.navitem .nav-ic,.navitem .nav-ic svg,.navitem .lbl{transition:none;}
  .navitem.nav-tap .nav-ic svg,.navitem.nav-tap .nav-ic .supplied-icon{animation:none;}}



.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark .wm-text{font-weight:700;letter-spacing:2px;}

.stat-label{font-size:10px;color:var(--snow-muted);text-transform:uppercase;letter-spacing:.35px;}
.stat-val{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;color:var(--snow-ink);margin-top:2px;}
.section-title{font-size:17px;font-weight:700;color:var(--snow-ink);}

.stat-tile{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:12px;box-shadow:var(--sh-card);}
.icon-tile{border-radius:var(--r-ctl);background:var(--snow-wine-soft);color:var(--snow-wine);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Product card, per the owner's reference screenshot: the NAME sits on top,
   centred and large, then the full-width image, then a 2x2 grid of tinted
   stat tiles, then a full-width Buy Now. The reference is a screenshot of
   an unrelated app in a purple/blue theme -- layout, labels and proportions
   are copied, the colours are Petro's own (CLAUDE.md's design-fidelity
   rule). */
/* Owner: "product cards are rounded and large, they should be small and not
   rounded." The 22px radius and 170px image came from the mockup, but with
   four money tiles under them each card filled a whole phone screen. Tighter
   radius, half the image height, and smaller type -- roughly half the height
   per card, so several are visible at once. */
/* Owner: no title bar -- the product name sits ON the image. Product photos
   are stored at exactly 1600x900 px, 16:9 (the admin panel cover-fits every
   upload onto that frame), so the card frame is aspect-ratio driven rather
   than a fixed pixel height: the image fills it exactly, with no letterboxing,
   whatever the phone's width. 1600 px wide still covers a 3x phone at the
   ~355 px card width, so it stays sharp.

   This was 4:3 until the owner sent his real artwork -- 1721x914, near enough
   16:9 -- with "reduce on the size of cards their height is very high, just
   like you see that resolution it should be that". 4:3 was the cause: at a
   354 px card the image alone was 264 px tall and the whole card 422 px, so
   barely two fitted on a phone screen. 16:9 takes the image to 199 px and the
   card to 357 px. Measured, not estimated. */
.p-card{background:var(--snow-surface);border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line-soft);box-shadow:var(--sh-card);}
/* Owner: "l also want when l tap on the product card it fades in then out,
   but no action just it is animation but no action should be there on
   triggering buy."
   So the CARD acknowledges a tap and does nothing else. Buying stays behind
   the Buy Now button alone -- tapping a card must never start a purchase,
   which is why this is a class toggled by a listener rather than any kind of
   onclick handler on the card itself.

   The first version dipped OPACITY to .62 and left transform alone. Owner:
   "you failed to understand, cozy when l tap it just cause faint image
   instead of make product card bounce in or fade in and out minimumly." He is
   right, and the reason is worth keeping: fading a card does not read as the
   card responding, it reads as the card briefly failing to draw. A press is a
   physical event, so the acknowledgement has to be physical -- the card gives
   under the finger and springs back.

   Same spring curve as the nav icon, a fraction of its amplitude. The nav
   icon squashes to .74 and overshoots to 1.18, which is right for a 30px
   glyph and would look like the whole screen lurching on a 360px-wide card.
   "Minimumly": 2.8% in, under 1% out -- enough to see, not enough to move the
   layout under the finger. Nothing here changes opacity, so the card never
   goes faint again. */
.p-card.card-tap{animation:cardTapBounce .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardTapBounce{
  0%{transform:scale(1);}
  34%{transform:scale(.972);}   /* in  */
  68%{transform:scale(1.008);}  /* out */
  100%{transform:scale(1);}}
@media (prefers-reduced-motion:reduce){.p-card.card-tap{animation:none;}}
.p-card .p-img{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#ffd9a0,#f5a000);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.p-card .p-img img{width:100%;height:100%;object-fit:cover;display:block;}
.p-card .p-img .glyph{width:52px;height:52px;border-radius:var(--r-ctl);background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;}
/* A scrim, not a solid bar -- the name has to stay readable over whatever
   photo is uploaded without hiding the top of it. */
.p-card .p-name{position:absolute;left:0;right:0;bottom:0;padding:24px 13px 10px;color:#fff;font-weight:700;font-size:19px;letter-spacing:.01em;
  background:linear-gradient(to top,rgba(20,8,4,.72) 0%,rgba(20,8,4,.42) 55%,rgba(20,8,4,0) 100%);text-shadow:0 1px 4px rgba(0,0,0,.5);}
.p-card .p-body{padding:10px;}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px;}
.p-stat{background:var(--snow-green-soft);border-radius:var(--r-ctl);padding:8px 6px;text-align:center;}
.p-stat.warm{background:var(--snow-wine-soft);}
.p-stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--snow-muted);font-weight:600;}
.p-stat .v{font-size:16px;font-weight:700;color:var(--snow-ink);margin-top:2px;font-family:var(--number-font,inherit);white-space:nowrap;}
.p-card .p-cta{width:100%;height:44px;padding:0;font-size:16px;letter-spacing:.04em;border-radius:var(--r-ctl);}
.product-card__stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:10px 16px;}
.product-card__cta{width:100%;min-height:44px;margin-top:16px;border-radius:var(--r-ctl);font-size:14px;}

.plan-card{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:18px;box-shadow:var(--sh-card);}

.segmented-control,.team-level-switcher{display:flex;background:var(--snow-neutral-soft);border-radius:var(--r-ctl);padding:4px;gap:4px;}
.segmented-control .seg,.team-level-switcher .seg{flex:1;text-align:center;padding:9px 0;border-radius:var(--r-ctl);font-size:13px;font-weight:500;color:var(--snow-muted);background:none;border:none;}
.segmented-control .seg.active,.team-level-switcher .seg.active{background:#fff;font-weight:700;color:var(--snow-wine);box-shadow:0 4px 12px -8px rgba(17,17,17,.3);}

.settings-list{background:var(--snow-surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:4px 16px;box-shadow:var(--sh-card);}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--snow-border);}
.list-row:last-child{border-bottom:none;}



.team-referral-card{position:relative;overflow:hidden;min-height:210px;padding:22px;border-radius:var(--r-card);color:#fff;background:var(--petro-hero);box-shadow:0 16px 32px -22px rgba(17,17,17,.35);}
.team-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.team-deposits-card{grid-column:1 / -1;position:relative;overflow:hidden;border-radius:var(--r-card);padding:20px;color:#fff;background:linear-gradient(145deg,var(--snow-green),var(--snow-green-deep));box-shadow:0 14px 28px -22px rgba(17,17,17,.3);}

/* ── App chrome not in the mockups: auth, sheets, forms, toast, loading ── */
.wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;background:var(--snow-canvas);padding-bottom:calc(var(--nav-h) + 20px);}
/* Rebuilt entirely per the owner's own reference GIF, frame-by-frame
   (a 167-frame loop): three concentric rings, red at the bottom fading to
   blue/violet at the top, whose visible arc continuously grows/shrinks
   AND travels around the circle (not a fixed spinner), glowing, with a
   plain numeric counter climbing 0-100 dead centre -- no wordmark, no
   background image, no gradient backdrop, pure black. Owner: "remove it
   even it has background image like that of petro, remove it entirely,
   only put that loader everywhere for loading pages... check that loader
   in gif carefully how it works and use it." The old dark-red gradient
   backdrop and the Petro wordmark/wave treatment are gone, not
   just restyled -- there is nothing left here that came from Petro. */
#loadingScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:500;}
#openingGate .og-mark{font-weight:800;font-size:36px;letter-spacing:.03em;color:#fff;}
.ring-loader-wrap{position:relative;width:min(38vw,150px);height:min(38vw,150px);display:flex;align-items:center;justify-content:center;}
.ring-loader{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 0 7px rgba(227,6,19,.55)) drop-shadow(0 0 16px rgba(107,76,255,.4));}
/* pathLength="100" (set on each <circle> in the markup) normalises every
   ring's dash math to 0-100 regardless of its actual radius, so all three
   rings -- different circumferences -- can share one keyframe animation
   and still trace the exact same arc/gap at every instant, matching how
   the reference's three rings move in lockstep rather than spiralling
   apart. stroke-dashoffset alone (no transform:rotate) is what makes the
   gap travel around the ring -- the gradient stays fixed in screen space
   (red low, blue/violet high) exactly like the reference, instead of
   rotating with the ring the way a transform-based spinner would. */
.ring-arc{fill:none;stroke:url(#ringGrad);stroke-linecap:round;
  stroke-dasharray:2 98;stroke-dashoffset:0;transform-origin:60px 60px;
  animation:ringSweep 2.4s ease-in-out infinite;}
.ring-arc-1{stroke-width:3;}
.ring-arc-2{stroke-width:2.4;opacity:.85;}
.ring-arc-3{stroke-width:1.8;opacity:.7;}
@keyframes ringSweep{
  0%{stroke-dasharray:2 98;stroke-dashoffset:0;}
  50%{stroke-dasharray:78 22;stroke-dashoffset:-38;}
  100%{stroke-dasharray:2 98;stroke-dashoffset:-100;}
}
.ls-percent{position:relative;z-index:1;font-weight:800;font-size:clamp(20px,7vw,28px);color:#ff3b44;letter-spacing:.02em;
  text-shadow:0 0 10px rgba(227,6,19,.85),0 0 22px rgba(227,6,19,.4);}
/* ── Download APP screen ──
   Owner: "make when one taps download, it opens and middle there is a button
   download, and in background there is image uploaded from admin panel."
   The admin image fills the panel; the button sits dead centre on top of it.
   min-height uses the sheet's own visible box (the sheet stops 68px short of
   the bottom for the nav bar), so "middle" is the middle of what is actually
   on screen -- 100vh here would push the button below the fold. */
/* Bleeds to the sheet's own edges: .sheet-body is padded 4px 20px 40px, and
   .sheet-bg itself stops 68px short of the bottom for the nav bar, under a
   ~66px .sheet-head. So the panel spans exactly what is visible. */
.dl-screen{position:relative;min-height:calc(100vh - var(--nav-h) - 66px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--petro-grad);margin:-4px -20px -40px;}
.dl-screen .dl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* The image is uploaded by the owner and could be anything -- pale, busy,
   white. The scrim is what guarantees the white title and the button edge
   stay legible on top of whatever lands here, rather than hoping. */
.dl-screen .dl-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,4,.32) 0%,rgba(10,6,4,.62) 100%);}
/* Owner: "middle there is a button download" -- the BUTTON is what has to sit
   in the middle, not the block of text that happens to contain it. Centring
   the whole card puts the heading and blurb above it, which pushes the button
   about 60px below the real centre. Three rows with equal 1fr top and bottom
   put the button itself dead centre, with the text hanging off it either way. */
.dl-screen .dl-body{position:relative;z-index:1;width:100%;max-width:320px;padding:0 22px;text-align:center;color:#fff;
  display:grid;grid-template-rows:1fr auto 1fr;min-height:calc(100vh - var(--nav-h) - 66px);}
.dl-screen .dl-top{align-self:end;padding-bottom:26px;}
.dl-screen .dl-mark{display:flex;justify-content:center;margin-bottom:18px;}
.dl-screen .dl-title{font-size:24px;font-weight:700;margin:0 0 10px;color:#fff;}
.dl-screen .dl-sub{font-size:14px;line-height:1.6;margin:0 0 26px;color:rgba(255,255,255,.86);}
.dl-screen .dl-btn{width:100%;padding:16px 0;font-size:16px;font-weight:700;letter-spacing:.04em;}
.dl-screen .dl-note{font-size:12.5px;line-height:1.6;margin:16px 0 0;color:rgba(255,255,255,.78);}
#loadingScreen .spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
/* Owner: "when one taps recharge after having select amount it should
   bring a spin loader so as to open the screen which is for selecting
   network and number" -- proceedToManualPaymentMethod() already swapped
   the button's own label for this markup during its brief transition to
   the network/number screen, but .mini-spin was never actually given any
   CSS -- an empty, invisible <div>, so tapping Recharge visibly did
   nothing for 400ms before the next screen appeared. Real gap, not just
   too subtle; same white-on-wine spinner style as .primary-button already
   uses elsewhere, sized to sit cleanly inside a button. */
.mini-spin{width:18px;height:18px;margin:0 auto;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite;}
/* Owner: "establish a timer ie like saying snow opening in 23:59:34... so it
   will be after the start up loader" -- a pre-launch gate shown instead of
   the login/app once the loading screen would otherwise hand off, admin-
   toggleable next to Maintenance mode in Settings. Same wine-gradient hero
   background as the auth screen for visual consistency, not a new palette. */
#openingGate{position:fixed;inset:0;z-index:501;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--petro-hero);color:#fff;}
#openingGate .og-label{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:18px;}
#openingGate .og-countdown{font-size:40px;font-weight:700;margin-top:10px;font-variant-numeric:lining-nums tabular-nums;font-family:var(--number-font,inherit);}
#openingGate .og-sub{font-size:13px;color:rgba(255,255,255,.65);margin-top:14px;max-width:320px;line-height:1.5;}
@keyframes tickerFlow{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes chestSwing{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.chest-hang{animation:chestSwing 2.6s ease-in-out infinite;transform-origin:50% -6px;}

/* ── Home / Products / Referral (Petro mockups) ───────────────────── */
.home-topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--snow-surface);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -8px rgba(20,10,5,.3);position:relative;flex-shrink:0;color:var(--snow-ink);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--snow-wine);border:2px solid var(--snow-surface);}
.top-wordmark{font-weight:800;font-size:20px;letter-spacing:.03em;color:var(--snow-ink);}
/* Petro's own rule here was edge-to-edge, no rounding, no side gutters
   (owner, at the time: "it should complete the margin"). The new mockup
   shows the opposite -- a rounded, inset card with visible white margin
   either side, so this follows the new mockup rather than the old Petro
   preference; .ref-banner (the Referral page's own banner, not shown in
   any mockup yet) keeps the original edge-to-edge treatment. */
.home-banner{margin:0 18px 14px;height:190px;border-radius:var(--r-card);position:relative;overflow:hidden;background:var(--petro-hero);}
.ref-banner{margin:0 0 14px;height:190px;border-radius:0;position:relative;overflow:hidden;background:var(--petro-hero);}
/* ── SKELETON LOADERS ──
   Owner: "use skeleton loaders exactly how the screen contents will appear
   after load." So these are not generic grey bars -- each one is built from
   the same measurements as the real thing it stands in for, so nothing jumps
   when the data lands. Before this, a first-ever visit with nothing cached
   painted the real screen with empty data: "0 plans", zeroed totals, an empty
   member list -- indistinguishable from a member who genuinely has none.
   The shimmer stays. It is what makes a block read as "loading" rather than
   as a broken empty box, and it is not the content-entrance animation that
   was removed earlier. */
/* A tint, not a flat colour: --snow-neutral-soft was so close to the cream
   page that the blocks were invisible on it. An alpha tint reads at the same
   strength on the page AND on the white cards the skeletons sit inside. */
.sk{position:relative;overflow:hidden;background:rgba(60,26,14,.09);border-radius:var(--r-ctl);}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:skShimmer 1.25s ease-in-out infinite;}
@keyframes skShimmer{100%{transform:translateX(100%);}}

/* Team: two stat cards over the level switcher and member rows. */

/* ── THE ONGOING MARK ──
   Owner sent this as a 180px standalone loader ("put this animation on aside of
   running product, it should be well defined") -- three chips orbiting a
   pulsing centre one.

   Every length is a fraction of --s rather than a fixed px, so the shape is
   IDENTICAL at any size. Shrinking his 180px original with transform:scale()
   was the other option and is worse here: it would drop the 2px speckle
   highlights to a third of a pixel, where they stop being texture and become
   dirt. Same reason the speckles are dropped outright at this size -- at 32px
   they are sub-pixel either way, and his gold-to-ember gradient is what
   actually carries the chip.

   32px is measured, not guessed: rendered at 24/30/36/44 and compared, the
   three triangles stay separately readable down to about 30 and mush below it.

   It marks ONLY ongoing plans -- a matured one has nothing in motion -- and
   holds still for a phone that asked for less motion. */
.pspin{--s:32px;width:var(--s);height:var(--s);position:relative;flex:none;}
.pspin-orbit{position:absolute;inset:0;animation:pspinOrbit 1.8s linear infinite;}
.pspin-chip{position:absolute;width:calc(var(--s)*.30);height:calc(var(--s)*.278);
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:linear-gradient(145deg,#ffd85f 0%,#f7aa27 32%,#e97918 65%,#b9430e 100%);
  animation:pspinGlow .9s ease-in-out infinite alternate;}
.pspin-chip:nth-child(1){top:calc(var(--s)*.011);left:calc(var(--s)*.35);transform:rotate(4deg);}
.pspin-chip:nth-child(2){right:calc(var(--s)*.022);bottom:calc(var(--s)*.15);transform:rotate(125deg);animation-delay:.2s;}
.pspin-chip:nth-child(3){left:calc(var(--s)*.022);bottom:calc(var(--s)*.15);transform:rotate(235deg);animation-delay:.4s;}
.pspin-core{position:absolute;width:calc(var(--s)*.417);height:calc(var(--s)*.383);
  left:50%;top:50%;
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:linear-gradient(145deg,#ffe06b 0%,#f7ae29 34%,#e67917 67%,#b6400d 100%);
  filter:drop-shadow(0 calc(var(--s)*.044) calc(var(--s)*.033) rgba(96,35,3,.36));
  animation:pspinPulse 1.15s ease-in-out infinite;}
.pspin-glow{position:absolute;width:calc(var(--s)*.44);height:calc(var(--s)*.11);left:50%;top:62%;
  border-radius:50%;background:rgba(255,121,0,.28);
  filter:blur(calc(var(--s)*.061));animation:pspinShadow 1.15s ease-in-out infinite;}
@keyframes pspinOrbit{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pspinGlow{
  from{filter:drop-shadow(0 1px 1px rgba(102,40,6,.22)) brightness(.95);}
  to{filter:drop-shadow(0 2px 2px rgba(102,40,6,.38)) brightness(1.12);}}
@keyframes pspinPulse{
  0%,100%{transform:translate(-50%,-50%) scale(.88) rotate(-5deg);}
  50%{transform:translate(-50%,-50%) scale(1.08) rotate(5deg);}}
@keyframes pspinShadow{
  0%,100%{opacity:.35;transform:translateX(-50%) scale(.75);}
  50%{opacity:.9;transform:translateX(-50%) scale(1.2);}}
@media (prefers-reduced-motion:reduce){
  .pspin-orbit,.pspin-chip,.pspin-core,.pspin-glow{animation:none;}
  .pspin-core{transform:translate(-50%,-50%);}
  .pspin-glow{transform:translateX(-50%);}
}

.home-banner img{display:block;width:100%;height:100%;object-fit:cover;}
/* Admin video banner (Home.dc.html). Owner: "l dont want it to be tappable
   or pause or play, l want it to go or run on its own." So the play ring is
   gone entirely and the video takes NO pointer events -- a tap on the banner
   passes straight through, it cannot be paused, and there is no long-press
   menu on it. It starts itself (autoplay+muted+loop+playsinline, with
   tryAutoplayHomeBanner()'s retries behind it). */
.home-banner video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.home-banner video::-webkit-media-controls{display:none!important;}
/* A video URL that 404s or is an unplayable format would otherwise leave a
   flat empty block; fall back to the same striped hero the no-banner state
   uses. */
.home-banner.hb-video-failed video{display:none;}
.home-banner.hb-video-failed{background:var(--petro-hero);}
.home-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 18px;margin:-42px 18px 16px;position:relative;z-index:3;}
.home-action{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;color:var(--snow-ink);}
/* Solid red circle, white glyph -- the mockup's Deposit/Withdraw/Invite/
   Support tiles. Real SVG (see ICONS.cardPlus etc.) replacing the old
   Petro raster PNGs, which is why this now paints its own background
   instead of leaving it to the image. */
.home-action .badge{width:56px;height:56px;border-radius:50%;background:var(--petro-grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -10px rgba(227,6,19,.55);}
.home-action .badge svg{width:22px;height:22px;}
.home-action .badge img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(30,10,5,.28));}
.supplied-icon{display:block;background:currentColor;-webkit-mask:var(--supplied-icon) center/contain no-repeat;mask:var(--supplied-icon) center/contain no-repeat;}
.home-action .badge .supplied-icon{width:26px;height:26px;}
.home-action .lbl{font-size:12px;font-weight:600;}
/* ── Home top bar v2 (logo + tagline + Notifications/Support) ──
   Was a solid Corporate Red band on every screen that reuses this class
   (Home, Account, Network, My Assets...). Owner: "remove all red headers"
   -- at that frequency a colored band reads as repetitive page furniture,
   same call as .sheet-head above. White bar now; the PETRO mark becomes a

.home-topbar-v2{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 10px;background:var(--snow-surface);color:var(--snow-ink);border-bottom:1px solid var(--snow-border);}

/* ── Daily Check-in card ── */

/* Coloured-circle row icons -- three tones, cycled per row to match the

@keyframes fuelFlow{from{background-position:0 0;}to{background-position:220% 0;}}
@media (prefers-reduced-motion:reduce){.mar-progress i{animation:none;background-position:0 0;}}
.mar-foot{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:10.5px;color:var(--snow-muted);}
.mar-foot span:last-child{text-align:right;}
.my-assets-empty{padding:70px 0;text-align:center;color:var(--snow-muted);font-size:13px;}
.asset-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:0;background:var(--snow-surface);border-radius:var(--r-card);padding:0;margin-bottom:14px;overflow:hidden;box-shadow:var(--sh-card);}
.asset-thumb{width:112px;height:112px;border-radius:0;overflow:hidden;align-self:start;background:var(--snow-neutral-soft);}
.asset-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.ar-glyph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--snow-muted);}
.asset-body{min-width:0;padding:13px 14px 14px;}
.asset-name{font-size:15px;font-weight:800;color:var(--snow-ink);margin-bottom:7px;}
.asset-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;margin-bottom:11px;}
.asset-stats span{font-size:10px;color:var(--snow-muted);font-weight:600;display:flex;align-items:baseline;gap:3px;}
.asset-stats b{color:var(--snow-ink);font-weight:800;margin-left:2px;}
.asset-row .p-cta{width:100%;height:40px;padding:0;font-size:13px;margin:0;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 12px;}
.page-head h2{margin:0;font-size:23px;font-weight:400;letter-spacing:.02em;}
.page-head span{font-size:12.5px;color:var(--snow-muted);font-weight:500;}
.url-row{display:flex;align-items:center;gap:10px;background:var(--snow-neutral-soft);border:1.5px solid var(--snow-border);border-radius:var(--r-ctl);padding:0 14px;min-height:66px;margin-bottom:18px;}
.url-row span{flex:1;min-width:0;font-size:12px;line-height:1.45;color:var(--snow-muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;}
.url-row .copy-ic{width:45px;height:42px;border-radius:var(--r-ctl);background:var(--snow-wine-soft);color:var(--snow-wine);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
.url-row .copy-ic svg{width:22px;height:22px;display:block;}
/* Owner: "the copy turns to tick." Green, as in his -- a tick in the brand red
   would read as an error mark. Applies to every copy control (the URL row's
   icon, the manual-payment number/name buttons) and to the labelled button,
   which swaps its text to "Copied" instead of its icon. */
.copy-ic.copied,.mp-copybtn.copied{background:var(--snow-green-soft);color:var(--snow-green);}
.primary-button.copied{pointer-events:none;}
.lv-line{font-size:13px;font-weight:700;color:var(--snow-ink);margin:4px 0;}

/* ── The member card, measured off his mockup ──────────────────────────
   Owner: "l need that exactly what you're seeing, all the arrangements, have
   you seen even those green winnings on cards, l need them, also figures are
   small why?"

   THE GREEN EDGE is real and ours had none. Sampled straight out from the left
   edge of his card 1: G-R reaches +12 and G-B +10 in the two pixels just
   outside it, then decays to the page's own +1 over about 8 device px. Ours
   carried `var(--sh-card)`, a warm brown drop shadow, and a warm neutral
   border -- no green anywhere. This is the same glow .team-gcard already uses
   above, rgba(74,170,108,...), so the two card families on this one screen
   finally match instead of one being warm and one green.

   Both screenshots are 720 device px wide on the same phone, so
   720/390 = 1.846 device px per CSS px, and his figures convert directly:

     card height   244 dev = 132.2 CSS   (ours was 129)
     gap           28 dev  =  15.2 CSS   (ours was 12)
     side margin   32 dev  =  17.3 CSS   (ours 18 -- unchanged) */
.team-member{background:var(--snow-surface);border:1px solid #dceadd;border-radius:var(--r-card);padding:16px;margin-bottom:15px;
  box-shadow:0 6px 24px rgba(74,170,108,.34),0 2px 8px rgba(74,170,108,.20);}
.team-member .top{display:flex;align-items:center;gap:12px;}
/* The disc holds a mark now (owner: "why the logo is empty?"), so it needs to
   centre one. Mirrors .acct-logo's rules at 44px instead of 68px: cover for an
   uploaded logo so a square upload fills the circle rather than letterboxing,
   and overflow:hidden so it is clipped to the circle either way. */
.team-member .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.team-member .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.team-member .avatar span{color:#fff;font-weight:800;letter-spacing:.04em;line-height:1;}
/* Text sizes derived from INK HEIGHTS, not guessed. Each of his blocks was
   measured, then converted with this app's own measured cap-to-font ratio for
   that same element (same font family, so the ratio transfers) -- and only
   where the two strings share a glyph class, since an ink height that includes
   an ascender or descender is not comparable to one that does not.

     element   his ink   our ink @ our size   -> his size   ours now
     .name       10.8      10 @ 15px             16.2         16
     .phone       8.1       9 @ 12px             10.8         11
     .amt3       13.0      12 @ 16px             17.3         17
     .foot        8.1       8 @ 11px             11.1         11 (unchanged)

   .joined is deliberately absent: his string and ours were different, so ink
   height could not compare them. It is set by WIDTH instead, now that both
   render the same "Joined 07/09/2026 01:21" -- his measures 123.0 CSS wide. */
.team-member .name{font-weight:600;font-size:16px;}
.team-member .phone{font-size:11px;color:var(--snow-muted);font-weight:500;}
.team-member .amt3{margin-left:auto;font-size:17px;font-weight:700;color:var(--snow-wine);}
/* 11px stays: measured by WIDTH, not ink height, now that his string and ours
   are the same. His "Joined 07/09/2026 01:21" runs 123.0 CSS wide; ours at
   11px measures 121.1, inside 2%. Ink height could not have settled this --
   the old text had descenders his has none of.

   The bottom margin is 12, not 8, and it is the whole 3px the card was short:
   his divider sits 94.8 CSS below the card top and ours sat at 91. With 12 it
   lands at 95, the footer line at 104, and the card at 132 against his 131.6. */
.team-member .joined{font-size:11px;color:var(--snow-muted);font-weight:500;margin:10px 0 12px;}
.team-member .ln2{height:1px;background:var(--snow-border);margin-bottom:8px;}
.team-member .foot{font-size:11px;color:var(--snow-muted);font-weight:500;}

/* Team.dc.html's level switcher: three separate pills, the active one filled
   with the brand gradient and its own 3D shelf -- not the soft segmented
   control inherited from Snow. */
.lv-switcher{display:flex;gap:10px;margin:16px 18px 14px;}
.lv-switcher .lv{flex:1;text-align:center;padding:11px 0;border-radius:var(--r-pill);font-weight:700;font-size:14px;border:1.5px solid var(--snow-border);color:var(--snow-muted);background:var(--snow-surface);font-family:inherit;}
.lv-switcher .lv.on{background:var(--petro-grad);color:#fff;border-color:transparent;box-shadow:none;}

/* ── Account (Account.dc.html) ──
   A profile card (logo / ID / phone / wallet balance / Deposit+Withdraw)
   above a plain white SETTINGS list, then a black Log Out button. This
   replaces Snow's coloured card matrix entirely. */
.acct-profile{background:var(--snow-surface);border-radius:var(--r-card);padding:22px;border:1px solid var(--line-soft);box-shadow:var(--sh-card);}
.acct-profile .p-top{display:flex;align-items:center;gap:14px;}
.acct-logo{width:68px;height:68px;border-radius:50%;background:var(--petro-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 10px 20px -12px rgba(226,27,42,.5);}
.acct-logo img{width:100%;height:100%;object-fit:cover;}
.acct-logo span{color:#fff;font-weight:800;font-size:19px;letter-spacing:.06em;}
/* When an animated logo is set it becomes the profile mark itself, and the
   circle has to give way: the source is 300x220 landscape, and cropping that
   to a 60px circle would cut roughly a quarter of its width off the sides.
   So the slot takes the source's own aspect ratio, contains rather than
   covers (nothing cropped, nothing stretched), and drops the gradient
   backing so the file's transparency shows through.
   Resolution: 66px tall renders at 132-198 device pixels on a 2x/3x phone,
   comfortably inside the source's 220px height, so it is always downscaled
   and stays crisp -- it is never blown up past its native size. */
.acct-logo.has-gif{width:auto;height:66px;aspect-ratio:300/220;border-radius:var(--r-ctl);background:none;box-shadow:none;}
.acct-logo.has-gif img{width:100%;height:100%;object-fit:contain;image-rendering:auto;}
.acct-profile .p-id{font-weight:600;font-size:20px;}
.acct-profile .p-phone{color:var(--snow-muted);font-size:16px;font-weight:500;}
.acct-divider{height:1px;background:var(--snow-border);margin:18px 0;}
.acct-profile .bal-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--snow-muted);font-weight:500;text-align:center;}
/* Owner, against a reference screenshot: "the number of account balance is
   large and UGX and colored in the colour of site, so ours should be that
   orange." So the whole figure -- the UGX too, not just the digits -- is the
   brand orange, big and bold, exactly as the reference treats its own brand
   colour. It was 34px in the app's default text weight and ink colour, which
   is what made it read as ordinary body text next to the reference.
   Size is capped by the longest figure that has to fit on a 390px phone
   without wrapping (see test-balance-style.py, which measures the real
   rendered width rather than trusting the number here). */
.acct-profile .bal-value{font-size:44px;font-weight:700;color:var(--petro-orange);
  text-align:center;line-height:1.1;letter-spacing:-.01em;
  /* Pinned to one line on purpose: a balance broken across two lines reads
     as two numbers. fitBalanceText() steps the size down only as far as the
     measured width actually demands, so an ordinary balance keeps all 44px
     and only a very large one shrinks. */
  white-space:nowrap;
  /* fit-content so the box HUGS the digits, which is what makes the gradient
     below span the figure itself instead of the full-width card. max-width
     keeps the overflow test (scrollWidth > clientWidth) working: the box is
     capped at the card's width, so a too-long figure still reports overflow
     and gets stepped down. */
  width:fit-content;max-width:100%;margin:2px auto 18px;}
/* Owner: "but has no gradient just like you see buttons, other side is conc
   another is half conc" -- the Deposit button runs deep red on one end into
   orange on the other, and the figure was a single flat orange next to it.
   Same --petro-grad, same 135deg, painted through the glyphs.
   Guarded by @supports because the fallback for an unsupported
   background-clip is an INVISIBLE balance -- the flat orange above stays as
   the fallback, and only browsers that can actually clip to text get the
   gradient. -webkit-text-fill-color is the one WebKit honours. */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .acct-profile .bal-value{background:var(--petro-grad);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;}
}
/* Every number below is measured off the owner's own mockup, not chosen.
   His screenshot and ours are both 1080 device px wide on the same phone, so
   device pixels compare directly; 1080/390 = 2.769 device px per CSS px.

     icon tile      his 114 dev px -> 41 CSS   (ours was 52, 1.28x too big)
     row pitch      his 193        -> 70 CSS   (ours was 250)
     title ink      his  30        -> 15 CSS   (ours was 35 at 17.5px)
     Deposit btn    his 141 tall   -> 51 CSS   (ours was 58)
     Log Out        his 146 tall   -> 53 CSS   (ours was 54, already right)

   Owner: "see cards in account are very big plus their icons, please use
   exactly the size of mock up, even see button size of withdrawal and
   deposit." Row pitch is tile + 2x padding + the 1px rule: 41 + 28 + 1 = 70,
   which is his 69.7 to within a pixel. */
.acct-btnrow{display:flex;gap:10px;}
.acct-btnrow button{flex:1;height:51px;font-size:16px;padding:0;}
.sec-head{display:flex;align-items:center;gap:9px;margin:26px 0 12px;}
.sec-head .bar{width:4px;height:21px;border-radius:var(--r-pill);background:var(--petro-grad);flex-shrink:0;}
.sec-head h2{font-size:22px;font-weight:400;margin:0;flex-shrink:0;}
.sec-head .ln{flex:1;height:1px;background:var(--snow-border);}
/* The Invitation Reward heading's accent bar. Same shape and gradient as
   .sec-head .bar so the two read as one device, sized to this smaller 17px
   heading rather than Account's 22px one. */
.inv-bar{width:4px;height:17px;border-radius:var(--r-pill);background:var(--petro-grad);flex-shrink:0;display:block;}
/* Owner: "see the settings card is having green line." It is the CARD's own
   border, not the rule beside the heading -- sampled down his left edge it
   holds rgb(236,243,235) from the top of the card to the bottom, G-R = +7,
   a green-tinted hairline rather than the neutral one we had. */
.setting-list{background:var(--snow-surface);border-radius:var(--r-card);overflow:hidden;border:1px solid #dceadd;box-shadow:var(--sh-card);}
.setting-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--snow-border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--snow-ink);font-family:inherit;}
.setting-row:last-child{border-bottom:0;}
.setting-row .sq{width:41px;height:41px;border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--snow-neutral-soft);}
.setting-row .sq svg{width:22px;height:22px;display:block;}
.setting-row .txt{flex:1;min-width:0;}
.setting-row .t1{font-weight:600;font-size:15px;}
.setting-row .t2{font-size:12.5px;color:var(--snow-muted);font-weight:500;}
.setting-row .chev{flex-shrink:0;color:var(--snow-muted);}
/* Each tile carries its OWN background, sampled top-left to bottom-right off
   his mockup -- they are gradients, not flat fills. Two stops were his
   theme's purple and are translated to the brand's orange per the standing
   rule (shape and placement from the mockup, colour from Petro); owner:
   "the first of download app it is purple, so here it should be orange."
   Everything else is his measured colour unchanged, including the pale green
   behind Balance Record that he pointed at specifically.
     download  (100,31,112) -> ( 78, 23, 88)   purple  => deep orange
     wallet    (255,209,12) -> (232,195, 78)
     balance   (177,202,172)-> (224,238,225)
     messages  (254,244,208)-> (250,244,230)
     loginpw   ( 98,52, 98) -> (233,216,188)   purple  => deep orange
     tradepw   (192,161,96) -> (246,202, 15)
   Turntable has no counterpart in his mockup (that row does not exist there),
   so it takes a warm coral that sits between the gold above it and the green
   below rather than inventing a seventh hue out of sequence. */
.setting-row .sq.ic-download{background:linear-gradient(145deg,#b34700,#8a3600);}
.setting-row .sq.ic-wallet  {background:linear-gradient(145deg,#ffd10c,#e8c34e);}
.setting-row .sq.ic-turntable{background:linear-gradient(145deg,#f4a06a,#efc0a2);}
.setting-row .sq.ic-balance {background:linear-gradient(145deg,#b1caac,#e0eee1);}
.setting-row .sq.ic-messages{background:linear-gradient(145deg,#fef4d0,#faf4e6);}
.setting-row .sq.ic-loginpw {background:linear-gradient(145deg,#a8480e,#e9d8bc);}
.setting-row .sq.ic-tradepw {background:linear-gradient(145deg,#c0a160,#f6ca0f);}
/* Language has no counterpart in the owner's mockup (that row does not exist
   there), so like Turntable it takes a tone that sits inside the sequence
   already measured off it rather than introducing a hue of its own -- a
   deeper burnt orange, one step darker than Download APP's so the two do not
   read as the same tile. Its glyph is stroked white, hence the light end
   stays dark enough to keep it legible. */
.setting-row .sq.ic-language{background:linear-gradient(145deg,#8f4a12,#c4763a);
  display:flex;align-items:center;justify-content:center;}
.logout-btn{display:flex;width:100%;height:53px;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-size:16px;letter-spacing:.08em;padding:0;}
/* The owner's own door artwork, at the size his mockup draws it: his
   glyph measures 31x47 device px, which is 17 CSS px tall. Width is left
   auto so the door keeps its own proportions instead of being squashed
   into a square. */
.logout-btn img{height:17px;width:auto;display:block;flex-shrink:0;}

/* ── Payout Wallet hero ──
   Withdrawal gets one deliberate surface: the linked mobile-money wallet.
   The phone number is the hero value; everything around it stays secondary. */
.wallet-card{position:relative;border-radius:var(--r-card);padding:20px;color:#fff;overflow:hidden;margin:0 0 10px;background:rgba(20,12,8,.58);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 28px -18px rgba(0,0,0,.7);}
.wallet-card .row1{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.wallet-ident{display:flex;align-items:center;gap:10px;min-width:0;}
.wallet-card .wc-mark{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.09);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wallet-card .wc-mark svg{width:20px;height:20px;}
.wallet-card .wallet-kicker{font-size:9.5px;line-height:1.2;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.58);font-weight:700;margin-bottom:3px;}
.wallet-card .provider{font-size:15px;font-weight:650;letter-spacing:0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
.wallet-card .wallet-status{font-size:10px;font-weight:750;letter-spacing:.03em;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);padding:5px 9px;border-radius:var(--r-pill);white-space:nowrap;}
.wallet-card .wallet-status.empty{color:rgba(255,255,255,.62);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);}
.wallet-card .wallet-number-label{position:relative;z-index:1;margin-top:26px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:650;}
.wallet-card .num{position:relative;z-index:1;font-size:28px;line-height:1.15;letter-spacing:.025em;margin-top:6px;font-weight:720;color:#fff;font-variant-numeric:tabular-nums;}
.wallet-card .wallet-meta{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.wallet-card .meta-item{min-width:0;}
.wallet-card .meta-item span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:650;margin-bottom:4px;}
.wallet-card .meta-item b{display:block;font-size:12.5px;color:#fff;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wallet-minimal{padding-top:8px;}
.wallet-plain-row{display:flex;align-items:center;gap:16px;padding:22px 2px;border-bottom:1px solid var(--snow-border);}
.wallet-plain-copy{flex:1;min-width:0;}
.wallet-plain-number{font-size:26px;font-weight:700;letter-spacing:.025em;color:var(--snow-ink);font-variant-numeric:tabular-nums;}
.wallet-plain-name{font-size:12px;color:var(--snow-muted);font-weight:550;margin-top:6px;letter-spacing:.02em;}
.wallet-delete{width:40px;height:40px;border:0;background:transparent;color:var(--snow-wine);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
.wallet-delete svg{width:20px;height:20px;}
.wallet-add-form{padding-top:4px;}
.wallet-line-field{height:58px;display:flex;align-items:center;border-bottom:1.5px solid var(--snow-border);margin-bottom:14px;gap:8px;}
.wallet-line-field:focus-within{border-bottom-color:var(--snow-wine);}
.wallet-line-field input{border:0;outline:0;background:transparent;font-size:16px;color:var(--snow-ink);flex:1;min-width:0;font-family:inherit;padding:0 2px;}
.wallet-save{width:100%;height:52px;margin-top:10px;}
.wallet-otp-actions{display:flex;gap:12px;margin-top:12px;}
.wallet-otp-actions button{flex:1;height:48px;border:0;border-radius:var(--r-ctl);font-family:inherit;font-weight:650;}
.wallet-otp-actions button:first-child{background:var(--snow-neutral-soft);color:var(--snow-ink);}
.wallet-minimal #walResendBtn{display:block;text-align:center;margin-top:12px;color:var(--snow-wine);font-size:12px;text-decoration:none;}
.prov-pick{position:relative;}
.prov-pick .prov-input{cursor:pointer;}
.prov-pick .prov-input input{cursor:pointer;}
.prov-caret{color:var(--snow-muted);flex-shrink:0;transition:transform .15s;}
.prov-pick.open .prov-caret{transform:rotate(180deg);}
.prov-list{display:none;position:absolute;left:0;right:0;top:58px;z-index:5;background:var(--snow-surface);border:1px solid var(--snow-border);overflow:hidden;box-shadow:0 14px 28px -14px rgba(30,10,5,.35);}
.prov-pick.open .prov-list{display:block;}
.prov-opt{display:block;width:100%;text-align:left;background:var(--snow-surface);border:0;border-bottom:1px solid var(--snow-border);padding:14px 12px;font-family:inherit;font-size:14px;color:var(--snow-ink);cursor:pointer;}
.prov-opt:last-child{border-bottom:0;}
.prov-opt:active{background:var(--snow-neutral-soft);}
.prov-opt.on{color:var(--snow-wine);font-weight:650;}
.plain-h2{font-size:17px;font-weight:700;margin:0 0 12px;}
.wallet-summary{display:flex;align-items:center;justify-content:space-between;background:var(--snow-surface);border:1.5px solid var(--snow-border);border-radius:var(--r-card);padding:16px 18px;gap:10px;}
.wallet-summary .prov{font-weight:600;font-size:14px;flex-shrink:0;}
.wallet-summary .masked{font-size:14px;color:var(--snow-muted);}
.wallet-summary .holder{font-size:13px;font-weight:500;text-align:right;line-height:1.3;}

/* ── Deposit: flat transaction form ──
   One hierarchy, no secondary cards: amount first, quick values as shortcuts,
   then payment phone. Inputs stay controls; instructions sit directly on page. */
.dep-sec{display:flex;align-items:center;margin:0 0 10px;}
.dep-sec .bar{display:none;}
.dep-sec span{font-size:13px;font-weight:650;letter-spacing:.02em;color:var(--snow-muted);}
.dep-amt{height:64px;display:flex;align-items:center;padding:0 2px;margin-bottom:8px;background:transparent;border:0;border-bottom:1.6px solid var(--snow-border);border-radius:0;}

/* A dark, small, centred toast -- owner: "don't send the same notify design
   as old Petro code... make these dark small, not designed" (kept), then
   later: "l nolonger need such notifies of in page... all notifies in
   middle not bottom" -- moved from bottom-anchored to the middle of the
   screen, and this is now the ONLY place a validation/error message shows
   anywhere in the app (the auth screens used to write their own inline
   pink error boxes into the page instead of calling this -- see
   regError()/forgotError() and doLogin() in original_module.js -- that
   second pattern is gone, not just hidden). No dimmed backdrop and no OK

   tapping it), it also auto-dismisses on its own (see notify()'s timer),

/* ── Messages (MessagesList.dc.html / Messages.dc.html) ── */
/* Owner: "they have design ... the mock up has a very clean css, high
   quality and definition." His unread row is not a flat white rectangle: it
   is a soft gradient card carrying a TINTED glow in the accent hue, so an
   unread message looks lit rather than merely outlined. Ours had the accent
   only as a 3px bar on the left edge, which is a marker, not a design.
   The glow is the brand's warm one for the same reason the backdrop is --
   his green belongs to his theme. */
.msg-row{display:flex;align-items:flex-start;gap:14px;background:linear-gradient(135deg,#ffffff 0%,#fff6ef 100%);border:1px solid var(--line-soft);border-left:3px solid var(--snow-wine);border-radius:var(--r-card);padding:16px;margin-bottom:12px;width:100%;text-align:left;font-family:inherit;color:var(--snow-ink);box-shadow:0 1px 2px rgba(30,10,5,.05),0 12px 26px -14px rgba(226,27,42,.42);}
/* A read message loses the lift as well as the bar -- it is done with, and
   should sit back rather than keep competing with the unread ones. */
.msg-row.read{background:var(--snow-surface);border-left-color:var(--snow-border);box-shadow:var(--sh-card);}
/* Same raised disc as the Balance Record avatars -- one avatar treatment
   across the app, not two that nearly match. */
.msg-row .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(145deg,#eafaee 0%,#b8e6c6 100%);color:#116434;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  box-shadow:0 6px 14px -6px rgba(20,96,48,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.msg-row .txt{flex:1;min-width:0;}
.msg-row .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.msg-row .t1{font-weight:600;font-size:15px;line-height:1.35;}
.msg-row .date{font-size:11px;color:var(--snow-muted);font-weight:500;text-align:right;flex-shrink:0;white-space:nowrap;}
.msg-row .t2{font-size:12px;color:var(--snow-muted);font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Owner, holding his mockup's before/after beside ours: "you can see blurry
   green, and message doesn't slide from down."
   Both halves measured off the two screenshots at matched width.

   THE BACKDROP. His reads rgb(163,218,186) -- luminance 189, a LIGHT tinted
   wash with the list visibly blurred behind it. Ours read rgb(134,125,118),
   luminance 126: a flat grey-brown dim, no blur, no hue. The difference is
   not "a bit darker", it is the opposite operation -- his lifts and tints the
   page, ours drops a dirty sheet over it.
   The tint here is the BRAND's warm one, not his green. His mockups are drawn
   in a purple/green theme; a green wash is the right answer in that app and
   would be the only green surface in this one. The effect is his, the hue is
   Petro's -- say the word and it goes green.
   backdrop-filter is what does the blurring; the rgba on top does the tint.
   Both are needed: the blur alone leaves the colour of whatever is behind it,
   and the tint alone is what we already had.

   ROUND 2, owner: "the mockup shows good blur very well but see yours, not
   even blur ... see the message when tapped, it leaves a nav icons but see
   yours how you did it."
   Two separate faults, both measured off his latest screenshot.
   (1) The blur WAS applying -- the tint was hiding it. At .42 the wash was
       opaque enough that the blurred page underneath stopped being legible as
       content, which is what "not even blur" describes: you cannot see a blur
       you cannot see through. His backdrop keeps the list's shapes plainly
       visible behind the glass. Tint down to .26, blur up to 20px, so there is
       something recognisable behind it.
   (2) His overlay STOPS ABOVE THE BOTTOM BAR -- sampling his left gutter, the
       tint runs to y=1841 of 2085 and the nav below it is untinted and sharp.
       Ours covered the whole screen. `bottom:var(--nav-h)` is the same rule
       .sheet-bg already uses, so this is the app's own convention rather than
       a number invented here.

   ROUND 3, and (1) above had overshot: 20px is not "minimal". Owner: "see the
   blur in my mockup it is minimal such that you can even see some texts in
   background." Measured over the strip above the card in both screenshots:

                    luminance   stdev   edge p99
        his            190.9     10.9        8
        ours (20px)    216.2      1.4        3

   stdev and edge energy are what matter -- they say how much STRUCTURE
   survives, i.e. whether there is anything left to read. Ours was FLAT: the
   content was not blurred, it was erased. Luminance cannot see that, and
   chasing luminance is exactly how round 2 landed on a backdrop that hit the
   right brightness with nothing legible behind it.

   blur/tint were then swept over the REAL popup on the REAL list
   (tune-msg-blur.py, 28 combinations) and read back the same three ways.
   5px/.22 reproduces his stdev exactly (10.9). The luminance still reads
   higher than his and that is correct to ignore: his list sits on a green
   page and ours on a white sheet, so brightness here is a property of his
   CONTENT, not of his blur. */
.msg-detail-bg{position:fixed;left:0;right:0;top:0;bottom:var(--nav-h);
  background:rgba(238,112,34,.22);
  -webkit-backdrop-filter:blur(5px) saturate(1.15);backdrop-filter:blur(5px) saturate(1.15);
  display:none;align-items:flex-end;z-index:305;}
/* No backdrop-filter (older Android WebViews): a light tint alone would leave
   the page behind fully legible and the card floating on nothing, so lean on
   opacity instead. Deliberate, not accidental. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .msg-detail-bg{background:rgba(238,112,34,.62);}
}
.msg-detail-bg.show{display:flex;}
/* A FLOATING card, not a sheet welded to the screen edge -- that is what
   "poorly designed it" is pointing at. Measured off his screenshot: the card
   spans x=45..1035 of 1080, so a 4.2% side inset (16px at 390), its bottom
   edge sits 39px above the overlay's own bottom (another ~16px), and every
   corner is rounded. Its height is 898 of 2085 = 43% of the screen; the old
   58vh minimum made a short message noticeably taller than his.
   It still rises from below -- the owner asked for that in an earlier round
   and this does not undo it; it now travels to a resting place 16px up rather
   than to the screen edge. */
.msg-detail{width:calc(100% - 32px);max-width:448px;margin:0 auto 16px;background:var(--snow-surface);border-radius:26px;padding:26px 22px 30px;position:relative;box-shadow:0 18px 44px -14px rgba(20,10,5,.42);animation:sheetUp .42s cubic-bezier(.22,1,.36,1);min-height:43vh;max-height:calc(100% - 32px);overflow-y:auto;}
/* It really slides now. It was translateY(24px) over .22s -- a nudge you have
   to be looking for, which is exactly "message doesn't slide from down". From
   100% of its own height means it starts fully below the fold and travels the
   whole way up. */
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.msg-detail .xbtn{position:absolute;top:18px;right:18px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;color:var(--snow-ink);}
.msg-detail .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;padding-right:30px;}
.msg-detail .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(145deg,#eafaee 0%,#b8e6c6 100%);color:#116434;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  box-shadow:0 6px 14px -6px rgba(20,96,48,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.msg-detail h2{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.35;}
.msg-detail .date{font-size:11px;color:var(--snow-muted);font-weight:500;}
.msg-detail .ln{height:1px;background:var(--snow-border);margin-bottom:16px;}
.msg-detail .content{font-size:14px;line-height:1.75;color:var(--snow-ink);font-weight:500;white-space:pre-line;}

/* ── Change Login / Trade Password (ChangeLoginPassword.dc.html, ChangePassword.dc.html) ── */
.pw-note{font-size:13px;color:var(--snow-muted);font-weight:500;line-height:1.6;margin:0 0 24px;}
.pw-label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--snow-muted);margin:0 0 7px;}
.pw-field{background:transparent;border:0;border-bottom:1.5px solid var(--snow-border);border-radius:0;height:56px;display:flex;align-items:center;padding:0 2px;margin:0 0 24px;gap:10px;}
.pw-field:focus-within{border-bottom-color:var(--snow-wine);}
