<title>Mint Admin</title>
<!-- The SAME policy nginx sends as a header, carried in the file itself too.
     A host header cannot follow a file to another host, so this meta tag is
     what keeps the page covered even if it were ever served from somewhere
     other than this VPS's own nginx (a local test server with no headers
     configured, for instance) -- a document must satisfy BOTH, they
     intersect rather than one overriding the other.

     What this actually buys, on a money app: script injected into this page
     cannot POST a member's balance, session token or Trade Password to a
     server the attacker controls, and cannot LOAD a script from one. That is
     connect-src and script-src's host list; everything else here is
     supporting work.

     'unsafe-inline' in script-src is REQUIRED and must not be "tidied away":
     build-core.js ships the whole app as one inline <script> (s.textContent =
     code), which no hash can cover because the content changes every build.

     'unsafe-eval' is deliberately ABSENT, and there is one expected, harmless
     CSP violation on every load because of it. build-core.js / build-admin.js
     set `disableConsoleOutput: true`, and javascript-obfuscator implements
     that with a global-object helper shaped like
         try { g = Function('return this')(); } catch (e) { g = window; }
     Function() is eval, so the browser blocks it and reports a violation --
     then the catch assigns `window`, which is the same object it was reaching
     for, and the bundle carries on. Verified by test-csp-runtime.py, which
     walks every tab and sheet under the real policy.

     Do NOT add 'unsafe-eval' to silence that one line. It would let any
     injected script build code from a string, which is most of what this
     policy is here to prevent, in exchange for a warning that changes
     nothing. test-csp-runtime.py allows that exact violation and fails on
     any other, so a NEW eval -- one without a fallback, that really would
     break something -- is still caught.

     frame-ancestors is NOT here: a meta policy cannot express it (the browser
     ignores it), which is exactly why render.yaml keeps sending the header
     version too. The two are not redundant. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#1739b8">

<style>
  :root{
    /* Re-themed again to match the user app's new "Premium Industrial
       Energy" identity (owner-specified: Corporate Red primary, Clean White
       background, Golden Orange secondary accent, Charcoal text/secondary
       UI -- green stays functional-only, not a theme color). Variable NAMES
       kept (--gold/--gold-deep/--gold-ink etc.) with only the VALUES
       swapped -- same low-risk convention as every earlier reskin here, so
       nothing downstream (every rule in this file already reads these
       tokens) needed touching. --gold now carries RED, not gold/orange --
       the name is legacy (this file has been "value-only, keep the name"
       for three re-themes running; renaming it here would mean re-reading
       every rule that touches it to confirm nothing assumes the old value,
       for a cosmetic variable name no one but this file's own source reads). */
    --bg:#f2f4fd; --card:#ffffff; --ink:#25262b; --sub:#6b6d76; --line:#ececee; --line2:#f5f5f6;
    --gold:#1739b8; --gold-deep:#0e2a8e; --gold-ink:#ffffff; --ok:#0f9d58; --ok-bg:rgba(15,157,88,.12);
    --danger:#d1293e; --danger-bg:rgba(209,41,62,.1); --warn:#b45309; --warn-bg:rgba(180,83,9,.12); --sky:#f5a000;
  }
  /* Neutral, unobtrusive scrollbar. Two properties because they cover
     two different scrollbars: `scrollbar-color` is the only one an OVERLAY
     scrollbar obeys (Chromium 121+ paints those natively and ignores the
     ::-webkit-scrollbar pseudo-elements), while ::-webkit-scrollbar still
     styles the classic ones a desktop browser draws -- and the admin panel is
     mostly used on a desktop, so that path is the one that shows here. */
  html{scrollbar-width:thin;scrollbar-color:#707784 transparent;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#707784;border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:#9299a5;}

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  button,input,select,textarea{font-family:inherit}
  .hidden{display:none !important}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px}

  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:30px 26px;width:100%;max-width:380px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .brand .mk{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .brand .mk svg{width:24px;height:24px}
  /* The mark is an <img> now (see the comment on #brandMarkLogin). It fills
     the round badge rather than sitting inside it as a glyph would, so the
     Mint tile IS the badge -- same shape an uploaded Brand logo gets from
     applyAdminBrandLogo(), so the two tiers cannot look different. */
  .mk img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .brand b{font-size:20px}
  .muted{color:var(--sub);font-size:13px}

  input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
    font-size:14px;background:var(--card);color:var(--ink);outline:none;margin-top:6px}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  /* The two language pickers. Every other select in this panel is a full-width
     form control; these two are chrome, so they opt out of that width rather
     than stretching the topbar row and the login card's brand line. */
  #langLogin,#langSwitch{width:auto;margin-top:0;padding:7px 9px;border-radius:9px;font-size:12.5px}
  #langLogin{margin-left:auto;flex:0 0 auto}
  label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-top:12px;text-align:left}
  .btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:12px 18px;font-size:14px;
    font-weight:800;cursor:pointer}
  .btn:active{opacity:.88}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn.block{width:100%;margin-top:16px}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.sky{background:var(--sky);color:#fff}
  .btn.ghost{background:var(--line2);color:var(--ink)}

  /* shell */
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar-inner{display:flex;align-items:center;gap:12px;padding:12px 0}
  .topbar .mk{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .topbar .mk svg{width:20px;height:20px}
  .topbar b{font-size:16px}
  .spacer{flex:1}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
  .tab{background:transparent;border:1px solid transparent;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:700;
    color:var(--sub);cursor:pointer}
  .tab.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
  .tab .badge-n{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;background:var(--danger);color:#fff;
    border-radius:20px;font-size:10px;line-height:16px;}
  .content{padding:18px 0 70px}

  h2.sec{font-size:17px;margin:4px 0 14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:12px;color:var(--sub);margin-top:3px}

  .panel-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1;min-width:120px}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .subtab{background:var(--line2);border:0;color:var(--sub);border-radius:18px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .subtab.active{background:var(--gold);color:var(--gold-ink)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--bg)}
  .pill-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
  .t-ok{background:var(--ok-bg);color:var(--ok)}
  .t-warn{background:var(--warn-bg);color:var(--warn)}
  .t-bad{background:var(--danger-bg);color:var(--danger)}
  .t-mut{background:var(--line);color:var(--sub)}
  .table-scroll{overflow-x:auto}
  .empty{color:var(--sub);font-size:13px;padding:18px;text-align:center}
  /* Same loading spinner as the user app — replaces plain "Loading…" text. */
  .cm-spin-wrap{display:flex;align-items:center;justify-content:center;padding:40px 0;}
  .cm-spinner{width:34px;height:34px;color:var(--gold-deep);animation:cmSpinRotate 1.4s linear infinite;}
  .cm-spinner circle{stroke:currentColor;stroke-linecap:round;fill:none;stroke-width:3.6;animation:cmSpinDash 1.4s ease-in-out infinite;}
  @keyframes cmSpinRotate{100%{transform:rotate(360deg);}}
  @keyframes cmSpinDash{
    0%{stroke-dasharray:1px,200px;stroke-dashoffset:0px;}
    50%{stroke-dasharray:100px,200px;stroke-dashoffset:-15px;}
    100%{stroke-dasharray:100px,200px;stroke-dashoffset:-125px;}
  }
  /* Small inline spinner for busy buttons (Credit/Debit/etc while a
     request is in flight) -- same small spinning-arc icon as the user app. */
  .verify-spin{display:inline-flex;animation:verifySpin .9s linear infinite;}
  @keyframes verifySpin{to{transform:rotate(360deg);}}

  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .prod{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .prod .thumb{height:90px;background:var(--line2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;}
  .prod .thumb .tint-sw{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
  .prod .pb{padding:12px}
  .prod .pt{font-weight:800}
  .prod .pp{color:var(--sub);font-size:12.5px;margin-top:2px}
  .prod .pr{color:var(--ok);font-size:12px;font-weight:700;margin-top:4px}
  .prod .pa{display:flex;gap:6px;margin-top:10px}
  .img-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line2);flex-shrink:0}
  /* A transparent logo on a flat tile is indistinguishable from a logo with a
     matching solid background, so the one slot type where transparency is the
     whole point gets a checkerboard behind it and CONTAIN rather than cover --
     cover would crop a wide wordmark and hide exactly the edges he needs to
     check. Owner: "so as it shows up on transparent sitting with no black
     background" -- he has to be able to SEE that it worked. */
  .img-thumb.alpha{object-fit:contain;background-color:#fff;
    background-image:linear-gradient(45deg,#d8dee6 25%,transparent 25%,transparent 75%,#d8dee6 75%),
                     linear-gradient(45deg,#d8dee6 25%,transparent 25%,transparent 75%,#d8dee6 75%);
    background-size:12px 12px;background-position:0 0,6px 6px}

  .banner-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}

  .modal-bg{position:absolute;inset:0;background:rgba(10,18,32,.45)}

  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
  .kv .k{color:var(--sub)}

  .toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}

  .codebox{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-family:monospace;

  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}

  .lang-pick{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);

  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0 2px;overflow-x:auto}

  .chart-x{font-size:9px;color:var(--sub);white-space:nowrap}

<script data-mint-idle>
// Where a login is kept. localStorage, so it survives closing the app or the browser (the server still ends it after its own idle/maximum time);
// sessionStorage when the browser does not allow localStorage. (sessionStorage alone ended every login the moment the tab or the app was closed.)

window.createMintIdleSession = function(key, onExpire, onActivity){
  var IDLE = 2 * 60 * 60 * 1000, MAX = 8 * 60 * 60 * 1000;
  var state = null, lastPulse = 0, lastSave = 0, timer = null;
  function save(force){
    if (!state || (!force && Date.now() - lastSave < 1000)) return;
    lastSave = Date.now();
    try { window.mintKeep.setItem(key, JSON.stringify(state)); } catch (_) {}
  }
  function clear(){ state = null; lastSave = 0; clearInterval(timer); timer = null; try { window.mintKeep.removeItem(key); } catch (_) {} }
  function expire(){ if (!state) return false; clear(); onExpire(); return false; }
  function check(){
    if (!state) return false;
    var now = Date.now();
    if (!Number.isFinite(state.started) || !Number.isFinite(state.last) || state.last > now || now < state.started || now - state.last >= IDLE || now - state.started >= MAX) return expire();

  }

    if (!check() || !onActivity || Date.now() - lastPulse < 30000) return;
    lastPulse = Date.now();

  }
  function activity(e){
    if (document.hidden || !e.isTrusted || !check()) return;
    state.last = Date.now(); save(); pulse();
  }

    document.addEventListener(name, activity, {passive:true});
  });

  window.addEventListener('pagehide', function(){ if (check()) save(true); });
  window.addEventListener('pageshow', check);

    begin: function(identity, started, fresh){
      clearInterval(timer);
      var saved = null;
      try { saved = JSON.parse(window.mintKeep.getItem(key)); } catch (_) {}

        {identity:identity, started:started, last:started};

<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="login-card">
    <div class="brand">
      <!-- Owner: "in admin panel still has old svgs and icons ie that slanting
           8 and that ladder svg on the home, please let it be mint logo."
           This was Snow's inherited swoosh -- a slanting infinity mark drawn
           in a hardcoded <path>, which is exactly the "slanting 8". The
           topbar's was a hand-drawn grid, the "ladder". Both are the app's
           own icon now: a real file, no network, and the same mark that is on
           the home screen of anyone who installed either app. An uploaded
           Brand logo still replaces it -- see applyAdminBrandLogo(). -->
      <div class="mk" id="brandMarkLogin"><img src="icon-192.png" alt="" width="40" height="40"></div>
      <b data-brandadmin>Mint Admin</b>
      <!-- The topbar picker lives inside #shell, which nobody has reached yet
           on this screen. An operator who does not read English has to be able
           to change the language BEFORE signing in, or the one screen standing
           between them and the panel is the one screen they cannot read. -->
      <select id="langLogin" title="The language this panel is shown in" data-no-i18n></select>
    </div>
    <p class="muted">Owner: leave username blank and enter your admin key. Staff: enter the username and password you were given.</p>
    <input id="userInput" type="text" placeholder="Username (leave blank if you're the owner)" autocomplete="off">
    <input id="keyInput" type="password" placeholder="Admin key / password" autocomplete="off">
    <input id="totpInput" class="hidden" type="text" inputmode="numeric" maxlength="7" placeholder="6-digit code from your authenticator app" autocomplete="one-time-code">
    <button class="btn block" id="loginBtn">Sign in</button>
    <p class="muted" id="loginErr" style="color:var(--danger);margin-top:12px"></p>
  </div>
</div>

<!-- SHELL -->
<div class="hidden" id="shell">
  <div class="topbar">
    <div class="wrap">
      <div class="topbar-inner">
        <div class="mk" id="brandMarkTop"><img src="icon-192.png" alt="" width="34" height="34"></div>
        <b data-brandadmin>Mint Admin</b>
        <div class="spacer"></div>
        <!-- ── THE PANEL'S OWN LANGUAGE ──
             Owner: "also make when in admin, you can change its language too,
             everything there."

             Beside the country switch on purpose: the two are the same kind of
             control (what this panel is showing / what it is saying) and an
             operator who works in one country in one language sets both once
             and forgets them. Unlike the country switch it is NEVER hidden --
             every language is offered to every operator, because which words
             the person reading the panel understands is not a property of the
             country they are administering. -->
        <select id="langSwitch" title="The language this panel is shown in" style="max-width:150px" data-no-i18n></select>
        <button class="btn ghost sm" id="liveBtn" title="Auto-refresh the current tab as new activity arrives"><span id="liveDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle"></span>Live</button>
        <button class="btn ghost sm" id="pushBtn" title="Enable push notifications for new deposits and withdrawal requests on this device/browser. Tapping an alert opens this panel -- it does not approve or send anything by itself.">Notify</button>
        <button class="btn ghost sm hidden" id="installBtn">Install</button>
        <button class="btn ghost sm" id="refreshBtn">Refresh</button>
        <button class="btn ghost sm" id="logoutBtn">Log out</button>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="dashboard">Dashboard</button>
        <button class="tab" data-tab="analytics">Analytics</button>
        <button class="tab" data-tab="users">Users</button>
        <button class="tab" data-tab="deposits">Deposits</button>
        <button class="tab" data-tab="withdrawals">Withdrawals <span class="badge-n hidden" id="wBadge"></span></button>
        <button class="tab" data-tab="products" id="productsTab">Products</button>
        <button class="tab" data-tab="promocodes" id="promocodesTab">Gift Codes</button>
        <button class="tab" data-tab="messages" id="messagesTab">Messages</button>
        <button class="tab" data-tab="transactions">Transactions</button>
        <button class="tab" data-tab="referrals">Referrals</button>
        <button class="tab" data-tab="settings" id="settingsTab">Settings</button>
        <button class="tab" data-tab="banners" id="bannersTab">Banners</button>
        <button class="tab hidden" data-tab="admins" id="adminsTab">Admins</button>
        <button class="tab hidden" data-tab="auditlog" id="auditLogTab">Activity Log</button>
      </div>
    </div>
  </div>
  <div class="wrap content" id="content"></div>
</div>

<script>
// Auto-update, same pattern as the member app: a new deploy must reach an
// already-open admin session without a manual cache-clear/reload. Held back
// while an admin action is mid-flight (_tabBusy, already tracked by
// withTabBusy() above for the live-refresh-suppression it was originally
// built for -- reused here for the same reason: don't yank a save/upload/
// generate action out from under the admin).
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(reg){
    function checkForUpdate(){ reg.update().catch(function(){}); }
    setInterval(checkForUpdate, 60 * 60 * 1000);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkForUpdate(); });
    window.addEventListener('focus', checkForUpdate);
  }).catch(function(){});
  var _swReloading = false;
  // Only reload on a controllerchange that swaps out a worker THIS page was
  // already running under -- the very first claim (a fresh visit/cleared
  // cache) also fires this event and would otherwise reload the panel for
  // no reason, same real bug fixed in the member app's registration script.
  var _hadControllerAtLoad = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (_swReloading) return;
    if (!_hadControllerAtLoad) { _hadControllerAtLoad = true; return; }
    (function tryReload(){
      if (typeof window._tabBusyCount !== 'undefined' && window._tabBusyCount > 0) { setTimeout(tryReload, 500); return; }
      _swReloading = true;
      location.reload();
    })();
  });
}
</script>
