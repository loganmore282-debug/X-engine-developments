plugins {
    id 'com.android.application'
}

android {
    namespace 'site.xengine.app'
    compileSdk 34

    defaultConfig {
        applicationId "site.xengine.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies — uses the platform WebView only.
dependencies {
}
