# Requests that look for hidden files, scripts, backups and admin tools that do not exist on this site (what scanners such as
# nikto, gobuster, dirb, wfuzz and nuclei send). A real member never asks for these.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(GET|POST|HEAD|PUT|DELETE|OPTIONS)[^"]*(\.php|\.asp|\.aspx|\.jsp|\.cgi|\.env|\.git|\.svn|\.sql|\.bak|\.swp|wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|cgi-bin|xmlrpc|actuator|server-status|etc/passwd|\.\./|%2e%2e|boaform|HNAP1|vendor/phpunit)[^"]*" (400|403|404|405)
ignoreregex =
