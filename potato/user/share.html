.mg-redirect.show{display:flex;}
.mg-redirect .spin{display:block;width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.28);border-top-color:#0a8a4a;animation:mgSpin 1s linear infinite;}
.mg-redirect p{margin:18.5px 0 0;font:400 12.5px/1.2 var(--mg-serif);letter-spacing:.1em;color:#fff;}
@keyframes mgSpin{to{transform:rotate(360deg);}}

/* Balance Record */
.sheet-bg.v-rec-page .sheet-body{padding-top:0;}
.v-recbal{position:relative;overflow:hidden;margin:0 -15px;height:131px;padding:0;border-bottom:1px solid #cfe3d3;text-align:center;background:linear-gradient(115deg,#e9e1b0 0%,#b5dcb4 36%,#98d5ad 52%,#c9e2cd 78%,#e6e1dc 100%);}
.v-recbal span{display:block;padding-top:33.5px;font:400 12.4px/1.2 var(--mg-serif);letter-spacing:.14em;color:#8d9a90;}
.v-recbal b{display:block;margin-top:11px;font:700 34px/1.2 var(--mg-serif);color:#171717;}
.v-rectabs{display:flex;margin:0 -15px;padding:0 15px;border-bottom:1px solid #e3e7de;background:linear-gradient(135deg,#fef4f5,#fdf2f4);}
.v-rectabs button{flex:1;min-width:0;padding:10px 2px 9px;border:0;border-bottom:2px solid transparent;background:transparent;color:#8d939b;font:400 13px/1.15 var(--mg-sans);text-align:center;height:58.5px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
.v-rectabs button.on{border-bottom-color:#0c6a3a;color:#0c6a3a;font-weight:700;}
.v-rec{display:flex;align-items:center;gap:13px;margin-top:9.5px;min-height:98px;padding:12px 17px 12px 16.5px;box-sizing:border-box;border:1px solid #e0ece3;border-radius:14px;background:#fefefc;box-shadow:0 8px 18px -16px rgba(2,120,60,.5);}
.v-rav{flex:0 0 43px;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e6efe2,#b3c7b3);color:#1d2f20;font:700 13.5px/1 var(--mg-serif);box-shadow:0 5px 10px -5px rgba(2,120,60,.45);}
.v-rav.out{background:linear-gradient(145deg,#c3dcb3,#2a8050);color:#0f2a18;}
.v-rmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.v-rmid b{font:700 14.5px/1.25 var(--mg-serif);color:#1c1c1c;}
.v-rmid small{font:400 12px/1.3 var(--mg-sans);color:#9aa0ad;}
.v-rdesc{font:400 12px/1.3 var(--mg-sans);color:#0a8a4a;}
.v-chip{align-self:flex-start;padding:1px 9px 2px;border-radius:9px;font:500 11.5px/1.4 var(--mg-sans);color:#fff;background:#2fc45e;}
.v-chip.wait{background:#f28c1e;}.v-chip.bad{background:#e40613;}
.v-ramt{flex:0 0 auto;font:700 14px/1.2 var(--mg-serif);}
.v-ramt.in{color:#7d8420;}.v-ramt.out{color:#0c5a34;}
.v-more{text-align:center;padding:16px 0 6px;}
.v-more button{height:38px;padding:0 22px;border:1px solid #cfe6d6;border-radius:14px;background:#e8f3ea;color:#4a6b59;font:500 11.5px/1 var(--mg-sans);}

/* Messages */
.mg-mrow{position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;margin-top:14px;padding:12px 30px 14px 12px;border:1px solid #d4e8d9;border-left:0;border-radius:16px;background:linear-gradient(135deg,#fefefc,#fdf3f1);text-align:left;box-shadow:0 10px 22px -18px rgba(2,120,60,.5);overflow:hidden;}
.mg-mrow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#0b5d3a;}
.mg-mrow .av,.msg-detail .av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#cfe9b0,#0ea659);margin-left:4px;}
.mg-mrow .t{flex:0 1 164px;max-width:164px;min-width:0;font:700 14.4px/21px var(--mg-serif);color:#111;word-break:break-word;}
.mg-mrow .d{flex:0 0 auto;align-self:center;font:400 11px/1.45 var(--mg-sans);color:#9aa0ad;text-align:right;white-space:nowrap;}
.mg-mrow .dot{position:absolute;right:13.5px;top:50%;width:11px;height:11px;margin-top:-9px;border-radius:50%;background:#0c8a4a;box-shadow:0 0 0 4px #d6efde;}
.mg-mrow.read .av{filter:saturate(.5);opacity:.8;}
.msg-detail-bg{bottom:var(--nav-h);background:rgba(98,203,146,.7)!important;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);align-items:flex-end;}
.msg-detail{position:relative;width:calc(100% - 30px);max-width:450px;margin:0 auto 8.5px;padding:26px 22.5px 30px;border:0;border-radius:28px;background:#f8fcf8;box-shadow:0 20px 50px -20px rgba(2,90,50,.45);max-height:78vh;overflow-y:auto;}
.msg-detail .xbtn{position:absolute;top:29px;right:29.5px;width:27px;height:27px;color:#0c5a34;}
.msg-detail .xbtn svg{display:block;width:100%;height:100%;stroke-width:1.6;}
.msg-detail .head{display:flex;align-items:center;gap:13px;margin:48px 0 12px;padding-right:0;}
.msg-detail .head .av{flex:0 0 38px;margin-left:0;}
.msg-detail h2{margin:0 0 6px;font:700 14.5px/22px var(--mg-serif);color:#111;}
.msg-detail .date{font:400 11.5px/1.2 var(--mg-sans);color:#9aa0ad;}
.msg-detail .ln{height:1px;margin:0 0 13px;background:#dbe8de;}
.msg-detail .content{margin-bottom:13px;font:400 11.5px/1.6 var(--mg-sans);color:#3a4a40;white-space:pre-line;}
.msg-detail .mimg{display:block;width:100%;height:auto;border-radius:14px;}

/* Treasure Chest */
.mg-chestpg{position:relative;padding:146.5px 8px 27px;text-align:center;}
.mg-fade{display:block;position:absolute;left:12%;right:12%;height:1px;background:linear-gradient(90deg,rgba(2,166,82,0),rgba(2,166,82,.32),rgba(2,166,82,0));}
.mg-fade.t{top:146.5px;}.mg-fade.b{position:relative;left:auto;right:auto;margin:35px 12% 0;}
.mg-chest-ring{position:relative;width:188px;height:188px;margin:0 auto;border-radius:50%;border:1px dotted rgba(70,150,110,.25);display:flex;align-items:center;justify-content:center;}
.mg-chest-ring::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(214,177,74,.22);}
.mg-chest-ring .glow{position:absolute;left:-30px;right:-30px;top:-10px;bottom:-30px;background:radial-gradient(ellipse 34% 30% at 50% 56%,rgba(120,215,165,.62),rgba(120,215,165,0) 100%),radial-gradient(ellipse 46% 44% at 40% 70%,rgba(240,215,170,.35),rgba(240,215,170,0) 100%);}
.mg-chest-ring img{position:relative;display:block;width:105px;height:auto;margin-top:-2px;filter:drop-shadow(0 2px 3px rgba(80,40,0,.12));animation:mgFloat 2.2s ease-in-out infinite;}
@keyframes mgFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.mg-chestpg h2{margin:1px 0 0;font:700 19px/1.2 var(--mg-serif);letter-spacing:.1em;color:#145a35;}
.mg-chestpg p{margin:9px 0 0;font:italic 400 11.5px/1.2 var(--mg-serif);letter-spacing:.04em;color:#9aa0ad;}
.mg-chest-key{display:block;width:100%;box-sizing:border-box;height:44.5px;margin:24px 0 0;padding:0 14px;border:1px solid #b9e0cb;border-radius:14px;background:#fdfcf7;color:#4a4a4a;text-align:center;font:400 14px/1 var(--mg-serif);letter-spacing:.07em;outline:0;}
.mg-chest-key::placeholder{color:#7d7d80;}
.mg-chest-key:focus{border-color:#02a652;}
.mg-chest-go{display:block;width:100%;height:45px;margin:17px 0 0;border:0;border-radius:14px;background:linear-gradient(125deg,#07a856 0%,#02924a 50%,#056b39 100%);color:#fff;font:700 14px/1 var(--mg-serif);letter-spacing:.2em;cursor:pointer;}
.mg-chest-go:disabled{opacity:.65;}
.sheet-bg.mg-chest-page .sheet-head h2{color:#1a5a38;}

/* Congratulations card */
.v-win-bg{padding:0 18px 42px;background:rgba(40,180,110,.73);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);}
.v-win-card{position:relative;max-width:314px;min-height:313px;box-sizing:border-box;padding:36px 22px 33px;border:2px solid transparent;border-radius:25px;background:linear-gradient(135deg,#fdf8f4,#f0eae6) padding-box,linear-gradient(135deg,#1f9a55,#ecc84a 55%,#1f9a55) border-box;box-shadow:0 20px 50px -18px rgba(2,90,50,.5);}
.v-win-card h2{margin:0;font:700 26px/1.2 var(--mg-serif);letter-spacing:.08em;background:linear-gradient(90deg,#1d7a3f,#e6c54a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.v-win-sub{margin:16.5px 0 0;font:italic 400 14px/1.2 var(--mg-serif);letter-spacing:.04em;color:#7d7d75;}
.v-win-amt{margin:14.5px 0 0;font:700 44px/1.15 var(--mg-serif);background:linear-gradient(90deg,#3f8a3c,#c6b53a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.v-win-bal{margin:24.5px 0 0;font:400 13px/1.2 var(--mg-serif);letter-spacing:.02em;color:#9a9aa5;}
.v-win-btn{width:auto;min-width:182px;height:45.5px;margin:28.5px auto 0;padding:0 28px;border-radius:14px;background:linear-gradient(125deg,#07a856,#02924a 50%,#056b39);font:700 14px/1 var(--mg-serif);letter-spacing:.2em;}

/* Welcome dialog */
.ann-bg{background:rgba(2,166,82,.43);-webkit-backdrop-filter:none;backdrop-filter:none;align-items:flex-start;padding:66px 15px 0;box-sizing:border-box;}
.ann-sheet{position:relative;display:block;width:100%;max-width:330px;max-height:calc(100vh - 66px - var(--nav-h));max-height:calc(100dvh - 66px - var(--nav-h));overflow-y:auto;padding:9px 17px 17px;box-sizing:border-box;border-radius:28px;background:#fffffe;box-shadow:0 20px 50px -20px rgba(2,90,50,.5);margin-bottom:0;}
.mg-ann-x{display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:0 0 0 auto;padding:0;border:2px solid #7d7d7d;border-radius:50%;background:#fff;color:#2c2c2c;}
.mg-ann-x svg{width:19px;height:19px;}
.ann-sheet h2{margin:12px 0 0;text-align:center;font:700 17px/1.2 var(--mg-serif);letter-spacing:.02em;color:#161616;padding:0 0 23px;}
.mg-ann-img{display:block;width:100%;height:auto;border-radius:12px;}
.mg-ann-lines{margin:9px 0 6px;text-align:center;}
.mg-ann-lines p{margin:0;font:700 12.5px/22px var(--mg-sans);color:#586a5e;}
.mg-ann-join{display:flex;align-items:center;justify-content:center;height:41.5px;margin-top:15px;border-radius:14px;background:linear-gradient(125deg,#07a856,#02924a 50%,#056b39);color:#fff;font:700 13.5px/1 var(--mg-sans);text-decoration:none;}

/* Passwords */
.v-edit.mg-pw{margin-top:0;padding:20px 17.5px 17px;border:1px solid #d3e8dc;border-radius:17px;box-shadow:none;background:linear-gradient(135deg,#fafdfa,#eef6ef);}
.mg-pw .v-flabel{color:#9aa3a0;margin:0 0 6px;font-size:12.2px;}
.mg-pw .v-pbox{margin-bottom:16.5px;}
.mg-pw .v-pbox input{height:40px;border-color:#cbe5d3;border-radius:12px;background:#e9f2e9;color:#1a1a1a;}
.mg-pw .v-pbox input::placeholder{color:#7a827d;}
.mg-pw .v-cta{margin-top:0;height:42px;letter-spacing:.04em;border-radius:12px;box-shadow:none;}
.v-pbox{margin:0;}
.v-pbox input{height:43px;}
.v-edit .v-cta{margin-top:23px;}

/* small dialogs: Help, Download */
.v-dl-bg,.v-help-bg{position:fixed;inset:0;z-index:430;display:none;align-items:center;justify-content:center;padding:0 24px;background:rgba(40,50,45,.34);}
.v-dl-bg.show,.v-help-bg.show{display:flex;}
.v-dl-card{width:100%;max-width:281px;box-sizing:border-box;padding:24px 22px 21px;border-radius:24px;background:#f6f6f6;color:#111;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.22);}
.v-dl-card h3{margin:0 0 12px;font:700 19px/1.2 var(--mg-serif);}
.v-dl-card p{margin:0 0 18px;font:400 15px/1.45 var(--mg-sans);color:#444;}
.v-dl-card button{width:100%;height:41px;border:0;border-radius:13px;background:#e40613;color:#fff;font:700 17px/1 var(--mg-sans);}
.v-help-wrap{width:100%;max-width:294px;display:flex;flex-direction:column;align-items:center;gap:20px;}
.v-help-card{width:100%;box-sizing:border-box;padding:27px 23px 26px;border:0;border-radius:24px;background:#f6f6f6;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.22);}
.v-help-ic{width:45px;height:45px;border-radius:50%;background:#e3f3e9;color:#0a8a4a;display:inline-flex;align-items:center;justify-content:center;}
.v-help-ic svg{width:27px;height:27px;}
.v-help-card h3{margin:14px 0 21px;font:700 18px/1.2 var(--mg-serif);color:#111;}
.v-help-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.v-help-b{height:69.5px;border:1px solid #cfe6d6;border-radius:13px;background:#fff;color:#1a1a1a;font:700 15px/1 var(--mg-sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;}
.v-help-b svg{width:22px;height:22px;color:#0a8a4a;stroke:#0a8a4a;}
.v-help-close{margin-top:19px;width:100%;height:41px;border:0;border-radius:13px;background:linear-gradient(125deg,#07a856,#056b39);color:#fff;font:700 17px/1 var(--mg-sans);}
.v-help-x{width:41px;height:41px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(40,70,55,.6);color:#fff;display:flex;align-items:center;justify-content:center;}
.v-help-x svg{width:18.5px;height:18.5px;}

/* confirm (Buy) dialog */
.confirm-bg{background:rgba(40,50,45,.34);}
.confirm-sheet{border-radius:24px;background:#f9f9f6;color:#161616;box-shadow:0 18px 50px rgba(0,0,0,.22);}
.confirm-sheet h3{font-family:var(--mg-serif);color:#0c6a3a;}
.confirm-sheet .secondary-button{background:#e8f3ea;border:1px solid #cfe6d6;color:#4a6b59;border-radius:14px;}
.primary-button{background:linear-gradient(125deg,#07a856,#02924a 50%,#056b39);color:#fff;border:0;border-radius:14px;font-weight:700;box-shadow:0 8px 16px -10px rgba(2,120,60,.8);}
.secondary-button{background:#e8f3ea;color:#4a6b59;border:1px solid #cfe6d6;border-radius:14px;font-weight:700;}

/* payment status page (opens after Confirm Deposit) */
.pay-page{background:var(--mg-bg);}
.pay-page::before{display:none;}
.pay-card{background:#fefefc;border:1px solid #d6e9dd;box-shadow:0 14px 30px -22px rgba(2,120,60,.5);-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:24px;}
.pay-card h3{color:#161616;font-family:var(--mg-serif);}
.pay-card p,.pay-steps{color:#5f6f63;}
.pay-note{color:#9aa0ad;}
.pay-steps li::marker{color:#02964c;}
.sheet-head.pay-head{height:65px;box-sizing:border-box;padding:0 21px;background:transparent;}
body.deposit-status-open .sheet-bg{bottom:0;}

/* Loading word inside pages */
.mg-loadtxt{display:inline-block;color:#b4b8bf;font:400 13.5px/1.2 var(--mg-sans);letter-spacing:.02em;}
.mg-nomem .mg-loadtxt{font-family:var(--mg-serif);color:#a4a8b0;font-size:13.5px;}
.list-loading{padding:34px 4px;display:flex;justify-content:center;align-items:center;}

/* product card tap */
.mg-card.card-tap{animation:cardTapBounce .34s cubic-bezier(.34,1.56,.64,1);}

/* Drawn scrollbar (see mgScrollbarInit): the native one is hidden on the page-level scrollers so only this one shows. */
#mgSb,#mgSbList{position:fixed;right:0;top:0;width:4px;z-index:300;pointer-events:none;display:none;}
#mgSbList{z-index:310;width:3px;}
.mg-sb i{display:block;width:100%;border-radius:2px;background:#02a552;will-change:transform;}
.prov-list::-webkit-scrollbar{width:0 !important;}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet-bg::-webkit-scrollbar,#msgDetailBg::-webkit-scrollbar{width:0 !important;height:0 !important;display:none !important;}
html,body,.sheet-bg,#msgDetailBg{scrollbar-width:none !important;}
/* The bar's 4px of room while it is on (class set by mgScrollbarInit); header strips that bleed to the edge keep reaching it. */
html.mg-gut #pageHost{padding-right:4px;}
html.mg-gut .mg-top{margin-right:-19px;}
.sheet-bg.mg-gut{padding-right:4px;}
.sheet-bg.mg-gut .sheet-head{margin-right:-4px;}
.sheet-bg.mg-gut .v-recbal,.sheet-bg.mg-gut .v-rectabs{margin-right:-19px;}
.sheet-bg.mg-gut .v-rectabs{padding-right:19px;}


/* Glow sweep (measured from the owner's screen recording of the Sign Up button, 60 fps): a soft white band, 65% of the button wide, peak white 11.4%,

   half a second after it a second, steady band crosses (0.5 s); then 0.33 s of rest. Only the Buy Now, Log In, Sign Up and Profile Deposit buttons carry it. */

/* Order gift: a rigid vertical bounce, 1.2 s. At rest, drops 13.9% in 0.24 s, rises halfway (to 6.9%) by 0.54 s, drops again by 0.84 s, rises home by 1.13 s. */
@keyframes ptGiftBounce{

  20%{transform:translateY(13.9%);animation-timing-function:cubic-bezier(.45,0,.55,1);}
  44.7%{transform:translateY(6.9%);animation-timing-function:cubic-bezier(.65,0,.35,1);}
  70.1%{transform:translateY(13.9%);animation-timing-function:cubic-bezier(.42,0,.58,1);}
  94%,100%{transform:translateY(0);}
}
/* Download app: floats up 9% and back, 1.6 s, straight lines: up over 0.4 s, hold 0.35 s, down over 0.46 s, rest 0.38 s. */
@keyframes ptAppFloat{0%{transform:translateY(0);}25%{transform:translateY(-9%);}47%{transform:translateY(-9%);}76%{transform:translateY(0);}100%{transform:translateY(0);}}

/* Flip clock (HH:MM:SS): dark tiles 28 x 39, white bold digits 25 px, a hairline across the middle, red colon dots. A changed digit flips in 0.55 s:
   the lower half shows the new digit at once; the old upper half folds down evenly from 0.06 s to 0.33 s; the new lower half unfolds from 0.32 s to 0.55 s. */
.pt-fc{display:flex;align-items:center;justify-content:center;direction:ltr;}
.pt-fp{display:flex;gap:2.3px;}
.pt-fcol{position:relative;width:19.4px;height:39px;flex:none;}
.pt-fcol::before,.pt-fcol::after{content:'';position:absolute;left:50%;width:3.3px;height:3.3px;margin-left:-1.65px;border-radius:50%;background:#e0211f;}
.pt-fcol::before{top:14.9px;}
.pt-fcol::after{top:24.6px;}

.pt-fd::after{content:'';position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:rgba(0,0,0,.55);z-index:6;pointer-events:none;}
.pt-fd .pt-ft,.pt-fd .pt-fb,.pt-fd .pt-fl{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:#191919;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.pt-fd .pt-ft,.pt-fd .pt-fl-t{top:0;border-radius:7px 7px 0 0;}

.pt-fd .pt-ft i,.pt-fd .pt-fl-t i{top:0;}
.pt-fd .pt-fb i,.pt-fd .pt-fl-b i{top:-19.5px;}
.pt-fd .pt-fl{display:none;z-index:4;}
.pt-fd.pt-go .pt-fl{display:block;}

.pt-fd.pt-go .pt-fl-b{transform-origin:50% 0;animation:ptUnfoldBot 233ms 317ms cubic-bezier(.3,.5,.7,.8) both;}

<script data-potato-idle>
// Where a login is kept. localStorage, so it survives closing the app or the browser (the server still ends it after its own idle/maximum time);
// sessionStorage when the browser does not allow localStorage. (sessionStorage alone ended every login the moment the tab or the app was closed.)
window.potatoKeep = (function(){ try { var k = '__potato_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (_) { try { return sessionStorage; } catch (__) { return null; } } })();
// Real interaction renews activity; polling, focus, and visibility never do.
window.createPotatoIdleSession = function(key, onExpire, onActivity){
  var IDLE = 4 * 60 * 60 * 1000, MAX = 4 * 60 * 60 * 1000;
  var state = null, lastPulse = 0, lastSave = 0, timer = null;
  function save(force){
    if (!state || (!force && Date.now() - lastSave < 1000)) return;
    lastSave = Date.now();
    try { window.potatoKeep.setItem(key, JSON.stringify(state)); } catch (_) {}
  }
  function clear(){ state = null; lastSave = 0; clearInterval(timer); timer = null; try { window.potatoKeep.removeItem(key); } catch (_) {} }
  function expire(){ if (!state) return false; clear(); onExpire(); return false; }
  // A phone's clock is corrected by the network now and then and can step
  // BACK by a few seconds. Treating any backward step as tampering signed
  // members out for nothing. A small step is absorbed by pulling the stored
  // times back to now (so it can lengthen a session by no more than SKEW);
  // a larger one is still refused, as is a clock that has run far ahead.
  // 60 seconds is the same limit the server applies to a login time that is
  // ahead of its own clock (checkMember in session-policy.js).
  var SKEW = 60 * 1000;
  function check(){
    if (!state) return false;
    var now = Date.now();
    if (!Number.isFinite(state.started) || !Number.isFinite(state.last)) return expire();
    if (state.last > now && state.last <= now + SKEW) state.last = now;
    if (state.started > now && state.started <= now + SKEW) state.started = now;
    if (state.last > now || now < state.started || now - state.last >= IDLE || now - state.started >= MAX) return expire();
    return true;
  }
  function pulse(){
    if (!check() || !onActivity || Date.now() - lastPulse < 30000) return;
    lastPulse = Date.now();
    Promise.resolve(onActivity()).catch(function(){});
  }
  function activity(e){
    if (document.hidden || !e.isTrusted || !check()) return;
    state.last = Date.now(); save(); pulse();
  }
  ['pointerdown','keydown','wheel','touchmove'].forEach(function(name){
    document.addEventListener(name, activity, {passive:true});
  });
  document.addEventListener('visibilitychange', function(){ if (check() && document.hidden) save(true); });
  window.addEventListener('pagehide', function(){ if (check()) save(true); });
  window.addEventListener('pageshow', check);
  return {
    begin: function(identity, started, fresh){
      clearInterval(timer);
      var saved = null;
      try { saved = JSON.parse(window.potatoKeep.getItem(key)); } catch (_) {}
      // Firebase timestamps use the server clock. Allow the same small
      // forward skew as the backend; clamp locally so no lifetime is added.
      var localStarted = started > Date.now() && started <= Date.now() + 60000 ? Date.now() : started;
      state = !fresh && saved && saved.identity === identity ? saved :
        {identity:identity, started:localStarted, last:localStarted};
      if (!check()) return false;
      save(true); timer = setInterval(check, 1000); lastPulse = 0; pulse(); return true;
    },
    check:check, clear:clear, expire:expire
  };
};
</script>

<script data-potato-loader>
/* Paint the owner's box picture on the very first frame: the copy kept from the last visit is set inline (no network
   wait), then the stored copy is refreshed in the background for next time. The percentage runs from the moment the page began. */
(function(){
  window._potatoLoaderStart = Date.now();
  try {
    var box = document.getElementById('ldBox'), fill = document.getElementById('ldFill'), pct = document.getElementById('ldPct'), KEY = 'potato_loader_img';
    var ls = document.getElementById('loadingScreen'), MIN = 2500, done = false;
    window._potatoLoaderProgress = function(n){ if (n >= 100) done = true; n = Math.min(100, Math.max(0, Math.floor(n))); if (fill) fill.style.width = n + '%'; if (pct) pct.textContent = 'Loading... ' + n + '%'; };
    var tick = function(){
      if (done || !ls || ls.style.display === 'none') return;
      var t = (Date.now() - window._potatoLoaderStart) / (typeof window._potatoLoaderMinMs === 'number' ? window._potatoLoaderMinMs : MIN);
      window._potatoLoaderProgress(Math.min(99, t * 100));
      setTimeout(tick, 60);
    };
    tick();
    window._potatoLoaderRestart = function(){ window._potatoLoaderStart = Date.now(); done = false; window._potatoLoaderProgress(0); done = false; tick(); };
    var kept = null; try { kept = localStorage.getItem(KEY); } catch (e) {}
    if (kept && box) box.style.backgroundImage = 'url("' + kept + '")';
    if (!window.fetch || !window.FileReader) return;
    fetch('/k7x2/public/loader-image', { cache: 'no-cache' }).then(function(r){ if (r.status === 404) { try { localStorage.removeItem(KEY); } catch (e) {} if (box && kept) box.style.backgroundImage = 'none'; return null; } return r.ok ? r.blob() : null; }).then(function(b){
      if (!b || b.size > 1500000) return;
      var fr = new FileReader();
      fr.onload = function(){
        var u = String(fr.result || '');
        if (u.indexOf('data:image/') !== 0 || u === kept) return;
        try { localStorage.setItem(KEY, u); } catch (e) {}
        if (!kept && box) box.style.backgroundImage = 'url("' + u + '")';
      };
      fr.readAsDataURL(b);
    }).catch(function(){});
  } catch (e) {}
})();
</script>

<script>
/* THE APP'S NAME, PAINTED BEFORE ANYTHING ELSE.
 *
 * Owner: "l had made a little bit changes in names but on start up loader it
 * was still saying potato."
 *
 * He is describing a real gap, not a bug in the rename. The name lives in
 * Admin -> Settings and reaches the app over the network, but the loading
 * screen is on screen precisely while that request is in flight -- so the
 * loader could only ever show whatever was compiled into this file, and what
 * was compiled in was the old name. Every boot, forever.
 *
 * So the name is remembered on the device the first time it is known, and
 * this runs before the 250KB core inflates: every launch after the very first
 * paints the real name in the first frame. The DOMContentLoaded pass catches
 * every [data-brandmark] further down the document -- currently just the
 * pre-launch countdown gate's own mark, since the loading screen no longer
 * carries one.
 *
 * Nothing here falls back to a hard-coded name. Owner: "let's not make potato
 * to be default name" -- on a genuinely first-ever launch the mark stays
 * blank for the moment it takes settings to land. A blank that fills in is
 * honest; the wrong name is not.
 *
 * The mark is built with createTextNode/createElement rather than innerHTML.
 * The server already refuses < and > in the name, but this value has been
 * through localStorage, and building nodes is injection-proof by
 * construction instead of by remembering to escape.
 */
(function(){
  var KEY = 'potato_brand_name';
  var name = '';
  try { name = (localStorage.getItem(KEY) || '').trim(); } catch (e) {}
  // The module reads this instead of its own localStorage: one read, one
  // place that knows the key.
  window.__brandCached = name;
  if (!name) return;
  document.title = name;
  var up = name.toUpperCase();
  // Just the name -- the last-letter-in-accent-colour "CHIP+Z" split was a
  // pun specific to Potato's own name, meaningless for any other brand, so
  // it isn't carried over here (matches brandWordmarkHtml() in the module,
  // which this pre-core paint has to mirror since it runs before the module
  // exists).
  window.__paintBrandMarks = function(){
    var els = document.querySelectorAll('[data-brandmark]');
    for (var i = 0; i < els.length; i++) els[i].textContent = up;
    var raw = document.querySelectorAll('[data-brandname]');
    for (var j = 0; j < raw.length; j++) raw[j].textContent = name;
  };
  window.__paintBrandMarks();
  document.addEventListener('DOMContentLoaded', window.__paintBrandMarks);
})();

/* Older browsers lack lvh. Ignore height-only resize events (address bar
 * and keyboard); recalculate only when the layout width changes. */
(function(){
  if (window.CSS && CSS.supports('height', '100lvh')) return;
  var lastWidth = 0;
  function sizeWallpaper(){
    var width = document.documentElement.clientWidth;
    if (!width || width === lastWidth) return;
    lastWidth = width;
    document.documentElement.style.setProperty('--wallpaper-height', window.innerHeight + 'px');
  }
  sizeWallpaper();
  window.addEventListener('resize', sizeWallpaper, { passive: true });
})();

/* Contain document edge drags on browsers that ignore overscroll-behavior.
 * Use the current movement direction so reversing at an edge works within
 * the same gesture. Lock only vertical gestures after a small movement
 * threshold; sideways swipes, nested scrollers and multi-touch stay native. */
(function(){
  function hasOwnScroller(el){
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollHeight > el.clientHeight) {
        var oy = getComputedStyle(el).overflowY;
        if (oy === 'auto' || oy === 'scroll') return true;
      }
      el = el.parentElement;
    }
    return false;
  }
  var startX = 0, startY = 0, lastY = 0, axis = null, blocking = false;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) { blocking = false; return; }
    startX = e.touches[0].clientX;
    startY = lastY = e.touches[0].clientY;
    axis = null;
    blocking = !hasOwnScroller(e.target);
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length !== 1) { blocking = false; return; }
    if (!blocking) return;
    var y = e.touches[0].clientY;
    var dy = y - lastY;
    lastY = y;
    if (axis === null) {
      var dx = Math.abs(e.touches[0].clientX - startX);
      var travelY = Math.abs(y - startY);
      if (Math.max(dx, travelY) < 8) return;
      axis = travelY > dx ? 'vertical' : 'horizontal';
    }
    if (axis !== 'vertical') return;
    var root = document.scrollingElement || document.documentElement;
    var atTop = root.scrollTop <= 0;
    var atBottom = root.scrollTop + root.clientHeight >= root.scrollHeight - 1;
    if (e.cancelable && ((atTop && dy > 0) || (atBottom && dy < 0))) e.preventDefault();
  }, { passive: false });
  function reset(){ blocking = false; }
  document.addEventListener('touchend', reset, { passive: true });
  document.addEventListener('touchcancel', reset, { passive: true });
})();
</script>

    <div class="v-help-card" id="helpCard"></div>
    <button class="v-help-x" type="button" onclick="closeHelpDialog()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

</div>

<div class="confirm-bg" id="confirmBg" onclick="if(event.target===this)closeConfirm()">

</div>

<!-- Message detail (Messages.dc.html): a bottom sheet that slides up over
     the inbox list, with an X top-right. -->

  <div class="msg-detail" id="msgDetail"></div>
</div>

<!-- Announcement dialog (Chipz mechanism reused: maybeAnnounceAfterSheet()
     already fires this on the phone Back button / tapping back to Home from
     Deposit/Withdraw/Wallet -- see that function's own comment). Reintroduced
     per owner: "channel and email buttons shaking and glowing, the cancel X
     sign will be top right... opens from middle as usual... good appearing
     animation not just appearing abruptly." -->
<div class="ann-bg" id="annBg" onclick="if(event.target===this)closeAnnouncement()">
  <div class="ann-sheet" id="annSheet"></div>
</div>

<!-- Owner: "include nav arrow '<', and its title space, on that payment page."
     Reuses .sheet-head verbatim so this header IS the app's header, not a
     lookalike -- same red background, same 24px chevron, same centred
     title (the gradient chevron this comment used to describe was
     Potato's own cyan-to-blue -- fixed to a plain white stroke above, along
     with every other .sheet-head, since they all share one rule).
     #depStatusBody is a DIV, not a <p>: the pending state renders an <ol>
     of steps, and an <ol> inside a <p> is invalid and gets reparented by
     the browser, which drops the list out of the card entirely. -->
<div class="pay-page" id="depStatusBg">
  <div class="sheet-head pay-head">
    <button class="back" onclick="closeDepositStatusModal()" aria-label="Back"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.7 3.6 5.3 8l4.4 4.4L8.6 8z" fill="#f4fbf6" stroke="#f4fbf6" stroke-width=".7" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="pay-body">
    <div class="pay-card">
      <div class="dep-status-icon" id="depStatusIcon"></div>
      <h3 id="depStatusTitle">Processing your deposit</h3>
      <div id="depStatusBody"></div>
      <div class="pay-actions">
        <button class="secondary-button" id="depVerifyBtn" style="display:none;" onclick="verifyDepositNow()">Verify</button>
        <button class="primary-button" id="depStatusCloseBtn" style="display:none;" onclick="closeDepositStatusModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  // Potato's own sign-in. No Firebase: passwords and sessions live in our
  // database and this talks to /auth/* on our server. It keeps the small
  // surface the app was written against (window.fbSignIn / fbCreateUser /
  // fbSignOut / fbChangePassword / fbAuth.currentUser and the 'snow-auth'
  // event), so the rest of the app did not have to change. The origin below is
  // rewritten by set-backend-url.js together with the app's other copies.
  const POTATO_AUTH_API = '/k7x2';
  const KEY = 'potato_auth_session';
  // Kept in window.potatoKeep (localStorage), so the member stays signed in after closing the app, until the server ends the session
  // (4 hours idle or in all) or they log out. It used to be sessionStorage: closing the tab ended every login.
  const keep = () => window.potatoKeep || sessionStorage;
  const read = () => {
    try {
      const s = JSON.parse(keep().getItem(KEY));
      return s && s.token && s.uid && Number(s.expiresAt) > Date.now() ? s : null;
    } catch (_) { return null; }
  };
  const write = s => { try { keep().setItem(KEY, JSON.stringify(s)); } catch (_) {} };
  const wipe = () => { try { keep().removeItem(KEY); } catch (_) {} try { sessionStorage.removeItem(KEY); } catch (_) {} };
  const CODES = {
    INVALID_CREDENTIAL: 'auth/invalid-credential', TOO_MANY_ATTEMPTS: 'auth/too-many-requests', TOO_MANY_REQUESTS: 'auth/too-many-requests',
    PHONE_IN_USE: 'auth/email-already-in-use', WEAK_PASSWORD: 'auth/weak-password', BAD_CAPTCHA: 'auth/bad-captcha', CAPTCHA_REQUIRED: 'auth/bad-captcha', INVALID_PHONE: 'auth/invalid-email',
  };
  async function call(path, body, token) {
    let resp, data;
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
      try {
        resp = await fetch(POTATO_AUTH_API + path, { method: 'POST', signal: ctl.signal,
          headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
          body: JSON.stringify(body || {}) });
        data = await resp.json().catch(() => ({}));
      } finally { clearTimeout(timer); }
    } catch (_) { throw { code: 'auth/network-request-failed', message: 'network' }; }
    if (resp.ok && data && data.status === 'success') return data;
    const code = CODES[data && data.code] || (resp.status === 429 ? 'auth/too-many-requests' : resp.status === 401 ? 'auth/invalid-credential' : 'auth/internal-error');   // only a real 401 means "wrong": a blocked or odd answer (403, 404, a proxy page) is not blamed on the password
    throw { code, message: (data && data.message) || 'Request failed' };
  }
  const phoneOf = email => String(email || '').split('@')[0];
  // The shape the app reads off a signed-in user (it was Firebase's User).
  const makeUser = s => ({
    uid: s.uid, email: s.email || '',
    getIdToken: async () => (read() || s).token,
    getIdTokenResult: async () => ({ claims: { auth_time: (read() || s).authTime } }),
  });
  const auth = { currentUser: null };
  // _potatoAuthFired tells the app, if its own code unpacks AFTER this script has already announced who is signed in, that it must pick that up
  // itself (an announcement made before anyone listens is lost, which left the loading screen up for ever).
  const announce = user => { auth.currentUser = user; window._potatoAuthFired = true; window.dispatchEvent(new CustomEvent('snow-auth', { detail: user })); };
  const open = (data, email) => {
    const s = { token: data.token, uid: data.uid, authTime: data.authTime, expiresAt: data.expiresAt, email };
    write(s); const u = makeUser(s); announce(u); return { user: u };
  };
  window.fbCreateUser = async (email, pass) => open(await call('/auth/signup', { phone: phoneOf(email), password: pass }), email);
  window.fbSignIn     = async (email, pass) => open(await call('/auth/login', { phone: phoneOf(email), password: pass }), email);
  window.fbSignOut    = async () => { wipe(); announce(null); };
  window.fbAuth       = auth;
  // Change Login Password (Account -> Login Password): the server checks the
  // current password itself and ends the member's other sessions.
  window.fbChangePassword = async (email, oldPass, newPass) => {
    const s = read();
    if (!s) throw new Error('not-signed-in');
    await call('/auth/password/change', { oldPassword: oldPass, newPassword: newPass }, s.token);
  };
  // Like onAuthStateChanged: say once, at startup, who (if anyone) is signed
  // in. A stored session is only "signed in" until the server says otherwise
  // (its first request answers 401 if it was ended or timed out).
  const restored = read();
  if (restored) announce(makeUser(restored)); else { wipe(); announce(null); }
</script>
