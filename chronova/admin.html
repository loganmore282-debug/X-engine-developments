<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronova Admin</title>
<!-- PWA: makes the "Install" icon appear in the browser address bar -->
<meta name="theme-color" content="#0c0b0e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
window._adminInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window._adminInstallPrompt = e;
  var b = document.getElementById('installBtn'); if (b) b.classList.remove('hidden'); });
window.addEventListener('appinstalled', function(){ window._adminInstallPrompt = null;
  var b = document.getElementById('installBtn'); if (b) b.classList.add('hidden'); });</script>
<style>
  :root{
    --bg:#0b0a07; --card:#17150f; --ink:#f3efe6; --sub:#a89f8c; --line:#2b2619; --line2:#1f1c13;
    --gold:#d9ad4e; --gold-deep:#a97f22; --gold-ink:#1c1403; --ok:#57c98a; --ok-bg:#12241a;
    --danger:#f4708c; --danger-bg:#3a1720; --warn:#e8c468; --warn-bg:#241f14; --sky:#7fc8e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  button,input,select,textarea{font-family:inherit}
  .hidden{display:none !important}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px}

  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:30px 26px;width:100%;max-width:380px;
    box-shadow:0 10px 40px rgba(76,29,149,.12);text-align:center;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .brand .mk{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e6b4,var(--gold) 60%,var(--gold-deep));display:flex;align-items:center;justify-content:center;}
  .brand .mk svg{width:24px;height:24px}
  .brand b{font-size:20px}
  .muted{color:var(--sub);font-size:13px}

  input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
    font-size:14px;background:var(--card);color:var(--ink);outline:none;margin-top:6px}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-top:12px;text-align:left}
  .btn{background:linear-gradient(180deg,#f4d98a,var(--gold) 60%,var(--gold-deep));color:var(--gold-ink);border:0;border-radius:11px;padding:12px 18px;font-size:14px;
    font-weight:800;cursor:pointer}
  .btn:active{opacity:.88}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn.block{width:100%;margin-top:16px}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
  .btn.ok{background:var(--ok);color:#0a1a10}
  .btn.danger{background:var(--danger);color:#2a0a10}
  .btn.sky{background:var(--sky);color:#0a1a20}
  .btn.ghost{background:var(--line2);color:var(--ink)}

  /* shell */
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar-inner{display:flex;align-items:center;gap:12px;padding:12px 0}
  .topbar .mk{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e6b4,var(--gold) 60%,var(--gold-deep));display:flex;align-items:center;justify-content:center}
  .topbar .mk svg{width:20px;height:20px}
  .topbar b{font-size:16px}
  .spacer{flex:1}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
  .tab{background:none;border:0;padding:8px 13px;border-radius:20px;font-size:13px;font-weight:700;
    color:var(--sub);cursor:pointer}
  .tab.active{background:var(--gold);color:var(--gold-ink)}
  .tab .badge-n{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;background:var(--danger);color:#fff;
    border-radius:20px;font-size:10px;line-height:16px;}
  .content{padding:18px 0 70px}

  h2.sec{font-size:17px;margin:4px 0 14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:12px;color:var(--sub);margin-top:3px}

  .panel-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1;min-width:120px}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .subtab{background:var(--line2);border:0;color:var(--sub);border-radius:18px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .subtab.active{background:var(--gold);color:var(--gold-ink)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--bg)}
  .pill-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
  .t-ok{background:var(--ok-bg);color:var(--ok)}
  .t-warn{background:var(--warn-bg);color:var(--warn)}
  .t-bad{background:var(--danger-bg);color:var(--danger)}
  .t-mut{background:var(--line);color:var(--sub)}
  .table-scroll{overflow-x:auto}
  .empty{color:var(--sub);font-size:13px;padding:18px;text-align:center}

  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .prod{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .prod .thumb{height:90px;background:var(--line2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;}
  .prod .thumb .tint-sw{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#e6c473,#a97f22)}
  .prod .pb{padding:12px}
  .prod .pt{font-weight:800}
  .prod .pp{color:var(--sub);font-size:12.5px;margin-top:2px}
  .prod .pr{color:var(--ok);font-size:12px;font-weight:700;margin-top:4px}
  .prod .pa{display:flex;gap:6px;margin-top:10px}
  .img-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line2);flex-shrink:0}
  .img-picker{display:flex;gap:12px;align-items:center;margin:4px 0 8px}
  .img-prev{width:72px;height:72px;border-radius:12px;background:var(--line2);flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:11px}
  .img-prev img{width:100%;height:100%;object-fit:cover}
  .img-picker-actions{display:flex;flex-direction:column;gap:8px}
  .file-btn{display:inline-flex;align-items:center;justify-content:center;text-align:center}
  .banner-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}

  /* modal */
  .modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-bg{position:absolute;inset:0;background:rgba(30,15,60,.45)}
  .modal{position:relative;background:var(--card);border-radius:18px;padding:20px;max-width:460px;width:100%;
    max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-size:17px}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
  .kv .k{color:var(--sub)}
  .modal-close{position:absolute;right:14px;top:14px;background:var(--line);border:0;border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--sub)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
  .codebox{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-family:monospace;
    font-size:15px;letter-spacing:1px;word-spacing:6px;line-height:1.9}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
  .seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .seg button{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font-size:13px;color:var(--sub);font-weight:600}
  .seg button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin:2px 0 6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0 2px;overflow-x:auto}
  .chart-col{flex:1 0 auto;min-width:18px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
  .chart-bars{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
  .chart-bars i{display:block;width:7px;border-radius:3px 3px 0 0;min-height:2px}
  .chart-x{font-size:9px;color:var(--sub);white-space:nowrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="login-card">
    <div class="brand">
      <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1403" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.6 1.6"/></svg></div>
      <b>Chronova Admin</b>
    </div>
    <p class="muted">Owner: leave username blank and enter your admin key. Staff: enter the username and password you were given.</p>
    <input id="userInput" type="text" placeholder="Username (leave blank if you're the owner)" autocomplete="off">
    <input id="keyInput" type="password" placeholder="Admin key / password" autocomplete="off">
    <button class="btn block" id="loginBtn">Sign in</button>
    <p class="muted" id="loginErr" style="color:var(--danger);margin-top:12px"></p>
  </div>
</div>

<!-- SHELL -->
<div class="hidden" id="shell">
  <div class="topbar">
    <div class="wrap">
      <div class="topbar-inner">
        <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1403" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.6 1.6"/></svg></div>
        <b>Chronova Admin</b>
        <div class="spacer"></div>
        <button class="btn ghost sm" id="liveBtn" title="Auto-refresh the current tab as new activity arrives"><span id="liveDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle"></span>Live</button>
        <button class="btn ghost sm hidden" id="installBtn">Install</button>
        <button class="btn ghost sm" id="refreshBtn">Refresh</button>
        <button class="btn ghost sm" id="logoutBtn">Log out</button>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="dashboard">Dashboard</button>
        <button class="tab" data-tab="analytics">Analytics</button>
        <button class="tab" data-tab="users">Users</button>
        <button class="tab" data-tab="deposits">Deposits</button>
        <button class="tab" data-tab="withdrawals">Withdrawals <span class="badge-n hidden" id="wBadge"></span></button>
        <button class="tab" data-tab="products">Products</button>
        <button class="tab" data-tab="banners">Banners</button>
        <button class="tab" data-tab="codes">Codes</button>
        <button class="tab" data-tab="transactions">Transactions</button>
        <button class="tab" data-tab="referrals">Referrals</button>
        <button class="tab" data-tab="settings">Settings</button>
        <button class="tab hidden" data-tab="admins" id="adminsTab">Admins</button>
        <button class="tab hidden" data-tab="auditlog" id="auditLogTab">Activity Log</button>
      </div>
    </div>
  </div>
  <div class="wrap content" id="content"></div>
</div>

<div class="modal-root hidden" id="modalRoot"></div>

<script>
// Chronova Admin panel.
const SERVER = 'https://education-oc44.onrender.com';

// A short-lived SESSION TOKEN, never the raw admin key/password itself, is
// what actually rides on every request from here on — issued by the server
// at login (owner via the master key, staff via their own username/password).
let SESSION_TOKEN = '', SESSION_USER = '', SESSION_ROLE = '';
try {
  SESSION_TOKEN = sessionStorage.getItem('fg_admin_token') || '';
  SESSION_USER  = sessionStorage.getItem('fg_admin_user')  || '';
  SESSION_ROLE  = sessionStorage.getItem('fg_admin_role')  || '';
} catch (_) {}
function storeSession(token, username, role){
  SESSION_TOKEN = token; SESSION_USER = username; SESSION_ROLE = role;
  try { sessionStorage.setItem('fg_admin_token', token); sessionStorage.setItem('fg_admin_user', username); sessionStorage.setItem('fg_admin_role', role); } catch (_) {}
}
function clearSession(){
  SESSION_TOKEN = ''; SESSION_USER = ''; SESSION_ROLE = '';
  try { sessionStorage.removeItem('fg_admin_token'); sessionStorage.removeItem('fg_admin_user'); sessionStorage.removeItem('fg_admin_role'); } catch (_) {}
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ugx(n){ return 'UGX ' + Number(n||0).toLocaleString('en-UG'); }
function tsMs(v){ if(!v) return 0; if(v.seconds!=null) return v.seconds*1000; const t=new Date(v).getTime(); return isNaN(t)?0:t; }
function fdate(v){ const m=tsMs(v); return m?new Date(m).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''; }
// Friendly day label from a 'YYYY-MM-DD' string in East Africa Time: Today / Yesterday / "21 Jul".
function dayLabel(iso){
  const now=new Date(Date.now()+3*3600000);
  const today=now.toISOString().slice(0,10);
  const yest=new Date(now.getTime()-86400000).toISOString().slice(0,10);
  if(iso===today) return 'Today';
  if(iso===yest) return 'Yesterday';
  const d=new Date(iso+'T00:00:00Z');
  return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
}
// Read an uploaded image File, downscale it (canvas) and return a compressed
// JPEG data URI. Keeps the base64 stored in the DB small so uploads don't bloat
// the M0 database. maxDim caps the longest edge; quality is JPEG compression.
function fileToDataUrl(file, maxDim=900, quality=0.82){
  return new Promise((resolve,reject)=>{
    if(!file) return reject(new Error('No file'));
    if(!/^image\//.test(file.type)) return reject(new Error('Please choose an image file'));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('Could not read the file'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('That image could not be loaded'));
      img.onload=()=>{
        let{width:w,height:h}=img;
        if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        try{ resolve(c.toDataURL('image/jpeg',quality)); }
        catch(e){ reject(new Error('Could not process the image')); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
let _toastT=null;
function toast(msg,kind){ let t=$('adToast'); if(!t){ t=document.createElement('div'); t.id='adToast'; document.body.appendChild(t);} t.className='toast'+(kind?' '+kind:''); t.textContent=msg; clearTimeout(_toastT); _toastT=setTimeout(()=>t.remove(),3000); }

async function api(path, body={}){
  try{
    const r = await fetch(SERVER+path, { method:'POST',
      headers:{ 'Content-Type':'application/json', ...(SESSION_TOKEN?{ Authorization:'Bearer '+SESSION_TOKEN }:{}) },
      body: JSON.stringify(body), signal:AbortSignal.timeout(30000) });
    const d = await r.json();
    // A dead/expired/revoked session — bounce back to the login screen instead
    // of leaving the panel silently failing every call.
    if (r.status === 401 && path !== '/admin/login' && path !== '/admin/check-key') {
      clearSession();
      $('shell').classList.add('hidden'); $('loginView').classList.remove('hidden');
      $('loginErr').textContent = 'Your session ended — sign in again.';
    }
    return d;
  }catch(e){ return { status:'error', message: e.name==='TimeoutError'?'Server is waking up — try again in a moment.':'Network error' }; }
}

// ── LOGIN ──
// Owner: leaves the username field blank, enters the master key. Staff: fills
// in the username + password they were given. Either way the server hands
// back a session token — the panel never has to remember which kind it was.
async function doLogin(){
  const username = $('userInput').value.trim().toLowerCase();
  const secret = $('keyInput').value;
  if(!secret){ $('loginErr').textContent = username ? 'Enter your password.' : 'Enter the admin key.'; return; }
  const btn=$('loginBtn'); btn.disabled=true; btn.textContent='Checking…'; $('loginErr').textContent='';
  try{
    const path = username ? '/admin/login' : '/admin/check-key';
    const payload = username ? { username, password: secret } : { key: secret };
    // Timeout so a cold/asleep server can't leave the button stuck on "Checking…".
    const r = await fetch(SERVER+path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:AbortSignal.timeout(15000) });
    const d = await r.json();
    if(d.status==='success'){ storeSession(d.token, d.username, d.role); openShell(); }
    else { $('loginErr').textContent = d.message || 'Invalid credentials.'; }
  }catch(e){ $('loginErr').textContent = 'Network error — try again.'; }
  btn.disabled=false; btn.textContent='Sign in';
}
$('loginBtn').addEventListener('click', doLogin);
$('keyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('userInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('keyInput').focus(); });
$('logoutBtn').addEventListener('click', async ()=>{
  api('/admin/logout', {}).catch(()=>{});
  clearSession();
  $('shell').classList.add('hidden'); $('loginView').classList.remove('hidden');
  $('keyInput').value=''; $('userInput').value='';
});

function openShell(){ $('loginView').classList.add('hidden'); $('shell').classList.remove('hidden'); switchTab('dashboard'); refreshBadges(); startLive();
  if (window._adminInstallPrompt) $('installBtn').classList.remove('hidden');
  // Managing other admin accounts and reading the activity log are owner-only —
  // a staff login (even a compromised one) never even sees these tabs exist.
  const isOwner = SESSION_ROLE === 'owner';
  $('adminsTab').classList.toggle('hidden', !isOwner);
  $('auditLogTab').classList.toggle('hidden', !isOwner);
}
$('liveBtn').addEventListener('click', ()=>{ setLive(!_live); if(_live) liveTick(); });
$('installBtn').addEventListener('click', async ()=>{
  if (!window._adminInstallPrompt) return toast('Open the browser menu and choose Install app', 'ok');
  window._adminInstallPrompt.prompt();
  try { await window._adminInstallPrompt.userChoice; } catch(_){}
  window._adminInstallPrompt = null;
  $('installBtn').classList.add('hidden');
});

// ── TABS ──
let _tab='dashboard';
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
$('refreshBtn').addEventListener('click',()=>{ switchTab(_tab); refreshBadges(); });
function switchTab(name){
  _tab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  const c=$('content'); c.innerHTML='<div class="empty">Loading…</div>';
  ({ dashboard:renderDashboard, analytics:renderAnalytics, users:renderUsers, deposits:renderDeposits, withdrawals:renderWithdrawals,
     products:renderProducts, banners:renderBanners, codes:renderCodes, transactions:renderTransactions,
     referrals:renderReferrals, settings:renderSettings, admins:renderAdmins, auditlog:renderAuditLog }[name])();
}
async function refreshBadges(){
  const s = await api('/admin/stats');
  if(s.status==='success' && s.pendingWithdrawals>0){ $('wBadge').textContent=s.pendingWithdrawals; $('wBadge').classList.remove('hidden'); }
  else $('wBadge').classList.add('hidden');
}

// ── LIVE AUTO-REFRESH ── re-pulls the active data tab every 12s so new joins,
// deposits, withdrawals, transactions and referrals appear on their own. Skips
// edit tabs (products/banners/codes/settings), skips while a modal is open, and
// leaves the Users search alone while you're typing in it.
let _live=true, _liveTimer=null;
const LIVE_TABS=new Set(['dashboard','users','deposits','withdrawals','transactions','referrals']);
const RENDERERS={ dashboard:()=>renderDashboard(), users:()=>renderUsers(), deposits:()=>renderDeposits(),
  withdrawals:()=>renderWithdrawals(), transactions:()=>renderTransactions(), referrals:()=>renderReferrals() };
function modalOpen(){ const m=$('modalRoot'); return m && !m.classList.contains('hidden'); }
function liveTick(){
  if(document.hidden) return;
  refreshBadges().catch(()=>{});
  if(!_live || modalOpen() || !LIVE_TABS.has(_tab)) return;
  // Don't wipe the Users search while it's being used.
  if(_tab==='users'){ const s=$('userSearch'); if(s && (s.value.trim() || document.activeElement===s)) return; }
  (RENDERERS[_tab]||(()=>{}))();
}
function startLive(){ if(_liveTimer) return; _liveTimer=setInterval(liveTick, 12000); }
function setLive(on){ _live=on; const d=$('liveDot'); if(d) d.style.background = on ? 'var(--ok)' : 'var(--sub)';
  $('liveBtn').style.opacity = on ? '1' : '.6'; }

// ── DASHBOARD ──
// ── ANALYTICS ──
let _anPeriod = 30;
async function renderAnalytics(){
  $('content').innerHTML='<div class="empty">Crunching numbers…</div>';
  const a = await api('/admin/analytics', { days:_anPeriod });
  if(a.status!=='success'){ $('content').innerHTML='<div class="empty">Could not load analytics. '+esc(a.message||'')+'</div>'; return; }

function statusPill(s){
  s=String(s||'success').toLowerCase();
  if(['success','processed','matched'].includes(s)) return `<span class="pill-tag t-ok">Successful</span>`;
  if(['pending','processing','claimed','awaiting_payment'].includes(s)) return `<span class="pill-tag t-warn">Processing</span>`;
  if(['failed','cancelled','rejected','expired'].includes(s)) return `<span class="pill-tag t-bad">Failed</span>`;
  return `<span class="pill-tag t-mut">${esc(s)}</span>`;
}

    if(d.status!=='success'){ toast(d.message||'Audit failed','err'); return; }
    const K={negative_balance:'Negative balance',duplicate_credit:'DUPLICATE CREDIT',balance_mismatch:'Balance ≠ ledger',
      withdrawal_no_gateway_ref:'Withdrawal has no gateway reference',withdrawal_stuck:'Withdrawal stuck at gateway'};
    openModal(`<h3>Integrity audit</h3>

  });
  drawUsers();
}
// Reduce any phone to its 9-digit national core so 0771…, +256771…, 256771…
// and 771… all match each other.
function phoneCore(p){ let n=String(p||'').replace(/\D/g,''); if(n.startsWith('256')) n=n.slice(3); if(n.startsWith('0')&&n.length>=10) n=n.slice(1); return n; }
function drawUsers(){
  const raw = ($('userSearch')?.value||'').trim();
  const q = raw.toLowerCase();
  const qCore = phoneCore(raw);
  let list;
  if(q){
    list = _users.filter(u=>
      (u.username||'').toLowerCase().includes(q) ||
      (u.referralCode||'').toLowerCase().includes(q) ||
      (qCore && phoneCore(u.phone).includes(qCore)) ||
      (u.id||'').toLowerCase()===q
    );
  } else {
    list = _users.slice(0,500);
  }
  const note = (!q && _users.length>500)
    ? `<tr><td colspan="5" class="empty">Showing first 500 of ${_users.length}. Search by name or phone to find anyone.</td></tr>` : '';
  $('userRows').innerHTML = (list.length ? list.map(u=>`
    <tr class="clickable" data-uid="${esc(u.id)}">
      <td><b>${esc(u.username||'—')}</b></td><td>${esc(u.phone||'')}</td>
      <td>${ugx(u.walletBalance)}</td><td>${ugx(u.totalInvested)}</td>
      <td><span class="pill-tag ${u.status==='banned'?'t-bad':'t-ok'}">${u.status==='banned'?'Banned':'Active'}</span></td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">No matching users</td></tr>') + note;
  document.querySelectorAll('#userRows tr[data-uid]').forEach(tr=>tr.addEventListener('click',()=>openUser(tr.dataset.uid)));
}

let _wits=[], _witFilter='pending';
async function renderWithdrawals(){
  const r = await api('/admin/withdrawals/list', { limit: 500 });
  _wits = r.withdrawals||[];
  // TRUE counts come from the server (all withdrawals), so they never freeze at
  // the page size. Fall back to counting the page only if the server is old.
  let counts = r.counts;
  if(!counts){ counts={ pending:0, processing:0, processed:0, rejected:0, failed:0 }; _wits.forEach(w=>{ counts[w.status]=(counts[w.status]||0)+1; }); }
  const subs = [['pending','Pending'],['processing','Processing'],['processed','Processed'],['rejected','Rejected'],['failed','Failed'],['all','All']];
  const pbd = r.processedByDay||[];
  const maxP = Math.max(1, ...pbd.map(d=>d.count));
  const rows = pbd.slice().reverse(); // newest day first
  const procChart = pbd.length ? `<div class="panel-card">
    <div class="row" style="align-items:center;margin-bottom:2px"><h2 class="sec" style="flex:1;margin:0">Processed per day</h2>
    <div class="muted"><b>${counts.processed||0}</b> processed all-time · ${ugx(r.processedAmount||0)} paid out</div></div>
    <div class="chart">${pbd.map(d=>`<div class="chart-col" title="${dayLabel(d.day)}: ${d.count} processed · ${ugx(d.amount)}"><div class="chart-bars"><i style="height:${Math.round(d.count/maxP*100)}%;background:var(--ok)"></i></div><div class="chart-x">${d.day.slice(8)}</div></div>`).join('')}</div>
    <div class="table-scroll" style="max-height:340px;margin-top:10px"><table><thead><tr><th>Day</th><th>Withdrawals processed</th><th>Amount paid</th></tr></thead>
    <tbody>${rows.map(d=>`<tr><td>${dayLabel(d.day)}</td><td><b style="font-size:16px">${d.count}</b></td><td>${d.amount?ugx(d.amount):'—'}</td></tr>`).join('')}</tbody></table></div></div>` : '';
  $('content').innerHTML = `
    <h2 class="sec">Withdrawals</h2>
    ${procChart}
    <div class="subtabs">${subs.map(([k,l])=>`<button class="subtab${_witFilter===k?' active':''}" data-wf="${k}">${l}${k==='all'?` (${r.total||_wits.length})`:(counts[k]?` (${counts[k]})`:'')}</button>`).join('')}</div>
    <div class="panel-card table-scroll"><table><thead><tr><th>When</th><th>User</th><th>Amount</th><th>Net</th><th>Status</th><th></th></tr></thead><tbody id="witRows"></tbody></table></div>`;
  document.querySelectorAll('[data-wf]').forEach(b=>b.addEventListener('click',()=>{ _witFilter=b.dataset.wf; renderWithdrawals(); }));
  drawWits();
}

    <tr><td>${fdate(w.createdAt)}</td><td>${esc(w.userName||'')}<br><span class="muted">${esc(w.withdrawalPhone||w.userPhone||'')}</span></td>

function editProduct(p, order){
  p = p || {};
  openModal(`
    <h3>${p.id?'Edit product':'New product'}</h3>
    <label>Name</label><input id="pLabel" value="${esc(p.label||'')}" placeholder="e.g. Emerald">
    <label>Key (slug, lowercase — leave blank to auto)</label><input id="pKey" value="${esc(p.key||'')}" placeholder="emerald">
    <div class="row">
      <div><label>Price (UGX)</label><input id="pPrice" type="number" value="${p.price||''}" placeholder="450000"></div>
      <div><label>Total payout (UGX)</label><input id="pRet" type="number" value="${p.expectedReturn||''}" placeholder="1125000"></div>
    </div>
    <div class="row">
      <div><label>Cycle (days)</label><input id="pCycle" type="number" value="${p.cycle||30}"></div>
      <div><label>Order</label><input id="pOrder" type="number" value="${p.order!=null?p.order:(order||0)}"></div>
    </div>
    <label>Watch image</label>
    <div class="img-picker">
      <div class="img-prev" id="pImgPrev">${p.image?`<img src="${esc(p.image)}" alt="">`:'<span class="muted">No image</span>'}</div>
      <div class="img-picker-actions">
        <label class="btn sm file-btn">Upload image<input type="file" id="pFile" accept="image/*" hidden></label>
        <button class="btn sm danger" id="pImgClear" type="button"${p.image?'':' style="display:none"'}>Remove</button>
      </div>
    </div>
    <label class="muted" style="font-size:11px">…or paste a hosted image URL</label>
    <input id="pImage" value="${esc(p.image&&!/^data:/.test(p.image)?p.image:'')}" placeholder="https://…/product.png">
    <div class="switch-row" style="margin-top:10px"><span><b>Active</b> <span class="muted">(shown in the app)</span></span>
      <label style="width:auto;margin:0"><input type="checkbox" id="pActive" ${p.active!==false?'checked':''} style="width:auto"></label></div>
    <div class="switch-row"><span><b>Sold out</b> <span class="muted">(shown, but not buyable)</span></span>
      <label style="width:auto;margin:0"><input type="checkbox" id="pSoon" ${p.comingSoon?'checked':''} style="width:auto"></label></div>
    <button class="btn block" id="pSave">Save watch</button>`);
  let imgData = p.image||''; // uploaded data URI (takes priority over the URL field)
  const setPrev = (src)=>{ $('pImgPrev').innerHTML = src?`<img src="${esc(src)}" alt="">`:'<span class="muted">No image</span>'; $('pImgClear').style.display = src?'':'none'; };
  $('pFile').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ imgData = await fileToDataUrl(f); $('pImage').value=''; setPrev(imgData); toast('Image ready — tap Save product','ok'); }
    catch(err){ toast(err.message||'Could not read image','err'); }
  });
  $('pImgClear').addEventListener('click', ()=>{ imgData=''; $('pImage').value=''; setPrev(''); });
  $('pImage').addEventListener('input', ()=>{ imgData=''; setPrev($('pImage').value.trim()); });
  $('pSave').addEventListener('click', async()=>{
    const image = imgData || $('pImage').value.trim();
    const body = { id:p.id, label:$('pLabel').value, key:$('pKey').value, price:$('pPrice').value,
      expectedReturn:$('pRet').value, cycle:$('pCycle').value, order:$('pOrder').value,
      image, active:$('pActive').checked, comingSoon:$('pSoon').checked };
    if(!parseFloat(body.price)) return toast('Enter a price','err');
    const restore=$('pSave').textContent; $('pSave').disabled=true; $('pSave').textContent='Saving…';
    const d=await api('/admin/products/save', body);
    $('pSave').disabled=false; $('pSave').textContent=restore;
    toast(d.status==='success'?'Saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
    if(d.status==='success'){ closeModal(); renderProducts(); }
  });
}

// Every sensitive action across the panel — settings changes, bans, manual
// credits, withdrawals processed, account management — lands here with
// whoever actually did it, so five people sharing the panel is never a
// black box.
const AUDIT_LABELS = {
  admin_created:'Admin account created', admin_deactivated:'Admin deactivated', admin_reactivated:'Admin reactivated',
  admin_password_reset:'Admin password reset', admin_deleted:'Admin account deleted',
  deposit_approved:'Deposit approved', deposit_rejected:'Deposit rejected', deposit_force_credited:'Deposit force-credited',
  withdrawal_rejected:'Withdrawal rejected', withdrawal_processed:'Withdrawal processed',
  manual_credit:'Manual credit', manual_debit:'Manual debit', user_banned:'User banned', user_unbanned:'User unbanned',
  user_deleted:'User account deleted', settings_updated:'Settings updated', banner_set:'Banner changed',
  product_created:'Product created', product_updated:'Product updated', product_deleted:'Product deleted', products_cleared:'All products cleared',
};
async function renderAuditLog(){
  const r = await api('/admin/audit-log');
  const list = r.log||[];
  $('content').innerHTML = `
    <h2 class="sec">Activity log</h2>
    <div class="panel-card"><p class="muted" style="margin-top:0">The most recent 200 sensitive actions across the panel, newest first.</p></div>
    <div class="panel-card table-scroll"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>${list.length?list.map(e=>`
      <tr><td style="white-space:nowrap">${fdate(e.createdAt)}</td><td><b>${esc(e.actor||'?')}</b></td>
      <td>${esc(AUDIT_LABELS[e.action]||e.action)}</td>
      <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(e.meta||{}))}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nothing logged yet</td></tr>'}
    </tbody></table></div>`;
}

// ── TRANSACTIONS ──
let _txns=[], _txFilter='all';
async function renderTransactions(){
  const r = await api('/admin/transactions/list', { limit: 400 });
  _txns = r.transactions||[];
  const subs=[['all','All'],['topup','Deposits'],['withdrawal','Withdrawals'],['commission','Commissions'],['investment','Watches'],['checkin','Check-in'],['redeem','Codes']];
  $('content').innerHTML = `
    <h2 class="sec">Transactions</h2>
    <div class="panel-card"><input id="txSearch" placeholder="Search description, type or user id"></div>
    <div class="subtabs">${subs.map(([k,l])=>`<button class="subtab${_txFilter===k?' active':''}" data-tf="${k}">${l}</button>`).join('')}</div>
    <div class="panel-card table-scroll"><table><thead><tr><th>When</th><th>Type</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead><tbody id="txRows"></tbody></table></div>`;
  document.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{ _txFilter=b.dataset.tf; drawTxns(); document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('active',x.dataset.tf===_txFilter)); }));
  $('txSearch').addEventListener('input', drawTxns);
  drawTxns();
}
function drawTxns(){
  let list=_txFilter==='all'?_txns:_txns.filter(t=>t.type===_txFilter);
  const q=($('txSearch')?.value||'').toLowerCase().trim();
  if(q) list=list.filter(t=>(t.description||'').toLowerCase().includes(q)||(t.type||'').includes(q)||(t.userId||'').toLowerCase().includes(q));
  $('txRows').innerHTML = list.length?list.slice(0,300).map(t=>`
    <tr class="${t.userId?'clickable':''}" ${t.userId?`data-uid="${esc(t.userId)}"`:''}><td>${fdate(t.createdAt)}</td><td>${esc(t.type||'')}</td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.description||'')}</td>
    <td style="color:${(t.amount||0)>=0?'var(--ok)':'var(--danger)'};font-weight:700;white-space:nowrap">${(t.amount||0)>=0?'+':'−'}${ugx(Math.abs(t.amount||0))}</td>
    <td>${statusPill(t.status)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No transactions</td></tr>';
  document.querySelectorAll('#txRows tr[data-uid]').forEach(tr=>tr.addEventListener('click',()=>openUser(tr.dataset.uid)));
}

// ── REFERRALS ──
async function renderReferrals(){
  const r = await api('/admin/referrals/list');
  const list = r.referrals||[];
  $('content').innerHTML = `
    <div class="row" style="align-items:center;margin-bottom:12px"><h2 class="sec" style="flex:1;margin:0">Referrals (${list.length})</h2>
      <button class="btn sm" id="recoLinks">Fix missing links</button>
      <button class="btn sm" id="recoComm">Pay missing rewards</button></div>
    <p class="muted" style="margin-top:0"><b>Fix missing links</b>: records every join that was left unlinked. <b>Pay missing rewards</b>: pays any referral commission still owed on investments. Both are safe and never double-pay. Task Center milestone rewards are claimed by the user in-app, not paid by the admin.</p>
    <div class="panel-card table-scroll"><table><thead><tr><th>When</th><th>Referrer</th><th>New user</th><th>Level</th></tr></thead>
    <tbody>${list.length?list.map(x=>`<tr class="${x.referrerId?'clickable':''}" ${x.referrerId?`data-uid="${esc(x.referrerId)}"`:''}><td>${fdate(x.createdAt)}</td><td><b>${esc(x.referrerName||x.referrerId||'')}</b></td><td>${esc(x.referredName||x.referredUserId||'')}</td><td>${x.level?('L'+x.level):'L1'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No referrals yet</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('#content tr[data-uid]').forEach(tr=>tr.addEventListener('click',()=>openUser(tr.dataset.uid)));
  $('recoComm').addEventListener('click',async()=>{
    const b=$('recoComm'); b.disabled=true; b.textContent='Checking…';
    const d=await api('/admin/commissions/reconcile');
    b.disabled=false; b.textContent='Pay missing rewards';
    toast(d.status==='success'?`Checked ${d.processed} investment(s) — any owed rewards paid`:(d.message||'Failed'), d.status==='success'?'ok':'err');
  });
  $('recoLinks').addEventListener('click',async()=>{
    const b=$('recoLinks'); b.disabled=true; b.textContent='Fixing…';
    const d=await api('/admin/referrals/reconcile');
    b.disabled=false; b.textContent='Fix missing links';
    toast(d.status==='success'?`Linked ${d.linked} missing referral(s)`:(d.message||'Failed'), d.status==='success'?'ok':'err');
    if(d.status==='success'&&d.linked) renderReferrals();
  });
}

// ── SETTINGS ──
async function renderSettings(){
  const r = await api('/admin/settings');
  const s = r.settings||{};
  const v = (k,d)=> (s[k]!=null? s[k] : (d!=null?d:''));
  $('content').innerHTML = `
    <h2 class="sec">Rates &amp; limits</h2>
    <div class="panel-card">
      <div class="row">
        <div><label>Min deposit</label><input id="sMinDep" type="number" value="${v('minDeposit',30000)}"></div>
        <div><label>Min withdrawal</label><input id="sMinWit" type="number" value="${v('minWithdrawal',10000)}"></div>
        <div><label>Welcome bonus</label><input id="sWelcome" type="number" value="${v('welcomeBonus',7000)}"></div>
        <div><label>Check-in bonus</label><input id="sCheckin" type="number" value="${v('checkinBonus',500)}"></div>
      </div>
      <div class="row" style="margin-top:6px">
        <div><label>Withdrawal fee (0–1)</label><input id="sFee" type="number" step="0.01" value="${v('liquidityFee',0.14)}"></div>
        <div><label>L1 commission (0–1)</label><input id="sC1" type="number" step="0.01" value="${v('commL1',0.35)}"></div>
        <div><label>L2 commission (0–1)</label><input id="sC2" type="number" step="0.01" value="${v('commL2',0.02)}"></div>
        <div><label>L3 commission (0–1)</label><input id="sC3" type="number" step="0.01" value="${v('commL3',0.01)}"></div>
      </div>
      <div class="row" style="margin-top:6px">
      </div>
      <div class="switch-row" style="margin-top:8px"><span><b>Require a watch before withdrawing</b> <span class="muted">(blocks bonus-only cashouts)</span></span>
        <label style="width:auto;margin:0"><input type="checkbox" id="sReqInvest" ${s.requireInvestToWithdraw!==false?'checked':''} style="width:auto"></label></div>
      <div class="switch-row" style="margin-top:8px"><span><b>Maintenance mode</b> <span class="muted">(blocks the app for users)</span></span>
        <label style="width:auto;margin:0"><input type="checkbox" id="sMaint" ${s.maintenanceMode?'checked':''} style="width:auto"></label></div>
      <label>Maintenance message (shown to users)</label><input id="sMaintMsg" value="${esc(v('maintenanceMsg',''))}" placeholder="Chronova is being upgraded. Please check back shortly.">
      <h2 class="sec" style="margin:14px 0 4px">Payment provider</h2>
      <p class="muted" style="margin:0 0 4px">Chronova runs on MarzPay only — recharges are collected and withdrawals are released through it automatically. Nothing to configure here.</p>
      <button class="btn block" id="saveRates">Save rates</button>
    </div>

    <h2 class="sec">Announcement dialog</h2>
    <div class="panel-card">
      <div class="switch-row"><span><b>Show announcement popup</b></span>
        <label style="width:auto;margin:0"><input type="checkbox" id="aEnabled" ${s.annEnabled?'checked':''} style="width:auto"></label></div>
      <label>Title (hero text)</label><input id="aTitle" value="${esc(v('annTitle','Notice'))}">
      <label>Body</label><textarea id="aBody" rows="7" placeholder="Write the announcement…">${esc(v('annBody',''))}</textarea>
      <label>Button label (optional)</label><input id="aCtaLabel" value="${esc(v('annCtaLabel',''))}">
      <label>Button link (optional)</label><input id="aCtaUrl" value="${esc(v('annCtaUrl',''))}">
      <button class="btn block" id="saveAnn">Save announcement</button>
      <p class="muted" style="margin-top:10px">Saving re-shows the popup to everyone.</p>
    </div>

    <h2 class="sec">Announcement banner image</h2>
    <div class="panel-card">
      <p class="muted" style="margin-top:0">Shown at the top of the announcement popup, above the title. Leave unset to keep the plain gold mark instead.</p>
      <div class="banner-row">
        ${s.announcementBg?`<img class="img-thumb" src="${esc(s.announcementBg)}" onerror="this.style.opacity=.3">`:'<div class="img-thumb" style="opacity:.25"></div>'}
        <div style="flex:1;min-width:0;font-size:12px;word-break:break-all">${s.announcementBg?'Uploaded image':'<span class="muted">Not set</span>'}</div>
        ${s.announcementBg?`<button class="btn danger sm" id="annBgClear">Clear</button>`:''}
      </div>
      <label class="btn block file-btn" style="margin-top:10px">Upload image<input type="file" id="annBgFile" accept="image/*" hidden></label>
    </div>

    <h2 class="sec">Support contacts</h2>
    <div class="panel-card">
      <label>WhatsApp number or link</label><input id="spWa" value="${esc(v('supportWhatsapp',''))}" placeholder="+256700000000 or https://wa.me/256700000000">
      <label>Telegram group</label><input id="spTgGroup" value="${esc(v('telegramGroup',''))}" placeholder="https://t.me/yourgroup">
      <label>Telegram channel</label><input id="spTgChan" value="${esc(v('telegramChannel',''))}" placeholder="https://t.me/yourchannel">
      <label>Direct contact (Telegram)</label><input id="spTg" value="${esc(v('supportTelegram',''))}" placeholder="https://t.me/youragent">
      <label>Support hours</label><input id="spHours" value="${esc(v('supportHours',''))}" placeholder="Every day, 9:00 AM – 9:00 PM">
      <button class="btn block" id="saveSupport">Save support contacts</button>
    </div>

    <h2 class="sec">Regulation page</h2>
    <div class="panel-card">
      <p class="muted" style="margin-top:0">Shown under Account → Regulation. Blank leaves the page empty in the app.</p>
      <textarea id="regText" rows="8" placeholder="Platform rules and regulation…">${esc(v('rulesText',''))}</textarea>
      <button class="btn block" id="saveReg">Save regulation</button>
    </div>

    <h2 class="sec">About page</h2>
    <div class="panel-card">
      <label>App tagline (shown under the logo)</label><input id="abTag" value="${esc(v('brandTagline',''))}" placeholder="Grow your money with watches.">
      <label>About text (shown on the app's About page)</label>
      <textarea id="abText" rows="8" placeholder="Describe Chronova for your users. Leave a blank line between paragraphs.">${esc(v('aboutText',''))}</textarea>
      <button class="btn block" id="saveAbout">Save about page</button>
    </div>`;
  $('saveRates').addEventListener('click', async()=>{
    const upd = {
      minDeposit:+$('sMinDep').value, minWithdrawal:+$('sMinWit').value, welcomeBonus:+$('sWelcome').value,
      checkinBonus:+$('sCheckin').value, liquidityFee:+$('sFee').value,
      commL1:+$('sC1').value, commL2:+$('sC2').value, commL3:+$('sC3').value,
      requireInvestToWithdraw:$('sReqInvest').checked, maintenanceMode:$('sMaint').checked,
      maintenanceMsg:$('sMaintMsg').value.trim()
    };
    const d=await api('/admin/settings/update', upd); toast(d.status==='success'?'Rates saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
  });
  $('saveAnn').addEventListener('click', async()=>{
    const upd = { annEnabled:$('aEnabled').checked, annTitle:$('aTitle').value.trim(), annBody:$('aBody').value,
      annCtaLabel:$('aCtaLabel').value.trim(), annCtaUrl:$('aCtaUrl').value.trim() };
    const d=await api('/admin/settings/update', upd); toast(d.status==='success'?'Announcement saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
  });
  $('annBgFile').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    try {
      toast('Uploading…','ok');
      const dataUri = await fileToDataUrl(f,1280,0.82);
      const d = await api('/admin/settings/update', { announcementBg: dataUri });
      toast(d.status==='success'?'Saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
      if (d.status==='success') renderSettings();
    } catch(err){ toast(err.message||'Could not read image','err'); }
  });
  const annBgClear = document.getElementById('annBgClear');
  if (annBgClear) annBgClear.addEventListener('click', async()=>{
    const d = await api('/admin/settings/update', { announcementBg: '' });
    toast(d.status==='success'?'Cleared':(d.message||'Failed'), d.status==='success'?'ok':'err');
    if (d.status==='success') renderSettings();
  });
  $('saveSupport').addEventListener('click', async()=>{
    const upd = { supportWhatsapp:$('spWa').value.trim(), supportTelegram:$('spTg').value.trim(),
      telegramGroup:$('spTgGroup').value.trim(), telegramChannel:$('spTgChan').value.trim(),
      supportHours:$('spHours').value.trim() };
    const d=await api('/admin/settings/update', upd); toast(d.status==='success'?'Support saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
  });
  $('saveReg').addEventListener('click', async()=>{
    const d=await api('/admin/settings/update', { rulesText:$('regText').value });
    toast(d.status==='success'?'Regulation saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
  });
  $('saveAbout').addEventListener('click', async()=>{
    const upd = { brandTagline:$('abTag').value.trim(), aboutText:$('abText').value };
    const d=await api('/admin/settings/update', upd); toast(d.status==='success'?'About saved':(d.message||'Failed'), d.status==='success'?'ok':'err');
  });
}

// ── MODAL ──
function openModal(html){ const r=$('modalRoot'); r.innerHTML=`<div class="modal-bg" data-close></div><div class="modal"><button class="modal-close" data-close>&times;</button>${html}</div>`; r.classList.remove('hidden'); r.querySelectorAll('[data-close]').forEach(e=>e.addEventListener('click',closeModal)); }
function closeModal(){ const r=$('modalRoot'); r.classList.add('hidden'); r.innerHTML=''; }

// ── BOOT ──
// If we already have a stored key (validated at first login), show the shell
// IMMEDIATELY — like Voltra — instead of blocking on a check-key round-trip.
if(SESSION_TOKEN){ openShell(); }
</script>
