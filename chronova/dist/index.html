<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Chronova</title>
<meta name="description" content="Chronova — a luxury-watch mobile-money investment platform">
<meta name="theme-color" content="#0c0b0e">
<meta property="og:title" content="Chronova">
<meta property="og:description" content="Own a luxury watch tier and earn every day. Chronova.">
<meta property="og:image" content="link-preview.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chronova">
<meta name="twitter:image" content="link-preview.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0a07; --card:#17150f; --ink:#f3efe6; --sub:#a89f8c;
    --line:#433b26; --line2:#211d15;
    --gold:#d9ad4e; --gold-deep:#a97f22; --gold-ink:#1c1403; --gold-pale:#f4d98a;
    --emerald:#34d399; --sapphire:#38bdf8; --ruby:#fb7185; --topaz:#eab308;
    --danger:#f4708c; --danger-bg:#3a1720;
    --ok:#57c98a; --ok-bg:#12241a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit}
  input,select{font-family:inherit}
  #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  .hidden{display:none !important;}
  .eico{width:22px;height:22px;display:block;}
  a{color:var(--gold)}

  /* ── SPLASH (first paint only) ── */
  .splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:18px;}
  .mark{width:88px;height:88px;border-radius:24px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(217,173,78,.28);}
  .mark svg{width:52px;height:52px;}
  .mark.sm{width:40px;height:40px;border-radius:12px;box-shadow:none;}
  .mark.sm svg{width:24px;height:24px;}
  .brand{font-size:26px;font-weight:800;letter-spacing:.2px;}
  .tagline{color:var(--sub);font-size:15px;max-width:280px;line-height:1.5;}
  .facets{display:flex;gap:8px;margin-top:6px;}
  .facets i{width:14px;height:14px;border-radius:4px;display:inline-block;}

  /* ── SHARED CONTROLS ── */
  .btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);
    font-size:16px;font-weight:700;cursor:pointer;}
  .btn:active{opacity:.85}
  .btn[disabled]{opacity:.55;cursor:default;}
  .btn.ghost{background:var(--line2);color:var(--ink);}
  .btn.outline{background:transparent;color:var(--gold);border:1.5px solid var(--gold);}
  .btn.danger{background:var(--danger);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:15px;background:var(--card);color:var(--ink);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--gold);}
  .field-err{color:var(--danger);font-size:12px;margin-top:6px;}
  .note{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;}
  .err-box{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:11px 14px;
    font-size:13px;margin-bottom:14px;}

  /* ── AUTH VIEW — immersive full-bleed gradient, pill fields, +256 prefix ── */
  .auth-view{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;

  .auth-bg-art{position:absolute;top:-40px;right:-60px;width:280px;height:280px;opacity:.13;pointer-events:none;}
  .auth-bg-art2{position:absolute;bottom:-70px;left:-70px;width:240px;height:240px;opacity:.10;pointer-events:none;}
  .auth-scroll{position:relative;z-index:2;flex:1;overflow-y:auto;padding:64px 26px 40px;
    display:flex;flex-direction:column;justify-content:center;min-height:100%;}
  .auth-logo{display:flex;flex-direction:column;align-items:center;gap:9px;margin:8px 0 26px;}
  .auth-clock{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#f7e6b4,#d9ad4e 60%,#a97f22);
    box-shadow:0 0 40px rgba(217,173,78,.55),inset 0 0 14px rgba(0,0,0,.35);}
  .auth-clock svg{width:42px;height:42px;}
  .auth-brand{font-size:30px;font-weight:800;letter-spacing:.34em;text-indent:.34em;margin:6px 0 0;
    background:linear-gradient(180deg,#f4d98a,#d9ad4e 55%,#a97f22);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-tag{font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;color:#b9a988;text-indent:.34em;}
  .auth-title{font-size:22px;font-weight:800;line-height:1.1;margin:0 0 22px;text-align:center;color:#f3efe6;}
  .auth-form{display:none;}
  .auth-form.active{display:block;}
  .pill{width:100%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.22);
    border-radius:12px;margin-bottom:14px;display:flex;align-items:center;overflow:hidden;}
  .pill:focus-within{border-color:#fff;background:rgba(255,255,255,.22);}
  .pill .ficon{display:flex;align-items:center;padding-left:16px;color:#f4d98a;flex:none;}
  .pill .ficon svg{width:18px;height:18px;}
  .pill .ficon + .prefix{padding-left:10px;}
  .pill .ficon + input{padding-left:12px;}
  .pill input{flex:1;background:none;border:0;outline:none;color:#fff;font-size:15px;padding:15px 18px;min-width:0;}
  .pill input::placeholder{color:rgba(255,255,255,.7);}
  .pill .prefix{padding:15px 0 15px 18px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap;}
  .pill .prefix + input{padding-left:12px;}
  .pill .toggle{background:none;border:0;color:rgba(255,255,255,.85);padding:0 16px;cursor:pointer;display:flex;}
  .pill .toggle svg{width:20px;height:20px;}
  .uname-hint{font-size:12px;margin:-8px 6px 14px;min-height:15px;}
  .uname-hint.ok{color:#2a5540;}
  .uname-hint.bad{color:#fecdd3;}
  .auth-cta{width:100%;padding:16px;border:0;border-radius:12px;background:linear-gradient(180deg,#f4d98a,#d9ad4e 60%,#a97f22);color:#1c1403;
    font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
  .auth-cta:active{opacity:.9;}
  .auth-cta[disabled]{opacity:.6;}
  .auth-err{background:rgba(225,29,72,.22);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:14px;padding:11px 15px;font-size:13px;margin-bottom:16px;}
  .auth-alt{text-align:right;margin:2px 4px 12px;}
  .auth-alt button{background:none;border:0;color:var(--gold-2,#f4d98a);font-weight:700;font-size:13.5px;cursor:pointer;}
  .auth-forgot{text-align:center;margin-top:14px;}
  .auth-forgot button{background:none;border:0;color:#a89f8c;font-size:13.5px;cursor:pointer;}
  .auth-signin{text-align:center;margin-top:16px;color:#a89f8c;font-size:13.5px;}
  .auth-signin button{background:none;border:0;color:#f4d98a;font-weight:800;font-size:13.5px;cursor:pointer;}
  .auth-alt button{background:none;border:0;color:#fff;font-weight:700;font-size:14px;
    text-decoration:underline;cursor:pointer;}
  .auth-legal{color:rgba(255,255,255,.7);font-size:11.5px;margin-top:20px;line-height:1.5;}
  /* floating decorative gems on the auth background */
  .float-gem{position:absolute;z-index:1;pointer-events:none;opacity:.22;animation:floaty 7s ease-in-out infinite;}
  .float-gem svg{width:100%;height:100%;}
  .fg1{width:66px;height:66px;top:11%;left:7%;animation-delay:0s;}
  .fg2{width:46px;height:46px;top:23%;right:10%;animation-delay:1.4s;opacity:.18;}
  .fg3{width:58px;height:58px;bottom:20%;left:14%;animation-delay:2.8s;opacity:.2;}
  .fg4{width:38px;height:38px;bottom:30%;right:16%;animation-delay:2s;opacity:.16;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(9deg)}}
  /* jumbled-letter captcha — the letters live INSIDE the same pill as the
     input: type on the left, letters shown on the right. */
  .captcha-pill{padding-right:6px;}
  .captcha-box{width:128px;height:42px;flex-shrink:0;background:#f4d98a;border-radius:24px;
    display:flex;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden;margin-left:8px;}
  .captcha-box span{font-size:22px;font-weight:800;font-family:Georgia,"Times New Roman",serif;display:inline-block;}
  .captcha-box .cap-line{position:absolute;left:-10%;width:120%;height:2px;background:rgba(217,173,78,.35);}
  .captcha-box .cl1{top:38%;transform:rotate(-7deg);}
  .captcha-box .cl2{top:62%;transform:rotate(5deg);}

  /* ── MAIN SHELL ── */
  .main-view{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  .topbar{display:none;}
  .topbar-title{font-size:19px;font-weight:800;}
  .panels{flex:1;overflow-y:auto;padding:10px 18px 100px;-webkit-overflow-scrolling:touch;}
  /* ── DASHBOARD v2: plain-icon actions, slim ticker, photo balance cards ── */
  .dact-row{display:flex;justify-content:space-around;padding:14px 4px 12px;margin:8px 0 0;border-bottom:1px solid var(--line);}
  .dact{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--ink);background:none;border:0;font-family:inherit;cursor:pointer;}
  .dact-ic{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:1.5px solid var(--line);}
  .dact img{width:24px;height:24px;filter:invert(75%) sepia(46%) saturate(638%) hue-rotate(358deg) brightness(101%) contrast(94%);}
  .dact.claimed .dact-ic{opacity:.55;}
  .spec-row{display:flex;margin:0 0 2px;border-bottom:1px solid var(--line);}
  .spec-col{flex:1;text-align:center;padding:14px 4px;}
  .spec-col + .spec-col{border-left:1px solid var(--line);}
  .spec-col b{display:block;font-size:14px;color:var(--gold);font-weight:800;}
  .spec-col span{font-size:11px;color:var(--sub);}
  .dtick{display:flex;align-items:center;gap:9px;padding:10px 14px;margin:10px 0 0;font-size:11px;color:var(--sub);background:var(--card);border-radius:12px;overflow:hidden;white-space:nowrap;}
  .dtick img{width:15px;height:15px;flex-shrink:0;filter:invert(75%) sepia(46%) saturate(638%) hue-rotate(358deg) brightness(101%) contrast(94%);}
  .dtick svg{width:15px;height:15px;flex-shrink:0;color:var(--gold);}
  .dtick b{color:var(--gold);font-weight:800;}
  .dpic{margin:14px 0 0;border-radius:14px;overflow:hidden;position:relative;height:96px;border:1.5px solid var(--line);}
  .dpic img.bgph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .dpic .sh{position:absolute;inset:0;background:rgba(10,9,12,.62);}
  .dpic .c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .dpic .n{font-size:23px;font-weight:800;color:#fff;}
  .dpic .l{font-size:11px;color:var(--gold);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .dpromo{margin:14px 0 4px;border-radius:14px;overflow:hidden;position:relative;height:96px;border:1.5px solid var(--line);}
  .dpromo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .dpromo .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,12,.55),rgba(10,9,12,.1));}
  .dpromo .c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 16px;}
  .dpromo b{color:#fff;font-size:15px;}
  .dpromo span{color:var(--gold);font-size:11px;margin-top:2px;}
  .panel{animation:panelIn .12s ease-out both;}
  @keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;
    background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
    color:var(--sub);font-size:11px;font-weight:700;padding:9px 2px 6px;cursor:pointer;border-radius:10px;
    position:relative;transition:color .15s;}
  .tab-btn.active{color:var(--gold);background:rgba(217,173,78,.13);}
  .tab-btn .eico{width:23px;height:23px;}
  .tab-fab{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:0;margin-top:-24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#f7e6b4,#d9ad4e 60%,#a97f22);
    box-shadow:0 8px 20px rgba(217,173,78,.55);}
  .tab-fab svg{width:26px;height:26px;}
  .wi.gold,.qi.gold{background:rgba(217,173,78,.14) !important;color:var(--gold) !important;}

  /* ── ACTIVITY TICKER (continuous marquee, distinct from a stacked feed) ── */
  .ticker{margin:0 0 6px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);}
  .ticker-head{display:flex;align-items:center;gap:6px;margin:14px 0 8px;}
  .ticker-head .live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .ticker-head span{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.4px;text-transform:uppercase;}
  .ticker-track{display:flex;gap:9px;width:max-content;animation:tickmove 48s linear infinite;}
  .ticker:active .ticker-track,.ticker-track:hover{animation-play-state:paused;}
  @keyframes tickmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tick-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);
    border-radius:30px;padding:6px 14px 6px 6px;white-space:nowrap;font-size:12.5px;}
  .tick-item .tav{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;}
  .tick-item .tk-amt{color:var(--ok);font-weight:800;}
  .tick-item .tk-ago{color:var(--sub);}

  /* ── HOME WALLET (light card, gradient accent bar, eye toggle) ── */
  .wallet-panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px 18px 16px;
    margin:12px 0 12px;position:relative;overflow:hidden;}
  .wallet-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:linear-gradient(var(--gold),var(--gold-pale));}
  .wallet-top{display:flex;align-items:center;justify-content:space-between;}
  .wallet-label{font-size:13px;color:var(--sub);font-weight:700;}
  .wallet-eye{background:none;border:0;color:var(--sub);cursor:pointer;display:flex;padding:2px;}
  .wallet-eye svg{width:19px;height:19px;}
  .wallet-amt{font-size:31px;font-weight:800;margin-top:6px;color:var(--ink);letter-spacing:.2px;}
  .wallet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px;}
  .wstat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;}
  .wstat .wi{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
  .wstat .wi svg{width:16px;height:16px;}
  .wstat .wn{font-size:14px;font-weight:800;line-height:1.1;}
  .wstat .wl{font-size:10.5px;color:var(--sub);margin-top:3px;}
  .quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px;}
  .quick-btn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 4px;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;
    font-weight:700;color:var(--ink);}
  .quick-btn .qi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .quick-btn .qi svg{width:18px;height:18px;}
  .quick-btn.claimed{opacity:.55;}

  /* ── HOME HERO BANNER (auto-rotating) ── */
  .hero-banner{position:relative;border-radius:20px;overflow:hidden;margin:12px 0 4px;height:150px;}
  .hb-slide{position:absolute;inset:0;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;
    color:#fff;opacity:0;transition:opacity .5s ease;pointer-events:none;}
  .hb-slide.on{opacity:1;pointer-events:auto;}
  .hb-slide .hb-title{font-size:21px;font-weight:800;line-height:1.15;max-width:70%;}
  .hb-slide .hb-sub{font-size:12.5px;opacity:.9;margin-top:6px;max-width:66%;}
  .hb-art{position:absolute;right:-8px;bottom:-10px;width:120px;height:120px;opacity:.9;}
  .hb-dots{position:absolute;bottom:10px;left:22px;display:flex;gap:6px;z-index:2;}
  .hb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .3s;}
  .hb-dots i.on{background:var(--card);width:18px;border-radius:4px;}

  /* ── GEM HERO CARDS ── */
  .gem-hero{background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;}
  .gh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    background:linear-gradient(120deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#000 6%) 100%);color:#fff;}
  .gh-name{font-size:20px;font-weight:800;letter-spacing:.3px;}
  .gh-badge{background:rgba(255,255,255,.22);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:800;}
  .gh-body{display:flex;gap:14px;padding:16px 18px 4px;}
  .gh-art{width:88px;height:88px;flex-shrink:0;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,#fff);
    display:flex;align-items:center;justify-content:center;}
  .gh-art svg{width:60px;height:60px;}
  .gh-stats{flex:1;min-width:0;}
  .ghs{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13px;}
  .ghs span{color:var(--sub);}
  .ghs b{font-weight:800;}
  .gh-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 16px;}
  .gh-price{font-size:19px;font-weight:800;color:var(--accent);}
  .gh-buy{background:var(--accent);color:#fff;border:0;border-radius:24px;padding:11px 26px;
    font-size:14px;font-weight:800;cursor:pointer;}
  .gh-buy:active{opacity:.85;}
  .gh-buy[disabled]{background:var(--line);color:var(--sub);cursor:default;}
  /* Coming-soon gems: dimmed art with a badge, non-buyable */
  .gem-hero.soon .gh-art{position:relative;filter:grayscale(.5) opacity(.85);}
  .gh-soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    background:rgba(12,10,4,.55);color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px;line-height:1.2;padding:4px;}
  .gem-hero.soon .gh-price{color:var(--sub);}

  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
  .sec-head h3{font-size:15px;font-weight:800;margin:0;}
  .sec-head .link-btn{background:none;border:0;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;padding:0;}
  .empty-note{color:var(--sub);font-size:13px;background:var(--line2);border-radius:12px;padding:16px;text-align:center;}

  .gem-active{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:10px;}
  .ga-main{display:flex;align-items:center;gap:14px;}
  .ga-boost{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);}
  .ga-boost .bs{font-size:12.5px;color:var(--sub);font-weight:600;}
  .ga-boost .bs.hot{color:#c2410c;}
  .boost-btn{background:linear-gradient(120deg,#f59e0b,#ef4444);color:#fff;border:0;border-radius:22px;
    padding:9px 18px;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;}
  .boost-btn svg{width:15px;height:15px;fill:#fff;stroke:#fff;}
  .boost-btn:active{opacity:.85;}
  .boost-hero{width:64px;height:64px;border-radius:20px;margin:2px auto 14px;
    background:linear-gradient(120deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;}
  .boost-hero svg{width:34px;height:34px;fill:#fff;stroke:#fff;}
  .boost-copy{font-size:14px;line-height:1.6;color:var(--ink);text-align:center;margin:0 0 4px;}
  .hold-row{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;}
  .hold-top{display:flex;align-items:center;justify-content:space-between;}
  .hold-top b{font-size:15px;}
  .hold-sub{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .ring{width:54px;height:54px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring-track{stroke:var(--line2);}
  .ring-prog{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);}
  .cd-line{margin-top:10px;padding:8px 12px;border-radius:10px;background:#241f14;color:var(--sub);
    font-size:12.5px;font-weight:600;}
  .cd-line b{color:var(--ink);}
  .cd-line .cd{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;}
  .gem-active-info{flex:1;min-width:0;}
  .gem-active-info .t{font-weight:800;font-size:14px;}
  .gem-active-info .s{color:var(--sub);font-size:12px;margin-top:2px;}
  .gem-active-info .p{color:var(--ok);font-size:12px;margin-top:2px;font-weight:700;}

  .activity-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);}
  .activity-row:last-child{border-bottom:0;}
  .act-dot{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .act-dot svg{width:17px;height:17px;}
  .act-info{flex:1;min-width:0;}
  .act-info .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .act-info .s{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .act-amt{font-size:13.5px;font-weight:800;white-space:nowrap;}
  .act-amt.pos{color:var(--ok);}
  .act-amt.neg{color:var(--ink);}

  /* ── PREMIUM RECORD CARDS ── */
  .rec{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:13px 14px;margin-bottom:10px;}
  .rec-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:#fff;box-shadow:0 4px 12px rgba(169,127,34,.14);}
  .rec-ic svg{width:22px;height:22px;stroke:#fff;}
  .rec-body{flex:1;min-width:0;}
  .rec-title{font-weight:800;font-size:14.5px;}
  .rec-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .rec-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;
    background:var(--line2);color:var(--gold);margin-top:6px;}
  .rec-right{text-align:right;flex-shrink:0;}
  .rec-amt{font-weight:800;font-size:15px;white-space:nowrap;}
  .rec-amt.pos{color:var(--ok);}
  .rec-amt.neg{color:var(--danger);}
  .rec-status{font-size:11px;font-weight:800;margin-top:4px;}
  .rec-status.ok{color:var(--ok);} .rec-status.proc{color:#d97706;}
  .rec-status.bad{color:var(--danger);} .rec-status.mut{color:var(--sub);}
  .rec-summary{display:flex;gap:10px;margin:4px 0 14px;}
  .rec-summary .rs{flex:1;border-radius:16px;padding:14px;color:#fff;}
  .rec-summary .rs.in{background:linear-gradient(135deg,#10b981,#0d9488);}
  .rec-summary .rs.out{background:linear-gradient(135deg,#fb7185,#e11d48);}
  .rec-summary .rs-l{font-size:12px;opacity:.9;font-weight:600;}
  .rec-summary .rs-n{font-size:18px;font-weight:800;margin-top:3px;}
  .rec-chips{position:sticky;top:0;background:var(--card);padding-top:2px;padding-bottom:8px;z-index:2;}

  /* ── GEMS — vertical list, one tier per full-width row ── */
  .gem-list{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .gem-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);
    border-radius:18px;padding:15px 16px;cursor:pointer;position:relative;overflow:hidden;}
  .gem-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,transparent);}
  .gem-row .facet{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;}
  .gem-row .facet svg{width:24px;height:24px;color:#fff;}
  .gem-row .gr-body{flex:1;min-width:0;}
  .gem-row .gr-name{font-weight:800;font-size:16px;}
  .gem-row .gr-pay{font-size:12.5px;color:var(--ok);font-weight:700;margin-top:2px;}
  .gem-row .gr-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .gem-row .gr-right{text-align:right;flex-shrink:0;}
  .gem-row .gr-price{font-weight:800;font-size:15px;}
  .gem-row .gr-cta{font-size:11px;color:var(--gold);font-weight:800;margin-top:3px;}
  .gem-swatch{width:34px;height:34px;border-radius:10px;}

  /* ── TEAM ── */
  /* ── TEAM SCREEN (hero + levels + task centre) ── */
  .team-hero{margin-top:12px;border-radius:20px;padding:18px;color:#fff;
    background:linear-gradient(130deg,#1a1409 0%,#2a2114 55%,#100d08 100%);overflow:hidden;position:relative;}
  .th-top{display:flex;align-items:flex-start;justify-content:space-between;}
  .th-label{font-size:12.5px;font-weight:700;opacity:.8;letter-spacing:.4px;text-transform:uppercase;}
  .th-amt{font-size:27px;font-weight:800;margin-top:4px;}
  .th-art{width:64px;height:64px;opacity:.35;}
  .th-code-row{display:flex;gap:8px;align-items:stretch;margin-top:16px;}
  .th-code{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;min-width:0;}
  .th-code span{display:block;font-size:10.5px;opacity:.75;font-weight:700;}
  .th-code b{font-size:15px;letter-spacing:1px;}
  .th-btn{border:0;border-radius:12px;padding:0 13px;font-size:12.5px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;gap:6px;}
  .th-btn svg{width:15px;height:15px;}
  .th-btn.solid{background:#f4d98a;color:#1c1403;}
  .lvl-list{margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
  .lvl-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2);}
  .lvl-row:last-child{border-bottom:0;}
  .lvl-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;flex-shrink:0;}
  .lvl-info{flex:1;min-width:0;}
  .lvl-info .t{font-size:13.5px;font-weight:700;}
  .lvl-info .s{font-size:12px;color:var(--sub);margin-top:2px;}
  .lvl-earn{font-weight:800;font-size:13.5px;white-space:nowrap;}
  .task-intro{font-size:13px;color:var(--sub);line-height:1.55;background:var(--line2);border-radius:12px;
    padding:12px 14px;margin-bottom:12px;}
  .task-intro b{color:var(--ink);}
  .task-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:14px 15px;margin-bottom:10px;}
  .task-row.done{background:#12241a;border-color:#2a5540;}
  .task-ic{width:40px;height:40px;border-radius:12px;background:#241f14;color:var(--topaz);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .task-ic svg{width:21px;height:21px;}
  .task-row.done .task-ic{background:#dcfce7;color:#16a34a;}
  .task-body{flex:1;min-width:0;}
  .task-t{font-size:13.5px;font-weight:700;}
  .task-bar{height:6px;border-radius:6px;background:var(--line2);margin:7px 0 5px;overflow:hidden;}
  .task-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#d9ad4e,#a97f22);
    transition:width .6s ease;}
  .task-row.done .task-bar i{background:#22c55e;}
  .task-s{font-size:11.5px;color:var(--sub);font-weight:600;}
  .task-reward{white-space:nowrap;font-size:14px;color:var(--gold);}
  .task-paid{display:flex;width:30px;height:30px;border-radius:50%;background:#22c55e;color:#fff;
    align-items:center;justify-content:center;}
  .task-paid svg{width:16px;height:16px;}

  .ref-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-top:12px;text-align:center;}
  .ref-code{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--gold);margin:8px 0 6px;}
  .ref-link{font-size:12px;color:var(--sub);background:var(--line2);border-radius:10px;padding:9px 12px;
    word-break:break-all;cursor:pointer;line-height:1.4;}
  .stat-row{display:flex;gap:10px;margin-top:16px;}
  .stat-box{flex:1;background:var(--line2);border-radius:12px;padding:12px;text-align:center;}
  .stat-box .n{font-size:18px;font-weight:800;}
  .stat-box .l{font-size:11px;color:var(--sub);margin-top:2px;}
  .stat-box .pct{display:inline-block;font-size:11px;font-weight:800;color:var(--gold);
    background:#241f14;border-radius:20px;padding:2px 9px;margin-bottom:6px;}

  /* ── GEM DETAIL SCREEN (redesigned) ── */
  .gd-hero{position:relative;border-radius:20px;overflow:hidden;height:190px;margin-bottom:16px;
    box-shadow:0 12px 28px rgba(169,127,34,.22);}
  .gd-hero img,.gd-hero-fill{width:100%;height:100%;object-fit:cover;display:block;}
  .gd-hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(9,7,3,.6),rgba(9,7,3,0) 55%);}
  .gd-hero-badges{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;
    justify-content:space-between;}
  .gd-roi{background:rgba(255,255,255,.92);color:var(--ok);font-weight:800;font-size:12px;
    padding:5px 12px;border-radius:20px;}
  .gd-price{background:rgba(9,7,3,.55);backdrop-filter:blur(4px);color:#fff;font-weight:800;font-size:14px;
    padding:6px 14px;border-radius:20px;}
  .gd-payout{background:linear-gradient(135deg,#1a1409,#2a2114 60%,#3a2c12);color:#fff;border-radius:20px;
    padding:20px;text-align:center;box-shadow:0 12px 28px rgba(169,127,34,.28);}
  .gd-payout-l{font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;letter-spacing:.3px;}
  .gd-payout-n{font-size:34px;font-weight:800;letter-spacing:.4px;margin:4px 0 6px;}
  .gd-payout-s{font-size:12.5px;color:rgba(255,255,255,.82);}
  .gd-payout-s b{color:#fff;}
  .gd-metrics{display:flex;gap:12px;margin-top:14px;}
  .gd-m{flex:1;display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:13px;}
  .gd-mi{width:34px;height:34px;border-radius:10px;background:var(--line2);display:flex;align-items:center;
    justify-content:center;flex-shrink:0;}
  .gd-mi svg{width:18px;height:18px;}
  .gd-mn{font-size:15px;font-weight:800;color:var(--ink);}
  .gd-ml{font-size:11px;color:var(--sub);margin-top:1px;}
  .gd-flow{margin:16px 0;background:var(--line2);border-radius:16px;padding:15px 16px;}
  .gd-step{display:flex;align-items:flex-start;gap:11px;font-size:13px;color:var(--ink);line-height:1.5;
    padding:6px 0;}
  .gd-step .gd-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .gd-step b{font-weight:800;}
  .gd-bal{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);
    border:1.5px solid var(--line);border-radius:14px;font-size:13.5px;color:var(--sub);margin-bottom:12px;}
  .gd-bal b{color:var(--ink);font-size:15px;font-weight:800;}
  .gd-bal.low b{color:var(--danger);}
  .gd-cta{font-size:15px;}
  .member-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);}
  .member-row:last-child{border-bottom:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--gold-pale);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .member-info{flex:1;min-width:0;}
  .member-info .t{font-weight:700;font-size:13.5px;}
  .member-info .s{font-size:11.5px;color:var(--sub);}
  .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;}
  .badge.on{background:var(--ok-bg);color:var(--ok);}
  .badge.off{background:var(--line2);color:var(--sub);}

  /* ── ACCOUNT — identity card + menu rows (not a stat matrix) ── */
  /* Account membership card — profile + balances fused into one premium card */
  .acc-card{position:relative;overflow:hidden;border-radius:24px;margin-top:12px;color:#fff;
    padding:20px 20px 8px;background:linear-gradient(135deg,#1a1409 0%,#2a2114 52%,#3a2c12 100%);
    box-shadow:0 18px 38px rgba(169,127,34,.34);}
  .acc-card::before{content:"";position:absolute;top:-70px;right:-50px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none;}
  .acc-card::after{content:"";position:absolute;bottom:-90px;left:-40px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.22),rgba(56,189,248,0) 70%);pointer-events:none;}
  .acc-top{display:flex;align-items:center;gap:14px;position:relative;}
  .acc-av{width:58px;height:58px;border-radius:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;background:rgba(255,255,255,.16);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);}
  .acc-name{font-weight:800;font-size:18px;letter-spacing:.2px;}
  .acc-phone{color:rgba(255,255,255,.78);font-size:13px;margin-top:2px;}
  .acc-code{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:rgba(255,255,255,.15);
    border-radius:20px;padding:4px 11px;font-size:11px;font-weight:800;letter-spacing:1.2px;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);}
  .acc-code svg{width:12px;height:12px;opacity:.85;}
  .acc-stats{display:flex;margin-top:18px;background:rgba(255,255,255,.11);border-radius:16px;
    border:1px solid rgba(255,255,255,.12);position:relative;}
  .acc-stats .as{flex:1;text-align:center;padding:13px 6px;position:relative;}
  .acc-stats .as + .as::before{content:"";position:absolute;left:0;top:22%;height:56%;width:1px;
    background:rgba(255,255,255,.16);}
  .acc-stats .as .n{font-size:15px;font-weight:800;line-height:1.15;}
  .acc-stats .as .l{font-size:10.5px;color:rgba(255,255,255,.72);margin-top:4px;letter-spacing:.3px;}
  .acc-tier{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0 6px;
    font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.4px;}
  .acc-tier svg{width:13px;height:13px;}
  .menu-list{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
  .menu-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line2);
    cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-size:15px;color:var(--ink);}
  .menu-row:last-child{border-bottom:0;}
  .menu-row .mi{width:34px;height:34px;border-radius:10px;background:var(--line2);color:var(--gold);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .menu-row .mi svg{width:18px;height:18px;}
  .menu-row .ml{flex:1;font-weight:700;}
  .menu-row .mr{color:var(--sub);}
  .menu-row .mr svg{width:18px;height:18px;}
  .menu-row.danger .mi{background:var(--danger-bg);color:var(--danger);}
  .menu-row.danger .ml{color:var(--danger);}
  .support-body{display:flex;flex-direction:column;gap:10px;}
  .support-row{display:flex;align-items:center;gap:13px;padding:13px;border:1.5px solid var(--line);
    border-radius:14px;text-decoration:none;color:var(--ink);font-size:14px;}
  .support-row .mi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .support-row .mi svg{width:19px;height:19px;}
  .support-row .s{color:var(--sub);font-size:12px;}
  .bank-row{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;}
  .bank-row .mi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--line2);color:var(--gold);}
  .bank-row .mi svg{width:18px;height:18px;}
  .bank-info{flex:1;min-width:0;}
  .bank-info .t{font-weight:700;font-size:14px;}
  .bank-info .s{color:var(--sub);font-size:12px;}
  .bank-row.is-pick{cursor:pointer;}
  .bank-go{color:var(--sub);display:flex;flex-shrink:0;}
  .bank-go svg{width:17px;height:17px;}
  .bank-del{background:var(--danger-bg);color:var(--danger);border:0;border-radius:9px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .bank-del svg{width:17px;height:17px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--line2);color:var(--sub);
    font-size:12.5px;font-weight:700;border:0;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--gold);color:#fff;}

  /* ── WITHDRAW / DEPOSIT amount entry ── */
  .amt-big{width:100%;border:0;border-bottom:2px solid var(--line);font-size:32px;font-weight:800;
    padding:6px 0;text-align:center;color:var(--ink);outline:none;background:none;}
  .amt-big:focus{border-color:var(--gold);}
  .amt-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px;}
  .amt-chip{padding:8px 14px;border-radius:20px;background:var(--line2);border:0;color:var(--ink);
    font-size:13px;font-weight:700;cursor:pointer;}
  /* ── DEPOSIT POLLING / CONFIRM STATE ── */
  .pay-wait{text-align:center;padding:12px 0 4px;}
  .pay-orb{width:88px;height:88px;border-radius:50%;margin:6px auto 20px;position:relative;
    background:linear-gradient(135deg,#d9ad4e,#a97f22);display:flex;align-items:center;justify-content:center;color:#fff;}
  .pay-orb svg{width:38px;height:38px;stroke:#fff;position:relative;z-index:2;}
  .pay-orb::before,.pay-orb::after{content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--gold);opacity:.5;animation:payring 1.8s ease-out infinite;}
  .pay-orb::after{animation-delay:.9s;}
  @keyframes payring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}
  .pay-orb.ok{background:linear-gradient(135deg,#10b981,#059669);animation:paypop .35s ease;}
  .pay-orb.bad{background:linear-gradient(135deg,#fb7185,#e11d48);animation:paypop .35s ease;}
  .pay-orb.ok::before,.pay-orb.ok::after,.pay-orb.bad::before,.pay-orb.bad::after{display:none;}
  @keyframes paypop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  /* Full-screen falling confetti (payment success) */
  .confetti-sky{position:fixed;inset:0;z-index:2000;pointer-events:none;overflow:hidden;}
  .confetti-sky i{position:absolute;top:-5vh;display:block;opacity:0;border-radius:2px;
    animation-name:confFall;animation-timing-function:cubic-bezier(.3,.35,.6,.95);animation-fill-mode:forwards;}
  @keyframes confFall{
    0%{opacity:1;transform:translate3d(0,-5vh,0) rotate(0deg);}
    25%{transform:translate3d(calc(var(--sway)*.45),22vh,0) rotate(calc(var(--rot)*.3));}
    50%{transform:translate3d(calc(var(--sway)*-.35),48vh,0) rotate(calc(var(--rot)*.6));}
    75%{opacity:1;transform:translate3d(calc(var(--sway)*.55),76vh,0) rotate(calc(var(--rot)*.85));}
    100%{opacity:.9;transform:translate3d(var(--sway),108vh,0) rotate(var(--rot));}}
  .pay-title{font-size:19px;font-weight:800;margin:0 0 6px;}
  .pay-sub{font-size:13.5px;color:var(--sub);line-height:1.55;margin:0 auto 12px;max-width:290px;}
  /* Radial gold loader — replaces the old bouncing dots everywhere (login,
     register, deposit, withdraw, check-in...). Pure CSS, one rotating ring
     built from 12 conic segments via a masked conic-gradient. */

  .breakdown{background:var(--line2);border-radius:14px;padding:14px 16px;margin:16px 0;}
  .breakdown .br{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .breakdown .br.total{border-top:1px dashed #d9cef2;margin-top:5px;padding-top:10px;font-weight:800;font-size:15px;}
  .breakdown .br .muted{color:var(--sub);}

  /* ── PAGE (full-screen slide-in, replaces bottom-sheet) ── */
  .modal-root{position:fixed;inset:0;z-index:500;display:flex;align-items:stretch;justify-content:center;}
  .modal-root.hidden{display:none;}
  .modal-backdrop{position:absolute;inset:0;background:rgba(9,7,3,.55);touch-action:none;}
  /* While any dialog is open the page behind it must NOT scroll */
  body.no-scroll{overflow:hidden;}
  .modal-card{position:relative;width:100%;max-width:480px;background:var(--bg);
    padding:0 20px calc(24px + env(safe-area-inset-bottom));height:100%;overflow-y:auto;
    overscroll-behavior:contain;animation:pageIn .12s ease-out both;-webkit-overflow-scrolling:touch;}
  /* "Ghost" appear — fades/scales in place, no directional slide */
  @keyframes pageIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  .modal-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
    margin:0 -20px 18px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
    background:var(--bg);border-bottom:1px solid var(--line);}
  .modal-head h2{font-size:17px;font-weight:800;margin:0;flex:1;}
  .modal-close{background:none;border:0;padding:0;width:34px;height:34px;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;}
  .modal-close:active{color:var(--gold);}
  .modal-close svg{width:22px;height:22px;}
  /* explanatory instruction block shown on deposit / withdraw / referral pages */
  .proc-line{display:flex;align-items:center;gap:9px;background:var(--line2);border:1px solid var(--line);
    border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--sub);}
  .proc-line b{color:var(--ink);font-weight:700;}
  .proc-line .pl-ic{color:var(--gold);display:flex;flex-shrink:0;}
  .proc-line .pl-ic svg{width:17px;height:17px;}
  .info-note{display:flex;gap:10px;align-items:flex-start;background:var(--line2);border-radius:14px;
    padding:13px 14px;margin-bottom:16px;border:1px solid var(--line);}
  .info-note .in-ic{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;background:var(--line2);color:var(--gold);}
  .info-note .in-ic svg{width:17px;height:17px;}
  .info-note .in-tx{font-size:12.5px;line-height:1.55;color:var(--sub);}
  .info-note .in-tx b{color:var(--ink);font-weight:700;}
  .info-note ol{margin:6px 0 0;padding-left:17px;}
  .info-note li{margin-bottom:3px;}

  /* ── ABOUT PAGE ── */
  .about-hero{text-align:center;padding:8px 0 4px;}
  .about-logo{width:76px;height:76px;margin:0 auto 12px;}
  .about-name{font-size:22px;font-weight:800;color:var(--ink);}
  .about-tag{font-size:13px;color:var(--sub);margin-top:4px;}
  .about-body{margin-top:18px;}
  .about-body p{font-size:14px;line-height:1.62;color:var(--ink);margin:0 0 14px;}
  .dl-meta{margin:18px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .dl-row{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;font-size:13.5px;
    color:var(--sub);border-bottom:1px solid var(--line2);}
  .dl-row:last-child{border-bottom:0;}
  .dl-row b{color:var(--ink);font-weight:700;}
  .blocker{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:28px;}
  .blocker-card{max-width:340px;text-align:center;}
  .blocker-logo{width:76px;height:76px;margin:0 auto 18px;}
  .blocker-card h2{font-size:20px;font-weight:800;margin:0 0 10px;color:var(--ink);}
  .blocker-card p{font-size:14px;line-height:1.6;color:var(--sub);margin:0 0 22px;}

  /* ── ANNOUNCEMENT DIALOG ── */
  .ann-card{position:relative;width:100%;max-width:400px;background:var(--card);border-radius:22px;overflow:hidden;
    margin:0 16px;animation:annIn .25s ease both;max-height:86vh;display:flex;flex-direction:column;}
  @keyframes annIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .ann-x{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:0;border:0;
    background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .ann-x svg{width:17px;height:17px;}
  .ann-hero{height:120px;background:linear-gradient(120deg,#1a1409,#2a2114 60%,#100d08);position:relative;
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;}
  .ann-hero .ann-htitle{color:#fff;font-size:34px;font-weight:800;letter-spacing:2px;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.5);}
  .ann-logo{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:60px;height:60px;
    border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;}
  .ann-logo svg{width:38px;height:38px;}
  .ann-body{padding:44px 22px 20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .ann-text{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .ann-list{margin-top:0;}
  .ann-list li{font-size:14px;color:var(--ink);}
  .ann-inline-link{color:#38bdf8;text-decoration:underline;word-break:break-all;}
  .ann-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;
    background:linear-gradient(120deg,#38bdf8,#2563eb);
    color:#fff;text-align:center;text-decoration:none;padding:13px;border-radius:0;font-weight:700;font-size:14px;}
  .ann-cta-ic{width:20px;height:20px;flex-shrink:0;display:inline-flex;}
  .ann-cta-ic svg{width:100%;height:100%;display:block;}

  /* ── TOAST ── */
  .toast-root{position:fixed;inset:0;z-index:1400;display:flex;align-items:center;
    justify-content:center;pointer-events:none;}
  .toast{background:rgba(58,56,52,.96);color:#fff;border:0;
    padding:15px 26px;border-radius:11px;font-size:14px;font-weight:500;max-width:78%;
    text-align:center;box-shadow:0 14px 36px rgba(0,0,0,.45);
    animation:cvToast .2s cubic-bezier(.2,.9,.3,1.1) both;}
  .toast.out{animation:cvToastOut .24s ease both;}
  .toast .toast-in{display:block;}
  .toast.has-check{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 30px;}
  .toast-check{width:34px;height:34px;flex-shrink:0;color:#fff;}
  .toast-check svg{width:34px;height:34px;}
  @keyframes cvToast{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes cvToastOut{to{opacity:0;transform:scale(.96)}}

  /* Small radial button loader (replaces "Please wait" text + dots) */

  /* ══════════════════════════════════════════════
     CHRONOVA — rebuilt surfaces
     Boxed corners, gold on warm charcoal, no rounded pills.
     ══════════════════════════════════════════════ */

  /* ── Loader: twelve spokes fading around a ring. Used for every busy state. ── */
  .spin{display:inline-block;width:22px;height:22px;position:relative;vertical-align:middle;}
  .spin i{position:absolute;left:50%;top:1px;width:2px;height:6px;margin-left:-1px;
    border-radius:1px;background:currentColor;transform-origin:50% 10px;
    animation:cvSpin .72s linear infinite;opacity:.12;}
  .spin i:nth-child(1){transform:rotate(0deg);animation-delay:-.72s}
  .spin i:nth-child(2){transform:rotate(30deg);animation-delay:-.66s}
  .spin i:nth-child(3){transform:rotate(60deg);animation-delay:-.60s}
  .spin i:nth-child(4){transform:rotate(90deg);animation-delay:-.54s}
  .spin i:nth-child(5){transform:rotate(120deg);animation-delay:-.48s}
  .spin i:nth-child(6){transform:rotate(150deg);animation-delay:-.42s}
  .spin i:nth-child(7){transform:rotate(180deg);animation-delay:-.36s}
  .spin i:nth-child(8){transform:rotate(210deg);animation-delay:-.30s}
  .spin i:nth-child(9){transform:rotate(240deg);animation-delay:-.24s}
  .spin i:nth-child(10){transform:rotate(270deg);animation-delay:-.18s}
  .spin i:nth-child(11){transform:rotate(300deg);animation-delay:-.12s}
  .spin i:nth-child(12){transform:rotate(330deg);animation-delay:-.06s}
  @keyframes cvSpin{0%{opacity:1}100%{opacity:.12}}

  /* Centred loader for a screen that is still fetching. */
  .load-wrap{display:flex;align-items:center;justify-content:center;padding:46px 0;color:var(--gold);}
  .load-wrap .spin{width:30px;height:30px;}
  .load-wrap .spin i{height:8px;transform-origin:50% 14px;}

  /* ── Home: hero banner (admin-supplied only) ── */
  .hero-static{width:calc(100% + 36px);margin:-10px -18px 14px;aspect-ratio:16/9;
    overflow:hidden;background:var(--line2);}
  .hero-static img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-static.is-empty{background:
    repeating-linear-gradient(135deg,#17150f 0 12px,#1c1913 12px 24px);}

  /* ── Home: action row ── */
  .act-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .act{border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;
    background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;
    font:inherit;transition:border-color .15s,background .15s;}
  .act:active{background:var(--line2);}
  .act:hover{border-color:var(--gold-deep);}
  .act-ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--gold);}
  .act-ic svg{width:24px;height:24px;}
  .act-ic img{width:24px;height:24px;object-fit:contain;
    filter:invert(75%) sepia(46%) saturate(638%) hue-rotate(358deg) brightness(101%) contrast(94%);}
  .act-t{font-size:11px;font-weight:700;letter-spacing:.01em;}
  .act.is-done .act-ic{opacity:.45;}
  .act.is-done .act-t{color:var(--sub);}

  /* ── Home: live activity wire ── */
  .wire{display:flex;align-items:center;gap:10px;border-radius:12px;
    background:var(--line2);border:1px solid var(--line);padding:8px 11px;margin-bottom:14px;}
  .wire-cap{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .wire-cap svg{width:20px;height:20px;}
  .wire-cap.right{color:var(--gold);}
  .wire-view{flex:1;min-width:0;overflow:hidden;}
  .wire-track{display:inline-flex;white-space:nowrap;animation:cvWire 120s linear infinite;}
  @keyframes cvWire{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .wire-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;
    font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .wire-item em{font-style:normal;color:var(--gold);font-weight:700;}
  .wire-dot{width:6px;height:6px;flex-shrink:0;}
  .wire-dot.in{background:var(--ok);}
  .wire-dot.out{background:var(--gold-deep);}

  /* ── Home: balance cards, each on its own admin banner ── */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{border-radius:14px;position:relative;overflow:hidden;min-height:92px;
    background:var(--card);border:1px solid var(--line);display:flex;}
  .stat-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .stat-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,7,.35),rgba(11,10,7,.88));}
  .stat-in{position:relative;padding:13px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;width:100%;}
  .stat-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .stat-v{font-size:17px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.15;}

  /* ── Three-quarter sheet (Recharge / Withdrawal) ── */
  .sheet{position:relative;width:calc(100% - 34px);max-width:460px;max-height:76vh;
    display:flex;flex-direction:column;border-radius:18px;overflow:hidden;
    background:var(--bg);border:1px solid var(--gold-deep);
    box-shadow:0 26px 60px rgba(0,0,0,.6);
    animation:cvRise .12s ease-out both;}
  @keyframes cvRise{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

  .sheet-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;
    border-bottom:1px solid var(--line);flex-shrink:0;}
  .sheet-head h2{flex:1;text-align:center;font-size:16px;font-weight:800;margin:0;color:var(--ink);}
  .sheet-x,.sheet-rec{border-radius:10px;width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--line2);border:1px solid var(--line);color:var(--gold);cursor:pointer;padding:0;}
  .sheet-x svg,.sheet-rec svg{width:18px;height:18px;}
  .sheet-rec-sp{width:34px;flex-shrink:0;}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 14px 20px;-webkit-overflow-scrolling:touch;}
  .sheet-body .btn{margin-top:18px;}
  .sheet-body .ci-rules{margin-top:16px;}

  /* ── Form pieces ── */
  .fld-l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--sub);font-weight:700;margin:14px 0 7px;}
  .fld-l:first-child{margin-top:0;}
  .fld{border-radius:12px;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);}
  .fld:focus-within{border-color:var(--gold);}
  .fld-pre{padding:0 10px;font-size:13px;font-weight:700;color:var(--sub);flex-shrink:0;}
  .fld input{flex:1;background:none;border:0;outline:none;color:var(--ink);
    font-size:17px;font-weight:700;padding:13px 12px 13px 0;font-variant-numeric:tabular-nums;width:100%;}

  .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .chip-grid .chip{border-radius:12px;padding:13px 4px;background:var(--card);border:1px solid var(--line);
    color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;}
  .chip-grid .chip.on{background:linear-gradient(135deg,var(--gold-pale),var(--gold));
    color:var(--gold-ink);border-color:var(--gold);}

  .net-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
  .net{border-radius:12px;padding:11px;background:var(--card);border:1px solid var(--line);color:var(--sub);
    font-size:13px;font-weight:700;cursor:pointer;}
  .net.on{border-color:var(--gold);color:var(--gold);background:var(--line2);}

  /* ── Instruction notice ── */
  .notice{border-radius:12px;margin-top:16px;padding:13px;background:var(--line2);border-left:3px solid var(--gold);}
  .notice b{display:block;font-size:12px;color:var(--gold);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.06em;}
  .notice ol{margin:0;padding-left:17px;}
  .notice li{font-size:12px;line-height:1.65;color:var(--sub);margin-bottom:5px;}
  .notice li b{display:inline;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink);}
  .notice-min{margin:9px 0 0;font-size:12px;color:var(--gold);font-weight:700;}

  /* ── Withdrawal specifics ── */
  .wd-bal{border-radius:12px;display:flex;align-items:baseline;justify-content:space-between;padding:15px;
    background:var(--card);border:1px solid var(--gold-deep);}
  .wd-bal span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);font-weight:700;}
  .wd-bal b{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
  .calc{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--sub);}
  .calc b{color:var(--ok);font-size:14px;font-variant-numeric:tabular-nums;}
  .calc-fee{color:var(--sub);}
  .pick{display:flex;flex-direction:column;gap:7px;}
  .pick-row{border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;
    background:var(--card);border:1px solid var(--line);color:var(--ink);
    font-size:13px;font-weight:700;cursor:pointer;text-align:left;}
  .pick-row em{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums;}
  .pick-row.on{border-color:var(--gold);}
  .pick-nav{width:100%;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px;background:var(--card);border:1px solid var(--line);color:var(--ink);
    font-size:13px;font-weight:700;cursor:pointer;text-align:left;}
  .pick-nav-tx{font-variant-numeric:tabular-nums;}
  .pick-nav svg{width:17px;height:17px;color:var(--sub);flex-shrink:0;}

  .pm-row{border-radius:12px;display:flex;align-items:center;gap:11px;padding:13px;
    background:var(--card);border:1px solid var(--gold);margin-bottom:6px;}
  .pm-ic{width:20px;height:20px;flex-shrink:0;color:var(--gold);display:flex;}
  .pm-ic svg{width:20px;height:20px;}
  .pm-label{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);}
  .pm-check{width:18px;height:18px;flex-shrink:0;color:var(--gold);display:flex;}
  .pm-check svg{width:18px;height:18px;}

  /* ── Records ── */
  .rtabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .rtab{flex:1;padding:12px 4px;background:none;border:0;border-bottom:2px solid transparent;
    color:var(--sub);font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .rtab.on{color:var(--gold);border-bottom-color:var(--gold);}
  .rcard{border-radius:12px;background:var(--card);border:1px solid var(--line);padding:13px;margin-bottom:9px;}
  .rcard-top{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);}
  .rcard-top b{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .rcard-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;}
  .rcard-grid span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;}
  .rcard-grid em{font-style:normal;font-size:12px;color:var(--ink);text-align:right;
    font-variant-numeric:tabular-nums;word-break:break-all;}

  /* ── Page banner (Check-in, Contact, Team) ── */
  .page-banner{border-radius:14px;width:100%;aspect-ratio:16/7;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;}
  .page-banner img{width:100%;height:100%;object-fit:cover;display:block;}


  /* ── Contact Us ── */
  .ct-row{border-radius:12px;display:flex;align-items:center;gap:12px;padding:15px 13px;background:var(--card);
    border:1px solid var(--line);margin-bottom:9px;text-decoration:none;color:var(--ink);}
  .ct-ic{border-radius:10px;width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--line2);color:var(--gold);}
  .ct-ic svg{width:21px;height:21px;}
  .ct-tx{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ct-tx b{font-size:14px;font-weight:700;}
  .ct-tx em{font-style:normal;font-size:12px;color:var(--sub);}
  .ct-go{color:var(--gold);font-size:20px;line-height:1;}
  .ct-hours{margin-top:14px;font-size:12px;color:var(--sub);text-align:center;}

  /* ── Products: two overlay stat rows, photo behind, chevron to open ── */
  .pstat-row{position:relative;overflow:hidden;border-radius:14px;min-height:80px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;margin-bottom:10px;background:var(--card) center/cover no-repeat;
    border:1px solid var(--line);cursor:pointer;}
  .pstat-row.has-bg::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,10,7,.35),rgba(11,10,7,.82));}
  .pstat-txt{position:relative;display:flex;flex-direction:column;gap:4px;}
  .pstat-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .pstat-v{font-size:19px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
  .pstat-go{position:relative;color:#fff;opacity:.75;display:flex;flex-shrink:0;}
  .pstat-go svg{width:18px;height:18px;}

  .pcard{border-radius:12px;display:flex;gap:12px;padding:12px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--tint,var(--gold));margin-bottom:11px;}
  .pcard-art{border-radius:10px;position:relative;width:96px;height:96px;flex-shrink:0;overflow:hidden;background:var(--line2);}
  .pcard-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .pcard-noimg{position:absolute;inset:0;background:
    repeating-linear-gradient(135deg,#1c1913 0 10px,#17150f 10px 20px);}
  .pcard-soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(11,10,7,.72);color:var(--gold);font-size:11px;font-weight:800;text-align:center;}
  .pcard.is-soon{opacity:.72;}
  .pcard-in{flex:1;min-width:0;display:flex;flex-direction:column;}
  .pcard-name{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px;}
  .pcard-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-bottom:10px;}
  .pcard-grid span{font-size:11px;color:var(--sub);}
  .pcard-grid b{font-size:12px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}
  .pcard-cta{border-radius:10px;margin-top:auto;padding:9px;background:linear-gradient(135deg,var(--gold-pale),var(--gold));
    border:0;color:var(--gold-ink);font:inherit;font-size:13px;font-weight:800;cursor:pointer;}
  .pcard-cta:disabled{background:var(--line2);color:var(--sub);cursor:default;}

  .pd-art{border-radius:14px;width:100%;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;}
  .pd-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .pd-fill{width:100%;height:100%;}
  .pd-total{border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:20px;
    background:var(--card);border:1px solid var(--gold-deep);margin-bottom:12px;}
  .pd-total span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;}
  .pd-total b{font-size:29px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
  .pd-grid{border-radius:12px;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;padding:14px;
    background:var(--line2);border:1px solid var(--line);}
  .pd-grid span{font-size:12px;color:var(--sub);}
  .pd-grid b{font-size:13px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}
  .pd-bal{border-radius:12px;display:flex;justify-content:space-between;align-items:center;padding:13px;
    margin:14px 0 12px;background:var(--card);border:1px solid var(--line);}
  .pd-bal span{font-size:12px;color:var(--sub);}
  .pd-bal b{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;}

  /* ── My products rows ── */
  .hold-row{border-radius:12px;background:var(--card);border:1px solid var(--line);padding:13px;margin-bottom:10px;}
  .hold-top{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);}
  .hold-top b{font-size:14px;font-weight:800;color:var(--ink);}
  .hold-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;}
  .hold-grid span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;}
  .hold-grid b{font-size:12px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}

  /* ── Account (mockup 08) ── */
  .acc-head{display:flex;align-items:center;gap:15px;padding:18px 4px 20px;}
  .acc-disc{width:66px;height:66px;flex-shrink:0;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#f7e6b4,var(--gold) 58%,var(--gold-deep));
    color:var(--gold-ink);display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;}
  .acc-id{min-width:0;flex:1;}
  .acc-num{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.01em;}
  .acc-badges{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
  .vip{background:linear-gradient(135deg,var(--gold-pale),var(--gold));color:var(--gold-ink);
    font-size:12px;font-weight:800;padding:3px 11px;border-radius:6px;letter-spacing:.02em;}
  .acc-code{display:inline-flex;align-items:center;gap:5px;background:var(--line2);
    border:1px solid var(--line);color:var(--sub);font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:6px;cursor:pointer;letter-spacing:.04em;}
  .acc-code svg{width:12px;height:12px;}

  .acc-bal{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:14px;
    background:linear-gradient(135deg,rgba(217,173,78,.12),rgba(23,21,15,.9));
    border:1px solid var(--gold-deep);margin-bottom:16px;}
  .acc-bal span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);font-weight:700;}
  .acc-bal b{font-size:31px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1;}

  .acc-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}
  .aact{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;
    border:0;color:var(--sub);font:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0;}
  .aact-ic{width:54px;height:54px;border-radius:14px;background:var(--card);
    border:1px solid var(--line);color:var(--gold);display:flex;align-items:center;justify-content:center;}
  .aact-ic svg{width:23px;height:23px;}
  .aact-ic img{width:23px;height:23px;object-fit:contain;
    filter:invert(75%) sepia(46%) saturate(638%) hue-rotate(358deg) brightness(101%) contrast(94%);}
  .aact:active .aact-ic{background:var(--line2);}
  .aact.is-done{opacity:.5;}

  .mission{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
    padding:18px;border-radius:14px;margin-bottom:18px;cursor:pointer;font:inherit;
    background:linear-gradient(135deg,rgba(217,173,78,.14),rgba(23,21,15,.92));
    border:1px solid var(--gold-deep);}
  .mission-txt{display:flex;flex-direction:column;gap:5px;}
  .mission-txt b{font-size:17px;font-weight:800;color:var(--gold);}
  .mission-txt span{font-size:13px;color:var(--sub);}
  .mission-go{color:var(--gold);flex-shrink:0;display:flex;}
  .mission-go svg{width:20px;height:20px;}

  /* Task Center — deliberately plain: a box, three stat columns, a status pill. */
  .tk-lead{font-size:13px;color:var(--sub);margin:0 0 16px;line-height:1.5;}
  .tk-row{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .tk-desc{font-size:13.5px;color:var(--ink);line-height:1.5;margin-bottom:14px;}
  .tk-desc b{color:var(--ink);}
  .tk-desc em{color:var(--gold);font-style:normal;font-weight:800;}
  .tk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-bottom:14px;}
  .tk-stats b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .tk-stats span{display:block;font-size:11px;color:var(--sub);margin-top:3px;}
  .tk-pill{width:100%;padding:12px;border:0;border-radius:10px;background:var(--line2);
    color:var(--sub);font:inherit;font-size:13px;font-weight:800;cursor:default;}
  .tk-pill.is-ready{background:var(--gold);color:var(--gold-ink);cursor:pointer;}
  .tk-pill.is-done{background:var(--ok-bg);color:var(--ok);}

  /* Account menu: no frames at all. The items sit in open space, three across,
     separated by rhythm rather than by boxes. */
  .atiles{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 6px;margin:6px 0 26px;}
  .atile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0;
    background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:600;
    cursor:pointer;text-align:center;line-height:1.3;}
  .atile:active{opacity:.55;}
  .ati{width:28px;height:28px;flex-shrink:0;color:var(--gold);display:flex;align-items:center;justify-content:center;}
  .ati svg{width:26px;height:26px;}
  .atl{display:block;max-width:100%;}

  .aflat{display:flex;align-items:center;gap:13px;width:100%;padding:15px 2px;
    background:none;border:0;color:var(--ink);font:inherit;font-size:14px;
    font-weight:600;cursor:pointer;text-align:left;}
  .aflat:active{opacity:.55;}
  .aflat.is-exit{color:var(--danger);}
  .aflat.is-exit .ati{color:var(--danger);}



  /* Empty shop — an explicit state, not a generic "no data" line. */
  .shop-empty{display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:52px 24px;text-align:center;}
  .shop-empty-ic{width:46px;height:46px;color:var(--gold);opacity:.55;display:flex;align-items:center;justify-content:center;}
  .shop-empty-ic svg{width:44px;height:44px;}
  .shop-empty b{font-size:16px;font-weight:800;color:var(--ink);}
  .shop-empty span{font-size:13px;color:var(--sub);line-height:1.55;max-width:270px;}

  /* ── Option picker (Select bank) — sits above the page it was opened from ── */
  .picker-root{position:fixed;inset:0;z-index:1200;display:flex;align-items:flex-end;justify-content:center;}
  .picker-root.hidden{display:none;}
  .pick-backdrop{position:absolute;inset:0;background:rgba(6,5,3,.62);}
  .pick-sheet{position:relative;width:100%;max-width:520px;background:var(--card);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;overflow:hidden;
    animation:cvPickUp .14s ease-out both;}
  @keyframes cvPickUp{from{transform:translateY(100%)}to{transform:none}}
  .pick-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);}
  .pick-bar span{font-size:15px;font-weight:800;color:var(--ink);}
  .pick-cancel,.pick-ok{background:none;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0;}
  .pick-cancel{color:var(--sub);}
  .pick-ok{color:var(--gold);}
  .pick-list{max-height:46vh;overflow-y:auto;padding:6px 0 10px;}
  .pick-opt{display:block;width:100%;padding:16px;background:none;border:0;
    border-bottom:1px solid var(--line);color:var(--sub);font:inherit;font-size:15px;
    font-weight:600;cursor:pointer;text-align:center;}
  .pick-opt:last-child{border-bottom:0;}
  .pick-opt.on{color:var(--gold);font-weight:800;background:rgba(217,173,78,.07);}

  /* ── Bind bank card ── */
  .bank-list{margin-bottom:14px;}
  .bind-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:0 15px;margin-bottom:18px;}
  .bind-row{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%;
    padding:16px 0;border-bottom:1px solid var(--line);background:none;border-left:0;
    border-right:0;border-top:0;font:inherit;text-align:left;position:relative;}
  .bind-row:last-child{border-bottom:0;}
  button.bind-row{cursor:pointer;}
  .bind-l{font-size:14px;font-weight:700;color:var(--ink);}
  .bind-l i{color:var(--danger);font-style:normal;margin-right:4px;}
  .bind-v{font-size:13px;color:var(--sub);}
  .bind-v.is-set{color:var(--gold);font-weight:700;}
  .bind-go{position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--sub);display:flex;}
  .bind-go svg{width:17px;height:17px;}
  .bind-row.is-field input{background:none;border:0;outline:none;color:var(--ink);
    font:inherit;font-size:13px;padding:0;width:100%;}
  .bind-row.is-field input::placeholder{color:var(--sub);}

  /* ── Customer care ── */
  .cc-hours{display:flex;flex-direction:column;gap:3px;margin-bottom:16px;}
  .cc-hours span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);font-weight:700;}
  .cc-hours b{font-size:14px;color:var(--gold);font-weight:700;}
  .cc-label{font-size:13px;color:var(--sub);font-weight:700;margin:4px 0 10px;}
  .tg-row{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:10px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;}
  .tg-art{width:64px;height:64px;flex-shrink:0;border-radius:12px;
    background:linear-gradient(135deg,#3fc0f5,#1c93d6);display:flex;align-items:center;justify-content:center;}
  .tg-art svg{width:42px;height:42px;}
  .tg-tx{display:flex;flex-direction:column;align-items:flex-start;gap:9px;}
  .tg-tx b{font-size:15px;font-weight:700;color:var(--ink);}
  .tg-jump{padding:7px 15px;border:0;border-radius:8px;font:inherit;font-size:12px;
    font-weight:800;background:linear-gradient(135deg,var(--gold-pale),var(--gold));
    color:var(--gold-ink);cursor:pointer;}



  /* ── Check-in ── */
  .ci-total{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 20px;}
  .ci-total b{font-size:36px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1;}
  .ci-total span{font-size:13px;color:var(--sub);}
  .ci-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .ci-cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px 10px;
    border-radius:14px;background:var(--card);border:1px solid var(--line);}
  .ci-cell b{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ci-cell span{font-size:12px;color:var(--sub);}
  .ci-rules{margin:18px 0 0;padding-left:18px;}
  .ci-rules li{font-size:12.5px;line-height:1.7;color:var(--sub);}

  /* ── Team ── */
  .tm-share{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 22px;}
  .tm-slab{position:relative;min-height:104px;border-radius:14px;overflow:hidden;
    background:var(--card) center/cover no-repeat;border:1px solid var(--line);}
  .tm-slab.has-bg::before{content:"";position:absolute;inset:0;background:rgba(9,8,5,.62);}
  .tm-slab-in{position:relative;height:100%;padding:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;}
  .tm-slab-in span{font-size:11px;color:var(--gold);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;}
  .tm-code{font-size:23px;font-weight:800;color:#fff;letter-spacing:.05em;}
  .tm-link{font-size:11px;font-weight:600;color:#fff;word-break:break-all;line-height:1.4;}
  .tm-cp{padding:11px;border:0;border-radius:11px;font:inherit;font-size:13px;font-weight:800;
    background:linear-gradient(135deg,var(--gold-pale),var(--gold));color:var(--gold-ink);cursor:pointer;}

  .tm-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .tm-title h3{font-size:19px;font-weight:800;color:var(--ink);margin:0;text-transform:uppercase;letter-spacing:.02em;}
  .tm-title span{font-size:12px;color:var(--sub);text-align:right;}
  .tm-task-link{display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;
    margin-bottom:16px;font:inherit;font-size:13px;font-weight:700;color:var(--gold);cursor:pointer;}
  .tm-task-chev{font-size:16px;line-height:1;}

  .tm-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:4px 15px;margin-bottom:14px;}
  .tm-lvl{padding:16px 0;border-bottom:1px solid var(--line);}
  .tm-lvl:last-child{border-bottom:0;}
  .tm-tag{display:inline-block;padding:4px 13px;border-radius:8px;margin-bottom:12px;
    background:linear-gradient(135deg,var(--gold-pale),var(--gold));color:var(--gold-ink);
    font-size:12px;font-weight:800;letter-spacing:.03em;}
  .tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .tm-col{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;}
  .tm-col b{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .tm-col span{font-size:11px;color:var(--sub);}

  .tm-totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .tm-total{position:relative;min-height:96px;border-radius:14px;overflow:hidden;padding:0;
    background:var(--card) center/cover no-repeat;border:1px solid var(--line);
    font:inherit;cursor:pointer;display:block;}
  .tm-total.has-bg::before{content:"";position:absolute;inset:0;background:rgba(9,8,5,.66);}
  .tm-total-in{position:relative;display:flex;flex-direction:column;align-items:flex-start;
    justify-content:flex-end;gap:3px;height:100%;min-height:96px;padding:14px;}
  .tm-total-in b{font-size:21px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
  .tm-total-in em{font-style:normal;font-size:12px;color:var(--sub);}

  /* Page background image, sitting behind a screen's content. */
  .page-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .page-bg img{width:100%;height:100%;object-fit:cover;opacity:.16;}
  .page-bg + *{position:relative;z-index:1;}

  /* Activity wire: brand mark one end, alert bell the other. */

  /* Records read as small statements: reference and status, then one labelled
     line per fact. Roomy on purpose. */
  .rec-card{padding:16px 0;border-bottom:1px solid var(--line);}
  .rec-card:last-child{border-bottom:0;}
  .rec-head{display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin-bottom:12px;}
  .rec-ref{font-size:14px;font-weight:700;color:var(--ink);word-break:break-all;}
  .rec-st{flex-shrink:0;font-size:13px;font-weight:700;}
  .rec-st.ok{color:var(--ok);}
  .rec-st.proc{color:var(--gold);}
  .rec-st.bad{color:var(--danger);}
  .rec-st.mut{color:var(--sub);}
  .rec-line{display:flex;align-items:baseline;gap:10px;padding:5px 0;}
  .rec-line span{flex:0 0 84px;font-size:13px;color:var(--sub);}
  .rec-line span::after{content:":";}
  .rec-line b{font-size:13.5px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;word-break:break-all;}

  /* Redeem gift */
  .gift-lead{font-size:13px;color:var(--sub);margin:0 0 12px;}
  .gift-group{display:flex;align-items:center;gap:13px;padding:13px;margin-bottom:22px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;}
  .gift-tg{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .gift-tg svg{width:36px;height:36px;}
  .gift-name{flex:1;font-size:15px;font-weight:700;color:var(--ink);}
  .gift-go{color:var(--sub);display:flex;flex-shrink:0;}
  .gift-go svg{width:17px;height:17px;}
  .gift-label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .gift-label i{color:var(--danger);font-style:normal;margin-right:4px;}
  /* A line, not a box. */
  .gift-input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);
    outline:none;color:var(--ink);font:inherit;font-size:15px;padding:14px 2px;
    letter-spacing:.06em;margin-bottom:26px;border-radius:0;}
  .gift-input::placeholder{color:var(--sub);letter-spacing:0;}
  .gift-input:focus{border-bottom-color:var(--gold);}

  /* Direct-purchase confirm — compact, centred, no page to step into. */
  .buy-card{position:relative;width:calc(100% - 40px);max-width:360px;
    background:var(--bg);border:1px solid var(--gold-deep);border-radius:16px;
    padding:18px;box-shadow:0 22px 54px rgba(0,0,0,.6);
    animation:cvRise .12s ease-out both;}
  .buy-art{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;margin-bottom:14px;background:var(--line2);}
  .buy-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .buy-fill{width:100%;height:100%;}
  .buy-name{font-size:18px;font-weight:800;color:var(--ink);margin:0 0 12px;}
  .buy-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;
    padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px;}
  .buy-grid span{font-size:13px;color:var(--sub);}
  .buy-grid b{font-size:13px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}
  .buy-bal{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .buy-bal span{font-size:13px;color:var(--sub);}
  .buy-bal b{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;}
  .buy-actions{display:flex;gap:10px;align-items:center;}
  .buy-cancel{flex:0 0 auto;padding:14px 20px;border:1px solid var(--line);border-radius:12px;
    background:none;color:var(--sub);font:inherit;font-size:14px;font-weight:700;cursor:pointer;}
  .buy-actions .btn{flex:1;margin:0;}
</style>
</head>
<body>
<div id="app">

  <!-- AUTH (hidden until the module decides, so returning users don't see it flash) -->
  <div class="auth-view hidden" id="authView">
    <div class="auth-scroll">
      <div class="auth-logo">
        <div class="auth-clock">
          <svg viewBox="0 0 24 24" fill="none" stroke="#241a06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.6 1.6"></path>
          </svg>
        </div>
        <h2 class="auth-brand">CHRONOVA</h2>
        
      </div>
