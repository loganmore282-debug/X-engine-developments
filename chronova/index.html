<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Chronova — Time is Wealth</title>
<meta name="description" content="Chronova — a luxury-watch mobile-money investment platform">
<meta name="theme-color" content="#0c0b0e">
<meta property="og:title" content="Chronova — Time is Wealth">
<meta property="og:description" content="Own a luxury watch tier and earn every day. Chronova.">
<meta property="og:image" content="link-preview.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chronova — Time is Wealth">
<meta name="twitter:image" content="link-preview.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0c0b0e; --card:#17161c; --ink:#f3efe6; --sub:#a89f8c;
    --line:#2a2733; --line2:#1f1d25;
    --violet:#d9ad4e; --violet-dk:#a97f22; --violet-ink:#1c1403;
    --emerald:#34d399; --sapphire:#38bdf8; --ruby:#fb7185; --topaz:#eab308; --amethyst:#f4d98a;
    --danger:#f4708c; --danger-bg:#3a1720;
    --ok:#57c98a; --ok-bg:#12241a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit}
  input,select{font-family:inherit}
  #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  .hidden{display:none !important;}
  .eico{width:22px;height:22px;display:block;}
  a{color:var(--violet)}

  /* ── SPLASH (first paint only) ── */
  .splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:18px;}
  .mark{width:88px;height:88px;border-radius:24px;background:var(--violet);
    display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(124,58,237,.28);}
  .mark svg{width:52px;height:52px;}
  .mark.sm{width:40px;height:40px;border-radius:12px;box-shadow:none;}
  .mark.sm svg{width:24px;height:24px;}
  .brand{font-size:26px;font-weight:800;letter-spacing:.2px;}
  .tagline{color:var(--sub);font-size:15px;max-width:280px;line-height:1.5;}
  .facets{display:flex;gap:8px;margin-top:6px;}
  .facets i{width:14px;height:14px;border-radius:4px;display:inline-block;}

  /* ── SHARED CONTROLS ── */
  .btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--violet);color:var(--violet-ink);
    font-size:16px;font-weight:700;cursor:pointer;}
  .btn:active{opacity:.85}
  .btn[disabled]{opacity:.55;cursor:default;}
  .btn.ghost{background:var(--line2);color:var(--ink);}
  .btn.outline{background:transparent;color:var(--violet);border:1.5px solid var(--violet);}
  .btn.danger{background:var(--danger);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:15px;background:var(--card);color:var(--ink);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--violet);}
  .field-err{color:var(--danger);font-size:12px;margin-top:6px;}
  .note{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;}
  .err-box{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:11px 14px;
    font-size:13px;margin-bottom:14px;}

  /* ── AUTH VIEW — immersive full-bleed gradient, pill fields, +256 prefix ── */
  .auth-view{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(165deg,#1a1409 0%,#241c0e 45%,#100d08 100%);color:#fff;}
  .auth-bg-art{position:absolute;top:-40px;right:-60px;width:280px;height:280px;opacity:.13;pointer-events:none;}
  .auth-bg-art2{position:absolute;bottom:-70px;left:-70px;width:240px;height:240px;opacity:.10;pointer-events:none;}
  .auth-scroll{position:relative;z-index:2;flex:1;overflow-y:auto;padding:64px 26px 40px;
    display:flex;flex-direction:column;justify-content:center;min-height:100%;}
  .auth-logo{display:flex;flex-direction:column;align-items:center;gap:9px;margin:8px 0 26px;}
  .auth-clock{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#f7e6b4,#d9ad4e 60%,#a97f22);
    box-shadow:0 0 40px rgba(217,173,78,.55),inset 0 0 14px rgba(0,0,0,.35);}
  .auth-clock svg{width:42px;height:42px;}
  .auth-brand{font-size:30px;font-weight:800;letter-spacing:.34em;text-indent:.34em;margin:6px 0 0;
    background:linear-gradient(180deg,#f4d98a,#d9ad4e 55%,#a97f22);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-tag{font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;color:#b9a988;text-indent:.34em;}
  .auth-title{font-size:22px;font-weight:800;line-height:1.1;margin:0 0 22px;text-align:center;color:#f3efe6;}
  .auth-form{display:none;}
  .auth-form.active{display:block;}
  .pill{width:100%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.22);
    border-radius:12px;margin-bottom:14px;display:flex;align-items:center;overflow:hidden;}
  .pill:focus-within{border-color:#fff;background:rgba(255,255,255,.22);}
  .pill .ficon{display:flex;align-items:center;padding-left:16px;color:#f4d98a;flex:none;}
  .pill .ficon svg{width:18px;height:18px;}
  .pill .ficon + .prefix{padding-left:10px;}
  .pill .ficon + input{padding-left:12px;}
  .pill input{flex:1;background:none;border:0;outline:none;color:#fff;font-size:15px;padding:15px 18px;min-width:0;}
  .pill input::placeholder{color:rgba(255,255,255,.7);}
  .pill .prefix{padding:15px 0 15px 18px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap;}
  .pill .prefix + input{padding-left:12px;}
  .pill .toggle{background:none;border:0;color:rgba(255,255,255,.85);padding:0 16px;cursor:pointer;display:flex;}
  .pill .toggle svg{width:20px;height:20px;}
  .uname-hint{font-size:12px;margin:-8px 6px 14px;min-height:15px;}
  .uname-hint.ok{color:#2a5540;}
  .uname-hint.bad{color:#fecdd3;}
  .auth-cta{width:100%;padding:16px;border:0;border-radius:12px;background:linear-gradient(180deg,#f4d98a,#d9ad4e 60%,#a97f22);color:#1c1403;
    font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
  .auth-cta:active{opacity:.9;}
  .auth-cta[disabled]{opacity:.6;}
  .auth-err{background:rgba(225,29,72,.22);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:14px;padding:11px 15px;font-size:13px;margin-bottom:16px;}
  .auth-alt{text-align:right;margin:2px 4px 12px;}
  .auth-alt button{background:none;border:0;color:var(--gold-2,#f4d98a);font-weight:700;font-size:13.5px;cursor:pointer;}
  .auth-forgot{text-align:center;margin-top:14px;}
  .auth-forgot button{background:none;border:0;color:#a89f8c;font-size:13.5px;cursor:pointer;}
  .auth-signin{text-align:center;margin-top:16px;color:#a89f8c;font-size:13.5px;}
  .auth-signin button{background:none;border:0;color:#f4d98a;font-weight:800;font-size:13.5px;cursor:pointer;}
  .auth-alt button{background:none;border:0;color:#fff;font-weight:700;font-size:14px;
    text-decoration:underline;cursor:pointer;}
  .auth-legal{color:rgba(255,255,255,.7);font-size:11.5px;margin-top:20px;line-height:1.5;}
  /* floating decorative gems on the auth background */
  .float-gem{position:absolute;z-index:1;pointer-events:none;opacity:.22;animation:floaty 7s ease-in-out infinite;}
  .float-gem svg{width:100%;height:100%;}
  .fg1{width:66px;height:66px;top:11%;left:7%;animation-delay:0s;}
  .fg2{width:46px;height:46px;top:23%;right:10%;animation-delay:1.4s;opacity:.18;}
  .fg3{width:58px;height:58px;bottom:20%;left:14%;animation-delay:2.8s;opacity:.2;}
  .fg4{width:38px;height:38px;bottom:30%;right:16%;animation-delay:2s;opacity:.16;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(9deg)}}
  /* jumbled-letter captcha — the letters live INSIDE the same pill as the
     input: type on the left, letters shown on the right. */
  .captcha-pill{padding-right:6px;}
  .captcha-box{width:128px;height:42px;flex-shrink:0;background:#f4d98a;border-radius:24px;
    display:flex;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden;margin-left:8px;}
  .captcha-box span{font-size:22px;font-weight:800;font-family:Georgia,"Times New Roman",serif;display:inline-block;}
  .captcha-box .cap-line{position:absolute;left:-10%;width:120%;height:2px;background:rgba(124,58,237,.35);}
  .captcha-box .cl1{top:38%;transform:rotate(-7deg);}
  .captcha-box .cl2{top:62%;transform:rotate(5deg);}

  /* ── MAIN SHELL ── */
  .main-view{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  .topbar{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;}
  .topbar-title{font-size:19px;font-weight:800;}
  .panels{flex:1;overflow-y:auto;padding:6px 18px 100px;-webkit-overflow-scrolling:touch;}
  .panel{animation:panelIn .18s ease both;}
  @keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;
    background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
    color:var(--sub);font-size:11px;font-weight:700;padding:9px 2px 6px;cursor:pointer;border-radius:10px;
    position:relative;transition:color .15s;}
  .tab-btn.active{color:var(--violet);}
  .tab-btn.active::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 4px 4px;
    background:linear-gradient(90deg,var(--violet),var(--amethyst));}
  .tab-btn .eico{width:23px;height:23px;}
  .tab-fab{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:0;margin-top:-24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#f7e6b4,#d9ad4e 60%,#a97f22);
    box-shadow:0 8px 20px rgba(217,173,78,.55);}
  .tab-fab svg{width:26px;height:26px;}
  .wi.gold,.qi.gold{background:rgba(217,173,78,.14) !important;color:var(--violet) !important;}

  /* ── ACTIVITY TICKER (continuous marquee, distinct from a stacked feed) ── */
  .ticker{margin:0 0 6px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);}
  .ticker-head{display:flex;align-items:center;gap:6px;margin:14px 0 8px;}
  .ticker-head .live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .ticker-head span{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.4px;text-transform:uppercase;}
  .ticker-track{display:flex;gap:9px;width:max-content;animation:tickmove 48s linear infinite;}
  .ticker:active .ticker-track,.ticker-track:hover{animation-play-state:paused;}
  @keyframes tickmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tick-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);
    border-radius:30px;padding:6px 14px 6px 6px;white-space:nowrap;font-size:12.5px;}
  .tick-item .tav{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;}
  .tick-item .tk-amt{color:var(--ok);font-weight:800;}
  .tick-item .tk-ago{color:var(--sub);}

  /* ── HOME WALLET (light card, gradient accent bar, eye toggle) ── */
  .wallet-panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px 18px 16px;
    margin:12px 0 12px;position:relative;overflow:hidden;}
  .wallet-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:linear-gradient(var(--violet),var(--amethyst));}
  .wallet-top{display:flex;align-items:center;justify-content:space-between;}
  .wallet-label{font-size:13px;color:var(--sub);font-weight:700;}
  .wallet-eye{background:none;border:0;color:var(--sub);cursor:pointer;display:flex;padding:2px;}
  .wallet-eye svg{width:19px;height:19px;}
  .wallet-amt{font-size:31px;font-weight:800;margin-top:6px;color:var(--ink);letter-spacing:.2px;}
  .wallet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px;}
  .wstat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;}
  .wstat .wi{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
  .wstat .wi svg{width:16px;height:16px;}
  .wstat .wn{font-size:14px;font-weight:800;line-height:1.1;}
  .wstat .wl{font-size:10.5px;color:var(--sub);margin-top:3px;}
  .quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px;}
  .quick-btn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 4px;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;
    font-weight:700;color:var(--ink);}
  .quick-btn .qi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .quick-btn .qi svg{width:18px;height:18px;}
  .quick-btn.claimed{opacity:.55;}

  /* ── HOME HERO BANNER (auto-rotating) ── */
  .hero-banner{position:relative;border-radius:20px;overflow:hidden;margin:12px 0 4px;height:150px;}
  .hb-slide{position:absolute;inset:0;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;
    color:#fff;opacity:0;transition:opacity .5s ease;pointer-events:none;}
  .hb-slide.on{opacity:1;pointer-events:auto;}
  .hb-slide .hb-title{font-size:21px;font-weight:800;line-height:1.15;max-width:70%;}
  .hb-slide .hb-sub{font-size:12.5px;opacity:.9;margin-top:6px;max-width:66%;}
  .hb-art{position:absolute;right:-8px;bottom:-10px;width:120px;height:120px;opacity:.9;}
  .hb-dots{position:absolute;bottom:10px;left:22px;display:flex;gap:6px;z-index:2;}
  .hb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .3s;}
  .hb-dots i.on{background:var(--card);width:18px;border-radius:4px;}

  /* ── GEM HERO CARDS ── */
  .gem-hero{background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;}
  .gh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    background:linear-gradient(120deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#000 6%) 100%);color:#fff;}
  .gh-name{font-size:20px;font-weight:800;letter-spacing:.3px;}
  .gh-badge{background:rgba(255,255,255,.22);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:800;}
  .gh-body{display:flex;gap:14px;padding:16px 18px 4px;}
  .gh-art{width:88px;height:88px;flex-shrink:0;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,#fff);
    display:flex;align-items:center;justify-content:center;}
  .gh-art svg{width:60px;height:60px;}
  .gh-stats{flex:1;min-width:0;}
  .ghs{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13px;}
  .ghs span{color:var(--sub);}
  .ghs b{font-weight:800;}
  .gh-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 16px;}
  .gh-price{font-size:19px;font-weight:800;color:var(--accent);}
  .gh-buy{background:var(--accent);color:#fff;border:0;border-radius:24px;padding:11px 26px;
    font-size:14px;font-weight:800;cursor:pointer;}
  .gh-buy:active{opacity:.85;}
  .gh-buy[disabled]{background:var(--line);color:var(--sub);cursor:default;}
  /* Coming-soon gems: dimmed art with a badge, non-buyable */
  .gem-hero.soon .gh-art{position:relative;filter:grayscale(.5) opacity(.85);}
  .gh-soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    background:rgba(36,22,64,.5);color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px;line-height:1.2;padding:4px;}
  .gem-hero.soon .gh-price{color:var(--sub);}

  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
  .sec-head h3{font-size:15px;font-weight:800;margin:0;}
  .sec-head .link-btn{background:none;border:0;color:var(--violet);font-size:13px;font-weight:700;cursor:pointer;padding:0;}
  .empty-note{color:var(--sub);font-size:13px;background:var(--line2);border-radius:12px;padding:16px;text-align:center;}

  .gem-active{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:10px;}
  .ga-main{display:flex;align-items:center;gap:14px;}
  .ga-boost{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);}
  .ga-boost .bs{font-size:12.5px;color:var(--sub);font-weight:600;}
  .ga-boost .bs.hot{color:#c2410c;}
  .boost-btn{background:linear-gradient(120deg,#f59e0b,#ef4444);color:#fff;border:0;border-radius:22px;
    padding:9px 18px;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;}
  .boost-btn svg{width:15px;height:15px;fill:#fff;stroke:#fff;}
  .boost-btn:active{opacity:.85;}
  .boost-hero{width:64px;height:64px;border-radius:20px;margin:2px auto 14px;
    background:linear-gradient(120deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;}
  .boost-hero svg{width:34px;height:34px;fill:#fff;stroke:#fff;}
  .boost-copy{font-size:14px;line-height:1.6;color:var(--ink);text-align:center;margin:0 0 4px;}
  .hold-row{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;}
  .hold-top{display:flex;align-items:center;justify-content:space-between;}
  .hold-top b{font-size:15px;}
  .hold-sub{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .ring{width:54px;height:54px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring-track{stroke:var(--line2);}
  .ring-prog{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);}
  .cd-line{margin-top:10px;padding:8px 12px;border-radius:10px;background:#241f14;color:var(--sub);
    font-size:12.5px;font-weight:600;}
  .cd-line b{color:var(--ink);}
  .cd-line .cd{color:var(--violet);font-weight:800;font-variant-numeric:tabular-nums;}
  .gem-active-info{flex:1;min-width:0;}
  .gem-active-info .t{font-weight:800;font-size:14px;}
  .gem-active-info .s{color:var(--sub);font-size:12px;margin-top:2px;}
  .gem-active-info .p{color:var(--ok);font-size:12px;margin-top:2px;font-weight:700;}

  .activity-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);}
  .activity-row:last-child{border-bottom:0;}
  .act-dot{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .act-dot svg{width:17px;height:17px;}
  .act-info{flex:1;min-width:0;}
  .act-info .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .act-info .s{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .act-amt{font-size:13.5px;font-weight:800;white-space:nowrap;}
  .act-amt.pos{color:var(--ok);}
  .act-amt.neg{color:var(--ink);}

  /* ── PREMIUM RECORD CARDS ── */
  .rec{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:13px 14px;margin-bottom:10px;}
  .rec-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:#fff;box-shadow:0 4px 12px rgba(76,29,149,.14);}
  .rec-ic svg{width:22px;height:22px;stroke:#fff;}
  .rec-body{flex:1;min-width:0;}
  .rec-title{font-weight:800;font-size:14.5px;}
  .rec-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .rec-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;
    background:var(--line2);color:var(--violet);margin-top:6px;}
  .rec-right{text-align:right;flex-shrink:0;}
  .rec-amt{font-weight:800;font-size:15px;white-space:nowrap;}
  .rec-amt.pos{color:var(--ok);}
  .rec-amt.neg{color:var(--danger);}
  .rec-status{font-size:11px;font-weight:800;margin-top:4px;}
  .rec-status.ok{color:var(--ok);} .rec-status.proc{color:#d97706;}
  .rec-status.bad{color:var(--danger);} .rec-status.mut{color:var(--sub);}
  .rec-summary{display:flex;gap:10px;margin:4px 0 14px;}
  .rec-summary .rs{flex:1;border-radius:16px;padding:14px;color:#fff;}
  .rec-summary .rs.in{background:linear-gradient(135deg,#10b981,#0d9488);}
  .rec-summary .rs.out{background:linear-gradient(135deg,#fb7185,#e11d48);}
  .rec-summary .rs-l{font-size:12px;opacity:.9;font-weight:600;}
  .rec-summary .rs-n{font-size:18px;font-weight:800;margin-top:3px;}
  .rec-chips{position:sticky;top:0;background:var(--card);padding-top:2px;padding-bottom:8px;z-index:2;}

  /* ── GEMS — vertical list, one tier per full-width row ── */
  .gem-list{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .gem-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);
    border-radius:18px;padding:15px 16px;cursor:pointer;position:relative;overflow:hidden;}
  .gem-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,transparent);}
  .gem-row .facet{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;}
  .gem-row .facet svg{width:24px;height:24px;color:#fff;}
  .gem-row .gr-body{flex:1;min-width:0;}
  .gem-row .gr-name{font-weight:800;font-size:16px;}
  .gem-row .gr-pay{font-size:12.5px;color:var(--ok);font-weight:700;margin-top:2px;}
  .gem-row .gr-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .gem-row .gr-right{text-align:right;flex-shrink:0;}
  .gem-row .gr-price{font-weight:800;font-size:15px;}
  .gem-row .gr-cta{font-size:11px;color:var(--violet);font-weight:800;margin-top:3px;}
  .gem-swatch{width:34px;height:34px;border-radius:10px;}

  /* ── TEAM ── */
  /* ── TEAM SCREEN (hero + levels + task centre) ── */
  .team-hero{margin-top:12px;border-radius:20px;padding:18px;color:#fff;
    background:linear-gradient(130deg,#1a1409 0%,#2a2114 55%,#100d08 100%);overflow:hidden;position:relative;}
  .th-top{display:flex;align-items:flex-start;justify-content:space-between;}
  .th-label{font-size:12.5px;font-weight:700;opacity:.8;letter-spacing:.4px;text-transform:uppercase;}
  .th-amt{font-size:27px;font-weight:800;margin-top:4px;}
  .th-art{width:64px;height:64px;opacity:.35;}
  .th-code-row{display:flex;gap:8px;align-items:stretch;margin-top:16px;}
  .th-code{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;min-width:0;}
  .th-code span{display:block;font-size:10.5px;opacity:.75;font-weight:700;}
  .th-code b{font-size:15px;letter-spacing:1px;}
  .th-btn{border:0;border-radius:12px;padding:0 13px;font-size:12.5px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;gap:6px;}
  .th-btn svg{width:15px;height:15px;}
  .th-btn.solid{background:#f4d98a;color:#1c1403;}
  .lvl-list{margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
  .lvl-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2);}
  .lvl-row:last-child{border-bottom:0;}
  .lvl-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;flex-shrink:0;}
  .lvl-info{flex:1;min-width:0;}
  .lvl-info .t{font-size:13.5px;font-weight:700;}
  .lvl-info .s{font-size:12px;color:var(--sub);margin-top:2px;}
  .lvl-earn{font-weight:800;font-size:13.5px;white-space:nowrap;}
  .task-intro{font-size:13px;color:var(--sub);line-height:1.55;background:var(--line2);border-radius:12px;
    padding:12px 14px;margin-bottom:12px;}
  .task-intro b{color:var(--ink);}
  .task-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:14px 15px;margin-bottom:10px;}
  .task-row.done{background:#12241a;border-color:#2a5540;}
  .task-ic{width:40px;height:40px;border-radius:12px;background:#241f14;color:var(--topaz);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .task-ic svg{width:21px;height:21px;}
  .task-row.done .task-ic{background:#dcfce7;color:#16a34a;}
  .task-body{flex:1;min-width:0;}
  .task-t{font-size:13.5px;font-weight:700;}
  .task-bar{height:6px;border-radius:6px;background:var(--line2);margin:7px 0 5px;overflow:hidden;}
  .task-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#d9ad4e,#a97f22);
    transition:width .6s ease;}
  .task-row.done .task-bar i{background:#22c55e;}
  .task-s{font-size:11.5px;color:var(--sub);font-weight:600;}
  .task-reward{white-space:nowrap;font-size:14px;color:var(--violet);}
  .task-paid{display:flex;width:30px;height:30px;border-radius:50%;background:#22c55e;color:#fff;
    align-items:center;justify-content:center;}
  .task-paid svg{width:16px;height:16px;}

  .ref-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-top:12px;text-align:center;}
  .ref-code{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--violet);margin:8px 0 6px;}
  .ref-link{font-size:12px;color:var(--sub);background:var(--line2);border-radius:10px;padding:9px 12px;
    word-break:break-all;cursor:pointer;line-height:1.4;}
  .stat-row{display:flex;gap:10px;margin-top:16px;}
  .stat-box{flex:1;background:var(--line2);border-radius:12px;padding:12px;text-align:center;}
  .stat-box .n{font-size:18px;font-weight:800;}
  .stat-box .l{font-size:11px;color:var(--sub);margin-top:2px;}
  .stat-box .pct{display:inline-block;font-size:11px;font-weight:800;color:var(--violet);
    background:#241f14;border-radius:20px;padding:2px 9px;margin-bottom:6px;}

  /* ── GEM DETAIL SCREEN (redesigned) ── */
  .gd-hero{position:relative;border-radius:20px;overflow:hidden;height:190px;margin-bottom:16px;
    box-shadow:0 12px 28px rgba(76,40,137,.22);}
  .gd-hero img,.gd-hero-fill{width:100%;height:100%;object-fit:cover;display:block;}
  .gd-hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,8,44,.55),rgba(20,8,44,0) 55%);}
  .gd-hero-badges{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;
    justify-content:space-between;}
  .gd-roi{background:rgba(255,255,255,.92);color:var(--ok);font-weight:800;font-size:12px;
    padding:5px 12px;border-radius:20px;}
  .gd-price{background:rgba(20,8,44,.5);backdrop-filter:blur(4px);color:#fff;font-weight:800;font-size:14px;
    padding:6px 14px;border-radius:20px;}
  .gd-payout{background:linear-gradient(135deg,#1a1409,#2a2114 60%,#3a2c12);color:#fff;border-radius:20px;
    padding:20px;text-align:center;box-shadow:0 12px 28px rgba(76,40,137,.28);}
  .gd-payout-l{font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;letter-spacing:.3px;}
  .gd-payout-n{font-size:34px;font-weight:800;letter-spacing:.4px;margin:4px 0 6px;}
  .gd-payout-s{font-size:12.5px;color:rgba(255,255,255,.82);}
  .gd-payout-s b{color:#fff;}
  .gd-metrics{display:flex;gap:12px;margin-top:14px;}
  .gd-m{flex:1;display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:13px;}
  .gd-mi{width:34px;height:34px;border-radius:10px;background:var(--line2);display:flex;align-items:center;
    justify-content:center;flex-shrink:0;}
  .gd-mi svg{width:18px;height:18px;}
  .gd-mn{font-size:15px;font-weight:800;color:var(--ink);}
  .gd-ml{font-size:11px;color:var(--sub);margin-top:1px;}
  .gd-flow{margin:16px 0;background:var(--line2);border-radius:16px;padding:15px 16px;}
  .gd-step{display:flex;align-items:flex-start;gap:11px;font-size:13px;color:var(--ink);line-height:1.5;
    padding:6px 0;}
  .gd-step .gd-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .gd-step b{font-weight:800;}
  .gd-bal{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);
    border:1.5px solid var(--line);border-radius:14px;font-size:13.5px;color:var(--sub);margin-bottom:12px;}
  .gd-bal b{color:var(--ink);font-size:15px;font-weight:800;}
  .gd-bal.low b{color:var(--danger);}
  .gd-cta{font-size:15px;}
  .member-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);}
  .member-row:last-child{border-bottom:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--amethyst);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .member-info{flex:1;min-width:0;}
  .member-info .t{font-weight:700;font-size:13.5px;}
  .member-info .s{font-size:11.5px;color:var(--sub);}
  .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;}
  .badge.on{background:var(--ok-bg);color:var(--ok);}
  .badge.off{background:var(--line2);color:var(--sub);}

  /* ── ACCOUNT — identity card + menu rows (not a stat matrix) ── */
  /* Account membership card — profile + balances fused into one premium card */
  .acc-card{position:relative;overflow:hidden;border-radius:24px;margin-top:12px;color:#fff;
    padding:20px 20px 8px;background:linear-gradient(135deg,#1a1409 0%,#2a2114 52%,#3a2c12 100%);
    box-shadow:0 18px 38px rgba(76,40,137,.34);}
  .acc-card::before{content:"";position:absolute;top:-70px;right:-50px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none;}
  .acc-card::after{content:"";position:absolute;bottom:-90px;left:-40px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.22),rgba(56,189,248,0) 70%);pointer-events:none;}
  .acc-top{display:flex;align-items:center;gap:14px;position:relative;}
  .acc-av{width:58px;height:58px;border-radius:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;background:rgba(255,255,255,.16);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);}
  .acc-name{font-weight:800;font-size:18px;letter-spacing:.2px;}
  .acc-phone{color:rgba(255,255,255,.78);font-size:13px;margin-top:2px;}
  .acc-code{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:rgba(255,255,255,.15);
    border-radius:20px;padding:4px 11px;font-size:11px;font-weight:800;letter-spacing:1.2px;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);}
  .acc-code svg{width:12px;height:12px;opacity:.85;}
  .acc-stats{display:flex;margin-top:18px;background:rgba(255,255,255,.11);border-radius:16px;
    border:1px solid rgba(255,255,255,.12);position:relative;}
  .acc-stats .as{flex:1;text-align:center;padding:13px 6px;position:relative;}
  .acc-stats .as + .as::before{content:"";position:absolute;left:0;top:22%;height:56%;width:1px;
    background:rgba(255,255,255,.16);}
  .acc-stats .as .n{font-size:15px;font-weight:800;line-height:1.15;}
  .acc-stats .as .l{font-size:10.5px;color:rgba(255,255,255,.72);margin-top:4px;letter-spacing:.3px;}
  .acc-tier{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0 6px;
    font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.4px;}
  .acc-tier svg{width:13px;height:13px;}
  .menu-list{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
  .menu-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line2);
    cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-size:15px;color:var(--ink);}
  .menu-row:last-child{border-bottom:0;}
  .menu-row .mi{width:34px;height:34px;border-radius:10px;background:var(--line2);color:var(--violet);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .menu-row .mi svg{width:18px;height:18px;}
  .menu-row .ml{flex:1;font-weight:700;}
  .menu-row .mr{color:var(--sub);}
  .menu-row .mr svg{width:18px;height:18px;}
  .menu-row.danger .mi{background:var(--danger-bg);color:var(--danger);}
  .menu-row.danger .ml{color:var(--danger);}
  .support-body{display:flex;flex-direction:column;gap:10px;}
  .support-row{display:flex;align-items:center;gap:13px;padding:13px;border:1.5px solid var(--line);
    border-radius:14px;text-decoration:none;color:var(--ink);font-size:14px;}
  .support-row .mi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .support-row .mi svg{width:19px;height:19px;}
  .support-row .s{color:var(--sub);font-size:12px;}
  .bank-row{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;}
  .bank-row .mi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bank-row .mi svg{width:18px;height:18px;}
  .bank-info{flex:1;min-width:0;}
  .bank-info .t{font-weight:700;font-size:14px;}
  .bank-info .s{color:var(--sub);font-size:12px;}
  .bank-del{background:var(--danger-bg);color:var(--danger);border:0;border-radius:9px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .bank-del svg{width:17px;height:17px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--line2);color:var(--sub);
    font-size:12.5px;font-weight:700;border:0;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--violet);color:#fff;}

  /* ── WITHDRAW / DEPOSIT amount entry ── */
  .amt-big{width:100%;border:0;border-bottom:2px solid var(--line);font-size:32px;font-weight:800;
    padding:6px 0;text-align:center;color:var(--ink);outline:none;background:none;}
  .amt-big:focus{border-color:var(--violet);}
  .amt-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px;}
  .amt-chip{padding:8px 14px;border-radius:20px;background:var(--line2);border:0;color:var(--ink);
    font-size:13px;font-weight:700;cursor:pointer;}
  /* ── DEPOSIT POLLING / CONFIRM STATE ── */
  .pay-wait{text-align:center;padding:12px 0 4px;}
  .pay-orb{width:88px;height:88px;border-radius:50%;margin:6px auto 20px;position:relative;
    background:linear-gradient(135deg,#d9ad4e,#a97f22);display:flex;align-items:center;justify-content:center;color:#fff;}
  .pay-orb svg{width:38px;height:38px;stroke:#fff;position:relative;z-index:2;}
  .pay-orb::before,.pay-orb::after{content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--violet);opacity:.5;animation:payring 1.8s ease-out infinite;}
  .pay-orb::after{animation-delay:.9s;}
  @keyframes payring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}
  .pay-orb.ok{background:linear-gradient(135deg,#10b981,#059669);animation:paypop .35s ease;}
  .pay-orb.bad{background:linear-gradient(135deg,#fb7185,#e11d48);animation:paypop .35s ease;}
  .pay-orb.ok::before,.pay-orb.ok::after,.pay-orb.bad::before,.pay-orb.bad::after{display:none;}
  @keyframes paypop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  /* Full-screen falling confetti (payment success) */
  .confetti-sky{position:fixed;inset:0;z-index:2000;pointer-events:none;overflow:hidden;}
  .confetti-sky i{position:absolute;top:-5vh;display:block;opacity:0;border-radius:2px;
    animation-name:confFall;animation-timing-function:cubic-bezier(.3,.35,.6,.95);animation-fill-mode:forwards;}
  @keyframes confFall{
    0%{opacity:1;transform:translate3d(0,-5vh,0) rotate(0deg);}
    25%{transform:translate3d(calc(var(--sway)*.45),22vh,0) rotate(calc(var(--rot)*.3));}
    50%{transform:translate3d(calc(var(--sway)*-.35),48vh,0) rotate(calc(var(--rot)*.6));}
    75%{opacity:1;transform:translate3d(calc(var(--sway)*.55),76vh,0) rotate(calc(var(--rot)*.85));}
    100%{opacity:.9;transform:translate3d(var(--sway),108vh,0) rotate(var(--rot));}}
  .pay-title{font-size:19px;font-weight:800;margin:0 0 6px;}
  .pay-sub{font-size:13.5px;color:var(--sub);line-height:1.55;margin:0 auto 12px;max-width:290px;}
  .pay-dots{display:flex;gap:7px;justify-content:center;margin:10px 0 4px;}
  .pay-dots i{width:9px;height:9px;border-radius:50%;background:var(--violet);animation:paybounce 1.2s ease-in-out infinite;}
  .pay-dots i:nth-child(2){animation-delay:.2s;} .pay-dots i:nth-child(3){animation-delay:.4s;}
  @keyframes paybounce{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-7px);opacity:1}}

  .breakdown{background:var(--line2);border-radius:14px;padding:14px 16px;margin:16px 0;}
  .breakdown .br{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .breakdown .br.total{border-top:1px dashed #d9cef2;margin-top:5px;padding-top:10px;font-weight:800;font-size:15px;}
  .breakdown .br .muted{color:var(--sub);}

  /* ── PAGE (full-screen slide-in, replaces bottom-sheet) ── */
  .modal-root{position:fixed;inset:0;z-index:500;display:flex;align-items:stretch;justify-content:center;}
  .modal-root.hidden{display:none;}
  .modal-backdrop{position:absolute;inset:0;background:rgba(30,15,60,.42);touch-action:none;}
  /* While any dialog is open the page behind it must NOT scroll */
  body.no-scroll{overflow:hidden;}
  .modal-card{position:relative;width:100%;max-width:480px;background:var(--bg);
    padding:0 20px calc(24px + env(safe-area-inset-bottom));height:100%;overflow-y:auto;
    overscroll-behavior:contain;animation:pageIn .22s ease both;-webkit-overflow-scrolling:touch;}
  /* "Ghost" appear — fades/scales in place, no directional slide */
  @keyframes pageIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  .modal-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
    margin:0 -20px 18px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
    background:var(--bg);border-bottom:1px solid var(--line);}
  .modal-head h2{font-size:17px;font-weight:800;margin:0;flex:1;}
  .modal-close{background:var(--line2);border:0;border-radius:12px;width:38px;height:38px;flex:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);order:-1;}
  .modal-close svg{width:20px;height:20px;}
  /* explanatory instruction block shown on deposit / withdraw / referral pages */
  .proc-line{display:flex;align-items:center;gap:9px;background:var(--line2);border:1px solid var(--line);
    border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--sub);}
  .proc-line b{color:var(--ink);font-weight:700;}
  .proc-line .pl-ic{color:var(--violet);display:flex;flex-shrink:0;}
  .proc-line .pl-ic svg{width:17px;height:17px;}
  .info-note{display:flex;gap:10px;align-items:flex-start;background:var(--line2);border-radius:14px;
    padding:13px 14px;margin-bottom:16px;border:1px solid var(--line);}
  .info-note .in-ic{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;background:#eef2ff;color:var(--sapphire);}
  .info-note .in-ic svg{width:17px;height:17px;}
  .info-note .in-tx{font-size:12.5px;line-height:1.55;color:var(--sub);}
  .info-note .in-tx b{color:var(--ink);font-weight:700;}
  .info-note ol{margin:6px 0 0;padding-left:17px;}
  .info-note li{margin-bottom:3px;}

  /* ── ABOUT PAGE ── */
  .about-hero{text-align:center;padding:8px 0 4px;}
  .about-logo{width:76px;height:76px;margin:0 auto 12px;}
  .about-name{font-size:22px;font-weight:800;color:var(--ink);}
  .about-tag{font-size:13px;color:var(--sub);margin-top:4px;}
  .about-body{margin-top:18px;}
  .about-body p{font-size:14px;line-height:1.62;color:var(--ink);margin:0 0 14px;}
  .dl-meta{margin:18px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .dl-row{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;font-size:13.5px;
    color:var(--sub);border-bottom:1px solid var(--line2);}
  .dl-row:last-child{border-bottom:0;}
  .dl-row b{color:var(--ink);font-weight:700;}
  .blocker{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:28px;}
  .blocker-card{max-width:340px;text-align:center;}
  .blocker-logo{width:76px;height:76px;margin:0 auto 18px;}
  .blocker-card h2{font-size:20px;font-weight:800;margin:0 0 10px;color:var(--ink);}
  .blocker-card p{font-size:14px;line-height:1.6;color:var(--sub);margin:0 0 22px;}

  /* ── ANNOUNCEMENT DIALOG ── */
  .ann-card{position:relative;width:100%;max-width:400px;background:var(--card);border-radius:22px;overflow:hidden;
    margin:0 16px;animation:annIn .25s ease both;max-height:86vh;display:flex;flex-direction:column;}
  @keyframes annIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .ann-hero{height:120px;background:linear-gradient(120deg,#1a1409,#2a2114 60%,#100d08);position:relative;
    display:flex;align-items:center;justify-content:center;}
  .ann-hero .ann-htitle{color:#fff;font-size:34px;font-weight:800;letter-spacing:2px;opacity:.9;}
  .ann-logo{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:60px;height:60px;
    border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;}
  .ann-logo svg{width:38px;height:38px;}
  .ann-body{padding:44px 22px 20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .ann-text{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .ann-cta{display:block;width:100%;margin-top:16px;background:linear-gradient(120deg,#38bdf8,#2563eb);
    color:#fff;text-align:center;text-decoration:none;padding:13px;border-radius:24px;font-weight:700;font-size:14px;}
  .ann-ok{width:100%;margin-top:12px;background:var(--ink);color:#fff;border:0;border-radius:24px;
    padding:14px;font-size:15px;font-weight:800;cursor:pointer;}

  /* ── TOAST ── */
  .toast-root{position:fixed;left:0;right:0;bottom:88px;display:flex;flex-direction:column;
    align-items:center;gap:8px;z-index:600;pointer-events:none;max-width:480px;margin:0 auto;}
  /* Rises from below and spreads open, then collapses back down the same way. */
  .toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;
    font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.22);max-width:88%;text-align:center;
    transform-origin:center bottom;animation:toastPop .34s cubic-bezier(.2,.8,.3,1.1) both;overflow:hidden;}
  .toast .toast-in{display:inline-block;white-space:nowrap;animation:toastText .34s ease both;}
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--ok);}
  .toast.out{animation:toastPop .34s cubic-bezier(.4,0,.7,.2) both reverse;}
  @keyframes toastPop{
    0%{opacity:0;transform:translateY(34px) scaleX(.24) scaleY(.6);}
    60%{opacity:1;transform:translateY(0) scaleX(1.04) scaleY(1);}
    100%{opacity:1;transform:translateY(0) scaleX(1) scaleY(1);}}
  @keyframes toastText{0%,45%{opacity:0}100%{opacity:1}}

  /* Animated three-dot button loader (replaces "Please wait" text) */
  .btn-dots{display:inline-flex;gap:5px;align-items:center;justify-content:center;height:1em;}
  .btn-dots i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;
    animation:btnDot 1s infinite ease-in-out both;}
  .btn-dots i:nth-child(2){animation-delay:.16s;}
  .btn-dots i:nth-child(3){animation-delay:.32s;}
  @keyframes btnDot{0%,80%,100%{opacity:.3;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}

  /* Branded "syncing" first-paint screen for returning devices (auto-login) */
  .boot-sync{position:fixed;inset:0;z-index:800;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;}
  .boot-sync.hidden{display:none;}
  .bs-logo{width:78px;height:78px;border-radius:22px;background:var(--violet);display:flex;align-items:center;
    justify-content:center;box-shadow:0 12px 30px rgba(124,58,237,.3);animation:bsPulse 1.4s ease-in-out infinite;}
  .bs-logo svg{width:46px;height:46px;}
  .bs-brand{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:.3px;}
  .bs-dots{display:flex;gap:9px;align-items:center;height:14px;}
  .bs-dots i{width:11px;height:11px;border-radius:50%;background:var(--violet);
    animation:bsWave 1.2s ease-in-out infinite;}
  .bs-dots i:nth-child(2){animation-delay:.15s;}
  .bs-dots i:nth-child(3){animation-delay:.3s;}
  @keyframes bsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes bsWave{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-9px);opacity:1}}
</style>
</head>
<body>
<div id="app">

  <!-- FIRST PAINT -->
  <!-- Returning device (was logged in): show a branded "syncing" screen, never
       the login form, so auto-login opens straight to the dashboard. A tiny
       inline script below flips to the auth form instantly for logged-out users. -->
  <div class="boot-sync" id="bootView">
    <div class="bs-logo"><svg viewBox="0 0 100 100" fill="none">
      <polygon points="35,20 65,20 82,42 58,80 42,80 18,42" fill="#ffffff" opacity="0.95"/>
      <polygon points="50,32 35,20 65,20" fill="#10b981"/><polygon points="50,32 65,20 82,42" fill="#38bdf8"/>
      <polygon points="50,32 82,42 58,80" fill="#f43f5e"/><polygon points="50,32 58,80 42,80" fill="#facc15"/>
      <polygon points="50,32 42,80 18,42" fill="#c084fc"/></svg></div>
    <div class="bs-brand">Chronova</div>
    <div class="bs-dots"><i></i><i></i><i></i></div>
  </div>

  <!-- AUTH (hidden until the module decides, so returning users don't see it flash) -->
  <div class="auth-view hidden" id="authView">
    <div class="auth-scroll">
      <div class="auth-logo">
        <div class="auth-clock">
          <svg viewBox="0 0 24 24" fill="none" stroke="#241a06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.6 1.6"></path>
          </svg>
        </div>
        <h2 class="auth-brand">CHRONOVA</h2>
        <span class="auth-tag">Time is Wealth</span>
      </div>
      <div id="authErr" class="auth-err hidden"></div>

      <form id="loginForm" class="auth-form active" autocomplete="off">
        <div class="pill"><span class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span><span class="prefix">+256</span><input id="liPhone" type="tel" inputmode="numeric" placeholder="Enter phone number" required></div>
        <div class="pill"><span class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><input id="liPass" type="password" placeholder="Enter password" required>
          <button type="button" class="toggle" data-toggle="liPass"></button></div>
        <div class="auth-alt"><button type="button" id="toRegister">Create account &rsaquo;</button></div>
        <button class="auth-cta" type="submit" id="liSubmit">Log In</button>
        <div class="auth-forgot"><button type="button" id="toForgot">Forgot password?</button></div>
      </form>

      <form id="registerForm" class="auth-form" autocomplete="off">
        <div class="pill"><span class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span><span class="prefix">+256</span><input id="rgPhone" type="tel" inputmode="numeric" placeholder="Phone number" required></div>

  // First-paint decision (runs before the heavy app module): a logged-out device
  // skips the syncing screen and sees the login form at once; a returning device
  // keeps the branded syncing screen until auto-login opens the dashboard.
  try {
    var authed = localStorage.getItem('fg_wasAuthed') === '1';
    document.getElementById('bootView').classList.toggle('hidden', !authed);
    document.getElementById('authView').classList.toggle('hidden', authed);
  } catch (e) {
    document.getElementById('bootView').classList.add('hidden');
    document.getElementById('authView').classList.remove('hidden');
  }
</script>
