        <div class="pill"><span class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><input id="rgPass" type="password" placeholder="Set password" required>
          <button type="button" class="toggle" data-toggle="rgPass"></button></div>
        <div class="pill"><span class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><input id="rgPass2" type="password" placeholder="Confirm password" required>
          <button type="button" class="toggle" data-toggle="rgPass2"></button></div>
        <div class="pill"><span class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></span><input id="rgRef" type="text" placeholder="Invite code (optional)" autocapitalize="characters" autocomplete="off"></div>
        <button class="auth-cta" type="submit" id="rgSubmit">Register Now</button>
        <div class="auth-signin">Already have an account? <button type="button" id="toLogin">Sign In</button></div>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="main-view hidden" id="mainView">
    <header class="topbar">
      <div class="mark sm"><svg viewBox="0 0 24 24" fill="none" stroke="#241a06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.6 1.6"></path></svg></div>
      <div class="topbar-title" id="topbarTitle">Home</div>
    </header>
    <main class="panels" id="panels">
      <section class="panel" id="panel-home"></section>
      <section class="panel hidden" id="panel-products"></section>
      <section class="panel hidden" id="panel-team"></section>
      <section class="panel hidden" id="panel-account"></section>
    </main>
    <nav class="tabbar">
      <button class="tab-btn active" data-tab="home" type="button">
        <svg class="eico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home</button>
      <button class="tab-btn" data-tab="products" type="button">
        <svg class="eico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="12" height="10" rx="3"/><path d="M9 7V4h6v3"/><path d="M9 17v3h6v-3"/><path d="M12 10.5V12l1.6 1"/></svg>
        Products</button>
      <button class="tab-fab" data-tab="products" type="button" aria-label="Products">
        <svg viewBox="0 0 24 24" fill="none" stroke="#241a06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.6 1.6"/></svg>
      </button>
      <button class="tab-btn" data-tab="team" type="button">
        <svg class="eico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/><circle cx="18" cy="9.5" r="2.4"/><path d="M15.8 14.6c2.5.3 4.7 2.1 4.7 5.4"/></svg>
        Team</button>
      <button class="tab-btn" data-tab="account" type="button">
        <svg class="eico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        Account</button>
    </nav>
  </div>

  <!-- MODAL + TOAST ROOTS -->
  <div class="modal-root hidden" id="modalRoot"></div>
  <div class="picker-root hidden" id="pickerRoot"></div>
  <div class="toast-root" id="toastRoot"></div>
</div>
<script>
  // First paint: a returning device opens STRAIGHT onto the dashboard — there is
  // no syncing screen and no gate. Account data lands a moment later and the
  // panels repaint in place. A logged-out device gets the login form at once.
  try {
    var authed = localStorage.getItem('fg_wasAuthed') === '1';
    document.getElementById('authView').classList.toggle('hidden', authed);
    document.getElementById('mainView').classList.toggle('hidden', !authed);
  } catch (e) {
    document.getElementById('authView').classList.remove('hidden');
  }
