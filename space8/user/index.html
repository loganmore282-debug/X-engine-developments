:root{
  --void:   #f4f7fb;
  --surface:#ffffff;
  --surface-2:#eef2f8;
  --surface-blue:#eaf1ff;
  --line:   #d7dfec;
  --ink:    #0a1220;
  --ink-dim:#5b6b84;
  --blue:   #2e6bff;
  --blue-dim:#1c48b3;
  --blue-mute:#7fa1f0;
  --blue-glow: rgba(46,107,255,.22);
  --danger: #d1293e;
  --danger-bg: rgba(209,41,62,.1);
  --radius-card: 20px;
  --radius-chip: 10px;
  --radius-btn: 14px;
  --radius-sheet: 24px;
  --page-bg: #eef1f6;
  --card-alpha: 1;
  --card-blur: 0px;
  --auth-card-alpha: 1;
  --auth-card-blur: 0px;
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--page-bg); color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  overscroll-behavior-y:none;
}
.mono{ font-variant-numeric:tabular-nums; }
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
svg{display:block;}

/* ---------- layout shells ---------- */
#loadingScreen{
  position:fixed; inset:0; overflow:hidden; background:var(--void); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; z-index:9999;
}
/* Same admin-set "Login / Register background" photo (authbg) + blur/tint as
   .auth-screen below -- the owner asked for the loader to share it rather
   than staying on the flat --void background it always had. */
#loadingScreen::before{ content:''; position:absolute; inset:-24px; background-image:var(--auth-bg-url, none); background-size:cover; background-position:center; filter:blur(var(--auth-bg-blur, 20px)); transform:scale(1.08); z-index:0; }
#loadingScreen::after{ content:''; position:absolute; inset:0; background:rgba(244, 247, 251, var(--auth-bg-tint, .78)); z-index:0; }
.loader-orbit{ position:relative; z-index:1; width:104px; height:104px; overflow:visible; }
.loader-orbit .orbit-path{ stroke:var(--blue); stroke-width:4; opacity:.20; }
.loader-orbit .orbit-core{ fill:var(--blue); }
.loader-orbit .orbit-eight{ fill:none; stroke:var(--blue); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.loader-orbit .orbit-satellite{ transform-origin:52px 52px; animation:orbitRevolution 1.45s linear infinite; }
.loader-orbit .orbit-satellite circle{ fill:#fff; stroke:var(--blue); stroke-width:4; }
.loader-orbit .orbit-satellite path{ fill:var(--blue); }
.loader-status{ position:relative; z-index:1; font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--blue); text-transform:uppercase; animation:loaderPulse 1.45s ease-in-out infinite; }
@keyframes orbitRevolution{ to{ transform:rotate(360deg); } }
@keyframes loaderPulse{ 50%{ opacity:.42; letter-spacing:.19em; } }

.auth-screen{ position:relative; overflow:hidden; min-height:100dvh; display:none; flex-direction:column; align-items:center; justify-content:center; background:var(--void); padding:max(28px, env(safe-area-inset-top)) 22px 40px; }
.auth-screen::before{ content:''; position:absolute; inset:-24px; background-image:var(--auth-bg-url, none); background-size:cover; background-position:center; filter:blur(var(--auth-bg-blur, 20px)); transform:scale(1.08); z-index:0; }
.auth-screen::after{ content:''; position:absolute; inset:0; background:rgba(244, 247, 251, var(--auth-bg-tint, .78)); z-index:0; }
.auth-wrap{ position:relative; z-index:1; width:100%; max-width:380px; }
.auth-word{ font-weight:700; font-size:20px; letter-spacing:-.01em; text-align:center; margin-bottom:32px; }
.auth-word .dot{ color:var(--blue); }
.auth-card{ background:rgba(255,255,255,var(--auth-card-alpha,1)); backdrop-filter:blur(var(--auth-card-blur,0px)); -webkit-backdrop-filter:blur(var(--auth-card-blur,0px)); border-radius:var(--radius-card); padding:26px 22px; }
.auth-title{ font-weight:700; font-size:19px; letter-spacing:-.01em; margin:0 0 22px; text-align:center; }
.auth-form{ display:flex; flex-direction:column; gap:15px; }
.auth-label{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px 2px; }
.auth-input{ width:100%; background:var(--void); border:1px solid var(--line); border-radius:10px; padding:13px 14px; font-size:14.5px; color:var(--ink); outline:none; }
.auth-input:focus{ border-color:var(--blue); }
/* Chrome/WebView autofill-detection trick (owner: "detect auto input by
   Google password and it automatically starts logging in") -- an
   autofilled input matches :-webkit-autofill, which this attaches a
   (visually invisible, near-zero-duration) animation to; JS below listens
   for the resulting 'animationstart' event to tell a genuine browser
   autofill apart from the user typing character by character, which no
   plain 'input'/'change' listener can distinguish on its own. */
@keyframes onAutoFillStart{ from{} to{} }
@keyframes onAutoFillCancel{ from{} to{} }
.auth-input:-webkit-autofill{ animation-name:onAutoFillStart; animation-duration:.001s; }
.auth-input:not(:-webkit-autofill){ animation-name:onAutoFillCancel; animation-duration:.001s; }
.auth-input::placeholder{ color:var(--ink-dim); }
.auth-pwrow{ position:relative; }
.auth-pwrow .auth-input{ padding-right:56px; }
.auth-pw-toggle{ position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:11px; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.02em; cursor:pointer; }
.auth-footer{ text-align:center; margin-top:20px; font-size:13px; color:var(--ink-dim); }
.auth-footer b{ color:var(--blue); font-weight:700; cursor:pointer; }
.auth-err{ display:none; background:var(--danger-bg); color:var(--danger); border-radius:10px; padding:11px 13px; font-size:13px; font-weight:600; margin-bottom:14px; }

#app{ display:none; min-height:100dvh; flex-direction:column; }
#app::before{ content:''; position:fixed; inset:-24px; background-image:var(--app-bg-url, none); background-size:cover; background-position:center; filter:blur(var(--app-bg-blur, 20px)); transform:scale(1.08); z-index:-2; pointer-events:none; }
#app::after{ content:''; position:fixed; inset:0; background:rgba(238,241,246, var(--app-bg-tint, .78)); z-index:-1; pointer-events:none; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:max(14px, env(safe-area-inset-top)) 18px 12px; position:sticky; top:0; z-index:20;
}
.wordmark{ font-weight:700; font-size:18px; letter-spacing:-.01em; display:flex; align-items:center; gap:2px; transition:opacity .18s ease, transform .18s ease; }
.wordmark .dot{ color:var(--blue); }
.topbar.scrolled .wordmark, .topbar.scrolled .iconbtn{ opacity:0; transform:translateY(-6px); pointer-events:none; }
.iconbtn{ width:40px; height:40px; border-radius:11px; background:var(--surface); display:flex; align-items:center; justify-content:center; transition:opacity .18s ease, transform .18s ease; }
.iconbtn svg{ width:20px; height:20px; stroke:var(--blue); }

main{ flex:1; padding:0 16px calc(80px + env(safe-area-inset-bottom)); }
.page{ display:none; }
.page.active{ display:block; animation:fadein .18s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.navbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:space-around; align-items:center;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:var(--surface);
}
.navitem{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:62px; font-size:9.5px; color:var(--blue-mute); text-transform:uppercase; letter-spacing:.03em; padding:4px 12px; border:1px solid transparent; border-radius:14px; cursor:pointer; transition:transform .18s ease,background .22s ease,color .22s ease; -webkit-tap-highlight-color:transparent; }
.navitem svg{ width:21px; height:21px; stroke:var(--blue-mute); transition:stroke .22s ease; }
.navitem svg.svg-cart, .navitem svg.svg-team{ stroke:none; fill:var(--blue-mute); transition:fill .22s ease; }

.navitem.active svg,.navitem.tap-glow svg{ stroke:var(--blue); }
.navitem.active svg.svg-cart,.navitem.active svg.svg-team,.navitem.tap-glow svg.svg-cart,.navitem.tap-glow svg.svg-team{ stroke:none; fill:var(--blue); }
.navitem:active{ transform:scale(.93); background:var(--surface-2); }

/* ---------- shared components ---------- */
.btn{ font-weight:700; font-size:14px; border:none; border-radius:var(--radius-btn); padding:14px; text-align:center; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--blue); color:#fff; box-shadow:0 8px 18px -6px var(--blue-glow); }
.btn-secondary{ background:var(--surface); color:var(--blue); border:1px solid var(--blue); }
.btn-ghost{ background:transparent; color:var(--blue); border:1px solid var(--blue-glow); }
.btn-danger{ background:var(--danger-bg); color:var(--danger); }
.btn[disabled]{ opacity:.5; pointer-events:none; }
.btn.loading{ pointer-events:none; }
.btn .spin{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
/* Owner: "a thin glow sweep on purchase buttons, thin and runs a bit fast,
   just like on chocomcc". A narrow diagonal light band that sweeps across
   the button, then pauses, then repeats. Opt-in via .btn-sweep so it rides
   ONLY the purchase buttons, not every primary button (deposit/withdraw/
   etc. stay plain). Suppressed while disabled / Coming Soon -- a shine on a
   greyed-out button reads as broken. The band is thin (~12% of the width)
   and the sweep itself is quick (~1s), with a short rest between passes. */
.btn-sweep{ position:relative; overflow:hidden; }
/* Band width and cycle speed are admin-tunable via --sweep-btn-w /
   --sweep-btn-speed (set on :root from settings in original_module.js);
   the values here are the fallback defaults when no setting is present.
   calc() derives the gradient's two transparent edges from a single width
   var so "size" is one number. */
.btn-sweep::after{ content:''; position:absolute; inset:0; background:linear-gradient(115deg, transparent calc(50% - var(--sweep-btn-w, 12%)/2), rgba(255,255,255,.55) 50%, transparent calc(50% + var(--sweep-btn-w, 12%)/2)); transform:translateX(-130%) skewX(-16deg); animation:btnSweep var(--sweep-btn-speed, 2.4s) ease-in-out infinite; pointer-events:none; }
.btn-sweep[disabled]::after{ display:none; }
@keyframes btnSweep{ 0%{ transform:translateX(-130%) skewX(-16deg); } 42%,100%{ transform:translateX(240%) skewX(-16deg); } }
.btn-secondary .spin{ border-color:var(--line); border-top-color:var(--ink-dim); }

.field{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px; }
.field.focus{ border-color:var(--blue); }
.field svg{ width:19px; height:19px; stroke:var(--blue); flex-shrink:0; }
/* The Codex-designed deposit/withdraw icons (ICONS.deposit/withdraw,
   original_module.js) are filled (fill=currentColor, stroke=none), unlike
   every other icon in this file which is colored via `stroke`. `color`
   drives `currentColor` here, not `stroke`. */
.action-btn .ico svg.money-action-icon,
.field svg.money-action-icon{
  color:var(--blue);
  fill:currentColor;
  stroke:none;
}
.action-btn.done .ico svg.money-action-icon{ color:var(--ink-dim); }
.field input{ border:none; background:none; outline:none; color:var(--ink); font-size:14.5px; width:100%; }
.field input::placeholder{ color:var(--ink-dim); }
.field-eye{ cursor:pointer; }
/* Owner: "dont allow default selection of any network, the box should be
   not filled such that one selects the right network" -- the network
   <select> starts on a disabled placeholder option (nothing pre-picked),
   styled grey like every other field's placeholder text until the member
   actually chooses one (toggled via the .placeholder class in
   original_module.js's payNetwork change handler). */
select.field.placeholder{ color:var(--ink-dim); }
.field-hint{ font-size:12px; color:var(--ink-dim); margin:-4px 2px 0; }

.card{ background:rgba(255,255,255,var(--card-alpha,1)); backdrop-filter:blur(var(--card-blur,0px)); -webkit-backdrop-filter:blur(var(--card-blur,0px)); border-radius:var(--radius-card); padding:18px; }
.section-title{ font-weight:700; font-size:16px; letter-spacing:-.01em; margin:26px 0 12px; display:flex; align-items:center; justify-content:space-between; color:var(--blue-dim); }
.section-title .see-all{ font-size:11px; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; }

.pill{ display:inline-flex; align-items:center; gap:5px; font-size:10px; letter-spacing:.03em; padding:4px 9px; border-radius:999px; text-transform:uppercase; white-space:nowrap; }
.pill-active{ background:var(--blue-glow); color:var(--blue-dim); }
.pill-done{ background:var(--surface-2); color:var(--ink-dim); }
.pill-done .s8-check{ width:12px; height:12px; stroke-width:2; }
.pill-fail{ background:var(--danger-bg); color:var(--danger); }
.pill-pending{ background:var(--surface-2); color:var(--ink-dim); }
.member-row .pill{ flex-shrink:0; }

.view-more-row{ text-align:center; margin-top:10px; }
.view-more-lvl{ background:none; border:none; color:var(--blue); font-size:12.5px; font-weight:700; padding:8px; cursor:pointer; }

.banner{ border-radius:var(--radius-card); overflow:hidden; position:relative; height:132px; background:var(--surface); margin-bottom:18px; display:flex; align-items:flex-end; }
.banner img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.banner .fallback-ico{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.banner .fallback-ico svg{ width:48px; height:48px; stroke:var(--line); }
/* Optional admin banner shown inside a sheet (Gift Code, Check-in) -- sits
   just under the sheet title, a touch shorter than a full page banner. */
.sheet-banner{ height:120px; margin-top:12px; }
/* Daily Check-in screen (owner: "checkin... so l will add banners") */
.checkin-card{ text-align:center; margin-top:14px; }
.checkin-reward-lab{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); }
.checkin-reward{ font-weight:800; font-size:32px; margin-top:6px; color:var(--blue); letter-spacing:-.01em; }
.checkin-rules{ margin-top:18px; padding:0 4px; }
.checkin-rule{ font-size:12.5px; color:var(--ink-dim); line-height:1.5; padding-left:18px; position:relative; margin-bottom:7px; }
.checkin-rule::before{ content:'•'; position:absolute; left:5px; color:var(--blue); font-weight:700; }
.about-photo{ width:100%; border-radius:var(--radius-card); display:block; margin:16px 0; }
.about-section-title{ font-size:15px; font-weight:800; color:var(--ink); margin:22px 0 8px; }
.about-body{ font-size:13.5px; line-height:1.7; color:var(--ink-dim); }
.about-body p{ margin:0 0 10px; }

.toast-bg{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.toast{ background:var(--ink); color:var(--void); font-size:13px; font-weight:600; padding:12px 18px; border-radius:999px; max-width:88vw; box-shadow:0 10px 30px -8px rgba(0,0,0,.4); opacity:0; transform:translateY(10px); transition:.2s; }
.toast.err{ background:var(--danger); color:#fff; }
.toast.show{ opacity:1; transform:none; }

.success-popup-bg{ position:fixed; inset:0; z-index:300; background:rgba(10,18,32,.45); display:none; align-items:center; justify-content:center; opacity:0; transition:opacity .18s; }
.success-popup-bg.show{ display:flex; opacity:1; }
.success-popup{ background:var(--surface); border-radius:20px; padding:36px 32px; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:78vw; box-shadow:0 20px 50px -12px rgba(0,0,0,.35); }
.success-popup .ico{ width:72px; height:72px; border-radius:50%; background:var(--blue); display:flex; align-items:center; justify-content:center; }
.success-popup .msg{ font-size:16px; font-weight:700; color:var(--ink); text-align:center; }
/* Owner: "your tick is very different from that... it should be this ✓ –
   Light Check Mark". Codex-diagnosed (2026-08-18) why two prior attempts
   failed on the real phone: the literal ✓ (U+2713) character falls back to
   an Android system SYMBOL font that ignores CSS font-weight entirely --
   so neither weight:800 nor weight:400 changed its thickness on-device
   (it only looked lighter in a desktop Chromium render, which uses a
   different fallback). The reliable fix is an inline SVG whose stroke-
   width WE control, set lighter than the old heavy icon (which was 2.4).
   One shared shape (.s8-check), stroke-width tuned per size below --
   thinner on the big tick, a touch heavier on the tiny ones so they stay
   legible. stroke:currentColor so each context's own text/icon color
   flows through unless overridden. */
.s8-check{ display:block; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.9; }
.success-popup .ico .s8-check{ width:34px; height:34px; stroke:#fff; stroke-width:1.75; }

.announce-bg{ position:fixed; inset:0; z-index:260; background:rgba(10,18,32,.6); display:none; align-items:center; justify-content:center; opacity:0; transition:opacity .2s ease; padding:26px; }
.announce-bg.show{ display:flex; opacity:1; }
.announce-sheet{ position:relative; overflow:hidden; width:100%; max-width:360px; background:#0d1b2a; border-radius:24px; box-shadow:0 24px 60px -14px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); transform:scale(.92) translateY(10px); transition:transform .26s cubic-bezier(.2,.9,.3,1); }
.announce-bg.show .announce-sheet{ transform:scale(1) translateY(0); }
.announce-sheet::before{ content:''; position:absolute; inset:-24px; background-image:var(--ann-bg-url, none); background-size:cover; background-position:center; filter:blur(var(--ann-bg-blur, 6px)); transform:scale(1.08); z-index:0; }
.announce-sheet::after{ content:''; position:absolute; inset:0; background:rgba(10,18,32, var(--ann-bg-tint, .55)); z-index:0; }
.announce-body{ position:relative; z-index:1; padding:26px 24px 24px; display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center; }
/* Owner: "remove cancel button there... clear view and we'll defined (X)"
   -- a small round close button replaces the old bottom Cancel button as
   the dismiss action (tapping the dark scrim still closes it too,
   unchanged). Moved from top-left to top-right the same day per a
   follow-up owner correction: "let (X) that one be on the right not
   left." */
.announce-close{ position:absolute; top:14px; right:14px; z-index:2; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.14); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.announce-close svg{ width:15px; height:15px; stroke:#fff; }
/* Owner: "you see friends text font in dialog, l want you to use that in our
   dialog" -- the picovver.com reference's bold all-caps display headline
   ("NOTIFY"). Self-hosted as a base64 @font-face (matching this file's own
   existing Inter embed, above) rather than a Google Fonts <link> -- this
   app deliberately never adds a live network dependency for its own text
   rendering. font-weight:400 here is deliberate, not a typo: the embedded
   face only has one (already-black) weight, declared at 400 above, so this
   is the value that actually maps to it. */
.announce-title{ font-family:'Archivo Black',sans-serif; font-weight:400; font-size:23px; text-transform:uppercase; color:#fff; letter-spacing:-.01em; }
/* Owner: "when one scrolls the words in ends goes out blurry not making
   steep titles where words disappear directly" -- a hard overflow:hidden
   edge clips the text mid-line with no transition. A mask-image gradient
   fades the top/bottom ~22px of the scrollable box to transparent instead,
   so text scrolling past either edge softens out rather than being cut off. */
.announce-text{ font-size:14px; color:rgba(255,255,255,.86); line-height:1.55; white-space:pre-wrap; max-height:52vh; overflow-y:auto; overscroll-behavior:contain; text-align:left; align-self:stretch; mask-image:linear-gradient(to bottom, transparent, #000 22px, #000 calc(100% - 22px), transparent); -webkit-mask-image:linear-gradient(to bottom, transparent, #000 22px, #000 calc(100% - 22px), transparent); }
/* Owner: "Telegram button will be established in the middle but it will
   have that very size as it was, no change only putting it in middle" --
   .pillbtn keeps its exact prior padding/font/size (no longer flex:1,
   since it's now the row's only button and flex:1 would stretch it full
   width); .announce-actions centers it instead. */
.announce-actions{ display:flex; justify-content:center; gap:10px; margin-top:8px; width:100%; }
.pillbtn{ text-align:center; font-weight:700; font-size:13.5px; padding:13px; border-radius:999px; cursor:pointer; border:none; display:flex; align-items:center; justify-content:center; gap:7px; }
.pillbtn-primary{ background:var(--blue); color:#fff; box-shadow:0 8px 18px -6px var(--blue-glow); }
.pillbtn svg{ width:16px; height:16px; stroke:currentColor; }
.pillbtn img{ width:16px; height:16px; }

/* ---------- skeletons ---------- */
.sk{ background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:sk .68s ease-in-out infinite; border-radius:8px; }
@keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
@media (prefers-reduced-motion:reduce){ .sk{ animation-duration:1.2s; } }
.sk-line{ height:12px; margin:6px 0; }

/* Solid blue box, square corners -- owner explicit: "blue and box not

.record-row{ background:var(--blue); border-radius:4px; padding:13px 14px; margin-bottom:9px; display:flex; align-items:center; gap:10px; }

.acct-del{ width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.92); border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.acct-del svg{ width:16px; height:16px; stroke:var(--danger); }

/* Deposit/withdrawal instructions -- owner explicit: "just open not framed
   in anything or lined", i.e. plain text, no card/border wrapper. */
.plain-note{ font-size:12.5px; line-height:1.55; color:var(--ink-dim); margin:14px 0; }
.plain-note b{ color:var(--ink); }
.instruction-card{ display:flex; flex-direction:column; gap:6px; margin-top:16px; padding:16px; background:var(--blue); color:#fff; border-radius:12px; font-size:12.5px; line-height:1.55; box-shadow:0 12px 28px -20px rgba(46,107,255,.95); }
.instruction-card b{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.instruction-card span{ color:rgba(255,255,255,.88); }

.instruction-card ol li{ padding-left:2px; }

/* ---------- sheets / modals ---------- */
/* Full pages, not centered modals -- opening one is a real navigation (own
   history entry, phone Back button closes it without exiting the app), not

.sheet-bg{ position:fixed; inset:0; background:var(--page-bg); z-index:100; display:none; flex-direction:column; }
.sheet-bg.show{ display:flex; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:max(10px, env(safe-area-inset-top)) 16px 8px; flex-shrink:0; }
.sheet{ background:var(--surface); flex:1; overflow-y:auto; border-radius:var(--radius-sheet) var(--radius-sheet) 0 0; padding:18px 22px calc(24px + env(safe-area-inset-bottom)); }

.sheet-sub{ color:var(--ink-dim); font-size:13px; margin:0 0 18px; }

/* ---------- home ---------- */
.balance-card{ background:var(--ink); color:var(--void); border-radius:var(--radius-card); padding:22px; position:relative; overflow:hidden; }
.balance-card .lab{ font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; opacity:.6; }
.balance-card .amt{ font-weight:700; font-size:30px; margin:6px 0 18px; letter-spacing:-.01em; }
.balance-split{ display:flex; gap:18px; border-top:1px solid var(--blue-dim); padding-top:14px; }
.balance-split div{ flex:1; }
.balance-split .lab2{ font-size:9.5px; text-transform:uppercase; opacity:.55; letter-spacing:.06em; }
.balance-split .val2{ font-weight:700; font-size:15px; margin-top:3px; }
/* Owner: split the single balance card into three separate cards -- a big
   Account Balance, plus Cumulative Earnings and Total Invested -- each with
   its own admin-uploaded banner as a full-bleed background and the number/
   label overlaid on top ("just like you see friends site"). A dark gradient
   sits over the image so the white text stays readable on any photo; with
   no banner set the card is a plain dark tile (same look as before). Grid:
   the big Balance card spans both rows on the left, the two smaller cards
   stack on the right. */
.balance-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.bcard{ position:relative; border-radius:var(--radius-card); overflow:hidden; padding:16px; color:#fff; background:#0d1b2a; background-size:cover; background-position:center; background-repeat:no-repeat; min-height:94px; display:flex; flex-direction:column; justify-content:flex-end; }
.bcard--main{ grid-row:span 2; min-height:200px; padding:20px; }
.bcard::before{ content:''; position:absolute; inset:0; background:linear-gradient(155deg, rgba(6,12,24,.28), rgba(6,12,24,.80)); z-index:0; }
.bcard > *{ position:relative; z-index:1; }
/* Owner: "regulate the digits size, such that if they exceed 7 figures
   they reduce in size... regulated in accordance to number of figures."
   --amt-scale is set inline per-figure by amtScale() (original_module.js)
   based on the actual digit count, so a card that overflows into 8+
   digits shrinks proportionally instead of wrapping/overflowing; a
   normal figure (<=7 digits) is untouched (scale defaults to 1). */
.bcard .bamt{ font-weight:800; font-size:calc(22px * var(--amt-scale, 1)); letter-spacing:-.01em; line-height:1.1; }
.bcard--main .bamt{ font-size:calc(32px * var(--amt-scale, 1)); }
.bcard .blab{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.85; margin-top:5px; }
.bcard--main .blab{ font-size:11px; }

.action-row{ display:flex; gap:10px; margin-top:14px; }
.action-btn{ flex:1; background:var(--surface); border-radius:16px; padding:7px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.action-btn .ico{ width:32px; height:32px; border-radius:50%; background:var(--blue-glow); display:flex; align-items:center; justify-content:center; }
.action-btn .ico svg{ width:15px; height:15px; stroke:var(--blue); }
.action-btn .ico .s8-check{ width:16px; height:16px; stroke-width:1.9; }

.ticker-icon svg{ width:19px; height:19px; stroke:var(--blue); }
.ticker-track{ flex:1; overflow:hidden; height:20px; position:relative; -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.ticker-items{ display:flex; align-items:center; gap:34px; width:max-content; animation:tickerScroll 24s linear infinite; }

.prod-card{ border-radius:18px; background:rgba(255,255,255,var(--card-alpha,1)); backdrop-filter:blur(var(--card-blur,0px)); -webkit-backdrop-filter:blur(var(--card-blur,0px)); padding:13px 14px; margin-bottom:10px; }

.prod-card .sat{ width:44px; height:44px; border-radius:12px; background:var(--surface-2); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.prod-card .sat img{ width:100%; height:100%; object-fit:cover; }
.prod-card .name{ font-weight:700; font-size:14.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prod-card .grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:11px 0; }
.prod-card .grid div{ background:var(--surface-2); border-radius:10px; padding:7px 8px; }
.prod-card .grid .lab{ font-size:9px; text-transform:uppercase; color:var(--ink-dim); letter-spacing:.03em; }
.prod-card .grid .val{ font-weight:700; font-size:12.5px; margin-top:2px; }
.prod-card.soon{ opacity:.6; }

/* ---------- team ---------- */
.member-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.member-row:first-child{ border-top:none; }
.member-row .av{ width:38px; height:38px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:var(--ink-dim); flex-shrink:0; }
.member-row .av svg{ width:20px; height:auto; }
.member-row .info{ flex:1; min-width:0; }
.member-row .phone{ font-weight:700; font-size:13.5px; }
.member-row .date{ font-size:11px; color:var(--ink-dim); margin-top:1px; }
/* .record-row's own box padding/no-border wins over the plain .member-row
   list-row defaults (thin top divider, vertical-only padding) whenever a
   row combines both classes -- the blue box IS the visual separation now,
   a leftover gray divider line across the top would look like a rendering
   glitch. */
.member-row.record-row{ padding:13px 14px; border-top:none; }
/* Higher specificity than the plain .member-row .phone/.date rules above
   (which are equal-specificity to a bare .record-row .phone/.date and
   would otherwise win by simply appearing later in the file) -- text needs
   to read white/near-white against the solid blue box, not the default
   dark ink color meant for a white row. */
.member-row.record-row .phone{ color:#fff; }
.member-row.record-row .date{ color:rgba(255,255,255,.88); }

.milestone-card{ display:flex; align-items:center; gap:16px; min-height:96px; padding:20px 18px; background:rgba(255,255,255,var(--card-alpha,1)); backdrop-filter:blur(var(--card-blur,0px)); -webkit-backdrop-filter:blur(var(--card-blur,0px)); border:1px solid var(--line); border-radius:20px; margin-bottom:14px; box-shadow:0 14px 30px -24px rgba(46,107,255,.75); }
.milestone-card .ico{ width:54px; height:54px; border-radius:16px; background:var(--blue-glow); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.milestone-card .ico svg{ width:20px; height:20px; stroke:var(--blue); }
.milestone-card.done .ico{ background:var(--surface-2); }
.milestone-card.done .ico svg{ stroke:var(--ink-dim); }
.milestone-card .info{ flex:1; }
.milestone-card .info .t{ font-weight:800; font-size:15.5px; color:var(--ink); line-height:1.3; }
.milestone-card .info .p{ font-size:12.5px; color:var(--ink-dim); margin-top:5px; line-height:1.4; }
.milestone-card .bar{ height:7px; background:var(--surface-2); border-radius:99px; margin-top:10px; overflow:hidden; }
.milestone-card .bar i{ display:block; height:100%; background:var(--blue); }
.milestone-card .claim{ font-size:12px; font-weight:700; color:#fff; background:var(--blue); border:1px solid var(--blue); border-radius:10px; padding:9px 11px; flex-shrink:0; }
.mission-pending{ font-size:10px; color:var(--blue); font-weight:800; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
.team-loading{ color:var(--ink-dim); font-size:12.5px; padding:16px 0; }

/* ---------- account ---------- */
/* The member's own identity spread across the (admin-customizable)
   'rocherstack' banner -- Space8 mark on one half, phone + the
   server-issued account ID on the other. A plain blue gradient by
   default (not the generic satellite fallback-icon): more likely
   default state than a set banner, and reads better behind white text. */
.identity-banner{
  position:relative; border-radius:var(--radius-card); min-height:104px; padding:20px;
  display:flex; align-items:center; gap:14px; overflow:hidden; margin-bottom:16px;
  background:linear-gradient(135deg,var(--blue),var(--blue-dim)); background-size:cover; background-position:center;
}
.identity-banner.has-img::before{ content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(10,18,32,.6),rgba(10,18,32,.28)); }
.identity-mark{ position:relative; flex:1 1 50%; display:flex; align-items:center; justify-content:center; }
.identity-mark svg{ width:56px; height:44px; color:#fff; opacity:.92; }
.identity-info{ position:relative; flex:1 1 50%; min-width:0; color:#fff; }
.identity-phone{ font-weight:700; font-size:16px; }
.identity-id{ font-size:12px; opacity:.85; margin-top:5px; letter-spacing:.04em; }
.identity-copyline{ display:flex; align-items:center; gap:5px; }
.mini-copy{ width:22px; height:22px; padding:3px; border:0; background:transparent; color:#fff; opacity:.86; display:flex; align-items:center; justify-content:center; }
.mini-copy svg{ width:14px; height:14px; stroke:currentColor; }

.referral-card{ margin-bottom:20px; }
.referral-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); }
.referral-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; }
.referral-code{ font-size:22px; font-weight:800; letter-spacing:.06em; color:var(--blue); word-break:break-all; }
.referral-hint{ font-size:11.5px; color:var(--ink-dim); margin-top:9px; line-height:1.45; }
.referral-link-label{ margin-top:16px; }
.referral-link-row{ align-items:flex-start; }
.referral-link{ flex:1; min-width:0; font-size:11px; color:var(--blue); line-height:1.45; overflow-wrap:anywhere; }

.giftcode-card{ margin-bottom:20px; }
.giftcode-row{ display:flex; align-items:center; gap:10px; }
.giftcode-row .field{ flex:1; }
.giftcode-row .btn{ width:auto; flex-shrink:0; padding:13px 20px; }
/* Owner: "a line not a box" -- the gift code input reads as a plain
   underlined line (no pill background/border, no icon), not the boxed
   .field style the rest of the app's inputs use. Scoped to this one input
   only -- .field itself stays untouched everywhere else. */
.giftcode-line-input{ display:block; width:100%; border:none; border-bottom:1.5px solid var(--line); border-radius:0; padding:12px 2px; background:none; font-size:14.5px; color:var(--ink); outline:none; }
.giftcode-line-input:focus{ border-bottom-color:var(--blue); }
.giftcode-line-input::placeholder{ color:var(--ink-dim); }

.telegram-card{ margin-bottom:20px; }
.telegram-row{ display:flex; gap:10px; margin-top:9px; }
.telegram-row .btn{ flex:1; gap:8px; }
.telegram-row .btn svg{ width:17px; height:17px; }
.telegram-row .btn img{ width:17px; height:17px; }

.matrix{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:9px; margin-bottom:22px; }
.mtile{ background:rgba(255,255,255,var(--card-alpha,1)); backdrop-filter:blur(var(--card-blur,0px)); -webkit-backdrop-filter:blur(var(--card-blur,0px)); border-radius:14px; padding:12px 4px; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
.mtile svg{ width:22px; height:22px; stroke:var(--blue); }
.mtile img{ width:22px; height:22px; }
.mtile img.ico-lg{ width:34px; height:auto; }
.mtile span{ font-size:9.5px; font-weight:700; }

.menu-list{ border-radius:var(--radius-card); overflow:hidden; background:rgba(255,255,255,var(--card-alpha,1)); backdrop-filter:blur(var(--card-blur,0px)); -webkit-backdrop-filter:blur(var(--card-blur,0px)); }
.menu-row{ display:flex; align-items:center; gap:12px; padding:15px 16px; border-top:1px solid var(--line); }
.menu-row:first-child{ border-top:none; }
.menu-row svg{ width:21px; height:21px; stroke:var(--blue); flex-shrink:0; }
.menu-row img{ width:21px; height:21px; flex-shrink:0; }
.menu-row span{ flex:1; font-size:14px; font-weight:600; }
.menu-row .chev{ width:15px; height:15px; stroke:var(--blue-mute); }

/* ---------- floating assistant ---------- */
.assist-fab{ position:fixed; right:16px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:40; width:58px; height:58px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 4px #fff, 0 10px 26px -8px rgba(10,20,40,.35); display:flex; align-items:center; justify-content:center; }
.assist-fab svg{ width:27px; height:27px; stroke:#fff; }
/* ---------- floating gift-code quick access (owner: "3d image of
   giftCodebox will be on top of where the chat assistant is... balancing
   in air going up and down, just very minimal movements") ---------- */
@keyframes giftFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
.gift-fab{ position:fixed; right:10px; bottom:calc(150px + env(safe-area-inset-bottom)); z-index:40; width:66px; height:66px; display:flex; align-items:center; justify-content:center; overflow:hidden; animation:giftFloat 3.2s ease-in-out infinite; filter:drop-shadow(0 10px 14px rgba(10,20,40,.35)); }
.gift-fab img{ width:100%; height:100%; object-fit:contain; pointer-events:none; }
/* Owner: "add that glow sweep on the gift box just minimal amounts". Same
   idea as the purchase buttons but deliberately fainter (lower opacity, an
   even thinner band) and much less frequent (long rest between passes) so
   it stays subtle. drop-shadow moved to the container above so overflow:
   hidden can clip the sweep to the box without also clipping the shadow.
   mix-blend-mode:screen keeps the shine on the box's lit pixels and nearly
   invisible over its transparent corners. */
.gift-fab::after{ content:''; position:absolute; inset:0; background:linear-gradient(115deg, transparent calc(50% - var(--sweep-gift-w, 6%)/2), rgba(255,255,255,.32) 50%, transparent calc(50% + var(--sweep-gift-w, 6%)/2)); mix-blend-mode:screen; transform:translateX(-140%) skewX(-16deg); animation:giftSweep var(--sweep-gift-speed, 5s) ease-in-out infinite; pointer-events:none; }
@keyframes giftSweep{ 0%,22%{ transform:translateX(-140%) skewX(-16deg); } 40%,100%{ transform:translateX(240%) skewX(-16deg); } }
.assist-panel{ position:fixed; inset:0; z-index:150; background:var(--void); display:none; flex-direction:column; }
.assist-panel.show{ display:flex; }
.assist-head{ display:flex; align-items:center; gap:12px; padding:max(16px,env(safe-area-inset-top)) 16px 14px; border-bottom:1px solid var(--line); }
.assist-head b{ font-size:15px; }
.assist-body{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg{ max-width:80%; padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.45; }
.msg.bot{ background:var(--surface); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.user{ background:var(--blue); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.msg.typing{ display:flex; gap:4px; align-items:center; padding:14px; }
.msg.typing span{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); animation:typingDot 1.1s infinite ease-in-out; }
.msg.typing span:nth-child(2){ animation-delay:.15s; }
.msg.typing span:nth-child(3){ animation-delay:.3s; }
@keyframes typingDot{ 0%,60%,100%{ opacity:.3; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-3px); } }
.assist-links{ display:flex; gap:10px; padding:0 16px 12px; }
.assist-links .btn{ flex:1; font-size:12.5px; padding:11px; gap:6px; }
.assist-links .btn svg{ width:16px; height:16px; }
.assist-links .btn img{ width:16px; height:16px; }
.assist-quick{ display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; scrollbar-width:none; }
.assist-quick::-webkit-scrollbar{display:none;}
.qchip{ flex-shrink:0; font-size:12px; font-weight:600; background:var(--surface); border-radius:999px; padding:8px 13px; color:var(--blue); white-space:nowrap; }
.assist-input{ display:flex; gap:10px; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
.assist-input .field{ flex:1; }
.assist-send{ width:48px; height:48px; border-radius:12px; background:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; }
.assist-send svg{ width:22px; height:22px; stroke:#fff; }

.empty-state{ text-align:center; padding:36px 20px; color:var(--ink-dim); }
.empty-state svg{ width:42px; height:42px; stroke:var(--line); margin:0 auto 12px; }
.empty-state p{ font-size:13px; margin:0; }
.list-end{ text-align:center; padding:16px 0 6px; color:var(--ink-dim); font-size:12px; }
</style>
</head>
<body>

<div id="loadingScreen" role="status" aria-label="Loading Space8">
  <svg class="loader-orbit" viewBox="0 0 104 104" aria-hidden="true">
    <circle class="orbit-path" cx="52" cy="52" r="39"/>
    <path class="orbit-eight" d="M52 52C31 26 18 28 18 42c0 15 16 21 34 10 18-11 34-5 34 10 0 14-13 16-34-10Z"/>
    <circle class="orbit-core" cx="52" cy="52" r="5"/>
    <g class="orbit-satellite"><g transform="translate(52 13)"><circle r="8"/><path d="M-3-2h6v4h-6zM-11-5h6v10h-6zM5-5h6v10H5z"/></g></g>
  </svg>
  <div class="loader-status">Preparing data</div>
</div>

<div id="screenLogin" class="auth-screen">
  <div class="auth-wrap">
    <div class="auth-word">Space<span class="dot">8</span></div>
    <div class="auth-card">
      <div class="auth-title">Login</div>
      <div class="auth-err" id="loginErr"></div>
      <div class="auth-form">
        <div><label class="auth-label" for="loginPhone">Phone Number</label>
          <input class="auth-input" id="loginPhone" type="tel" inputmode="tel" placeholder="07XXXXXXXX" autocomplete="tel" maxlength="10"></div>
        <div><label class="auth-label" for="loginPassword">Password</label>
          <div class="auth-pwrow">
            <input class="auth-input" id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password">
            <span class="auth-pw-toggle" data-target="loginPassword">Show</span>
          </div>
        </div>
        <button class="btn btn-primary" id="loginBtn" style="margin-top:4px">Login</button>
      </div>
      <div class="auth-footer">New here? <b id="goRegister">Register</b></div>
    </div>
  </div>
</div>

<div id="screenRegister" class="auth-screen">
  <div class="auth-wrap">
    <div class="auth-word">Space<span class="dot">8</span></div>
    <div class="auth-card">
      <div class="auth-title">Register</div>
      <div class="auth-err" id="registerErr"></div>
      <div class="auth-form">
        <div><label class="auth-label" for="regPhone">Phone Number</label>
          <input class="auth-input" id="regPhone" type="tel" inputmode="tel" placeholder="07XXXXXXXX" autocomplete="tel" maxlength="10"></div>
        <div><label class="auth-label" for="regPassword">Password</label>
          <div class="auth-pwrow">
            <input class="auth-input" id="regPassword" type="password" placeholder="Create password" autocomplete="new-password">
            <span class="auth-pw-toggle" data-target="regPassword">Show</span>
          </div>
        </div>
        <div><label class="auth-label" for="regPassword2">Confirm Password</label>
          <div class="auth-pwrow">
            <input class="auth-input" id="regPassword2" type="password" placeholder="Re-enter password" autocomplete="new-password">
            <span class="auth-pw-toggle" data-target="regPassword2">Show</span>
          </div>
        </div>
        <div><label class="auth-label" for="regPin">Withdrawal PIN (4 digits)</label>
          <div class="auth-pwrow">
            <input class="auth-input" id="regPin" type="password" inputmode="numeric" maxlength="4" placeholder="Choose a 4-digit PIN" autocomplete="one-time-code">
            <span class="auth-pw-toggle" data-target="regPin">Show</span>
          </div>
        </div>
        <div><label class="auth-label" for="regPin2">Confirm Withdrawal PIN</label>
          <div class="auth-pwrow">
            <input class="auth-input" id="regPin2" type="password" inputmode="numeric" maxlength="4" placeholder="Re-enter PIN" autocomplete="one-time-code">
            <span class="auth-pw-toggle" data-target="regPin2">Show</span>
          </div>
        </div>
        <div><label class="auth-label" for="regReferral">Referral Code (Optional)</label>
          <input class="auth-input" id="regReferral" type="text" placeholder="Enter code" autocapitalize="off"></div>
        <button class="btn btn-primary" id="registerBtn" style="margin-top:4px">Register</button>
      </div>
      <div class="auth-footer">Already have an account? <b id="goLogin">Login</b></div>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar" id="topbar">
    <div class="wordmark" aria-label="Space8"><svg viewBox="0 0 36 28" width="29" height="23" fill="none" aria-hidden="true"><path d="M18 14C10 4 4 6 4 12c0 6 7 8 14 2 7-6 14-4 14 2 0 6-6 8-14-2Z" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="7" r="2.5" fill="currentColor"/></svg><span>Space</span><span class="dot">8</span></div>
    <div class="iconbtn" id="notifBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
  </div>

  <main>
    <section class="page" id="page-home"></section>
    <section class="page" id="page-products"></section>
    <section class="page" id="page-team"></section>
    <section class="page" id="page-account"></section>
  </main>

  <div class="navbar">
    <div class="navitem" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Home</div>
    <div class="navitem" data-page="products"><svg class="svg-cart" viewBox="0 0 24 24"><rect x="2" y="3" width="3.2" height="2.4" rx="1.2"/><path d="M5.6 7h15.7l-2.5 9.3a1.8 1.8 0 0 1-1.74 1.3H9.84a1.8 1.8 0 0 1-1.74-1.3L5.6 7Z"/><circle cx="9.6" cy="20.3" r="1.7"/><circle cx="17.4" cy="20.3" r="1.7"/></svg>Products</div>
    <div class="navitem" data-page="team"><svg class="svg-team" viewBox="0 0 24 24"><circle cx="5.6" cy="7.4" r="2.3"/><path d="M1.3 18.3c0-2.9 1.9-5 4.3-5s4.3 2.1 4.3 5v.6H1.3v-.6Z"/><circle cx="18.4" cy="7.4" r="2.3"/><path d="M14.1 18.3c0-2.9 1.9-5 4.3-5s4.3 2.1 4.3 5v.6h-8.6v-.6Z"/><circle cx="12" cy="6.6" r="3.1"/><path d="M5.8 19.6c0-3.7 2.8-6.6 6.2-6.6s6.2 2.9 6.2 6.6v.4H5.8v-.4Z"/></svg>Team</div>
    <div class="navitem" data-page="account"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>Account</div>
  </div>

  <div class="assist-fab" id="assistFab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
  <div class="gift-fab" id="giftFab"><img src="/giftbox.png" alt="Gift code" width="66" height="66"></div>
</div>

<div class="assist-panel" id="assistPanel">
  <div class="assist-head">
    <div class="iconbtn" id="assistClose"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></div>
    <b>Space8 Assistant</b>
  </div>
  <div class="assist-body" id="assistBody"></div>
  <div class="assist-links" id="assistLinks"></div>
  <div class="assist-quick" id="assistQuick"></div>
  <div class="assist-input">
    <div class="field"><input id="assistInput" type="text" placeholder="Ask about deposits, withdrawals…"></div>
    <button class="assist-send" id="assistSend"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
  </div>
</div>

<div class="sheet-bg" id="depositSheetBg"><div class="sheet-head"><div class="iconbtn sheet-back" data-close="deposit"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></div><div class="iconbtn" id="depositRecordsBtn" title="Records"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></div></div><div class="sheet" id="depositSheet"></div></div>

  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAYjzxNqpvja5wt0C_WVDbT84DfEi0GIiQ",

  };
  const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.fbCreateUser = (email, pass) => createUserWithEmailAndPassword(auth, email, pass);
  window.fbSignIn     = (email, pass) => signInWithEmailAndPassword(auth, email, pass);
  window.fbSignOut    = () => signOut(auth);
  window.fbAuth       = auth;
  // Re-authenticates with the CURRENT password (Firebase requires a recent
  // sign-in before allowing a sensitive change like this) then sets the new
  // one. Throws on wrong current password / weak new password -- caller
  // (changePassword() in original_module.js) maps the Firebase error code to
  // a readable message, same pattern as fbCreateUser's callers already use.
  window.fbChangePassword = async (currentPass, newPass) => {
    const user = auth.currentUser;
    if (!user || !user.email) throw new Error('Not signed in');
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, currentPass));
    await updatePassword(user, newPass);
  };
  onAuthStateChanged(auth, (user) => { window.dispatchEvent(new CustomEvent('space8-auth', { detail: user })); });

<script>
  // Auto-update: a new deploy must reach an already-installed/open device on
  // its own -- without the member manually clearing cache/data or reinstalling
  // the app. sw.js already does its half (skipWaiting + clients.claim() so a
  // fresh worker takes control immediately, network-first no-cache navigation
  // so the shell itself isn't served stale); this is the other half, checking
  // for a new build and reloading once one takes over. Reload is deliberately
  // held back while a deposit/withdrawal/investment/gift-code/check-in
  // request is actually in flight (window._moneyCallsInFlight, set in
  // original_module.js's api()) so a background update can never yank the
  // page out from under money actually moving.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then((reg) => {
        var checkForUpdate = function(){ reg.update().catch(()=>{}); };
        setInterval(checkForUpdate, 60 * 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
        window.addEventListener('focus', checkForUpdate);
      }).catch(()=>{});
    });
    var _swReloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_swReloading) return;
      (function tryReload(){
        if ((window._moneyCallsInFlight || 0) > 0) { setTimeout(tryReload, 500); return; }
        _swReloading = true;
        location.reload();
      })();
    });
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window._installPrompt = e;
  });
  window.addEventListener('appinstalled', () => { window._installPrompt = null; });
</script>
