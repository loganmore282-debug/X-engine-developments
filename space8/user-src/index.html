:root{
  --void:   #f4f7fb;
  --surface:#ffffff;
  --surface-2:#eef2f8;
  --line:   #d7dfec;
  --ink:    #0a1220;
  --ink-dim:#5b6b84;
  --blue:   #2e6bff;
  --blue-dim:#1c48b3;
  --blue-glow: rgba(46,107,255,.22);
  --danger: #d1293e;
  --danger-bg: rgba(209,41,62,.1);
  --radius-card: 20px;
  --radius-chip: 10px;
  --radius-btn: 14px;
  --radius-sheet: 24px;
  --page-bg: #eef1f6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --void:   #060a12;
    --surface:#0d141f;
    --surface-2:#131c2b;
    --line:   #1e2a3d;
    --ink:    #f4f7fb;
    --ink-dim:#7c8aa0;
    --blue:   #2e6bff;
    --blue-dim:#7fa4ff;
    --blue-glow: rgba(46,107,255,.35);
    --danger: #ff5468;
    --danger-bg: rgba(255,84,104,.14);
    --page-bg: #05070c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --void:#060a12; --surface:#0d141f; --surface-2:#131c2b; --line:#1e2a3d;
  --ink:#f4f7fb; --ink-dim:#7c8aa0; --blue:#2e6bff; --blue-dim:#7fa4ff;
  --blue-glow:rgba(46,107,255,.35); --danger:#ff5468; --danger-bg:rgba(255,84,104,.14);
  --page-bg:#05070c; color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--page-bg); color:var(--ink);
  font-family:'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  overscroll-behavior-y:none;
}
.mono{ font-family:'Space Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
svg{display:block;}

/* ---------- layout shells ---------- */
#loadingScreen{
  position:fixed; inset:0; background:var(--page-bg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px; z-index:9999;
}
#loadingScreen .mark{ width:56px; height:56px; }
#loadingScreen .spin{ width:26px; height:26px; border-radius:50%; border:3px solid var(--surface-2); border-top-color:var(--blue); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.auth-screen{ min-height:100dvh; display:none; flex-direction:column; align-items:center; justify-content:center; background:var(--page-bg); padding:max(28px, env(safe-area-inset-top)) 22px 40px; }

#app{ display:none; min-height:100dvh; flex-direction:column; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;

}

main{ flex:1; padding:0 16px calc(96px + env(safe-area-inset-bottom)); }

.navbar{

}

/* ---------- shared components ---------- */
.btn{ font-weight:700; font-size:14px; border:none; border-radius:var(--radius-btn); padding:14px; text-align:center; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--blue); color:#fff; box-shadow:0 8px 18px -6px var(--blue-glow); }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:18px; }

.banner{ border-radius:var(--radius-card); overflow:hidden; position:relative; height:132px; background:var(--surface-2); margin-bottom:18px; display:flex; align-items:flex-end; }

.sk{ background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px; }
@keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
.sk-line{ height:12px; margin:6px 0; }

/* ---------- sheets / modals ---------- */
.sheet-bg{ position:fixed; inset:0; background:rgba(6,10,18,.5); z-index:100; display:none; align-items:flex-end; }

.sheet{ background:var(--surface); width:100%; border-radius:var(--radius-sheet) var(--radius-sheet) 0 0; padding:10px 20px calc(26px + env(safe-area-inset-bottom)); max-height:88dvh; overflow-y:auto; transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); }

/* ---------- home ---------- */
.balance-card{ background:var(--ink); color:var(--void); border-radius:var(--radius-card); padding:22px; position:relative; overflow:hidden; }
:root[data-theme="dark"] .balance-card{ background:var(--surface); border:1px solid var(--line); }
.balance-card .lab{ font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; opacity:.6; }

.balance-split{ display:flex; gap:18px; border-top:1px solid rgba(255,255,255,.12); padding-top:14px; }

.action-row{ display:flex; gap:10px; margin-top:14px; }
.action-btn{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:7px; }
.action-btn .ico{ width:38px; height:38px; border-radius:50%; background:var(--blue-glow); display:flex; align-items:center; justify-content:center; }
.action-btn .ico svg{ width:17px; height:17px; stroke:var(--blue); }
.action-btn.done .ico{ background:var(--surface-2); }
.action-btn.done .ico svg{ stroke:var(--ink-dim); }
.action-btn span{ font-size:11.5px; font-weight:700; }

.ticker{ border-radius:var(--radius-card); border:1px solid var(--line); background:var(--surface); overflow:hidden; height:154px; margin-top:22px; position:relative; }
.ticker-head{ display:flex; align-items:center; gap:7px; padding:12px 14px 8px; font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); }
.ticker-dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); animation:pulse 1.6s ease infinite; }

.ticker-list{ position:relative; }

.plan-card{ position:relative; border:1px solid var(--line); border-radius:var(--radius-card); background:var(--surface); padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:10px; }

.plan-info .meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
.plan-info .earn{ font-weight:700; font-size:13px; margin-top:5px; color:var(--blue); }

.prod-scroll{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }

.prod-card-mini{ flex:0 0 140px; border:1px solid var(--line); border-radius:16px; background:var(--surface); padding:12px; }

.prod-card-mini .name{ font-weight:700; font-size:12.5px; }
.prod-card-mini .price{ font-family:'Space Mono',monospace; font-size:12px; margin-top:4px; }
.prod-card-mini .ret{ font-size:10px; color:var(--ink-dim); margin-top:2px; }

/* ---------- products ---------- */
.shortcut-row{ display:flex; gap:8px; margin-bottom:16px; }
.shortcut{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
.shortcut svg{ width:18px; height:18px; stroke:var(--blue); }
.shortcut span{ font-size:10.5px; font-weight:700; }

.mystats{ display:flex; gap:10px; margin-bottom:20px; }
.mystats .card{ flex:1; padding:14px; }
.mystats .lab{ font-family:'Space Mono',monospace; font-size:9.5px; text-transform:uppercase; color:var(--ink-dim); letter-spacing:.05em; }
.mystats .val{ font-weight:700; font-size:16px; margin-top:5px; }

.prod-card{ border:1px solid var(--line); border-radius:var(--radius-card); background:var(--surface); padding:16px; margin-bottom:12px; }
.prod-card .top{ display:flex; gap:12px; align-items:flex-start; }

.prod-card .price{ font-family:'Space Mono',monospace; font-size:13px; color:var(--ink-dim); margin-top:2px; }

/* ---------- team ---------- */
.tabs-row{ display:flex; gap:6px; background:var(--surface-2); border-radius:999px; padding:4px; margin-bottom:18px; }

.member-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }

.milestone-card{ display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--line); border-radius:16px; margin-bottom:10px; }

.milestone-card.done .ico{ background:var(--surface-2); }
.milestone-card.done .ico svg{ stroke:var(--ink-dim); }

/* ---------- account ---------- */
.profile-card{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }

.profile-card .code{ font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ink-dim); margin-top:3px; }

.matrix{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:9px; margin-bottom:22px; }
.mtile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 4px; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
.mtile svg{ width:18px; height:18px; stroke:var(--ink-dim); }
.mtile span{ font-size:9.5px; font-weight:700; }

.menu-list{ border:1px solid var(--line); border-radius:var(--radius-card); overflow:hidden; background:var(--surface); }
.menu-row{ display:flex; align-items:center; gap:12px; padding:15px 16px; border-top:1px solid var(--line); }
.menu-row:first-child{ border-top:none; }
.menu-row svg{ width:17px; height:17px; stroke:var(--ink-dim); flex-shrink:0; }
.menu-row span{ flex:1; font-size:14px; font-weight:600; }
.menu-row .chev{ width:15px; height:15px; stroke:var(--ink-dim); }

/* ---------- floating assistant ---------- */
.assist-fab{ position:fixed; right:16px; bottom:calc(94px + env(safe-area-inset-bottom)); z-index:40; width:52px; height:52px; border-radius:50%; background:var(--blue); box-shadow:0 10px 26px -8px var(--blue-glow); display:flex; align-items:center; justify-content:center; }
.assist-fab svg{ width:22px; height:22px; stroke:#fff; }
.assist-panel{ position:fixed; inset:0; z-index:150; background:var(--page-bg); display:none; flex-direction:column; }
.assist-panel.show{ display:flex; }
.assist-head{ display:flex; align-items:center; gap:12px; padding:max(16px,env(safe-area-inset-top)) 16px 14px; border-bottom:1px solid var(--line); }
.assist-head b{ font-size:15px; }
.assist-body{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg{ max-width:80%; padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.45; }
.msg.bot{ background:var(--surface); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.user{ background:var(--blue); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.assist-quick{ display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; scrollbar-width:none; }

.qchip{ flex-shrink:0; font-size:12px; font-weight:600; border:1px solid var(--line); border-radius:999px; padding:8px 13px; color:var(--ink-dim); white-space:nowrap; }
.assist-input{ display:flex; gap:10px; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }

.assist-send{ width:44px; height:44px; border-radius:12px; background:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; }

.empty-state{ text-align:center; padding:36px 20px; color:var(--ink-dim); }
.empty-state svg{ width:34px; height:34px; stroke:var(--line); margin:0 auto 12px; }
.empty-state p{ font-size:13px; margin:0; }
</style>
</head>
