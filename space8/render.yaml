services:
  - type: web
    name: space8-server
    runtime: node
    rootDir: space8
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: MARZPAY_KEY
        sync: false

  - type: web
    name: space8-app
    runtime: static
    rootDir: space8/user
    buildCommand: "echo no build needed"
    staticPublishPath: .
    autoDeploy: true
    # index.html IS the whole app (the compiled bundle is embedded in it), so
    # letting it be HTTP-cached is what kept phones on old builds for days --
    # the service worker's network-first navigation would "fetch" it and still
    # be handed a stale copy straight out of the browser/CDN cache, which is
    # why only a hard refresh or a reinstall ever pulled a new version.
    # no-cache does NOT mean "never store": it means revalidate with the server
    # every time, so an unchanged build still answers 304 (no 3MB re-download)
    # while a new build is picked up immediately. Image/icon assets are
    # untouched and still cache normally.
    # The API server sends security headers on its own responses (helmet), but
    # these two STATIC sites were serving the actual pages with none at all --
    # so the app and admin panel could be framed by any other site
    # (clickjacking: an invisible iframe over a lookalike page, so a real tap
    # lands on the real Approve/Cash Out button). frame-ancestors 'none' plus
    # X-Frame-Options blocks that. object-src/base-uri close off plugin and
    # <base>-tag injection tricks. Deliberately NOT setting default-src or
    # script-src: the whole app ships as one inline bundle, so those would
    # need 'unsafe-inline' anyway and would buy nothing while risking a
    # blank white app if a single directive were slightly off.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: space8-admin
    runtime: static
    rootDir: space8/admin
    buildCommand: "echo no build needed"
    staticPublishPath: .
    autoDeploy: true
    # Same headers as the app, and they matter MORE here: this is the panel
    # that moves money, so it must never be embeddable in someone else's page.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
