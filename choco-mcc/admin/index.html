<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChocoMCC Admin</title><meta name="theme-color" content="#3B2416"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
window._adminInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window._adminInstallPrompt = e;
  var b = document.getElementById('installBtn'); if (b) b.classList.remove('hidden'); });
window.addEventListener('appinstalled', function(){ window._adminInstallPrompt = null;
  var b = document.getElementById('installBtn'); if (b) b.classList.add('hidden'); });</script><style>
  :root{
    --bg:#FBF2E4; --card:#FFFFFF; --ink:#3B2416; --sub:#9C8271; --line:#EADFC9; --line2:#F3E1C3;
    --gold:#E08A2C; --gold-deep:#C06F1C; --gold-ink:#3B2416; --ok:#2F9E68; --ok-bg:#DCF0E4;
    --danger:#C23B4B; --danger-bg:#F8DEE1; --warn:#C06F1C; --warn-bg:#FCE6C4; --sky:#4C7EA0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  button,input,select,textarea{font-family:inherit}
  .hidden{display:none !important}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:30px 26px;width:100%;max-width:380px;
    box-shadow:0 10px 40px rgba(59,36,22,.12);text-align:center;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .brand .mk{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FCE6C4,var(--gold) 60%,var(--gold-deep));display:flex;align-items:center;justify-content:center;}
  .brand .mk svg{width:24px;height:24px}
  .brand b{font-size:20px}
  .muted{color:var(--sub);font-size:13px}
  input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
    font-size:14px;background:var(--card);color:var(--ink);outline:none;margin-top:6px}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-top:12px;text-align:left}
  .btn{background:linear-gradient(180deg,#F3C98A,var(--gold) 60%,var(--gold-deep));color:var(--gold-ink);border:0;border-radius:11px;padding:12px 18px;font-size:14px;
    font-weight:800;cursor:pointer}
  .btn:active{opacity:.88}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn.block{width:100%;margin-top:16px}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.sky{background:var(--sky);color:#fff}
  .btn.ghost{background:var(--line2);color:var(--ink)}
  /* shell */
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar-inner{display:flex;align-items:center;gap:12px;padding:12px 0}
  .topbar .mk{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FCE6C4,var(--gold) 60%,var(--gold-deep));display:flex;align-items:center;justify-content:center}
  .topbar .mk svg{width:20px;height:20px}
  .topbar b{font-size:16px}
  .spacer{flex:1}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
  .tab{background:none;border:0;padding:8px 13px;border-radius:20px;font-size:13px;font-weight:700;
    color:var(--sub);cursor:pointer}
  .tab.active{background:var(--gold);color:var(--gold-ink)}
  .tab .badge-n{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;background:var(--danger);color:#fff;
    border-radius:20px;font-size:10px;line-height:16px;}
  .content{padding:18px 0 70px}
  h2.sec{font-size:17px;margin:4px 0 14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:12px;color:var(--sub);margin-top:3px}
  .panel-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1;min-width:120px}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .subtab{background:var(--line2);border:0;color:var(--sub);border-radius:18px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
  .subtab.active{background:var(--gold);color:var(--gold-ink)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--bg)}
  .pill-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
  .t-ok{background:var(--ok-bg);color:var(--ok)}
  .t-warn{background:var(--warn-bg);color:var(--warn)}
  .t-bad{background:var(--danger-bg);color:var(--danger)}
  .t-mut{background:var(--line);color:var(--sub)}
  .table-scroll{overflow-x:auto}
  .empty{color:var(--sub);font-size:13px;padding:18px;text-align:center}
  /* Same loading spinner as the user app — replaces plain "Loading…" text. */
  .cm-spin-wrap{display:flex;align-items:center;justify-content:center;padding:40px 0;}
  .cm-spinner{width:34px;height:34px;color:var(--gold-deep);animation:cmSpinRotate 1.4s linear infinite;}
  .cm-spinner circle{stroke:currentColor;stroke-linecap:round;fill:none;stroke-width:3.6;animation:cmSpinDash 1.4s ease-in-out infinite;}
  @keyframes cmSpinRotate{100%{transform:rotate(360deg);}}
  @keyframes cmSpinDash{
    0%{stroke-dasharray:1px,200px;stroke-dashoffset:0px;}
    50%{stroke-dasharray:100px,200px;stroke-dashoffset:-15px;}
    100%{stroke-dasharray:100px,200px;stroke-dashoffset:-125px;}
  }
  /* Small inline spinner for busy buttons (Credit/Debit/etc while a
     request is in flight) -- same small spinning-arc icon as the user app. */
  .verify-spin{display:inline-flex;animation:verifySpin .9s linear infinite;}
  @keyframes verifySpin{to{transform:rotate(360deg);}}
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .prod{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .prod .thumb{height:90px;background:var(--line2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;}
  .prod .thumb .tint-sw{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
  .prod .pb{padding:12px}
  .prod .pt{font-weight:800}
  .prod .pp{color:var(--sub);font-size:12.5px;margin-top:2px}
  .prod .pr{color:var(--ok);font-size:12px;font-weight:700;margin-top:4px}
  .prod .pa{display:flex;gap:6px;margin-top:10px}
  .img-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line2);flex-shrink:0}
  .img-picker{display:flex;gap:12px;align-items:center;margin:4px 0 8px}
  .img-prev{width:72px;height:72px;border-radius:12px;background:var(--line2);flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:11px}
  .img-prev img{width:100%;height:100%;object-fit:cover}
  .img-picker-actions{display:flex;flex-direction:column;gap:8px}
  .file-btn{display:inline-flex;align-items:center;justify-content:center;text-align:center}
  .banner-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
  /* modal */
  .modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-bg{position:absolute;inset:0;background:rgba(40,26,16,.45)}
  .modal{position:relative;background:var(--card);border-radius:18px;padding:20px;max-width:460px;width:100%;
    max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-size:17px}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
  .kv .k{color:var(--sub)}
  .modal-close{position:absolute;right:14px;top:14px;background:var(--line);border:0;border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--sub)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
  .codebox{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-family:monospace;
    font-size:15px;display:flex;flex-wrap:wrap;gap:8px}
  .mono{font-family:monospace;letter-spacing:.5px}
  .code-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:5px 6px 5px 10px}
  .code-chip .btn{padding:5px 10px;font-size:12px;border-radius:6px}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
  .seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .seg button{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font-size:13px;color:var(--sub);font-weight:600}
  .seg button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin:2px 0 6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0 2px;overflow-x:auto}
  .chart-col{flex:1 0 auto;min-width:18px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
  .chart-bars{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
  .chart-bars i{display:block;width:7px;border-radius:3px 3px 0 0;min-height:2px}
  .chart-x{font-size:9px;color:var(--sub);white-space:nowrap}
</style></head><body><div class="login" id="loginView"><div class="login-card"><div class="brand"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#3B2416" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></div><b>ChocoMCC Admin</b></div><p class="muted">Owner: leave username blank and enter your admin key. Staff: enter the username and password you were given.</p><input id="userInput" type="text" placeholder="Username (leave blank if you're the owner)" autocomplete="off"><input id="keyInput" type="password" placeholder="Admin key / password" autocomplete="off"><button class="btn block" id="loginBtn">Sign in</button><p class="muted" id="loginErr" style="color:var(--danger);margin-top:12px"></p></div></div><div class="hidden" id="shell"><div class="topbar"><div class="wrap"><div class="topbar-inner"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#3B2416" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></div><b>ChocoMCC Admin</b><div class="spacer"></div><button class="btn ghost sm" id="liveBtn" title="Auto-refresh the current tab as new activity arrives"><span id="liveDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle"></span>Live</button><button class="btn ghost sm" id="pushBtn" title="Enable push notifications">Notify</button><button class="btn ghost sm hidden" id="installBtn">Install</button><button class="btn ghost sm" id="refreshBtn">Refresh</button><button class="btn ghost sm" id="logoutBtn">Log out</button></div><div class="tabs" id="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="analytics">Analytics</button><button class="tab" data-tab="users">Users</button><butto
